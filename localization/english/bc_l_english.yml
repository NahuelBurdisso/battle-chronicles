 bc_they_are_fighting_on_the_county_seat_toast:0 "Where People Live"
 bc_they_are_fighting_on_the_county_seat_toast_desc:0 "There is a mill on the slope and a bridge under it and a row of thatch along the road, and all of it is somebody's, and none of it will be standing the same way tomorrow. He can hear a dog. That is the part he keeps returning to: at this distance, over all this noise, he can still hear a dog going frantic behind a wall, which means the wall is close, which means the people behind it are closer. So he sets his feet on the near edge of that road and will not give it up, long past the point where the road matters to the shape of the fight, because giving it up means the next hour happens on the far side of that wall instead. He is entirely aware this is not a military judgement. He makes it anyway, and makes it again ten minutes later, and again after that, and every time the price goes to him and none of it goes to them. Somebody who was not here will explain to him afterwards where he ought to have stood.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_nothing_built_on_this_ground_toast:0 "Nothing Here At All"
 bc_knight_there_is_nothing_built_on_this_ground_toast_desc:0 "No mill, no fence, no track worth the name: grass going brown, a fold of ground, a sky with nothing underneath it. He notices, because a man fighting in country like this has nothing to hang his sense of the field on - no roofline to judge a distance against, no lane to tell him which way a horse will actually go. So he stops trying to use the country and starts using the men. He takes up the rhythm of the rank instead, matches his footwork to the two on either hand, and reads the far side by what its shoulders are doing rather than by where it happens to be standing. Halfway through he realises he has stopped looking up altogether. It works far better than it ought to. There is nothing out here to be clever about, and being un-clever in precisely the right way at precisely the right speed turns out to be the one thing this ground pays for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

