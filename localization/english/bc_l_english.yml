# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 495.
 bc_the_thing_in_his_hand_is_nearly_done_toast:0 "The Soft Place"
 bc_the_thing_in_his_hand_is_nearly_done_toast_desc:0 "There is a bow in the blade now. He has carried it twenty-odd years and could find every fault along it by touch in the dark, and this morning there is one more: a spot two hands above the guard where the metal has stopped arguing back. Each stroke he lands takes something out of it and hands him less in return. So the strokes get shorter and closer and a great deal more honest - he gives up trying to finish anyone with the edge and starts using what is left as a bar of plain iron, which works, and costs him skin every single time. There is blood inside his sleeve and it is his own and he could not say when it began. A man ought to be able to set a thing like this down and take up another. There is another. It is in a chest, under a wagon, four fields off, and it might as well be at the bottom of the sea.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_foe_is_fighting_with_a_ruin_toast:0 "Ironmongery"
 bc_knight_the_foe_is_fighting_with_a_ruin_toast_desc:0 "He picks it out from thirty paces and it settles what the rest of the afternoon is going to be. The one giving orders over there has something in his fist that used to be beautiful and is now a stick with a poor edge - wrong shape at the tip, a shine along the flat where no shine belongs, and the whole of it carried slightly high, the way a man carries a tool he has stopped trusting. He does not go at him. That is not what the sight is for. What it is for is this: a household that lets that happen to the finest object it owns has been short of coin and short of attention for a long while, and everything else on that side is in the same state underneath the paint. So he gives up hunting for the brave place to stand and starts hunting for the thin one, finds it almost immediately, and works there without any particular feeling about it. Gear tells you what the purse has been doing. The purse tells you what the men have been eating.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

