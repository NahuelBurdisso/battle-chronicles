 bc_there_is_something_of_his_in_another_mans_hands_toast:0 "The Empty Peg"
 bc_there_is_something_of_his_in_another_mans_hands_toast_desc:0 "Three generations back a thing left this family and it has never come home. He knows precisely where it sits, whose wall it is on, which room, and how many men stand between him and that room, because he has been working the arithmetic of it since he was old enough to be told about it. None of that is on this hillside. What is on this hillside is a rank that will not hold and a decision about how much of himself to spend keeping it there another quarter of an hour. He spends too much. He goes into the second rank himself, further in than a man carrying what he is carrying has any business going, because the habit of reaching for something that is always just out of reach does not switch off when the ground changes. A point finds him under the arm before he is pulled back out of it. The rank gives anyway. He stands there afterwards with his own blood coming warm down the inside of the sleeve, doing sums about daylight, and nothing whatever about a wall three days' ride from here. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_what_he_is_owed_is_out_of_reach_toast:0 "No Road To It"
 bc_knight_what_he_is_owed_is_out_of_reach_toast_desc:0 "His family is owed something and there is no road to it. It went across water, or it went behind a door nobody of his standing will ever be let through, and the plain fact he grew up inside is that nothing can be done about it and nothing ever will be - no claim to press, nobody to press it against, only the knowledge, handed down like furniture, that it is not where it belongs. So he has carried it about with nowhere to put it. Then the far side's line comes apart directly in front of him and there is, at last, somewhere to put it. He goes in past the point where he ought to have stopped. He is three paces deeper than the man on his left and then he is six, working with no economy whatever, taking ground the way a man takes ground when the taking is the object and the ground is not. It is not disciplined and on a worse afternoon it would have finished him. On this one the whole front comes in after him. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

