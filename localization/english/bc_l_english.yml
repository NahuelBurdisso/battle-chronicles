# NEITHER MAY count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 167.
# afterwards".
 bc_the_day_has_stopped_being_worth_what_he_came_for_toast:0 "He Has Been Doing The Arithmetic All Afternoon And It Has Been Going The Wrong Way Since Before The Fighting Turned"
 bc_the_day_has_stopped_being_worth_what_he_came_for_toast_desc:0 "He priced this before he set out, the way he prices everything, and the price has been falling all afternoon. What he expected to have at the end of it was never a secret from himself: ransoms off whoever was worth ransoming, the horses, the harness, a season of somebody else's income and a debt written off that he has been carrying too long. He can still name each of those and he has stopped believing in any of them. Ransoms want men taken alive and standing where you can reach them, and the ones worth taking are the ones still on their feet and furthest away. Horses want a field you hold at dusk. The income wants the day, and the day is not going to be his. What he is left with is a set of costs, and unlike the profits the costs are all real and all already spent - the men he raised and fed and moved here, who eat whether or not this works, and the ones who are not going to eat again, whose people will want something from him in spring. He is not frightened. He is doing sums in a corner of his head that has never stopped doing them, and every version he tries comes out the same way, and the worst of it is that he cannot stop long enough to fight properly, because the part of him that would be doing the fighting is busy trying to work out how much of the loss he can still avoid taking.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_men_opposite_are_dying_by_the_rules_toast:0 "The Man Who Commands Them Will Not Let Them Win The Way They Could Win"
 bc_knight_the_men_opposite_are_dying_by_the_rules_toast_desc:0 "Something is being denied to the men in front of him and it has taken him most of the day to see what. They fight hard. They fight cleanly. When one of ours goes down and is plainly finished, the nearest of theirs steps over and past him instead of making certain, and does it every time, which is not what men do unless somebody has told them and gone on telling them. Twice he has watched a chance open that any of his own lot would have gone through without thinking about it, and twice the men opposite have gone the long way round instead, and the long way round is the reason they are losing this stretch of the line. He does not admire it. Admiring it would mean thinking about it, and thinking about it while working is how you end up on the ground with a thing you did not see. What he thinks, in the gap between one and the next, is that whoever is running them has decided what may be done to win and has made it stick all the way down to men who are dying of it, and that a rule like that is a beautiful thing to have on the other side of a field from you.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

