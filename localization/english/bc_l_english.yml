# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 220.
 bc_the_oath_he_broke_is_older_than_this_war_toast:0 "The Oath He Broke Is Older Than This War"
 bc_the_oath_he_broke_is_older_than_this_war_toast_desc:0 "He swore something once, out loud, with people standing there to hear it, and then he stopped keeping it. That was years ago and it has walked into every hall behind him since. What is happening in front of him now has nothing whatever to do with it - the wing has simply come apart, the way wings do, and men who were a line ten minutes ago are a crowd going the wrong way. But not one of them looks at him as they pass. They go by with their eyes forward and their mouths shut, and he stands there saying the words a commander says at exactly this moment, and the words are worth what his word is worth. He knows the sum. He worked it out years ago and has carried the answer ever since. The gods are still holding one broken promise against him and the afternoon is coming apart around him for reasons of its own, and he cannot, standing here, get the two of them apart in his own head.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_took_a_second_set_of_vows_and_kept_those_toast:0 "He Took A Second Set Of Vows And Kept Those"
 bc_knight_he_took_a_second_set_of_vows_and_kept_those_toast_desc:0 "There was an inheritance in front of him once and an arrangement behind it, and he put down both and swore himself to a thing that would give him neither. Men assume that was a loss. He has never once described it that way. What he was given instead is standing on either side of him now, close enough that their shoulders knock when they breathe, and none of the three of them has moved a foot in a quarter of an hour. The ground under their boots has been churned to a grey paste and it is holding. He is not doing anything clever and he is not trying to. He is doing the one thing he was drilled at for years, which is to stay precisely where he was put, for as long as it takes, beside men he will never have to wonder about. The far side has come at this stretch four separate times. It is still exactly where it was.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 166 - the men who were shown something ---------------------------
#
