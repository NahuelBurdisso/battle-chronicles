 bc_the_enemy_is_already_at_a_wall_here_toast:0 "Late to the Wall"
 bc_the_enemy_is_already_at_a_wall_here_toast_desc:0 "The wall is behind the enemy and has been under their engines for weeks, and the men on it have been counting days waiting for exactly this: for him, coming up the valley with everything he could scrape together. He can see the works from where he stands. He can see the stakes, the ditch, the outline of a camp that has had time to become a proper thing rather than a night's stop. That is the whole problem in one look - they have had time and he has not. He goes in regardless, because there is no version of this where he waits another week, and it costs him from the first minute: the good men on the left, the horses he needed for the second push, the half hour of light. He is bleeding into ground somebody else prepared. Every so often he glances up at the small figures along the parapet who have not moved, and he knows exactly what they are watching, and he keeps his face arranged in case one of them can make it out at this range.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_side_is_the_one_at_the_wall_toast:0 "The Ditch He Dug"
 bc_knight_this_side_is_the_one_at_the_wall_toast_desc:0 "They came down the near slope at first light, which every man in camp had said they would, and the difference between siege works that get rolled up and siege works that do not is whether anybody bothered with the ditch on the quiet days when nothing was happening. He bothered. He has been bothering for three weeks, unglamorously, while better-born men slept. Now he stands with the works at his back and does the plainest job there is: hold this length of line, do not step forward, do not let the man beside you step forward either. The far side has to come to him across ground he has personally walked and cursed and improved, and they arrive tired and uphill and out of order. He puts down the first one over the ditch and is back in his place before the body has finished dropping, and then does it again, and the line does not so much as bow. Behind him the engines never stopped working at all.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

