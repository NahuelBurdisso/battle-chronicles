# would rather have the ground".
 bc_there_are_too_many_banners_on_this_side_toast:0 "Four Voices"
 bc_there_are_too_many_banners_on_this_side_toast_desc:0 "There are four separate opinions drawn up behind him and every one of them has an inherited grievance attached, and the man across the way has none of that: one host, one voice, one direction, going through the middle of them like a knife through a fence. He has spent the morning not fighting but negotiating - persuading, flattering, appealing to shame, explaining for the third time that the left cannot go forward until the centre does. By the time the left agrees, the centre has decided something else. He tries an instruction so simple it insults everybody who hears it, and watches it arrive in four different shapes in four different places. What is beating him is not weight and it is not ground. It is that a thing with one head turns faster than a thing with four, and being entirely right about that is not going to change a single minute of what is left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_one_house_against_the_whole_gathering_toast:0 "Nobody Else Came"
 bc_knight_one_house_against_the_whole_gathering_toast_desc:0 "Nobody else came. The fact sat badly in camp for two days and then stopped mattering altogether, because a man can only be outnumbered in the abstract for so long before the abstraction turns into actual people standing in front of him and something has to be done about them. What he notices, once he is in among the four of them, is how much time they spend waiting on each other. There is a seam where one lot ends and the next begins - two paces of nobody's responsibility - and he puts himself into it, and both halves assume the other half will close it, and neither does. So he works along that seam like a man opening a shell. The reason it keeps working is that four of them have to be careful with one another and his own have nobody left to be careful with. Being alone out here turns out to be a kind of permission.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

