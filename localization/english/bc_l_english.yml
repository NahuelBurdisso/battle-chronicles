 bc_this_was_never_his_war_and_it_is_costing_him_his_own_men_toast:0 "He Is Paying For A Quarrel He Had No Part In With Men Who Sowed His Fields"
 bc_this_was_never_his_war_and_it_is_costing_him_his_own_men_toast_desc:0 "Nothing about this was ever his. The quarrel is not his, the ambition behind the quarrel is not his, and he has still not been given a version of why they are here that he would be willing to repeat out loud to a widow. What is his is the specific hundred and ninety or so who came out with him, and he knows a discouraging number of them by name, and by trade, and by which holding they came off. That is the arithmetic running under everything else he does this afternoon. The bank that just broke was mostly his. The gap it left is being filled by more of his. He can already see the shape of the settlement afterwards, in which the men who wanted this will keep whatever there is to keep, and he will go home to explain to a valley why a third of it did not come back, and every part of that explanation will be true and none of it will be any use to anybody standing in front of him when he gives it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_is_the_precise_thing_he_came_all_this_way_for_toast:0 "This Is The Precise Thing He Came All This Way To Be Seen Doing"
 bc_knight_this_is_the_precise_thing_he_came_all_this_way_for_toast_desc:0 "He is not going to pretend, even privately, that he is here for any reason more impressive than the one he is here for. He came because there would be a battle and because people would afterwards say who had been in the worst part of it, and he intended to be the answer. What is slightly inconvenient for anybody wanting to look down on him is that he is extremely good at it. He goes where it is thickest because that is where being seen is worth most, and having gone there he then does an enormous amount of very hard work, and the men who followed him in for less vain reasons are alive because of it. He is soaked to the elbow and grinning in a way that will be described unkindly. The stretch of the line he picked has folded the men opposite backwards over their own second rank, and not one of the witnesses who will criticise his motives later was standing far enough forward to have seen it happen.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

