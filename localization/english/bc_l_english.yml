 bc_there_are_three_of_them_who_have_waited_for_this_toast:0 "Three Who Waited"
 bc_there_are_three_of_them_who_have_waited_for_this_toast_desc:0 "He has been keeping the count without meaning to, and he could put a year to each of them - the one who was passed over, the one whose brother it was, and the one who has never said a word about it and never needed to. None of the three is in front of him this afternoon. That is not how these things arrange themselves. What is in front of him is his own left folding inward at a rate he can measure, and what he finds himself thinking, with a clarity he resents, is which of the three hears of it first and how long the pleasure takes to arrive. He has gone whole seasons without any of them crossing his mind. This is what losing does. It takes a man's enemies out of storage, puts them in order, and hands him the list to read while he still has the light for it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_three_men_would_come_if_he_went_down_toast:0 "Three Would Come"
 bc_knight_three_men_would_come_if_he_went_down_toast_desc:0 "There are three of them and he knows within twenty paces where two are standing. That is the entire substance of it. He is not braver than the man at his shoulder and he is not stronger; what he has is a piece of arithmetic done years ago and never since revisited, which is that if he goes down in the next quarter of an hour then three men stop whatever they are holding and come, and two of them arrive. So he takes the step the line wants taking and does not look back to see whether it was taken with him. It was. A line follows the man at its front once that man has stopped negotiating about it, and they are going one way now, at one pace, nobody needing to be told a thing twice. Later he will thank them or he will not, and it will alter nothing for any of the four.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

