 bc_the_thing_he_was_born_carrying_toast:0 "Still Waiting On It"
 bc_the_thing_he_was_born_carrying_toast_desc:0 "It is in him somewhere and it has never once shown. Two men of his blood went that way, one of them in front of a hall full of people, and he has known since he was a boy that the same thing is folded up inside him somewhere waiting to be asked for. So he has spent his life listening to himself. Every time a thought arrives faster than a thought should he stops and turns it over, and in forty-odd years nothing has ever come back wrong. That is the discipline he brings to a bad hour. His line is going backwards and it is going backwards in good order - every man where he was put, the ends folding in as the middle gives, nobody turning to look behind him - because the one thing he has practised harder than anything else in his life is not letting go of something that wants to go. There is no shouting from him at all. Shouting is the sound he has been afraid of hearing come out of his own mouth ever since he was old enough to understand what he had been given. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_it_never_woke_in_him_toast:0 "It Never Woke"
 bc_knight_it_never_woke_in_him_toast_desc:0 "The same thing sleeps in him. He worked out when he was about fourteen that it was in there, decided over the course of one afternoon that he was not going to spend his life sitting still and waiting on it, and has given it perhaps an hour of thought in all the years since. Not one man riding beside him knows. There is nothing much to know: it has never woken, and by now there is a fair chance it never will. What that leaves is a man with no part of himself set aside for dread. He takes an edge across the top of the shoulder on the way in and does not change hands for it. He takes a second one somewhere he will find tonight when he gets his mail off. The rank in front of him is opening and he stays inside it, bleeding in a steady unhurried way, doing the plain work of somebody who put the worst of it on the table at fourteen and has been getting along without that particular fear ever since. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

