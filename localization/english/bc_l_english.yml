 bc_he_rides_under_an_ugly_name_toast:0 "The Word They Use For Him"
 bc_he_rides_under_an_ugly_name_toast_desc:0 "He has been called it since he was a young man, and it is not a thing anybody says to his face, which is worse, because it means everybody has agreed on it. The far line knows it too. Somebody over there has been repeating it since the horns went, in the flat idiot chant men use when they are not yet frightened, and it carries up the slope perfectly well. He has spent a decade being careful in front of people who would rather he were not, and being careful has never once shifted the word by an inch. So this afternoon he stops being careful. He takes the middle himself, where he can be watched taking it, and he goes forward past the point where forward stops being an argument and turns into an appetite, and the men who love him for it come along into a place with nothing behind it at all. The word does not change. It simply acquires more to work with. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_a_name_men_say_kindly_toast:0 "Whatever It Was He Did"
 bc_knight_he_has_a_name_men_say_kindly_toast_desc:0 "Men who have never stood beside him know what he is supposed to be, which is a nuisance, because a thing that is supposed to be true has to be made true again in front of every new set of eyes. Nobody here says it aloud. They do the other thing, which is to leave a small clear space around him and watch what he does with it, and he has never in his life been able to leave such a space alone. So he spends it. He goes at the joint where two of their companies meet, on his own at first because on his own is quicker, and by the time the men either side have worked out that they were meant to come as well he is three paces past where it was sensible to stop. He fights the way a fire goes through a stable: with no plan whatever for afterwards. It works. It works most times, which is precisely why the thing that is supposed to be true keeps on being true. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

