 bc_battle_memory_won:0 "won a battle at [ROOT.Var('battle_location').GetProvince.GetNameNoTooltip]"
 bc_battle_memory_won_desc:0 "I stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and we were the ones still standing on it"
 bc_battle_memory_won_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and you were the ones still standing on it"
 bc_battle_memory_won_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and was among those still standing on it"

 bc_battle_memory_lost:0 "lost a battle at [ROOT.Var('battle_location').GetProvince.GetNameNoTooltip]"
 bc_battle_memory_lost_desc:0 "I stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"

# --- memory variants (2026-08-17) -------------------------------------------
#
# Two more per perspective, pooled by the `random_valid` block each memory type
# already carried in bc_memories.txt. A knight who fights a long war collects
# these by the dozen and they all read identically until now.
#
# THE PERSPECTIVES OF ONE VARIANT ARE THE SAME SENTENCE IN THREE VOICES, and
# the engine picks a line per perspective block rather than picking a variant
# once. Keeping the three pools in the same order is what keeps a comparison
# between two of them looking deliberate; bc_memories.txt says so at the call
# site too.
#
# `we` IS USED IN THE FIRST PERSON ONLY, and its second-person form is `you`
# doing the work of a plural - the same thing the shipped `you were the ones
# still standing on it` already does. Third person avoids the problem by naming
# the man.
#
# NO FULL STOP, PAST TENSE, LOWER CASE. Same rule as the nine above.
 bc_shieldbrother_memory_desc_b:0 "I held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of us"
 bc_shieldbrother_memory_desc_b_second_perspective:0 "you held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of you"
 bc_shieldbrother_memory_desc_b_third_perspective:0 "[owner.GetName] held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of them"

# --- the nemesis memory (2026-08-17) ----------------------------------------
#
# Written on the defeat that makes it three at the same man's hands, and only
# ever on that one. THE LOSER CARRIES IT AND THE WINNER DOES NOT, so all nine
# lines are about being beaten; the type's header in bc_memories.txt argues why.
#
# ALL NINE ARE PAST TENSE AND LOWER CASE with no full stop, the vanilla standard
# the shieldbrother set follows.
#
# THE THREE VARIANTS ARE THREE READINGS OF THE SAME FACT, not three degrees of
# it - the count is already three, and a variant hinting at four would be
# reporting something the ladder never wrote. THE THREE POOLS STAY IN ORDER, for
# the reason the shieldbrother header gives: the engine picks per perspective
# block, so a reader comparing two of them expects the same variant.
#
# THEY MAY NOT REUSE THE RIVALRY TOASTS' WORDS. bc_rivalry_nemesis_desc already
# spends "three fields, three defeats, one man" and "stopped thinking about the
# war"; bc_reason_battle_nemesis spends "has broken him three times on the
# field".
 bc_nemesis_memory_desc:0 "[nemesis.GetFullName] took the field from me for the third time, and after that I stopped calling it luck"
 bc_nemesis_memory_desc_second_perspective:0 "[nemesis.GetFullName] took the field from you for the third time, and after that you stopped calling it luck"
 bc_nemesis_memory_desc_third_perspective:0 "[nemesis.GetFullName] took the field from [owner.GetName] for the third time, and after that nobody called it luck"
 bc_nemesis_memory_desc_b:0 "I rode away from a third field that belonged to [nemesis.GetFullName], and I could name every man I left on it"
 bc_nemesis_memory_desc_b_second_perspective:0 "you rode away from a third field that belonged to [nemesis.GetFullName], and you could name every man you left on it"
 bc_nemesis_memory_desc_b_third_perspective:0 "[owner.GetName] rode away from a third field that belonged to [nemesis.GetFullName], and could name every man left on it"
 bc_nemesis_memory_desc_c:0 "three times I drew up against [nemesis.GetFullName] and three times I was the one who had to explain it afterwards"
 bc_nemesis_memory_desc_c_second_perspective:0 "three times you drew up against [nemesis.GetFullName] and three times you were the one who had to explain it afterwards"
 bc_nemesis_memory_desc_c_third_perspective:0 "three times [owner.GetName] drew up against [nemesis.GetFullName] and three times it was [owner.GetName] who had to explain it afterwards"

 bc_shieldbrother_memory_desc_c:0 "[shieldbrother.GetFullName] and I were the last two upright in that corner of it"
 bc_shieldbrother_memory_desc_c_second_perspective:0 "you and [shieldbrother.GetFullName] were the last two upright in that corner of it"
 bc_shieldbrother_memory_desc_c_third_perspective:0 "[owner.GetName] and [shieldbrother.GetFullName] were the last two upright in that corner of it"

 bc_battle_memory_won_desc_b:0 "I was at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and I watched it go"
 bc_battle_memory_won_desc_b_second_perspective:0 "you were at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and you watched it go"
 bc_battle_memory_won_desc_b_third_perspective:0 "[owner.GetName] was at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and watched it go"

 bc_battle_memory_won_desc_c:0 "we carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and I have not forgotten what it cost"
 bc_battle_memory_won_desc_c_second_perspective:0 "you carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and have not forgotten what it cost"
 bc_battle_memory_won_desc_c_third_perspective:0 "[owner.GetName] carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and has not forgotten what it cost"

 bc_battle_memory_lost_desc_b:0 "I was at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and I walked away from it"
 bc_battle_memory_lost_desc_b_second_perspective:0 "you were at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and you walked away from it"
 bc_battle_memory_lost_desc_b_third_perspective:0 "[owner.GetName] was at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and walked away from it"

 bc_battle_memory_lost_desc_c:0 "we were beaten at [ROOT.Var('battle_location').GetProvince.GetName], and I remember the road afterwards better than the fighting"
 bc_battle_memory_lost_desc_c_second_perspective:0 "you were beaten at [ROOT.Var('battle_location').GetProvince.GetName], and remember the road afterwards better than the fighting"
 bc_battle_memory_lost_desc_c_third_perspective:0 "[owner.GetName] was beaten at [ROOT.Var('battle_location').GetProvince.GetName], and remembers the road afterwards better than the fighting"

# --- pop-up events ----------------------------------------------------------

 bc_chronicles.0001.t:0 "The Banner Falls"
 bc_chronicles.0001.desc:0 "The standard goes down.\n\nIt is not a sound so much as an absence. The men who were dressing on it turn, and find nothing to dress on, and the turn spreads outward faster than any order could.\n\nThe standard-bearer is somewhere under the feet of the melee. The staff is still visible, canted, being trodden lower."
# THE TWO ADDED 2026-08-17 DESCRIBE THE SAME THIRTY SECONDS AND RESOLVE NONE OF
# IT. The four options below own the resolution, so neither may have the bearer
# dead, the staff lifted, or the line already gone.
 bc_chronicles.0001.desc_b:0 "It goes down in the middle of everything, and for a moment nobody nearby seems to have seen it.\n\nThen the men at the edges of that space stop doing what they were doing. There is a shape to a host that has something to look at, and the shape is coming apart from the inside outward while everyone in it is still facing the right way.\n\nThe staff is down there somewhere among boots and it is not still. It is being moved by the crowd, a little further each time."
 bc_chronicles.0001.desc_c:0 "Above the heads of ten thousand men there was one thing worth looking at, and there is not now.\n\nIt did not fall cleanly. It went over slowly, the way a thing goes over when several people are trying to hold it up and none of them can get their footing.\n\nWhat is happening in the next few ranks is not panic yet. It is every man in them turning to ask the same question of somebody who has no more idea than he does."
 bc_chronicles.0001.a:0 "Then I will carry it myself."
 bc_chronicles.0001.b:0 "Sound the withdrawal. Reform behind the line."
 bc_chronicles.0001.c:0 "No man steps back from where it fell."

 bc_chronicles.0002.t:0 "Rally the Line"
 bc_chronicles.0002.desc:0 "The line has not broken. It is doing something worse, and slower: it is thinking about breaking.\n\nMen at the back are looking over their shoulders and measuring the distance. Nothing has been decided yet. It will be decided in the next few moments, by whoever speaks into them."
# THE TWO ADDED 2026-08-17 MAY NOT BREAK THE LINE AND MAY NOT STEADY IT. This
# pop-up is only reachable while faltering and every option is a different way
# out, including the one where he says nothing, so the desc has to leave all
# four standing. It may not name the thing that frightened them either - the
# mod does not know what it was.
 bc_chronicles.0002.desc_b:0 "Nothing has given way. What has happened is quieter than that: the whole line has taken half a step it did not mean to take, and taken it backwards, and every man in it did that on his own.\n\nThey are still facing the right way. They are standing a little further apart than they were an hour ago, and they are listening for something, and it is not the enemy they are listening for."
 bc_chronicles.0002.desc_c:0 "The front rank is doing its work. It is the four ranks behind it that have gone strange - too quiet, and full of men who have started to think about the road.\n\nNobody has run. A man who is going to run stands exactly like this first, for about as long as this, and then somebody either speaks or does not.\n\nThere is time to do one thing."
 bc_chronicles.0002.a:0 "Ride the length of the line where they can see me."
 bc_chronicles.0002.b:0 "Promise them the spoils, and pay it out now."
 bc_chronicles.0002.c:0 "Say nothing. Let them steady themselves."

 bc_chronicles.0003.t:0 "The Van Breaks Through"
 bc_chronicles.0003.desc:0 "The leading ranks have found the seam and put a wedge in it, and the wedge is going deeper than anyone intended.\n\nIt can be driven all the way. It can also be driven so far that it comes out the far side alone, with the enemy closed up behind it."
# THE TWO ADDED 2026-08-17 MAY NOT SAY WHETHER THE WEDGE HOLDS. All four
# options act on it - pressed, halted, turned onto the flank, or traded for the
# baggage - so neither may close it off, and neither may put the wagons out of
# reach or the flank out of the question.
 bc_chronicles.0003.desc_b:0 "Somewhere in the last few minutes the leading ranks stopped pushing and started walking, and nobody sent word back about it.\n\nThey are a long way in. The men who went in first can see the other host's baggage over the heads in front of them, and the men who went in last can see their own line getting smaller behind them.\n\nIt is going the way a thing goes when it is either about to be a victory or about to be a very expensive lesson."
 bc_chronicles.0003.desc_c:0 "The point of the van has gone through something that was supposed to hold and is still going.\n\nFrom here it looks like a finger pushed into cloth - deep, and thinning, and with the cloth closing quietly along both sides of it. The men in it have not noticed the sides. They can only see forward.\n\nWhatever is going to be done about that has to be done in the next few minutes and by somebody who can see the whole of it."
 bc_chronicles.0003.a:0 "Press it. Everything behind the wedge."
 bc_chronicles.0003.b:0 "Hold them. Keep the line whole."
# --- pop-up contextual options (2026-08-17) ---------------------------------
#
# Five options added across the three pop-ups, on the pattern the eve set with
# its f, g and h. They are gated on the MAN and never on the battle, because a
# pop-up is a character_event and scope:combat_side does not cross the
# trigger_event boundary - see the block comment in bc_events.txt.
#
# EVERY ONE OF THEM NAMES ITS PRICE OR ITS PAYMENT IN THE TEXT. The eve's f set
# that rule for the same reason it applies here: the player is choosing before
# he knows how the battle ends, and an option whose cost only shows up in the
# modifier tooltip is a choice made blind. 0001.e names the coin, 0002.d names
# the horses, 0003.c names what is being given up to get the plunder.
#
# THE SPENT PHRASES IN THE POP-UP OPTIONS, which these five may not reuse:
# "carry it myself", "ride the length of the line", "where they can see me",
# "the spoils" (0002.b promises them), "keep the line whole", "no man steps
# back". 0003.c therefore says baggage and wagons rather than spoils.
 bc_chronicles.0001.d:0 "Have the prayers said aloud, and loudly. Let them hear whose side this is."
 bc_chronicles.0001.e:0 "Open the war chest. Coin in hands, now, and they stand."
 bc_chronicles.0002.d:0 "Everything still horsed, at the men doing the pushing. The horses will not be good for anything after."
 bc_chronicles.0003.c:0 "Let them have the baggage train. The wagons are worth more than the pursuit."
 bc_chronicles.0003.d:0 "Wheel the wedge onto their flank and roll it up."

# --- the fourth pop-up (2026-08-17) -----------------------------------------
#
# bc_flank_collapses grows a pop-up branch, the first template to do so since
# plan 1. EVERY ANSWER HERE IS A BAD ANSWER, which no other pop-up in the mod
# can say - the flank is already gone when the player is asked - so the four
# option strings must not read like victories. What they differ in is what the
# man pays to make it cheaper.
#
# SPENT PHRASES THESE FOUR MAY NOT REUSE, on top of the list above: "reform
# behind the line" (0001.b), "hold them" (0003.b), "press it" (0003.a), and
# "wheel" in the sense 0003.d uses it - the wedge is wheeled onto a flank
# there, and d here turns a second line round to face one, which is a
# different manoeuvre and must not borrow the same verb.
 bc_chronicles.0004.t:0 "The Left Is Gone"
 bc_chronicles.0004.desc:0 "The flank does not break so much as dissolve. One moment there are ranks there and the next there are men running between them, and the enemy is already pouring into the space where an army used to be.\n\nWhatever is decided now, it is decided about a battle that has just become smaller. The only question left is how much smaller."
# THE TWO ADDED 2026-08-17 MAY NOT LOSE THE BATTLE. The flank is gone; the
# battle is not, and one of the four options is to bring a second line round
# in order. Neither may say the host is surrounded or that the field is lost.
 bc_chronicles.0004.desc_b:0 "There were ranks on the left an hour ago and there is a crowd there now, moving the wrong way, and behind the crowd there is grass.\n\nThe enemy over there has stopped fighting anybody, because there is nobody to fight, and they are looking along the inside of what used to be a line. It has occurred to them what that means. It has occurred to everyone.\n\nThe rest of the host is still where it was put and has not been told anything."
 bc_chronicles.0004.desc_c:0 "It did not break in a place. It stopped being an army from the outside inward, one file at a time, in the space of about a minute, and the men doing it were not cowards this morning.\n\nWhat is left is two thirds of a battle line with an open side, and an enemy that now has somewhere to walk. The centre does not know yet. The centre will know very soon.\n\nEverything after this is about the size of the hole."
 bc_chronicles.0004.a:0 "Bend the line back and brace it. They can have the ground."
 bc_chronicles.0004.b:0 "Nothing. Let it go and save what is still standing."
 bc_chronicles.0004.c:0 "Everything still mounted, into the gap, with me at the front of it."
 bc_chronicles.0004.d:0 "Bring the second line round to face it. Slowly, and in order."

# --- the fifth pop-up, and the first one asked of a knight (2026-08-17) ------
#
# THIS ONE MAY NAME THE OTHER MAN. Every note in this file about pop-ups says
# they cannot reach across the field, and that remains true of the four
# commander ones - a character_event cannot see scope:combat_side. This event is
# different because the man it is about is on the player's OWN side and was
# saved as a scope before the raise, so [bc_chronicle_subject.GetName] resolves.
#
# THE DESC MUST NOT SAY HE IS DYING. The phase event applies nothing to the
# commander's health on any path, and a desc that promised a death the script
# never writes would be caught by the player the first time the man walked away
# from it. He is down and he is not getting up on his own; that is all of it.
#
# OPTION b IS NOT THE COWARD'S ANSWER and is written so that it cannot be read
# as one. It names what staying is for - the hole he would leave - and the men
# either side of him are in the sentence.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "carry it myself" and "no man steps
# back" (0001), "keep the line whole" (0003.b), "where they can see me"
# (0002.a), "with a man on his shoulder" (bc_knight_pulls_him_out_toast_desc,
# which is the toast for the same moment and which a player on this path will
# never see - but an AI knight in the same battle can produce it).
 bc_chronicles.0005.t:0 "He Is Down"
 bc_chronicles.0005.desc:0 "[bc_chronicle_subject.GetName] is somewhere in that, and he is not coming out of it upright without help.\n\nThe press closed over the place where he went down and it has not opened since. It is perhaps thirty feet. Thirty feet is nothing at a walk and it is a very long way through this.\n\nThe men either side of you have not moved. They are waiting to see what you do, which means that whatever you do, they will do."
# THE TWO ADDED 2026-08-17 MAY NOT KILL HIM AND MAY NOT GET HIM OUT. The four
# options are the whole of the resolution - going himself, staying, taking the
# line in with him, or sending three men - and one of them costs him the man,
# so a desc that has him dead or already moving takes that away. THE DISTANCE
# STAYS THIRTY FEET: option a is the word "thirty" and nothing else works.
 bc_chronicles.0005.desc_b:0 "[bc_chronicle_subject.GetName] went down about thirty feet to the right and has not come back up.\n\nThat is not the same as dead and everybody watching knows the difference. A man on the ground in that has some time, and the amount of it is not something anyone here can estimate.\n\nThe press over the place has thickened rather than moved. And the men on either side of you have gone quiet in the particular way men go quiet when they have decided to do whatever you do."
 bc_chronicles.0005.desc_c:0 "There is a churn about thirty feet off where the footing is bad and too many people are standing on one piece of ground, and [bc_chronicle_subject.GetName] is under it somewhere.\n\nHe was up a moment ago. It is the sort of thirty feet that takes a long time and costs whatever it costs on the way, and the shortest version of it goes through the middle.\n\nNobody near you is looking at the enemy. They are all looking at you."
 bc_chronicles.0005.a:0 "Thirty feet. I have been further into worse."
 bc_chronicles.0005.b:0 "If I go, this part of the line goes with me. I stay where I was put."
 bc_chronicles.0005.c:0 "On me — everyone on this side of the banner. We are going through it together."
 bc_chronicles.0005.d:0 "You three. Wide, from the left, and take him under the arms. I will hold what opens."

# --- nickname tooltips ------------------------------------------------------
#
# The ONE place this mod writes a key it did not invent. CK3 builds the nickname
# tooltip in the character sheet from `<nickname>_desc`, so there is no bc_-
# prefixed alternative: either the engine's key exists or the tooltip has nothing
# to say. AGOT defines all 27 names but only ONE of these descriptions
# (nick_agot_the_painter_desc), so 26 of the names this mod hands out hovered
# blank. That is what these fill.
#
# ADDITIONS, NOT OVERRIDES. Verified against the whole AGOT localization tree
# before writing: none of the 26 keys below is defined anywhere in it. A key that
# is defined twice is a `Duplicate localization key` line in error.log and the
# loser is silently discarded, so if AGOT ever ships its own, DELETE ours - do not
# rely on load order to pick a winner.
#
# These render for ANY bearer, including canon characters who start the game with
# the name. So each one is written as a byname a fighting man earns, never as
# something that only makes sense for a commander this mod just promoted, and each
# uses the vanilla gendered tokens rather than assuming a man.

 nick_agot_the_warrior_desc:0 "Men who have stood in the line beside [CHARACTER.GetShortUINameNoTooltipNoFormat] say the Warrior himself was wearing [CharYourHerHis(CHARACTER)] face that day."
 nick_agot_greysteel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has gone grey in the saddle, and the steel in [CharYourHerHis(CHARACTER)] hand has lost none of its edge."
 nick_agot_fireball_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] falls on a battle the way fire falls on dry grass, and leaves about as much of it standing."
 nick_agot_hardstone_desc:0 "The field threw everything it had at [CHARACTER.GetShortUINameNoTooltipNoFormat] and broke on [CharYouHerHim(CHARACTER)] like water on stone."
 nick_agot_breakspear_desc:0 "Spears splinter on [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] shield, and [CharYouSheHe(CHARACTER)] keeps coming."
 nick_agot_oakenfist_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] fist closes on a battle like oak, and what it takes hold of does not get loose."
 nick_agot_greatheart_desc:0 "There is no braver heart on any field [CHARACTER.GetShortUINameNoTooltipNoFormat] has ridden onto, and every man who followed [CharYouHerHim(CHARACTER)] there knows it."
 nick_agot_ironheart_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] watched the line break and did not flinch. Men have called [CharYouHerHim(CHARACTER)] iron-hearted ever since, and not all of them meant it kindly."
 nick_agot_the_neveryield_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been outnumbered, surrounded and ridden down, and has never once yielded."
 nick_agot_greycloak_desc:0 "The cloak went onto the field clean and came off it grey with ash and dust, and [CHARACTER.GetShortUINameNoTooltipNoFormat] has worn it that way ever since."
 nick_agot_longspear_desc:0 "Few men get close enough to [CHARACTER.GetShortUINameNoTooltipNoFormat] to find out what [CharYouSheHe(CHARACTER)] can do with a sword."
 nick_agot_shieldbreaker_desc:0 "Shields come away from [CHARACTER.GetShortUINameNoTooltipNoFormat] in pieces, and the arms behind them rarely fare better."
 nick_agot_shieldsmasher_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] does not go around a shield wall. [CharYouSheHe(CHARACTER)] goes through it."
 nick_agot_thunderbolt_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] arrives on a battle the way thunder arrives on a summer afternoon: all at once, and far too late to do anything about."
 nick_agot_the_steelskin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been cut, thrown and trampled, and keeps standing back up. The smallfolk have decided [CharYouSheHe(CHARACTER)] must be skinned in steel."
 nick_agot_the_woe_desc:0 "Whole houses count the day they met [CHARACTER.GetShortUINameNoTooltipNoFormat] in the field as the worst in their history."
 nick_agot_the_morningstar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rides at the head of the charge, bright and early and impossible to mistake for anyone else."
 nick_agot_oakenshield_desc:0 "Men form up behind [CHARACTER.GetShortUINameNoTooltipNoFormat] because whatever is in front of [CharYouHerHim(CHARACTER)] tends to stay in front of [CharYouHerHim(CHARACTER)]."
 nick_agot_blacksword_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade comes off the field black to the hilt, and [CharYouSheHe(CHARACTER)] has never been in any hurry to clean it."
 nick_agot_widowmaker_desc:0 "Count the widows made by the last three fields and you have counted [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] work."
 nick_agot_bloodborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] seems to have been born for a battlefield, and is never so alive as on one."
 nick_agot_starfire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] came down on them like something falling burning out of the night sky."
 nick_agot_the_windrider_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is always on the flank nobody was watching, and always sooner than anyone thought possible."
 nick_agot_swiftspur_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is first onto the field and last off it, and [CharYourHerHis(CHARACTER)] horses pay for both."
 nick_agot_battleborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has fought so many fields that men have stopped asking where [CharYouSheHe(CHARACTER)] came from and started saying [CharYouSheHe(CHARACTER)] was born out of one."
 nick_agot_swordbiter_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade has taken so many notches out of other men's steel that the armourers know [CharYouHerHim(CHARACTER)] by the work."
 bc_style_award_toast:0 "A Way of Fighting"
 bc_style_award_aggressive_attacker_desc:0 "[bc_award_subject.GetName] has won three battles by making the enemy pay for standing still. Men have started to say he does not fight so much as insist."
 bc_style_award_unyielding_defender_desc:0 "Three times now [bc_award_subject.GetName] has set his line and three times it has held. Whatever else is said of him, he does not move."
 bc_style_award_flexible_leader_desc:0 "[bc_award_subject.GetName] has won three battles on ground that did not suit him, and won them by not minding."
 bc_style_award_cautious_leader_desc:0 "[bc_award_subject.GetName] has taken three fields without spending men on any of them. The reckless captain he was is not the man who came back."
 bc_style_award_reckless_desc:0 "[bc_award_subject.GetName] has thrown himself into three battles without waiting to see the shape of them. It has worked three times."
 bc_style_award_organizer_desc:0 "Three battles, and not once has [bc_award_subject.GetName]'s line lost its shape. The men know where to be before he tells them."
 bc_terrain_award_toast:0 "He Knows This Ground"
 bc_terrain_award_desert_warrior_desc:0 "[bc_award_subject.GetName] has fought twice in the dry country and learned what it costs."
 bc_terrain_award_open_terrain_expert_desc:0 "Twice on open ground, and [bc_award_subject.GetName] has learned what open ground is for."
 bc_terrain_award_rough_terrain_expert_desc:0 "[bc_award_subject.GetName] has fought twice in broken country and stopped cursing it."
 bc_terrain_award_forest_fighter_desc:0 "Twice under the trees. [bc_award_subject.GetName] has stopped trying to make a forest into a field."
 bc_terrain_award_jungle_stalker_desc:0 "[bc_award_subject.GetName] has come out of the green twice. Not everyone does."
 bc_terrain_award_winter_soldier_desc:0 "Twice [bc_award_subject.GetName] has drawn up a line on ground that would not hold a stake, and twice he has come off it walking. The cold takes more men than the enemy does, and he has stopped letting it."
 rule_bc_rivalry:0 "Battle Chronicles: Rivalry"
 rule_bc_rivalry_desc:0 "Whether losing a notable battle to the same commander twice makes an enemy of him. The mod tracks the man regardless; this decides how far the grudge is allowed to go."
 setting_bc_rivalry_off:0 "Off"
 setting_bc_rivalry_off_desc:0 "No relations are set. Battles still remember who beat you, and the field still reads differently when you meet him again, but CK3's relation graph is left alone — and so are the schemes A Game of Thrones hangs off it."
 setting_bc_rivalry_rival:0 "Rival"
 setting_bc_rivalry_rival_desc:0 "A first loss is a grudge; a second makes him a rival. It stops there however many times he beats you."
 setting_bc_rivalry_nemesis:0 "Nemesis"
 setting_bc_rivalry_nemesis_desc:0 "The full ladder. Three losses to one man makes him a nemesis — which in A Game of Thrones is a man you may find yourself planning to kill."

 rule_bc_wounds:0 "Battle Chronicles: Wounds"
 rule_bc_wounds_desc:0 "Whether a commander can be hurt in the fighting. He is never killed, and never worse than wounded — but a wounded man cannot lead an army until he mends."
 setting_bc_wounds_off:0 "Off"
 setting_bc_wounds_off_desc:0 "Commanders come off every field whole. Battles still turn on their decisions; nothing is ever taken out of them."
 setting_bc_wounds_default:0 "Default"
 setting_bc_wounds_default_desc:0 "A commander on the wrong side of a decisive moment, in a large battle that has already been going a while, may be carried off it. At most once per battle, and never more than once at a time."

# --- rivalry ----------------------------------------------------------------

 bc_reason_battle_grudge:0 "beat him on the field"
 bc_reason_battle_rival:0 "has beaten him twice on the field"
 bc_reason_battle_nemesis:0 "has broken him three times on the field"
 bc_rivalry_toast:0 "The Man Across the Field"
 bc_rivalry_grudge_desc:0 "[bc_rivalry_foe.GetName] took the field from [bc_rivalry_subject.GetName] today. That is all it is so far — a name, and a face to put to it.[bc_rivalry_subject.Custom('bc_grudge_clause')]"
 bc_rivalry_rival_desc:0 "Twice now. [bc_rivalry_subject.GetName] has lost to [bc_rivalry_foe.GetName] twice, and the second time it stopped being bad luck.[bc_rivalry_subject.Custom('bc_rival_clause')]"
 bc_rivalry_nemesis_desc:0 "Three fields, three defeats, one man. [bc_rivalry_subject.GetName] has stopped thinking about the war and started thinking about [bc_rivalry_foe.GetName].[bc_rivalry_subject.Custom('bc_nemesis_clause')]"

# --- the dead ---------------------------------------------------------------

 bc_dead_knights_toast:0 "They Did Not All Come Back"
 bc_dead_knights_toast_desc:0 "Some of the men who rode out under [bc_bereaved_commander.GetName]'s banner are still on that field. The heralds will have their names by morning.[bc_bereaved_commander.Custom('bc_dead_knights_clause')]"

# --- the opening ------------------------------------------------------------

 bc_chronicles.0011.t:0 "The Lines Close"
 bc_chronicles.0011.desc_intro:0 "The hosts are in reach of one another and nothing has been settled yet. Whatever is chosen now will have to be lived with all day."
# THE THREE ADDED 2026-08-17 MAY NOT MENTION THE GROUND, THE OTHER HOST'S NAME,
# NUMBERS ON EITHER SIDE, OR HOW IT IS GOING - the two paragraphs that follow
# own the first two subjects and nothing has resolved yet in any case. Each ends
# on the choice, which is the paragraph's actual job.
 bc_chronicles.0011.desc_intro_b:0 "It is close enough now to hear them. Nothing has happened that could not still be undone, which will not be true for very much longer, and whatever [ROOT.Char.GetFirstName] says in the next few moments is what the rest of the day gets built on."
 bc_chronicles.0011.desc_intro_c:0 "The waiting is nearly done and the whole of it is still to come. Every man in reach is looking at somebody who will tell him what to do next, and the one they are all eventually looking at has to decide it now, with none of it in yet."
 bc_chronicles.0011.desc_intro_d:0 "There is a last quiet before this sort of thing and it is happening now. Nothing is known yet and none of it can be taken back afterwards, and the order that goes out of here in a moment is the one everything else will be answering until dark."
 bc_chronicles.0011.desc_nemesis:0 "And across the field, under the other banner, is [bc_eve_foe.GetName]. [ROOT.Char.GetFirstName] has been here before, against this man, and it did not go well."
 bc_chronicles.0011.desc_stranger:0 "Across the field the other host comes on behind a banner nobody here can name. Nobody over there is anybody [ROOT.Char.GetFirstName] knows."
 bc_chronicles.0011.a:0 "Press them before they are set."
 bc_chronicles.0011.b:0 "Hold the ground and let them come."
 bc_chronicles.0011.c:0 "Wait. See how the first ranks fare."
 bc_chronicles.0011.desc_kin:0 "The banners across the field are ones he grew up under. Somebody over there taught him to ride."
 bc_chronicles.0011.desc_heathen:0 "They will pray before this, as he will, and not to the same thing."
 bc_chronicles.0011.desc_countryman:0 "The men across the field speak as his do. Whatever is decided here, both sides will tell it in the same tongue."
 bc_chronicles.0011.desc_ground_rough:0 "The ground is broken between here and them. Whoever crosses it will arrive out of order."
 bc_chronicles.0011.desc_ground_forest:0 "The trees begin a hundred paces off and do not end. A line that goes in there stops being a line."
 bc_chronicles.0011.desc_ground_jungle:0 "The green starts where the field ends and it does not thin. Men who go in there are gone from this battle."
 bc_chronicles.0011.desc_ground_winter:0 "The cold has been in the men since before dawn. It will be in them all day."
 bc_chronicles.0011.desc_ground_desert:0 "There is no water between here and the horizon, and both armies know it."
 bc_chronicles.0011.desc_ground_open:0 "The field is what it is. Nothing on it will decide anything for you."
# --- eve variants (2026-08-17) ----------------------------------------------
#
# The eve prints one foe paragraph and one ground paragraph every time it is
# answered, and it has one of each per value. Both chains now pool their lines
# through `random_valid` in bc_eve_events.txt - the structure is vanilla's, and
# the event file's own comment carries the proof.
#
# THREE PER FOE VALUE, TWO PER GROUND BAND. The asymmetry is argued at the
# ground chain: a band's sentence has to stay true of every terrain in that
# band, and the bands were partitioned for prose rather than for tactics, so
# mountains, wetlands and bog all have to survive the same rough line.
#
# EVERY VARIANT OF A VALUE MAKES THE SAME CLAIM, because the chain has already
# decided which value speaks and a variant that added a fact would be reporting
# something nothing tested. The nemesis lines all say the two have met; the kin
# lines all say the blood is shared; the heathen lines all say the prayers
# differ; the countryman lines all say the tongue is shared; the stranger lines
# all say there is nothing between these two men but the war.
#
# THESE ARE THE EVE'S, NOT THE TOASTS'. bc_frag_bond_* is a clause appended to a
# battle toast and says `the man commanding here`; these are full paragraphs in
# a pop-up that already shows the player his own portrait, so they say `he` and
# use [ROOT.Char.GetFirstName] where a name helps. No line below is a rewording
# of a bond fragment - the two sets are read minutes apart in the same battle.
 bc_chronicles.0011.desc_nemesis_b:0 "[bc_eve_foe.GetName] is over there, under the other banner, where he has been before. [ROOT.Char.GetFirstName] has not forgotten how that ended."
 bc_chronicles.0011.desc_nemesis_c:0 "The scouts came back with one name and it was [bc_eve_foe.GetName]'s. Everything after that has been arranged around it."
 bc_chronicles.0011.desc_kin_b:0 "There are two banners here and one family under them. Whatever the heralds say, that is what this is."
 bc_chronicles.0011.desc_kin_c:0 "He knows the arms coming towards him the way he knows his own hands. He has eaten under them."
 bc_chronicles.0011.desc_heathen_b:0 "Two sets of prayers are going up on this ground this morning and they are not going to the same place."
 bc_chronicles.0011.desc_heathen_c:0 "Whatever they hold sacred over there, none of it is anything to him, and his is nothing to them."
 bc_chronicles.0011.desc_countryman_b:0 "Both hosts were raised in one country. Both will curse in the same words when it starts."
 bc_chronicles.0011.desc_countryman_c:0 "He will hear his own tongue shouted back at him all day, and it will be shouted at him."
 bc_chronicles.0011.desc_stranger_b:0 "The other host has come a long way to be here and he could not say from where. There is nothing between him and them that the war did not put there."
 bc_chronicles.0011.desc_stranger_c:0 "He looks for a face he knows over there and finds none. Whatever is settled today will be settled between strangers."
 bc_chronicles.0011.desc_ground_rough_b:0 "Nothing between the two hosts is level. Whoever moves first will spend the crossing getting untidy."
 bc_chronicles.0011.desc_ground_forest_b:0 "There is more wood than sky in that direction. Anything that goes in comes out somewhere else, and later."
 bc_chronicles.0011.desc_ground_jungle_b:0 "The green wall starts close and goes on further than the scouts got. It swallowed two of them yesterday."
 bc_chronicles.0011.desc_ground_winter_b:0 "Nobody slept warm and nobody is going to. The day will take a share of both hosts before either touches the other."
 bc_chronicles.0011.desc_ground_desert_b:0 "The heat is already standing off the ground in sheets. Whatever water is left is what there is."
 bc_chronicles.0011.desc_ground_open_b:0 "Flat, dry, and open from here to the treeline. Nothing here will help either of them."
 bc_chronicles.0011.d:0 "Let the ground fight for us."
 bc_chronicles.0011.e:0 "This time he does not ride away."
# The two contextual options added 2026-08-17. f is horse country, g is kin.
# f names its own price in the text, because it is the only option in the mod
# that applies a negative modifier and the player is choosing before he knows
# anything - an unpriced gamble presented as a free one would be a cheat.
 bc_chronicles.0011.f:0 "Loose the horse early. Spend them."
 bc_chronicles.0011.g:0 "Hold. Nobody over there dies who does not have to."
# h, added 2026-08-17, is the heathen case and the last bond value to get an
# option. It says nothing about mercy or the lack of it because the modifier it
# grants is the same one option a grants - what differs is the coin it is paid
# for, and the text names the coin.
 bc_chronicles.0011.h:0 "Have it preached before they form up. Their gods are not ours."
# i, added 2026-08-17, is the winter band and the only option in the mod that
# costs coin. It names the price in the text for the same reason f does: the
# choice is taken before anything is known, and coin is the one thing the
# player can be left measurably poorer in.
 bc_chronicles.0011.i:0 "Buy them a warm hour out of the war chest. Fires, wine, whatever is still in the wagons."
# j and k, added 2026-08-17, are the two options that read the man instead of
# the field - dread and stress. Neither names its price in the text, and that
# is the settled rule rather than an omission: f and i name theirs because one
# applies a negative modifier and the other spends coin, both of which the
# player would otherwise discover after the fact. Stress and prestige show in
# the option's own tooltip, so naming them again would be twice.
#
# SPENT PHRASES THESE MAY NOT REUSE. The nine options above already hold
# "press them", "hold the ground", "let them come", "wait", "see how the first
# ranks fare", "let the ground fight for us", "ride away", "loose the horse",
# "spend them", "nobody over there dies", "have it preached", "their gods are
# not ours", "buy them a warm hour" and "still in the wagons". j is the only
# option in the set that says out loud what the men think of him, and k is the
# only one where he stops.
 bc_chronicles.0011.j:0 "They are more frightened of me than of anything across that field. Send them forward."
 bc_chronicles.0011.k:0 "Let the captains set the watch. He is no use to anyone at dawn like this."

# --- the flesh --------------------------------------------------------------

# --- the lifesaver (2026-08-17) ---------------------------------------------
#
# THE ONLY TOAST IN THE MOD THAT NAMES TWO MEN. Every other knight toast says
# "he" and lets left_icon say which he - there is only ever one man in them.
# This one is about a thing that happened BETWEEN two, so both are named:
# [bc_knight.GetName] is the knight (the toast's left_icon) and
# [bc_chronicle_subject.GetName] is the commander he went in after, which is
# the same scope the three Custom clauses hang off.
#
# THE COMMANDER IS NOT CALLED HIS LORD. A knight in a side's knight list is
# not necessarily the commander's vassal, and the mod has no trigger asserting
# he is. Naming him is both shorter and true.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "come to take him out of the line"
# and "carried off" (bc_knight_will_not_be_carried), "still on his feet"
# (bc_knight_the_old_wound). "Pulled Me Out" is the opinion modifier's name and
# is deliberately NOT repeated in the toast - the opinion is the rescued man's
# word for it afterwards, the toast is what the field saw at the time.
# --- the two men who matter to him (2026-08-17) -----------------------------
#
# The three knight relation templates. NONE OF THE THREE NAMES THE RELATION.
# `has_relation_friend` and `has_relation_rival` are engine relations with no
# story attached - the game hands them out through events the mod never sees -
# so a desc explaining how the two men came to it would be inventing history.
# All three write what the relation is doing to the fighting today.
#
# THE SECOND MUST NOT READ AS COWARDICE. bc_knight_shames_himself is the mod's
# craven case and owns that ground; this man is obeying, exactly, and the whole
# point is that nobody can put a name to what is wrong with it.
#
# THE THIRD NAMES THE ENEMY COMMANDER'S EXISTENCE BUT NOT HIS NAME. A toast is
# rendered from the commander's scope and the only character scopes it has are
# bc_knight and bc_chronicle_subject - the man opposite is in neither, and the
# ground clause hangs off the subject like every other toast in the file.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "and he has not lost sight of him
# once" (bc_his_blood_in_the_ranks_toast_desc), "where he can be seen doing it"
# (same), "keeping score" (the second's own chance-row comment, which is not
# loc but reads oddly repeated).
# --- what he is already carrying (2026-08-17) -------------------------------
#
# The three stress templates, two commander and one knight. NONE OF THEM NAMES
# THE STRESS. The word does not belong in a thirteenth-century field and the
# number behind it is an abstraction the player already has a tooltip for; what
# these three write is what a man at the second breaking point looks like from
# ten feet away.
#
# NONE OF THEM SAYS WHAT PUT IT THERE. Stress arrives from anywhere in the
# game - a dead child, a broken vow, a decade of the wrong decisions - and this
# mod has contributed thirty-four points of it without knowing about any of the
# rest. A desc naming a cause would be inventing one.
#
# THE SECOND AND THIRD MAY NOT READ AS COURAGE. bc_he_cannot_stop is a man who
# cannot put a thing down and bc_knight_the_quiet_place is a man who has found
# the only hour of his year with no room in it for thinking. The mod already
# has brave men; these are not more of them.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he is still on his feet"
# (bc_knight_the_old_wound_toast_desc), "doing it wrong now" (same), "past the
# point where anybody would have called it enough" is this block's own and may
# not be reused by a later one.
 bc_the_hands_are_not_steady_toast:0 "The Orders Are Arriving Wrong"
 bc_the_hands_are_not_steady_toast_desc:0 "He is standing where he should be standing and saying the wrong things from it. Two of the last four orders contradicted each other and the men carrying them have started arriving back for a second telling. Nothing is wrong with the army. Everything is wrong with what the army is being asked for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_cannot_stop_toast:0 "One More, and Then One More"
 bc_he_cannot_stop_toast_desc:0 "It is going his way and it is not enough, and there is no sign of what would be. He has spent the reserve, called it back and spent it again, and every man who has suggested that this might be the moment to hold has been sent away with something to do.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_quiet_place_toast:0 "The Only Quiet Hour He Gets"
 bc_knight_the_quiet_place_toast_desc:0 "Whatever he has been carrying around all year, there is no room for it in the next four feet, and he has gone into those four feet like a man going indoors out of weather. He is buying ground at the usual price and he does not appear to have noticed paying.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_for_a_friend_toast:0 "Where His Friend Can See Him"
 bc_knight_for_a_friend_toast_desc:0 "He has put himself in the part of the line that matters most to one particular man watching, and it has changed how he is fighting - further forward than his own good sense would have taken him, and staying there. The ground he is standing on has been bought at the going rate.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_owes_him_nothing_toast:0 "Exactly What He Was Told"
 bc_knight_owes_him_nothing_toast_desc:0 "He is where he was put and he has not left it. He is also not one step ahead of it, and the difference between those two things is the whole afternoon. Nothing he has done could be called a failure and nothing he has done has helped.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_knows_that_man_toast:0 "He Has Been Waiting for This"
 bc_knight_knows_that_man_toast_desc:0 "There is a man giving orders on the other side of this that he has wanted a bad afternoon for years, and today the line is going forward far enough that getting near him has stopped being a fantasy. He is spending the horse to find out how near.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_pulls_him_out_toast:0 "He Went In After Him"
 bc_knight_pulls_him_out_toast_desc:0 "[bc_chronicle_subject.GetName] went down with the press closing over him and it was [bc_knight.GetName] who turned back into it. He came out of that with a man on his shoulder and the men who watched it have not stopped talking about it since.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE NINE MEMORY LINES. The RESCUED man carries this memory, so all nine are
# written from his side and `lifesaver` is the tag naming the knight - the
# mirror of the nemesis set, where the loser carries it and the tag names the
# winner.
#
# ALL NINE ARE PAST TENSE AND LOWER CASE with no full stop, and THE THREE POOLS
# STAY IN ORDER, for the reason the shieldbrother header gives: the engine picks
# a line per perspective block, so a reader comparing two of them expects to see
# the same variant.
#
# NONE OF THEM SAYS WHAT THE WOUND WAS or how close it came. The template fires
# on a losing side and applies nothing to the rescued man's health, so a line
# claiming he was dying would be reporting something no script wrote.
 bc_lifesaver_memory_desc:0 "[lifesaver.GetFullName] came back into that for me when nobody was going to make him"
 bc_lifesaver_memory_desc_second_perspective:0 "[lifesaver.GetFullName] came back into that for you when nobody was going to make him"
 bc_lifesaver_memory_desc_third_perspective:0 "[lifesaver.GetFullName] came back into that for [owner.GetName] when nobody was going to make him"
 bc_lifesaver_memory_desc_b:0 "I was under it and going nowhere, and [lifesaver.GetFullName] got me out"
 bc_lifesaver_memory_desc_b_second_perspective:0 "you were under it and going nowhere, and [lifesaver.GetFullName] got you out"
 bc_lifesaver_memory_desc_b_third_perspective:0 "[owner.GetName] was under it and going nowhere, and [lifesaver.GetFullName] got him out"
 bc_lifesaver_memory_desc_c:0 "I owe [lifesaver.GetFullName] a day I would otherwise not have had"
 bc_lifesaver_memory_desc_c_second_perspective:0 "you owe [lifesaver.GetFullName] a day you would otherwise not have had"
 bc_lifesaver_memory_desc_c_third_perspective:0 "[owner.GetName] owes [lifesaver.GetFullName] a day he would otherwise not have had"

 bc_wounded_toast:0 "Carried From the Field"
 bc_wounded_toast_desc:0 "[bc_wounded_commander.GetName] was brought down in the thick of it and carried out. He will live. He will not sit a horse at the head of an army until he mends.[bc_wounded_commander.Custom('bc_wounded_clause')]"

# --- the aftermath clauses (2026-08-17) --------------------------------------
#
# NO FRAGMENT HERE MAY NAME A CHARACTER, A HOUSE, A PLACE OR THE GROUND. The
# desc that calls it has already printed the names; these say what the fact
# means and have to be true of any battle in the game. Each is one sentence and
# each opens with a space, because it is appended to a finished sentence.
 bc_frag_grudge_a:0 " He has not said the name out loud yet. He will."
 bc_frag_grudge_b:0 " It is the kind of thing a man tells himself he has put down and then carries for years."
 bc_frag_grudge_c:0 " Nothing follows from it today. Something usually does."
 bc_frag_rival_a:0 " Twice is a pattern, and a pattern is a thing other people notice as well."
 bc_frag_rival_b:0 " There is now a version of this war that is only about the two of them, and it has started."
 bc_frag_rival_c:0 " He has begun rereading the first one, which is not a useful thing to be doing."
 bc_frag_nemesis_a:0 " He has worked out that there is no third answer to this that involves both of them living long lives."
 bc_frag_nemesis_b:0 " Whatever the war was about, it is not what he is going to be thinking about at night."
 bc_frag_nemesis_c:0 " Men have been known to lose everything else while settling one thing like this."
 bc_frag_dead_knights_a:0 " Somebody will have to write to the houses, and it will not be done well."
 bc_frag_dead_knights_b:0 " There are horses standing about out there with nobody looking for them."
 bc_frag_dead_knights_c:0 " The ones who came back are being very quiet about which of them was where."
 bc_frag_wounded_a:0 " The men who carried him out have already told the story twice and it has grown once."
 bc_frag_wounded_b:0 " Somebody else gives the orders until then, and everybody knows who."
 bc_frag_wounded_c:0 " He is furious about it, which the physician says is a good sign."

# --- where he learned it, and the man with no house (2026-08-17) ------------
#
# THE FIRST TWO ARE THE TWO ENDS OF ONE AXIS and must not sound like the same
# sentence twice. bc_taught_to_do_this is a man doing the thing he was made
# for, and bc_never_learned_the_trade is a man doing a thing nobody ever showed
# him. Neither is about how GOOD he is - the mod has martial for that and eight
# toasts already say it - so neither desc may reach for skill or the lack of
# it. One is about recognition and the other is about unfamiliarity.
#
# bc_never_learned_the_trade MAY NOT READ AS STUPIDITY OR COWARDICE. The man is
# very often the cleverest person on the field; he is applying a good mind to a
# problem that does not answer to the kind of thinking he was taught. The mod
# already has bc_the_hands_are_not_steady for a man coming apart and
# bc_no_fear_in_them for men who have stopped, and this is neither.
#
# bc_knight_no_house_behind_him IS NOT A COMPLAINT ABOUT HIS BIRTH. He is not
# resentful and the desc may not make him so - he is simply the only man in
# that part of the line for whom the day is an opportunity rather than a duty,
# and that shows in how he is fighting.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the usual price" and "the going
# rate" (bc_knight_the_quiet_place_toast_desc, bc_knight_for_a_friend_toast_desc),
# "past the point where anybody would have called it enough" (bc_he_cannot_stop
# block), "he is still on his feet" (bc_knight_the_old_wound_toast_desc).
 bc_taught_to_do_this_toast:0 "This Is What the Yard Was For"
 bc_taught_to_do_this_toast_desc:0 "He is not thinking about any of it. The line wants shortening and it shortens, the reserve wants moving and it moves, and every one of those decisions was drilled into him in a courtyard before he was tall enough to hold the shield he was given. Twenty years of somebody else's patience are being spent here in the space of an afternoon.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_never_learned_the_trade_toast:0 "Nobody Ever Showed Him This"
 bc_never_learned_the_trade_toast_desc:0 "He was raised for the other rooms - the ledger, the audience, the long careful conversation - and the day has asked him a question none of that answers. What he is doing is reasonable. It is also half a step behind what is happening, and the gap has been widening since noon.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_no_house_behind_him_toast:0 "Nothing Behind Him but the Shield"
 bc_knight_no_house_behind_him_toast_desc:0 "The device on that shield is one he chose himself and nobody has been obliged to remember it before today. He is further into this than the men either side of him, and staying there, because the whole of what he might yet be is standing in the ten feet in front of him and the host is winning enough for it to be seen.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the same name on both sides (2026-08-17) -------------------------------
#
# THE TWO ARE THE SAME FACT READ FROM OPPOSITE ENDS and the descs must make
# that legible without either explaining the other. The commander is a man who
# can afford mercy and spends it; the knight is a man who cannot afford to be
# overlooked and does not intend to be. Neither is written as noble.
#
# NEITHER MAY SAY "BROTHER" OR "COUSIN". bc_foe_is_house_trigger excludes close
# family outright, and bc_kin_across_the_line and bc_knight_meets_his_cousin
# own that ground with prose that names it. What these two share with the man
# opposite is a NAME, and the descs say so - the shield, the arms, the word
# itself - and never a degree of blood.
#
# THE COMMANDER'S DESC MAY NOT NAME THE ORDER HE DID NOT GIVE as a mercy or as
# a failure. He simply does not give it and the men simply notice, which is
# what the ordered/down cell means mechanically as well: nothing is handed out.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the usual price" and "the going
# rate" (the knight toasts that already close that way), "nothing behind him
# but the shield" (bc_knight_no_house_behind_him_toast, which is about a man
# with NO name and must not blur into these two, who have one).
 bc_he_will_not_chase_them_toast:0 "The Order Nobody Hears Him Give"
 bc_he_will_not_chase_them_toast_desc:0 "The other host is coming apart at the far end of the field and this is the moment the horse goes after it. The horse is standing. He is watching a shield down there with his own arms on it going the other way, and he says nothing at all until there is nothing left worth saying it about. Two of his captains looked at him. Neither asked.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_other_branch_toast:0 "The Same Name, and the Lesser Half of It"
 bc_knight_the_other_branch_toast_desc:0 "The man commanding the other host carries the name he carries and got the better share of it two generations before either of them was born. He has been in front of the line since the second charge, where every man on both sides can see whose arms those are, and he has not once looked for a place to stand that is safer than the one he is in.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the state of the chest (2026-08-17) ------------------------------------
#
# TWO MEN IN DEBT ON THE SAME AXIS AND THEY MUST NOT SOUND ALIKE. The commander
# is watching a bill arrive that he has been outrunning since the spring; the
# knight is looking at the one afternoon of the year when the bill can be
# answered. One desc is about arithmetic catching up and the other is about
# work.
#
# THE KNIGHT IS NOT A LOOTER AND THE DESC MAY NOT WRITE HIM AS ONE.
# bc_knight_strips_the_dead owns robbery and shames him for it. This man is
# taking prisoners, which is a trade with rules, and the only thing unusual
# about him is how much he needs it to go well.
#
# THE COMMANDER'S DESC MAY NOT NAME MUTINY. Nothing has broken and nobody has
# refused anything - the men are simply, visibly, doing the sum. The mod has
# bc_no_fear_in_them for a host that has stopped and bc_the_hands_are_not_steady
# for a man coming apart, and this is neither of those yet.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the usual price", "the going rate",
# "buy them a warm hour" and "still in the wagons" (the eve's coin option),
# "one more, and then one more" (bc_he_cannot_stop).
 bc_the_chest_is_empty_toast:0 "They Have Started Doing the Arithmetic"
 bc_the_chest_is_empty_toast_desc:0 "It has been three months since anything came out of the chest, and until this afternoon nobody was counting out loud. The line is going backwards at the far end and the men in the middle of it have begun asking each other a question that has an obvious answer. Nothing has been refused. Everything is being weighed.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_ransom_he_needs_toast:0 "Worth More Sitting Up"
 bc_knight_the_ransom_he_needs_toast_desc:0 "He is not killing the ones with good harness. He is putting them on the ground, taking the helm off to be sure of the face, and handing them back to two men he has told to keep them alive and separate, and he has been doing it since the other host started to bend. Somebody is going to be paid for all of this and he knows to the copper what he is owed elsewhere.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the gods, and what a knight hears across the field (2026-08-17) --------
#
# THE COMMANDER'S DESC MAY NOT DECIDE WHETHER IT WORKS. He plants himself and
# the line forms on him; whether the gods had anything to do with the rest of
# the afternoon is not the toast's business, and a desc that settles it turns a
# moment into a verdict. The modifier is the only claim being made.
#
# THE TWO KNIGHT DESCS ARE THE TWO HALVES OF ONE LOOK ACROSS THE FIELD and may
# both render on the same battle for the same man - the foe triggers are not
# mutually exclusive. So neither may claim to be the whole of what he thinks
# about the men opposite.
#
# bc_knight_they_sound_like_home IS NOT REMORSE AND NOT REFUSAL. He is doing
# the work; the volume is down. bc_knight_walks_them_back owns keeping shape
# while going backwards and bc_knight_shames_himself owns coming apart, and
# this is neither - which is also why it hands out no modifier.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the usual price", "the going rate",
# "their gods are not ours" (the eve's piety option), "nothing behind him but
# the shield", "the same name" (the house block above).
 bc_the_gods_are_watching_toast:0 "He Has Stopped Where the Banner Is"
 bc_the_gods_are_watching_toast_desc:0 "It has been going the wrong way since the middle of the morning and he has not moved a foot from where the standard is planted. Men who were falling back are forming up on him because he is the only fixed thing in that part of the field, and he is saying something that is not an order. Whatever comes at that spot next will find it occupied.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_against_unbelievers_toast:0 "The Fight He Was Promised"
 bc_knight_against_unbelievers_toast_desc:0 "Everything he was ever told about what a sword is for was told to him about a day like this one, against men who kneel to something else. He has been in the front of it since it started and he has not needed anybody to explain to him why. Whatever it costs him he has already agreed to pay.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_they_sound_like_home_toast:0 "They Are Shouting in His Own Accent"
 bc_knight_they_sound_like_home_toast_desc:0 "The men on the other side of his shield are saying the same words for things that he says, in the same order, and one of them called for his mother in a way he recognised. He has not stopped and he has not slowed. He has simply gone quiet, and he is being extremely careful about what he does next, which out here is not the same as being safe.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the body, from the saddle (2026-08-17) ---------------------------------
#
# BOTH ARE ABOUT REACH AND NEITHER IS ABOUT PAIN. The knight body batch is
# written from inside the ranks and is allowed to be about how it feels; from
# the saddle the only thing a wound changes that an army notices is where the
# man can get to and how fast. A desc here that dwells on the wound itself is
# the knight batch's sentence in the wrong file.
#
# THE FIRST MAY NOT BLAME HIM AND MAY NOT EXCUSE HIM. His orders are right and
# they are late, and the toast says both without deciding which matters. It
# hands out no modifier for the same reason.
#
# THE SECOND MAY NOT READ AS TRIUMPH OVER ADVERSITY. He is not overcoming
# anything; he worked out a method some years ago and it is simply how he
# fights now. The men treat it as ordinary, because to them it is.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he is still on his feet" and "doing
# it wrong now" (bc_knight_the_old_wound_toast_desc), "the orders are arriving
# wrong" (bc_the_hands_are_not_steady, which is a man coming apart and must not
# blur into a man who is simply too far away).
 bc_he_cannot_get_there_toast:0 "It Is Half a Mile to Where He Is Needed"
 bc_he_cannot_get_there_toast_desc:0 "Something is going wrong at the far end and he has known about it for a quarter of an hour, which is how long it took a rider to find him and will take another to get back. What he sent is the right thing to have sent. It was the right thing when the rider left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_holds_one_place_toast:0 "Everybody Comes to Him"
 bc_he_holds_one_place_toast_desc:0 "He has not moved from the rise since the host formed up and nobody expected him to. The captains have been coming and going all afternoon on a rota somebody worked out years ago, and the whole army knows where the answer to any question is standing. It is not the way it is done in the songs. It is working.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the other three numbers (2026-08-17) -----------------------------------
#
# THREE DESCS, THREE DIFFERENT KINDS OF COMPETENCE, AND NONE OF THEM IS "he is
# good at fighting". That sentence is already written a dozen times in this
# file off `martial` and `prowess`, and if any of these three drifts back
# towards it the template has been wasted.
#
# THE FIRST MAY NOT EXPLAIN THE TRICK. The whole texture of an intrigue moment
# is that the men in the ranks do not know what happened and the man across the
# field is still working it out. A desc that spells out the manoeuvre turns it
# into a tactics toast, which is bc_ground_favours_us's ground.
#
# THE SECOND IS ABOUT A BOOK AND MUST SAY SO PLAINLY. Every other losing desc
# in this file gets its knowledge out of the man's own past on a field. This
# one gets it out of a page, read in a room, years before any of this - and
# that is the only thing making it a new sentence.
#
# THE THIRD MAY NOT MENTION FEAR OR OBLIGATION IN ANY FORM. The instant it
# says the men stay because of what leaving would cost them, it is
# bc_they_fear_me_more with different words. They stay because of him.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he has not moved" (twice already -
# bc_the_gods_are_watching, bc_he_holds_one_place), "years ago" (the rota in
# bc_he_holds_one_place), "the only fixed thing" (bc_the_gods_are_watching),
# "coming apart in pieces" (the dread block).
 bc_the_trick_they_did_not_see_toast:0 "What Was Never on the Left"
 bc_the_trick_they_did_not_see_toast_desc:0 "The men the other side has been carefully avoiding all morning were not there, and had not been there since before the sun came up. Nobody in the ranks understands what has just happened to the field; they only know it opened where it had no business opening, and that somebody is already going through the gap. He has not explained it to anyone and does not intend to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_has_read_about_this_toast:0 "He Has Seen This Written Down"
 bc_he_has_read_about_this_toast_desc:0 "It is going wrong in a shape he recognises, and not from any field he has stood on. Somebody set this down two centuries ago and he read it in a cold room as a boy, and he knows which part of the line goes first and roughly how long the rest of it lasts after that. The order he is giving now is being given while it is still early enough to be worth giving.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_came_for_him_toast:0 "Nobody Has Gone Home"
 bc_they_came_for_him_toast_desc:0 "They are being pushed back and they are being pushed back in one piece. Two of the lords holding that end of the line came to this war on nothing but their own word, with somewhere better to be this afternoon and every reason to remember it, and neither of them has so much as glanced behind him. None of that was arranged out here. It was arranged at a long table, over a great many years, by a man who was good at tables.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the man on the other side is also commanding (2026-08-17) --------------
#
# NONE OF THE THREE MAY DESCRIBE THE ENEMY COMMANDER AS A PERSON. The mod
# knows one number about him. It does not know whether he is old, calm, cruel
# or lucky, and a desc that says any of those is inventing a character the
# save may flatly contradict - the man across the field is somebody's
# playable lord. Everything here has to be written from what arrives on THIS
# side of the field.
#
# THE FIRST MAY NOT MAKE OUR COMMANDER LOOK FOOLISH. That is the entire
# difference between it and bc_never_learned_the_trade. His decisions are
# good ones. They are being answered.
#
# THE SECOND MAY NOT EXPLAIN THE MISTAKE IN TACTICAL TERMS. A desc that names
# the manoeuvre turns it into a lecture; what the toast wants is the moment
# somebody on this side realises what they are looking at.
#
# THE THIRD IS FORTY FEET OF SHIELDS AND NOTHING ELSE. The instant it tells
# the reader what the enemy commander intended, it has given a knight a view
# of the field he does not have.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he knows what comes next"
# (bc_he_has_read_about_this), "the field opened" (bc_the_trick_they_did_not_
# see), "doing the right thing at the right moment" (used in three headers).
 bc_the_other_man_is_better_toast:0 "Everything Is Being Answered"
 bc_the_other_man_is_better_toast_desc:0 "He has changed the shape of this twice since midday and both times the change was correct and both times something was already standing where he sent it. Nobody on this side has done anything wrong. The orders went out clearly, the men carried them out, and it has not mattered once, and he is beginning to understand that whoever is holding the other standard has been a full step in front of him since before the first horn.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_gap_he_left_toast:0 "Somebody Over There Has Blundered"
 bc_the_gap_he_left_toast_desc:0 "It takes him a moment to believe what he is seeing, because no one who had ever been made to stand in a yard and be shouted at would have done it. Then he stops trying to believe it and starts shouting, and the riders are moving before he has finished the sentence. Whatever else this afternoon turns out to be, that was a present.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_something_is_always_there_toast:0 "There Is Always Something Waiting"
 bc_knight_something_is_always_there_toast_desc:0 "Four times now they have gone forward into a place that looked empty and four times there have been spears in it. He does not know why and he has no way of finding out from where he is standing, behind a shield, in the fifth rank of a push that has stopped again. He only knows that it keeps happening, that the men on either side of him have gone quiet about it, and that nobody wants to be in the front of the next one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the name he already has (2026-08-17) -----------------------------------
#
# NONE OF THE THREE MAY QUOTE THE NICKNAME. The gate is `has_any_nickname`,
# which means the name could be any of thirty-five AGOT keys or something out
# of a save this mod has never seen, and a desc that puts words in the men's
# mouths will be wrong most of the time. All three are written around the
# name without ever saying it, which is also how it actually sounds from
# fifty yards away.
#
# THE FIRST IS NOT A COMPLIMENT TO HIM. The host is going forward on
# something that has nothing to do with the orders he is giving, and it is
# spending horses doing it. He is not entirely in charge of this.
#
# THE SECOND MAY NOT BE SELF-PITY AND MAY NOT BE HUMILIATION. It is the exact
# moment a man notices that the people around him expected somebody else, and
# it costs fifteen stress rather than the file's usual ten for that reason.
#
# THE THIRD IS TOLD FROM FOUR HUNDRED YARDS. The knight has never met the man
# on the other banner and never will; what he has is a lifetime of hearing
# about him, and the sight of that banner going backwards.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the man in the songs"
# (bc_he_holds_one_place says "the way it is done in the songs"), "they have
# stopped having opinions", "whoever is holding the other standard"
# (bc_the_other_man_is_better).
 bc_they_are_shouting_his_name_toast:0 "They Are Not Waiting to Be Told"
 bc_they_are_shouting_his_name_toast_desc:0 "Somewhere in the middle ranks a man started shouting what people have called him since before this war, and it has gone along the line the way fire goes along a hedge. They are going forward. They are going forward faster than anybody ordered and the riders on the flank have been at a canter for a quarter of an hour with nothing in front of them yet. It is working, and he did not do it, and he cannot stop it either.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_name_is_a_weight_toast:0 "They Came Expecting Somebody Else"
 bc_the_name_is_a_weight_toast_desc:0 "Every man in this host walked here knowing what he is supposed to be, and it is going badly, and he can see them working out what that means. Nobody has said anything. A captain took an order from him just now and repeated it back, which is a thing that is done for a stranger. Whatever happens to the rest of the afternoon, the name is going to be attached to it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_name_across_the_field_toast:0 "That Banner Is Going Backwards"
 bc_knight_the_name_across_the_field_toast_desc:0 "He has been hearing about the man under that standard since he was old enough to hold a shield, from people who had never been within a hundred leagues of him. He is within four hundred yards of him now, and the standard has moved twice, and both times it moved the wrong way. Getting this far has cost the front of the push almost everything it had. He is going to be telling people about this for thirty years.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the mod reads its own army state back (2026-08-17) ---------------------
#
# ALL THREE MAY SAY "ALREADY TODAY" AND NONE MAY SAY "LAST TIME". The gates
# read a live verb modifier, and the verb families are wiped at combat end, so
# what they are looking at was granted by an earlier moment in this same
# battle or by the eve immediately before it. A desc that reaches back to a
# previous battle is claiming something the code cannot support.
#
# THE FIRST MAY NOT BE ABOUT A DECISION. bc_he_will_not_chase_them is the
# template where he could and will not; this one is the template where he
# would and cannot. If a reader can confuse the two toasts, this one is
# written wrong.
#
# THE SECOND IS A REVERSAL AND HAS TO FEEL LIKE ONE. The same men, the same
# afternoon, the other way round. It should be uncomfortable rather than
# tragic - nothing has been lost yet, it has simply turned over.
#
# THE THIRD IS AT GROUND LEVEL AND SEES NOTHING BUT CHURN. He does not know
# there is a pursuit. He knows the ground he is walking on has been ridden
# over twice and that nobody who went that way has come back past him.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he will not chase them", "the men
# running away have his name" (the house block), "the horses have been at a
# canter" (bc_they_are_shouting_his_name).
 bc_the_horses_are_already_gone_toast:0 "Nothing Left to Chase With"
 bc_the_horses_are_already_gone_toast_desc:0 "The other side has come apart and the road behind them is open and there is not one animal on this field with a gallop still in it. He sends what he has anyway and watches it go off at a walk. Everything he needed to end this today is standing in front of him with its head down and its sides going like a bellows.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_were_chasing_an_hour_ago_toast:0 "It Has Turned Over"
 bc_they_were_chasing_an_hour_ago_toast_desc:0 "Not long ago these were the men going forward through a gap, loose and quick and shouting, and now the same men are strung out across ground they took at a run and something is coming back at them across it. Men in open order do not receive a push well. He is watching the shape of his own morning being used against him and there is no version of the next quarter of an hour that is cheap.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_horses_went_past_toast:0 "They Have Already Been Here"
 bc_knight_the_horses_went_past_toast_desc:0 "The riders went by him a long while back, close enough that he had to step aside for them, and nobody has come the other way since. Now he is walking forward over ground that has been ridden across twice and churned into something that pulls at his feet, past things he does not look down at. Whatever is at the far end of this, the horses got there first and are still there.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the ledger as a gate (2026-08-17) --------------------------------------
#
# BOTH DESCS ARE ABOUT TIME AND NEITHER MAY NAME AN HOUR. The gate counts
# moments, not minutes, and a battle that produced three of them could have
# taken half a morning or most of a day. "Since midday" and "for two hours"
# are claims the code cannot make. What it can say is that a great deal has
# already happened.
#
# THE FIRST HAS NO SIDE ROW AND THE PROSE MAY NOT LEAN EITHER WAY. It renders
# on a field being won and a field being lost, so every sentence in it has to
# be true of both. That is unusual in this file and it is the hardest
# constraint in the block.
#
# THE SECOND IS THE ONE PLACE THE MOD IS ALLOWED TO BE TIRED. Every other
# knight desc is written at the pitch of the thing happening; this one is
# written at the pitch of the fourth time it has happened. It should read
# slower than anything else here.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "it has turned over"
# (bc_they_were_chasing_an_hour_ago), "nobody wants to be in the front of the
# next one" (bc_knight_something_is_always_there), "the whole of the world".
 bc_this_has_been_a_long_afternoon_toast:0 "This Is Not Going to Be Quick"
 bc_this_has_been_a_long_afternoon_toast_desc:0 "Enough has happened here now that nobody is trying anything elegant any more. The lines have closed up and gone heavy, the reserves have been in and come out and gone in again, and whatever either side arrived intending to do has been used up. He has stopped thinking about how to win this and started thinking about who will still be standing in order when it stops, which is a different question and the only one left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_lost_count_toast:0 "He Has Stopped Counting"
 bc_knight_he_has_lost_count_toast_desc:0 "He could tell you what happened the first time and most of the second. After that it is one thing. His shield arm has gone somewhere he cannot feel and he is not sure when he last saw the man who was on his left, and none of it has decided anything, and it is still going. Somewhere behind him a horn is saying something he used to know the meaning of.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the top of the ladder (2026-08-17) -------------------------------------
#
# THESE TWO ARE THE LOUDEST STATES THE MOD PRODUCES AND THE PROSE HAS TO EARN
# THAT. Both gates take a chain of moments to reach, which means a player who
# sees either toast has already read three or four others in the same battle.
# Anything merely energetic will land as one more of those. These have to
# read like the afternoon has decided.
#
# THE FIRST MAY NOT PROMISE A VICTORY. The rung is not the end of the battle
# and the mod has no idea how this finishes; what it knows is that right now
# nothing on the other side is answering. A desc that says they have won is
# writing a cheque the aftermath may not honour.
#
# THE SECOND MAY NOT KILL ANYBODY AND MAY NOT ROUT THE HOST. The standing
# rule holds - the mod does not narrate deaths it has not caused - and a rout
# is the aftermath's to declare. This is the moment before all of that, which
# is worse to stand in than either.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "coming apart in pieces", "he has
# stopped counting" (bc_knight_he_has_lost_count), "nothing left to chase
# with" (bc_the_horses_are_already_gone), "it has turned over".
 bc_nothing_is_stopping_this_toast:0 "Nothing Is Answering"
 bc_nothing_is_stopping_this_toast_desc:0 "Every order he has given for some time now has been carried out roughly as he imagined it, which has never once happened to him before. The far end of the line moved when he asked it to. The reserve went in where he pointed. Whatever is being done on the other side to stop this is not arriving, and the men have noticed, and they are asking him for things instead of waiting to be told.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_bottom_of_it_toast:0 "The Ground Behind Him Is Empty"
 bc_knight_the_bottom_of_it_toast_desc:0 "He turns around for the first time in a long while and there is a great deal more space back there than there ought to be. Not a rout, not yet, not quite: men are still facing the right way, and there are simply fewer of them doing it, and the ones at the edges keep glancing at the treeline. A riderless horse goes past at a flat gallop with nobody trying to catch it. Whatever this becomes, it has already stopped being a battle in the sense he came here for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- what the host had opinions about this morning (2026-08-17) -------------
#
# THE WHOLE OF BOTH DESCS IS THAT THE ARGUMENT HAS STOPPED, AND NEITHER MAY
# STAGE THE ARGUMENT IN ORDER TO WIN IT. No sceptic gets a line of dialogue
# and then gets corrected. Nobody thinks better of anything. The moment being
# written is later than that: a host that has other things to attend to and
# has quietly reallocated the attention. A desc that puts the doubt on the
# page has made the doubt the subject, and the doubt is not the subject.
#
# NEITHER MAY SAY "FOR A WOMAN" OR "FOR A LOWBORN" IN ANY CONSTRUCTION,
# including one an admirer would say. Praise on that axis is the argument
# again with better manners, and the templates gate on a field that is being
# won, where the question has stopped being asked at all.
#
# THE FIRST IS ABOUT LATENCY AND SHOULD READ LIKE A MEASUREMENT. What has
# changed over the morning is the gap between an order leaving her and a line
# moving, and that is a thing a commander can actually feel closing. Keep it
# concrete - the runner who no longer waits to be sure, the serjeant who has
# already started.
#
# THE SECOND MAY NOT NAME A FUTURE. He is not being knighted at the end of
# this and the mod does not know whether he lives to supper. What he has is
# the thing itself, happening, with witnesses - which is what the prestige is
# for and is enough.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "asking him for things instead of
# waiting to be told" (bc_nothing_is_stopping_this), "carried out roughly as
# he imagined it", "it has turned over", "he has stopped counting".
 bc_the_orders_are_taken_toast:0 "The Orders Are Simply Taken Now"
 bc_the_orders_are_taken_toast_desc:0 "At dawn there was a beat between her saying a thing and the thing beginning - short, but there, the length of a man deciding to move. It has gone. The runner leaves before she has finished the sentence because he already knows the end of it. The serjeant on the right has the wing turning while the order is still crossing the field to him. Nobody has announced this and nobody will mention it afterwards, and it is the reason the line is where it is.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_no_name_at_all_toast:0 "No Name At All"
 bc_no_name_at_all_toast_desc:0 "There is no house behind him, no seat, nothing that would get him a bed in a keep on a wet night, and the men who have been doing what he says since morning are winning with it. They are shouting to each other about the ford and the flank and about him, using the only thing they have to call him by, which is not much of a thing but is being used a great deal. Whatever else comes of today, a few hundred men now know exactly whose afternoon this was.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- whose war it is (2026-08-17) -------------------------------------------
#
# THE FIRST MAY NOT SAY THE WORD "FAULT" OR ANY SYNONYM FOR IT. What is true
# is narrower and harder: there is no one above him in this. Every other man
# on the field can say afterwards that he was sent, and he cannot, and that
# is a fact about the chain of command rather than a verdict on his judgement.
# The moment he is written as guilty the desc has become a small morality
# play and stopped being a battle.
#
# THE FIRST ALSO MAY NOT CONCEDE THE WAR. It is one bad afternoon in a
# quarrel the mod knows nothing else about, and the aftermath decides what it
# costs.
#
# THE SECOND AND THIRD SHARE A TRIGGER AND MUST NOT SHARE AN IMAGE. Both are
# looking at the same banner. The commander's is an arithmetic problem - that
# man, if he changes his mind, ends this, and he is having a bad afternoon
# where everyone can see. The knight's is a distance in yards that is not
# going to close. Do not let the knight's desc reason about the war and do
# not let the commander's desc want to reach anybody.
#
# NOBODY IS CAPTURED, WOUNDED OR KILLED IN ANY OF THE THREE. The standing
# rule holds and it is sharpest here, where the temptation is a lord in
# reach. The mod does not narrate a capture it has not caused.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "no house behind him"
# (bc_no_name_at_all), "the ground behind him is empty"
# (bc_knight_the_bottom_of_it), "it has turned over", "he has stopped
# counting".
 bc_the_war_has_his_name_on_it_toast:0 "There Is Nobody Above Him In This"
 bc_the_war_has_his_name_on_it_toast_desc:0 "The men going backwards past him were raised on his word, marched here on his word, and are being pushed off this ground for a quarrel that has his name written at the top of it in a maester's hand. There is no rider he can send to ask what to do. Every other man here will be able to say he was sent; he will have to say something else, and he has an hour or two yet before anyone asks him for it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_man_who_started_it_toast:0 "The Man Who Started It Is Here"
 bc_the_man_who_started_it_toast_desc:0 "It is not a castellan over there and it is not a son sent out to learn the trade. The banner in the middle of that line belongs to the man who could have let all of this alone and did not, and he has come out to see it done himself, and it is not being done. He is having to be told things by riders who do not want to tell him. Whatever else is decided today, it is being decided in front of the one man it belongs to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_banner_answerable_toast:0 "Three Hundred Yards Of It"
 bc_knight_the_banner_answerable_toast_desc:0 "He can see the banner. It has not moved all morning and it is not far - a field, a ditch, a great many men - and everything that has happened to him today comes from under it. He has spent himself twice trying to get closer and the ground between has only got worse for the trying. His horse is finished and his arms are heavy and the distance is exactly what it was when he first looked up and found it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- why he is here (2026-08-17) --------------------------------------------
#
# NONE OF THE THREE MAY NAME THE HOOK. The mod does not know what it is - a
# secret, a debt, a letter, a child in somebody's hall - and a desc that
# invents one is writing content the save file will contradict on the next
# read. What may be said is only that it exists, that both men know it, and
# what it is worth this afternoon.
#
# THE FIRST MAY NOT LET HIM CONSIDER LEAVING. He is a commander in the middle
# of a battle and the leash is why he is standing here at all, not an option
# he is weighing this hour. Make it a decision and the moment shrinks to a
# man sulking.
#
# THE SECOND MAY NOT GLOAT AND MAY NOT NAME A PRICE. He is not going to
# collect this afternoon and he is not thinking about the terms. What has
# changed is the size of the account, and one sentence noticing that is the
# whole of it.
#
# THE THIRD IS THE SHORTEST OF THE THREE AND SHOULD BE. A knight in the ranks
# has no room for the reasoning the commander gets; he has the leash and the
# next four feet. Write it at that length.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "there is nobody above him in this"
# (bc_the_war_has_his_name_on_it), "no house behind him" (bc_no_name_at_all),
# "the man who could have let all of this alone" (bc_the_man_who_started_it),
# "it has turned over", "he has stopped counting".
 bc_the_thing_they_have_on_him_toast:0 "He Did Not Choose This Field"
 bc_the_thing_they_have_on_him_toast_desc:0 "There was a conversation in a warm room some months ago that ended with him agreeing to be here, and the agreeing was not really the word for it. He has thought about that room perhaps twice since. He is thinking about it now, with the left of his line going and the light getting on, and the thought is not doing him any good and will not stop.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_leash_runs_the_other_way_toast:0 "The Account Grows"
 bc_the_leash_runs_the_other_way_toast_desc:0 "He rode out for this on his own account and with his own men, and he did not have to, and the man at the top of this war knows exactly why he did not have to. Nothing on the field looks any different for it. What is different is that by tonight there will be one more thing owed in that direction, and both of them will have been counting all day.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_leash_holds_toast:0 "He Could Have Gone At Dawn"
 bc_knight_the_leash_holds_toast_desc:0 "He could have gone at dawn and it would have cost him one thing only, and he knows the price of it to the penny. He is still here. The rank he is standing in has no idea any of this is true and would not care much if it did.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the office he holds at home (2026-08-17) -------------------------------
#
# THE FIRST IS WRITTEN AT THE DISTANCE OF THE DRILL, NOT THE AFTERNOON. What
# is being praised happened over two years of winters on a muddy field behind
# a town, and the toast is the moment he sees it come back. It may not become
# a sentence about him being clever today - bc_the_orders_are_taken already
# owns the closing gap, and this is the thing that was true before anyone
# rode out.
#
# THE SECOND MAY NOT MAKE HIM A COWARD OR A FOOL, and that is the hardest
# constraint in the block. He is good at a job that is not this one. He reaches
# for the thing that has always worked, which is walls and patience, and out
# here it is the wrong reach - but a desc that sneers has turned into
# bc_knight_shames_himself with a council seat.
#
# THE THIRD MAY NOT PUT A KING ON THE FIELD. A Kingsguard is very often on
# detached service, the mod has no idea who he is guarding today, and nothing
# available here can support it. It also renders on a field going either way,
# so every sentence in it has to be true of both - the second time this
# session that constraint has come up and the harder of the two, because the
# temptation to write the cloak as winning is strong.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he could have gone at dawn"
# (bc_knight_the_leash_holds), "the men have noticed"
# (bc_nothing_is_stopping_this), "he has stopped counting", "it has turned
# over".
 bc_the_marshals_own_work_toast:0 "Two Years Of Winters"
 bc_the_marshals_own_work_toast_desc:0 "The wing wheels because a serjeant three ranks back knows the horn call, and he knows it because of a wet field behind a town where nobody wanted to be and where the same call was blown four hundred times. None of that was interesting at the time and none of it was thanked. It is happening now, in front of him, at the speed it was supposed to happen at.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_castellan_outdoors_toast:0 "He Has Always Had A Wall"
 bc_the_castellan_outdoors_toast_desc:0 "Every hard hour of his life has been spent behind good stone with the other fellow outside it, and he was very good at those hours. So he does what has always worked: closes the ranks, shortens the front, tells them to stand and let it come to them. Out here there is no gate to hold and nothing at his back, and the thing coming to them has room to go round.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_white_cloak_toast:0 "The White Cloak"
 bc_knight_the_white_cloak_toast_desc:0 "It is filthy by now and it is still the most visible thing on this field, and men who have never been told his name are putting their shoulders where they can see it. He is not doing anything remarkable. He is doing the ordinary work at the ordinary pace with a great many people watching, which is the whole of what the cloak is for, and it works the same today whichever way today is going.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the Wall and the boy (2026-08-17) --------------------------------------
#
# THE FIRST MAY NOT NAME A WHITE WALKER, A WILDLING, OR THE WALL ITSELF. The
# Watch fights ordinary wars in AGOT - against wildlings, against pirates,
# against whoever the game has put in front of them - and the mod has no idea
# who is opposite. What is true of every one of those fights is the
# arithmetic: fewer than there were, and nobody sending more.
#
# THE FIRST MAY NOT BE ABOUT VOWS. A desc that recites the oath has written a
# ceremony instead of an afternoon, and the vow is not what is short today.
#
# THE SECOND MAY NOT KNIGHT HIM AND MAY NOT PROMISE TO. He is having a very
# good hour. Nobody in a position to reward it is thinking about him yet, and
# the mod cannot write a ceremony it does not schedule.
#
# THE THIRD MAY NOT KILL HIM, WOUND HIM OR SEND HIM RUNNING - the standing
# rule, and bc_knight_shames_himself owns running. What happens is smaller and
# permanent: the picture he had is replaced by the thing itself and he has
# several hours left to stand in it.
#
# THE SECOND AND THIRD ARE THE SAME BOY AND MUST NOT SHARE AN IMAGE. Nothing
# about him decides which of the two he gets - only what the rest of the field
# is doing - so neither may reason about his character.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the best day of his life" as a
# sentence (it is the header's phrase, not the prose's), "he could have gone
# at dawn" (bc_knight_the_leash_holds), "the men have noticed", "he has
# stopped counting".
 bc_the_watch_has_no_reserve_toast:0 "Nobody Is Sending More"
 bc_the_watch_has_no_reserve_toast_desc:0 "He can put a number on what he has left and the number is smaller than it was at noon. That is the whole of the problem: every man he loses today is lost for good, and the ranging that would have replaced him is not coming, and the other fellow does not have that difficulty. So the ones still standing fight the way men fight who have understood the arithmetic, which is harder than they should and with less care than he would like.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_squires_best_day_toast:0 "Nobody Has Told Him To Slow Down"
 bc_knight_the_squires_best_day_toast_desc:0 "Some time in the last hour he stopped being frightened and did not notice it happening. He is where the fighting is, and then he is ahead of it, and the horse under him is doing more than any horse should be asked to do in an afternoon. Grown men are shouting things at him that are half warning and half something else. He will pay for the horse tomorrow and he does not know it yet.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_what_he_agreed_to_toast:0 "This Is What It Is"
 bc_knight_what_he_agreed_to_toast_desc:0 "He had a picture of this. He has had it for years, and it was quite detailed, and it is being taken away from him a piece at a time by the actual noise and the actual smell and the way the man beside him keeps saying the same short word over and over. Nothing has happened to him. It is only that he now knows what he agreed to, and there are hours of it left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the other diagonal of the empty purse (2026-08-17) ----------------------
#
# NEITHER DESC MAY USE "THE ARITHMETIC" OR ANY FORM OF IT. It is the title of
# bc_the_chest_is_empty_toast and it appears again in the Watch block, and a
# third use in the mod's other money template would turn a phrase into a tic.
#
# THE FIRST MAY NOT HAVE THE MEN DOUBTING HIM. That is bc_the_chest_is_empty
# and it is the losing half of this same gate; here nobody in the ranks knows
# there is a number, and the pressure is entirely inside the man giving the
# orders.
#
# THE SECOND MAY NOT NAME A PRICE OR COUNT COPPERS - bc_knight_the_ransom_he_
# needs owns the man who knows what he is owed to the copper. This one is
# about being worth nothing to the people deciding, which is a different
# sentence and must not borrow that one's vocabulary.
#
# SPENT PHRASES THESE MAY NOT REUSE: "the men have noticed", "he has stopped
# counting", "worth more sitting up", "nothing has been refused".
 bc_the_short_war_toast:0 "It Has to Be Today"
 bc_the_short_war_toast_desc:0 "There is a version of this where he holds what he has taken, sits down in front of them and waits a month, and it is the better version and he cannot have it. He has known since before the horns that whatever he does not finish this afternoon he will not be able to feed. So the horses go forward again when they should be walked, and the wing that was holding is sent, and he is buying an ending with the only thing he still has to spend.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_pays_for_him_toast:0 "No Reason to Take Him Gently"
 bc_knight_nobody_pays_for_him_toast_desc:0 "The men coming at him can read harness as well as he can, and there is nothing on him that says somebody would send for him. He worked that out an hour ago. It means the door the others still have is not there for him, and a man who cannot put his hands up fights in a particular way - forward, and without much left over for the fellow beside him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the name he was given (2026-08-17) --------------------------------------
#
# NONE OF THE THREE MAY PRINT A SURNAME. Snow, Sand, Rivers, Stone, Flowers,
# Pyke, Hill, Storm and Waters are all correct for somebody and wrong for
# everybody else, and the mod has no idea which region it is standing in. The
# descs say what the name does, never what it is.
#
# NONE OF THE THREE MAY HAVE A CHARACTER SAY IT OUT LOUD. Nobody remarks on a
# man's birth to his face during a battle. What the mod may write is what he
# assumes is being thought, which is the actual mechanism in all three.
#
# THE FIRST MAY NOT SOUND GRATEFUL AND MAY NOT SOUND BITTER. The decree is
# years old and settled; what has not settled is the memory of the men.
#
# THE SECOND MAY NOT NAME THE REAL TACTICAL REASON HE IS LOSING - the point is
# that nobody is going to go looking for it.
#
# THE THIRD MAY NOT BE ABOUT GLORY OR RISK. bc_knight_the_glory_hound owns the
# man doing something dangerous for the story. This one is about a rate of
# work, which is the opposite failing.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the arithmetic", "the men have
# noticed", "he has stopped counting", "he could have gone at dawn".
 bc_the_parchment_and_the_men_toast:0 "The Decree Is Years Old"
 bc_the_parchment_and_the_men_toast_desc:0 "He is winning, and he is winning it neatly, which is not the same thing and is the thing he has decided to have. The flanks are covered before there is anything on them. The chase goes out in threes with a man over them who has been told twice. Every grey head in this host was standing somewhere when he was a different kind of person, and none of them will ever mention it, and he has never once commanded as though he believed that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_have_their_reason_toast:0 "Nobody Will Have to Look Far"
 bc_they_have_their_reason_toast_desc:0 "Another man loses an afternoon like this one and it gets argued about for a winter - the ground, the hour, the fellow on the left who was late. He is not going to get that argument. The answer is already written down and it was written before he ever sat a horse, and it will be said kindly by people who like him. He gives the next order anyway and it is a reasonable order.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_twice_as_good_toast:0 "Good Enough Is Not Available"
 bc_knight_twice_as_good_toast_desc:0 "The day is already going their way and he has not changed his pace since the first hour. Men either side of him have taken the moment everyone takes - a breath, a look around, a drink - and he has not, because a share of a good day is not a thing he will be given afterwards and he has known that since he was small. So he goes on working at a rate the line cannot hold, and the line tries to hold it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the body he was born with (2026-08-17) ----------------------------------
#
# THE FIRST MAY NOT MAKE HIM A GOOD FIGHTER. The gate is build, not prowess,
# and a knight of prowess 6 can fire it. What is true of him is mass, reach
# and a long arm, and none of that is skill.
#
# THE SECOND MAY NOT WOUND HIM, KILL HIM OR SEND HIM RUNNING - the standing
# rule and bc_knight_shames_himself's territory. He is still standing there,
# which is the whole of what the template says about him.
#
# THE THIRD MAY NOT PUT A JOKE IN ANYONE'S MOUTH AND MAY NOT ANSWER ONE. A man
# in a host does not say a word about his commander's height while there is
# fighting on, and a desc that has him proving somebody wrong makes the moment
# about the somebody. It is about an afternoon going the way he arranged it.
# It also may not have him fighting or in the line - he is not there.
#
# NONE OF THE THREE MAY USE THE WORD FOR WHAT HE IS. The trait gates it; the
# prose does not need to name it and reads as gawping when it does.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "he has
# stopped counting", "nobody has told him to slow down".
 bc_knight_built_for_it_toast:0 "Harder to Move Than Anything Beside Him"
 bc_knight_built_for_it_toast_desc:0 "Whatever else is true of him, he is a great deal of man, and for about a quarter of an hour that has been the most important fact on this part of the field. Things come at him and stop. The two men either side have quietly given up their own footing and taken his, and the shape of the line here now has a corner in it that the other host keeps walking into.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_it_weighs_the_same_toast:0 "It Weighs What It Weighs"
 bc_knight_it_weighs_the_same_toast_desc:0 "Sixty pounds of harness weighs sixty pounds on everybody and it has not been the same sixty pounds for him since the second hour. He is doing the work at half speed and a beat late, and he knows he is a beat late, and he has been correcting for it all afternoon with the only thing he has left, which is being there. Nobody has said anything to him about it. He has said a great deal to himself.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_small_man_toast:0 "It Is Going the Way He Said It Would"
 bc_the_small_man_toast_desc:0 "He has not touched a weapon today and does not intend to. What he has done is put the right men in the wrong place for the other fellow four separate times since noon, and the fourth one has just come apart in exactly the direction he said it would at breakfast. The riders coming back to him are taking their hats off first now, which they were not doing this morning.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# ---------------------------------------------------------------------------
# BATCH FIFTY. The man AGOT took the spurs from.
#
# THE DESC MAY NOT KNIGHT HIM AND MAY NOT PROMISE THAT ANYONE WILL. The trait
# is a standing state, not a wound that closes, and a toast that hints at its
# reversal writes a promise no other file in the mod can keep.
#
# IT MAY NOT SEND HIM RUNNING. bc_knight_shames_himself owns running, and this
# man is the opposite case: he is the one still in the place he was put.
#
# IT MAY NOT SAY WHAT HE DID. Whatever it was, AGOT does not record it, the
# player did not choose it, and inventing the crime would put a fact in the
# player's world that no other file agrees with. The men around him do not
# know either. That is most of the point.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he has nothing left to lose",
# "the men have noticed", "nobody has told him to slow down".
 bc_knight_the_spurs_they_took_toast:0 "He Stands Where They Put Him"
 bc_knight_the_spurs_they_took_toast_desc:0 "Whatever it was, it was some years ago and in front of enough people that the story travels ahead of him. He was given the worst piece of the line this morning by a captain who did not trouble to look at him while saying it, and he has been standing in it since, without a device on him and without anyone to hold it if he goes down. The line is falling back everywhere else. It is not falling back here, and the four men nearest him have stopped asking themselves why they are still level with him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-ONE. The mod reading its own record back to the player.
#
# NEITHER DESC MAY NAME THE STYLE. The gate on the first is a count, not a
# kind: the same paragraph is rendered for a man who has won twice by holding
# and a man who has won twice by charging, and any sentence that pictures one
# of them is wrong for the other. The word to reach for is "again", never
# "always in the same way".
#
# NEITHER MAY NAME A PREVIOUS BATTLE. The mod knows the count and nothing else
# - not where, not against whom, not what it was called - and a toast that
# invents a name puts a fact in the player's world that no other file agrees
# with.
#
# THE FIRST MAY NOT PROMISE A TRAIT. Three battles and a budget gate decide
# that, out of the template's sight and possibly against it.
#
# THE SECOND MAY NOT KILL HIM, MAY NOT LOSE THE BATTLE AND MAY NOT HAVE HIM
# CHANGE HIS MIND. `reckless` and `cautious_leader` are opposites and only the
# reward chain may make that swap.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "he has done
# this before", "it has worked every other time".
 bc_the_thing_he_always_does_toast:0 "They Move Before He Says It"
 bc_the_thing_he_always_does_toast_desc:0 "The rider he sent out is still forty yards short of the captain he was sent to and the captain has already turned his men into it. Nobody has drilled this. It is only that they have stood in this shape beside this man often enough to know what the second half of the order is going to be, and this afternoon the half-second they save on every one of them has begun adding up in a direction the other host can see from where it stands.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_gamble_that_does_not_pay_toast:0 "The Same Throw, A Worse Field"
 bc_the_gamble_that_does_not_pay_toast_desc:0 "He asked for the whole of it at once, the way he asks for it, and the ground gave him back about a third and kept the rest. The horses that went furthest are the ones not coming back, and the men behind them are looking at the gap where those horses were and doing the arithmetic on it out loud. He is watching the same gap. Nothing he is thinking about it has reached his face.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-TWO. The two counters, on the afternoon that contradicts them.
#
# NEITHER DESC MAY NAME A NUMBER. The mod holds `bc_notable_battles` and
# `bc_nemesis_losses` as integers and holds nothing else - no place, no year,
# no name of a previous field - so "the fourth time" and "since the Trident"
# are both inventions that no other file in the mod agrees with.
#
# THE FIRST MAY NOT PUT A DEFEAT IN HIS PAST. The counter is incremented only
# in the winner's arm of the aftermath chain; it is a tally of victories, and a
# sentence about all the fields he has seen is reading a number that does not
# say that.
#
# THE SECOND MAY NOT KILL EITHER MAN, MAY NOT PUT THEM WITHIN REACH OF EACH
# OTHER AND MAY NOT SETTLE IT. `bc_chronicles.0005` owns the thirty feet, the
# rivalry chain owns the escalation, and the battle is still going.
#
# NEITHER MAY BE ABOUT SURPRISE. Both men know exactly what is happening to
# them; that is the whole difference between these two and the ordinary
# losing-side templates.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "he has done
# this before", "nobody has said anything to him about it".
 bc_the_record_does_not_help_him_toast:0 "They Are Waiting For Something He Has Not Got"
 bc_the_record_does_not_help_him_toast_desc:0 "Everything he has sent out this hour has been the right thing sent to the right man at the right moment, and every one of them has arrived into a field that has stopped answering. The captains keep looking back up the slope at him between orders, waiting for the one they have all heard about, and he can see them doing it. There is no such order. There was never going to be one today, and he worked that out some time before they will.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_man_who_has_done_this_before_toast:0 "He Knows That Banner Too Well"
 bc_the_man_who_has_done_this_before_toast_desc:0 "The shape of it came apart in the same direction it came apart last time and he recognised the direction before the messengers did. Everything is going the way it went before, and he is doing the only thing left that he can still choose to do, which is stand exactly where he is standing and make the men either side of him do the same. The banner opposite has not moved either. Neither of them is going anywhere.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-THREE. The commander's wound, seen from the ranks.
#
# NEITHER DESC MAY SAY WHERE THE WOUND IS. The trait is `wounded` and the mod
# knows nothing beyond that - no limb, no weapon, no rider who brought him in.
# A toast that supplies one puts a fact in the player's world that the four
# other files touching this trait would contradict.
#
# NEITHER MAY HEAL HIM OR GET HIM OFF THE FIELD. Vanilla's recovery pulse owns
# how long `wounded` lasts and the battle is not over.
#
# NEITHER MAY BE ABOUT AN OLD WOUND. `bc_battle_wounded` is cleared at combat
# end and means "hit today"; `bc_knight_the_old_wound` owns the other reading,
# on the knight himself.
#
# THE SECOND MAY NOT LET THE RUMOUR BE TRUE. He is wounded and he is
# commanding. `bc_banner_falls` owns the banner going down and
# `bc_chronicles.0002` owns a line deciding what it is frightened of.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "word went
# down the line" in the prose itself, "nobody has told him".
 bc_knight_the_lord_is_still_up_toast:0 "The Man on the Grey Has Not Sat Down"
 bc_knight_the_lord_is_still_up_toast_desc:0 "Half the men in this part of the line saw it happen and have been working from the same short list of facts since: he was hit, he did not come off, and the horse is still turned the way it was turned before. They have not fought better this afternoon than they fought this morning. They have fought considerably harder, and the other host has been paying the difference for about a quarter of an hour without quite understanding where the bill came from.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_word_came_down_the_line_toast:0 "By the Fifth Rank It Is a Worse Story"
 bc_knight_word_came_down_the_line_toast_desc:0 "What happened is that he was hit and stayed up. What arrives here, four mouths later and travelling against the direction of the fighting, is a good deal shorter than that and stops after the first half. The orders keep coming and they are the same orders they have been all day, and the men taking them have started asking the rider who sent them, which is a question nobody asked at noon and which nothing in the answer can now settle.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-FOUR. The country the war kept him in.
#
# NEITHER DESC MAY NAME A TERRAIN. `bc_terrain_last` holds one of six BUCKETS,
# never a terrain key, so the mod does not know whether the last three fields
# were hills or mountains, bog or floodplain - only that they were the same
# kind of country. No river, no ridge, no wood may be named as though the
# player's map would agree with it.
#
# NEITHER MAY SAY HE CHOSE THE GROUND. The streak effect's own header settles
# this: terrain is not chosen, a commander goes where the war goes.
#
# THE SECOND MAY NOT NAME THE ENEMY OR MAKE HIM AN OLD OPPONENT. It reads a
# terrain counter, not `bc_battle_foe`; the man opposite may be a complete
# stranger who has simply been campaigning in the same country, and
# `bc_the_man_who_has_done_this_before` owns the case where he is not.
#
# NEITHER MAY COUNT THE BATTLES ALOUD - the standing rule for every counter in
# this family.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he has done this before", "the men
# have noticed", "he worked it out before they did".
 bc_the_same_country_again_toast:0 "Nobody Has to Be Told Twice Here"
 bc_the_same_country_again_toast_desc:0 "The outriders came back with less than they used to and it was worth more, because everybody receiving it already knew which half mattered. Nothing has been explained on this field since dawn. The scouts went where they were going to go, the captains put their flanks where this sort of country always wants them, and the whole apparatus has been running a quarter of an hour ahead of the other host all afternoon without anyone raising his voice about it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_learned_it_too_toast:0 "He Was Already Standing There"
 bc_he_learned_it_too_toast_desc:0 "Every move he has made this afternoon has been the correct move for this kind of country, and every one of them has arrived at a place where somebody was already waiting. It is not that he has been outfought. It is that he has spent long enough here to stop noticing that the campaign has been teaching the other side the same lessons at the same speed, and this is the hour in which that arithmetic finishes.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-FIVE. Three sets of gods, and what the man beside him expects.
#
# NONE OF THE THREE DESCS MAY QUOTE A CREED. The mod gates on `has_religion`
# and knows nothing else - not which faith inside the religion, not which
# septon or priest or grove, not what anybody was taught. A remembered line of
# scripture in a toast is a fact about a branch the gate did not test.
#
# NONE MAY PERFORM A MIRACLE OR MAKE A GOD DO ANYTHING. Every one of these is
# about what the men present assume will happen next, which is the only way a
# god reaches a battlefield in this mod.
#
# THE FIRST MAY NOT PROMISE THEY HOLD AND MAY NOT LOOK LIKE A RALLY -
# `bc_rally_the_line` owns that, and nothing here reverses.
#
# THE SECOND MAY NOT BURN ANYBODY AND MAY NOT PUT A PRIEST IN COMMAND. The
# commander is still the commander; the mod has no way to put anyone else
# there.
#
# THE THIRD MAY NOT PRAY ALOUD, MAY NOT PUT A TREE ON THE FIELD AND MAY NOT
# MAKE HIM DOUBT. He is not having a crisis of faith, he is having an ordinary
# bad hour with nothing to fill the silence with.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting".
 bc_they_do_not_ask_for_terms_toast:0 "Nobody Here Is Selling Himself Back"
 bc_they_do_not_ask_for_terms_toast_desc:0 "A herald came across an hour ago and went away again with the same answer he arrived with, and the men who heard it did not react to it in any way, because it had not occurred to any of them that a different answer was available. They are giving ground about a foot at a time and charging for every foot of it. Whatever the other host thought this last hour was going to cost, it is costing more than that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_fire_is_ahead_of_him_toast:0 "They Have Stopped Waiting For The Order"
 bc_the_fire_is_ahead_of_him_toast_desc:0 "He sent the centre forward and the centre went a good deal further than he sent it, and the two wings went with it without being asked, and the whole thing is now perhaps eighty yards past where he intended it to stop. It is working. It is also no longer entirely his, and he has spent the last few minutes riding along behind an army that is certain of something, trying to decide whether to spend the afternoon steering it or the afternoon getting it back.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_to_say_over_him_toast:0 "There Are No Words For This Part"
 bc_knight_nothing_to_say_over_him_toast_desc:0 "The man on his left went down twenty minutes ago and there was nothing to be said over him, so nothing was. Down the line somebody southron is being given the whole of it, the seven of them named one after another by a voice getting steadily higher, and it is carrying rather better than the fighting is. He has been listening to it and doing his work and has not yet decided which of the two of them is worse off.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-SIX. The war behind the afternoon, read for the first time.
#
# NEITHER DESC MAY NAME THE WAR, THE ENEMY, A HOUSE, A KING OR A CLAIM. The
# gates know one bit each - that the quarrel is internal, that the quarrel is
# his - and nothing whatever about who is in it or what it is for.
#
# THE FIRST MAY NOT SAY BROTHER, COUSIN OR KIN LITERALLY. `is_civil_war` is
# not a relation check; no relative has been tested and none may appear. It
# may not be a scene of recognition either - nobody spots a face he knows.
#
# THE SECOND MAY NOT HAVE HIM DECIDE ANYTHING, SURRENDER, SEND FOR TERMS OR
# CONTEMPLATE EITHER. He is a war leader losing an hour, not a war; the
# aftermath owns endings and this does not touch them.
#
# NEITHER MAY REVERSE THE HOUR OR PROMISE THE LINE HOLDS - both are losing
# templates and the mod does not undo a side's state in a moment toast.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it".
 bc_the_other_half_of_the_realm_toast:0 "The Same Drill, Learned In The Same Yard"
 bc_the_other_half_of_the_realm_toast_desc:0 "Everything the other host has done this afternoon has been done the way he would have done it, and each time it works there is a half-second in which he approves of it before he remembers who it is happening to. Neither side has given a foot cheaply. Neither side is going to be the one that turns first while the other is still watching, and so the hour is costing both of them roughly twice what an hour against strangers would.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_his_own_war_toast:0 "There Is No One To Send To"
 bc_his_own_war_toast_desc:0 "Twice in the last hour he has turned in the saddle to send word to somebody, and twice there has been nobody at the end of it, because the name at the top of this quarrel is his own and has been since the first day of it. So the reserve went in. Then the escort went in. He is aware, in the flat and unhurried way a man is aware of weather, that there is nothing left behind him now and no one who will be asked about it afterward except him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-SEVEN. The body he arrived with.
#
# NEITHER DESC MAY NAME THE ILLNESS OR DESCRIBE A SYMPTOM THAT NAMES IT.
# Sixteen traits share this gate - a pox, a plague, a cancer, a bad chest, a
# bad joint - and they have nothing in common except that he is not well. No
# cough, no rash, no named fever, nothing a maester would write down.
#
# NEITHER MAY BE A DEATHBED, MAY NOT HAVE HIM NEARLY FALL, AND MAY NOT PUT
# ANYONE BESIDE HIM TO FUSS. He is doing his job through it and is still doing
# it when the toast ends.
#
# THE FIRST MAY NOT SAY HE IS BRAVE ABOUT IT AND MAY NOT REVERSE THE HOUR. It
# is a losing template about buying the shorter option and letting the men pay
# the difference, which is the opposite of a gallant one.
#
# THE SECOND MAY NOT HAVE HIM WIN THE BATTLE, GIVE A SPEECH OR BE CHEERED -
# the whole point is that he spends nothing, and a cheer is somebody else's
# moment.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him".
 bc_the_shorter_of_the_two_orders_toast:0 "Every Choice Today Has Been The Near One"
 bc_the_shorter_of_the_two_orders_toast_desc:0 "There were two ways to answer the last push and he took the near one, as he took the near one before that, because the other would have meant crossing the field twice and he does not have two crossings in him this afternoon. Each of them was defensible. Together they have quietly turned a battle of movement into a battle of pushing, and pushing is being paid for in the ordinary currency by men who were not consulted about the exchange rate.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_does_not_move_from_the_rise_toast:0 "He Has Given Four Orders Since Noon"
 bc_he_does_not_move_from_the_rise_toast_desc:0 "He picked his ground at midday and has not left it since, and in three hours he has sent four riders out, which is fewer than he has sent in any battle of his life. It turns out that most of what he usually does is telling men he is watching them. They knew. The captains have been running their own halves of it all afternoon and running them well, and the only thing on this field that has not moved is the one thing that did not need to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-EIGHT. The mod's own verdict on the afternoon, read back.
#
# THE FIRST MAY NOT WIN THE BATTLE, MAY NOT ROUT ANYBODY AND MAY NOT NAME THE
# ENEMY COMMANDER. Phase events do not end battles and a rout is a word the
# aftermath owns. It is a host that has been ahead for a while, not a host
# that has just finished the job.
#
# THE FIRST MAY NOT BE A SPEECH OR A CHARGE ORDER either - `bc_rally_the_line`
# and the charge templates own those, and nothing here is being reversed or
# begun.
#
# THE SECOND MAY NOT NAME OR SHOW THE COMMANDER, MAY NOT SAY WHAT IS WRONG
# WITH HIM, AND MAY NOT HAVE ANYBODY DECIDE TO RUN. The knight does not know
# why the orders stopped arriving. He knows they stopped. Nothing in the gate
# tells him more than that and the desc may not either.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today".
 bc_they_have_the_shape_of_it_now_toast:0 "The Third Time It Worked, Nobody Waited"
 bc_they_have_the_shape_of_it_now_toast_desc:0 "It has worked twice already and the second time it worked faster than the first, and when the same opening appeared a third time the captains on both wings went into it without sending back to ask. There is a rhythm to the afternoon now that everybody on this side of the field can hear and nobody has had to describe. He has spent the last quarter of an hour giving permission for things that have already started.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_is_coming_from_behind_toast:0 "The Riders Stopped Arriving A While Ago"
 bc_knight_nothing_is_coming_from_behind_toast_desc:0 "Twice an hour, all morning, somebody came up from the rear with a word about what the rest of the field was doing, and at some point that stopped and nobody can say exactly when. So the line has done the only thing a line can do without being told: it has closed up, shortened its front, and settled into holding a piece of ground nobody has yet explained the value of, on the assumption that this is what would have been asked for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-NINE. Two afternoons in the service of a man he does not like.
#
# NEITHER DESC MAY SAY WHY. The gate is an opinion number and knows no reason
# for itself - no insult remembered, no land taken, no woman, no slight named.
# If a desc supplies a cause it is inventing a fact the mod did not check.
#
# NEITHER MAY HAVE HIM DISOBEY, SABOTAGE, RUN, OR SAY ANY OF IT ALOUD. Both are
# about a professional doing the work; the moment either of them becomes
# insubordination it is a different template and a different mod.
#
# THE FIRST MAY NOT BE BITTER IN THE NARRATOR'S VOICE. He has done his part
# well and the record will belong to somebody else, which is a fact rather than
# a complaint, and the toast reports it as one.
#
# THE SECOND MAY NOT MAKE HIM THE REASON THE SIDE IS LOSING. He is one man in a
# line. What is missing is the unasked-for extra that a bad hour runs on, and
# it is missing quietly.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped".
 bc_knight_it_will_be_his_name_toast:0 "It Will Be Written Down As His"
 bc_knight_it_will_be_his_name_toast_desc:0 "He took the ground he was sent for and held the corner of it that mattered, and did both about as well as they can be done, because the alternative would have cost him and not the man who sent him. Somewhere behind him that man is being handed the afternoon. In a year this will be one line in somebody's account of the war and it will have one name in it, and he has known which name since he was told where to stand.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_exactly_what_was_asked_toast:0 "To The Letter, And Not A Step Past It"
 bc_knight_exactly_what_was_asked_toast_desc:0 "Every order that reached him has been carried out exactly, which is the whole of it. Twice this hour there has been a half-chance on his right that a man might have gone for without being told, and both times he has looked at it and stayed where he was put, and both times he has been entirely within his instructions. A bad afternoon runs on the things nobody thinks to ask for. This one is not getting any.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY. The Watch and the free folk: no exit, and nothing but exits.
#
# NEITHER DESC MAY BE A LAST STAND OR KILL ANYBODY NAMED. Both are afternoons
# in the middle of something and the mod does not end battles in a toast.
#
# THE FIRST MAY NOT QUOTE THE OATH, NAME A CASTLE OR A RANGING, AND MAY NOT
# PUT WILDLINGS ACROSS THE FIELD. The gate says who these men are and nothing
# at all about who they are fighting; the Watch has been pulled into southron
# quarrels often enough that the enemy may not be assumed.
#
# THE FIRST MAY NOT CALL IT BRAVERY. A line that cannot leave gets closer
# together because those are the only two things available to it.
#
# THE SECOND MAY NOT HAVE HIM LEAVE, MAY NOT HAVE ANYONE ELSE LEAVE, AND MAY
# NOT SNEER AT KNEELERS. He is still fighting when the toast ends. The moment
# is that the arithmetic is available, not that anybody has done the sum.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter".
 bc_there_is_nowhere_to_desert_to_toast:0 "The Line Is Getting Narrower And Not Shorter"
 bc_there_is_nowhere_to_desert_to_toast_desc:0 "The flanks have come in twice in the last half hour, not because anyone ordered it but because there is nothing on either side of this field that a man in black could walk toward and still be alive in a month. So the front narrows and thickens and the men in it work at the range of about a foot, and the whole apparatus has quietly stopped being an army manoeuvring and started being a wall with hands.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_here_is_sworn_toast:0 "He Picked This Man In A Different Month"
 bc_knight_nobody_here_is_sworn_toast_desc:0 "Nobody in this host swore anything to anybody. He came because the man leading it had been right three times running, and standing here in the fourth hour of being wrong he can feel exactly how much of an army is a stack of private opinions that have not yet been revised. He is still working. The man on his left is still working. Neither of them has said the obvious thing, and both of them know the sum and how easy it would be to do.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-ONE. The county the battle is standing in belongs to him.
#
# NEITHER DESC MAY NAME A HOLDING, A VILLAGE, A RIVER OR A ROAD. The gate knows
# the county is inside his realm and knows nothing else - not its name, not
# what stands on it, not whether he has ever set foot here before today.
#
# NEITHER MAY MOVE ANYTHING ON THE MAP. No village burns, no crop is counted,
# no holding changes hands; the mod does not touch the map and a toast may not
# imply that it did.
#
# THE FIRST MAY NOT MAKE THE SMALLFOLK CHEER, MAY NOT PRODUCE A LEVY FROM
# NOWHERE AND MAY NOT WIN THE BATTLE. It is an advantage made entirely of
# knowing things, and it stays that size.
#
# THE SECOND MAY NOT PUT A NUMBER ON THE DAMAGE AND MAY NOT HAVE HIM REGRET
# GIVING BATTLE HERE. He chose this field this morning. The toast is about what
# choosing it is turning out to mean.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working".
 bc_every_ditch_here_has_a_name_toast:0 "Half The Line Grew Up Inside Thirty Miles"
 bc_every_ditch_here_has_a_name_toast_desc:0 "The ground rolls in a way that looks like nothing from the far side and is not nothing, and this side has spent the afternoon being told about it by men who cut hay on it. Where the wet part starts. Which hedge has a gap and which has a ditch behind it. Nothing about this is martial and all of it has arrived a quarter of an hour before it was needed, which is the difference between the two hosts today.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_it_is_his_own_country_underfoot_toast:0 "Whatever This Costs, He Is Paying It Twice"
 bc_it_is_his_own_country_underfoot_toast_desc:0 "Everything being ruined here this afternoon was already his before either host arrived, and it is being ruined at the rate a losing fight ruins things. He keeps feeding men into it well past the point the odds would justify, and the reason is not stubbornness: giving way here does not end the afternoon, it moves the identical afternoon eight miles further in, onto ground that is also his and has more on it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-TWO. Which of the two hosts chose this.
#
# NEITHER DESC MAY DISENGAGE, WITHDRAW OR CALL ANYTHING OFF. Phase events do
# not end battles and "he broke off the attack" is ending one.
#
# THE FIRST MAY NOT NAME THE OBJECTIVE, MAY NOT PUT A NUMBER ON THE ATTEMPTS
# AND MAY NOT HAVE HIM REGRET COMING. The gate knows he walked onto them and
# that it is going badly, and knows nothing about what he came for.
#
# THE SECOND MAY NOT COUNTERATTACK, MAY NOT BREAK THE ENEMY AND MAY NOT MAKE
# HIM CLEVER. Every interesting decision today was made by the other man and
# none of them worked; the toast may not steal any of them back.
#
# NEITHER MAY USE THE WORD FOR THE WAR'S ATTACKER. This is a combat-level fact
# about who walked onto whom this morning, not about who declared anything.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line".
 bc_he_chose_the_hour_toast:0 "Nobody Made Him Come Up This Slope"
 bc_he_chose_the_hour_toast_desc:0 "The ground was his choice and so was the morning and so was the shape of the thing, and none of it is doing what it was picked to do. What happens now is that the same push gets made again, because ordering it costs a sentence and admitting it does not work costs the rest of the campaign, and the second push is going in over the ground the first one paid for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_came_to_him_toast:0 "He Has Not Done Anything All Day"
 bc_they_came_to_him_toast_desc:0 "He picked this place two days ago, put the host on it, and has done nothing since except decline to leave. Everything clever that has happened this afternoon was thought of by the man opposite, and all of it has arrived here in pieces, at the pace the ground allows, into a line that has not had to change its mind about anything. There will be no story in this for him. There is a good deal of story in it for the other one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-THREE. There is a river in this province.
#
# NEITHER DESC MAY NAME THE RIVER OR THE FORD. The gate is a flag on a province
# and knows nothing else - not the name, not the width, not the season it was
# last in flood.
#
# NEITHER MAY DROWN ANYBODY, and neither may put a bridge on the field. The mod
# does not kill in a phase event, and a bridge is a structure the gate did not
# check for.
#
# THE FIRST MAY NOT HAVE HIM SHIFT THE BATTLE ELSEWHERE OR FIND A SECOND FORD.
# A funnelled battle cannot be un-funnelled by the man losing it, which is the
# whole moment.
#
# THE SECOND MAY NOT HAVE HIM CROSS, MAY NOT WIN THE BATTLE AND MAY NOT MAKE
# THE WATER A METAPHOR. He is in it, the fighting is in it, and he is still
# standing in it when the toast ends.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line", "he has
# not done anything".
 bc_it_all_comes_down_to_the_crossings_toast:0 "Three Places, And He Needs All Three"
 bc_it_all_comes_down_to_the_crossings_toast_desc:0 "There are three places on this front where men can actually reach each other and both hosts had them marked before noon, which was an advantage this morning and is arithmetic now. The same numbers are trying to fight along a third of the frontage. Nothing can be pulled back from a crossing without the crossing going with it, so nothing is pulled back, and the rate at which this is costing him has very little to do with how well anyone is fighting.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_water_is_over_his_boots_toast:0 "Nobody Fights Well On Stones He Cannot See"
 bc_knight_the_water_is_over_his_boots_toast_desc:0 "He has been standing in it long enough to stop noticing the cold and not long enough to trust his footing, and every man he has put down in the last half hour went down inside the length of his own arm, because there is no other range available here. The side is winning. This particular twenty yards of it is being bought at a price that will not appear in anybody's account of the day.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the edge that cannot be turned ------------------------------------------
#
# TWO MOMENTS ON A COASTAL FIELD. The first is the commander with a flank the
# enemy cannot buy; the second is a knight at the waterline getting off a
# horse that has stopped being any use.
#
# NEITHER MAY PUT A SHIP ANYWHERE. No sails on the horizon, no landing behind
# either host, no fleet coming, no fleet leaving. The gate checked whether the
# province touches salt water and nothing else, and a ship is an entire other
# battle that the mod has no business inventing in a toast.
#
# NEITHER MAY DROWN ANYBODY AND NEITHER MAY KILL ANYBODY. The mod does not
# kill in a phase event.
#
# THE FIRST MAY NOT SAY THE ENEMY IS BEATEN and may not have him commit the
# men he has saved. The whole moment is that they are still standing there
# unspent, which is what `measured` means.
#
# THE SECOND MAY NOT PUT HIM BACK ON THE HORSE, may not have the horse die,
# and may not turn the dismount into a victory. He gets off because the ground
# made him, the side is still going backwards when the toast ends, and the
# horse is simply somewhere behind him being no use to anyone.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line", "he has
# not done anything", "three places", "he cannot see".
 bc_the_sea_holds_that_flank_toast:0 "One End Of It Is Not His Problem"
 bc_the_sea_holds_that_flank_toast_desc:0 "Whoever is commanding opposite him has spent the morning looking for the end of this line and there is not one, because it runs into salt water and stops. Every man sent to find a way round has come back or not come back, and the effect either way is that the fighting is happening exactly where he decided it would. He has companies standing behind the right that have not been asked for anything yet, and the longer that stays true the more the afternoon belongs to him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_leaves_the_horse_in_the_shallows_toast:0 "The Ground Made The Decision"
 bc_knight_he_leaves_the_horse_in_the_shallows_toast_desc:0 "The animal has been in up to the hocks for a quarter of an hour and has gone from a weapon to a thing that has to be kept alive, so he swings down into water that comes over the top of his boots and hands it off to nobody in particular. On foot he is a shorter, slower, better-armoured man than he was, and he is now fighting at the only place on this field where being pushed backwards has an actual limit.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the men who are here for money ------------------------------------------
#
# TWO MOMENTS IN A FREE COMPANY. The first is a captain losing men who are his
# stock rather than his subjects; the second is a rider in the same company on
# the one afternoon of the year the arrangement pays properly.
#
# NEITHER MAY NAME A COMPANY. No Golden Company, no Second Sons, no Windblown,
# no Stormcrows. The gate asked whether the government is a mercenary one and
# nothing else, and the mod does not invent an organisation for a man who has
# one already.
#
# NEITHER MAY TAKE THE HOST OFF THE FIELD. A phase event does not end a battle,
# so no withdrawal, no disengagement, no terms and nobody riding away.
#
# NEITHER MAY MENTION A SPECIFIC SUM. The mod has never put a number of gold in
# a toast and is not starting; the point is what men cost, not what they cost
# in coin.
#
# THE FIRST MAY NOT SAY THE COMPANY IS BEATEN and may not have it break. The
# entire moment is that it does not break. It may not make him regretful about
# the trade either - he is doing arithmetic, and it is arithmetic he does well.
#
# THE SECOND MAY NOT SACK ANYTHING, may not take a prisoner, may not find any
# named object, and may not let him leave the battle. He is riding down men who
# are already running, in the direction where their carts are.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line", "he has
# not done anything", "three places", "he cannot see", "one end of it".
 bc_they_are_not_his_smallfolk_toast:0 "Every Man Here Was Bought Once"
 bc_they_are_not_his_smallfolk_toast_desc:0 "The line is going backwards and it is going backwards the way it was taught to, a step at a time with the ranks still in the order somebody spent years putting them in, because the alternative has been explained to every man in it in terms he understood. A lord who spends a thousand men has spent a thousand of somebody's sons and will hear about it in eight months. He has spent a thousand of the only thing he owns, and he is watching the rate of it with the attention of a man watching a granary burn.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_where_the_wages_are_toast:0 "The Contract Never Mentioned This Part"
 bc_knight_where_the_wages_are_toast_desc:0 "The men in front of him stopped being an enemy some minutes ago and became a crowd going the same direction, and behind the crowd, at the pace of an ox, is everything the crowd owns. He is not the first rider to work this out and he will not be the last one down that road today. The horse under him has one such afternoon in it and is spending the whole of it now, which he knows, and which is not going to stop him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- what the man across the field is worth ----------------------------------
#
# TWO MOMENTS ABOUT A CROWN ON THE OTHER SIDE. The first is a commander whose
# army has just been given one thing to look for; the second is a knight
# meeting the men that crown pays for.
#
# NEITHER MAY NAME THE KING, HIS KINGDOM, HIS HOUSE OR HIS SIGIL. The gate
# asked one question - is the highest title the man opposite holds a kingdom or
# better - and knows nothing else about him. The bond clause printed underneath
# will say whether he is kin, a countryman, a heathen or a stranger, and that
# is the only other thing either desc is entitled to imply.
#
# NEITHER MAY NAME A GUARD OR AN ORDER. No Kingsguard, no Golden Company, no
# household with a name. The mod has one Kingsguard template already and it is
# gated on the council positions; inventing an order here would collide with a
# gate that actually checks.
#
# NEITHER MAY KILL, CAPTURE OR END ANYTHING. A phase event does not take a
# prisoner and does not finish a battle.
#
# THE FIRST MAY NOT PUT THE KING IN REACH and may not say he is running. His
# host is going; what he is personally doing is not visible from here and the
# desc may not guess.
#
# THE SECOND MAY NOT MAKE HIM COWARDLY AND MAY NOT MAKE HIM HEROIC. He is being
# outspent, which is a thing that happens to good men at a steady rate all
# afternoon, and the toast is about the rate.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line", "he has
# not done anything", "three places", "he cannot see", "one end of it", "every
# man here".
 bc_the_other_banner_is_a_kings_toast:0 "One Thing Worth Chasing"
 bc_the_other_banner_is_a_kings_toast_desc:0 "An ordinary host coming apart sends a thousand men after a thousand different things and the chase is worth nothing by dusk. This host is coming apart around a banner that everybody on this field, on both sides, has been keeping track of since the lines closed. He does not have to give an order about it. He has an army that all wants the same thing at the same moment, which is a condition he may not see twice.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_men_a_king_can_afford_toast:0 "They Do Nothing Else All Year"
 bc_knight_the_men_a_king_can_afford_toast_desc:0 "The third one he has faced in this stretch of line has plate where the last two had mail and has been drilled by somebody who was paid well to do it, and none of them have been hungry this season. He is not being outfought by a scheme or worn down by the ground. He is meeting men whose kit was bought by somebody who never had to ask what it cost, one after another, and the difference is coming off this side at a rate anyone standing here could measure.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the man who is not entirely here ----------------------------------------
#
# TWO MOMENTS ABOUT A MIND THE MOD HAS NEVER READ. The first is an order that
# does not follow from anything; the second is a man in a line that is coming
# apart around him, who is not coming apart.
#
# NEITHER MAY NAME THE CONDITION. No madness, no lunacy, no possession, no
# devils, no gods talking, no voices, no fits, no fever. The gate matched one
# of four trait keys and none of the four tells the mod what it looks like from
# the outside. The descs work entirely from behaviour that the men around him
# can see.
#
# NEITHER MAY BE COMIC AND NEITHER MAY BE PITYING. Both men are competent
# enough to be where they are, and the other men on this field are afraid of
# the situation rather than of him.
#
# THE FIRST MAY NOT STATE THE ORDER, may not have anybody question or refuse
# it, and may not say afterwards whether it was right. Nobody in the toast
# knows that. It may not have him explain himself either.
#
# THE SECOND MAY NOT GIVE HIM A SPEECH, may not have anybody praise him, may
# not say what he is thinking, and may not make him invulnerable - he is not
# doing better than the men beside him, he is doing the same thing for longer.
#
# NEITHER MAY KILL ANYBODY.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the men have noticed", "nobody has
# said anything", "he has stopped counting", "he has been listening to it",
# "there is nothing left behind him", "every choice today", "the riders
# stopped", "to the letter", "he is still working", "half the line", "he has
# not done anything", "three places", "he cannot see", "one end of it", "every
# man here", "one thing worth".
 bc_the_order_nobody_can_explain_toast:0 "It Went Down The Line Anyway"
 bc_the_order_nobody_can_explain_toast_desc:0 "Something has been moved that was not in any plan discussed this morning, on a reading of the field that begins and ends inside one man, and the runners took it because runners take what they are given. The captains it reached have carried it out at the speed of people who intend to be able to say they carried it out. Wherever it turns out to have been going, the numbers have not improved since, and there is nobody in this host who could describe the reasoning if the day were lost on it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_has_changed_for_him_toast:0 "The One Account Not Running Out"
 bc_knight_nothing_has_changed_for_him_toast_desc:0 "A line does not run out of men before it runs out of each man's willingness to be the one still there when his neighbour is not, and along this stretch that has been going for some time. He is drawing on none of it. He is doing at this hour precisely what he was doing at the last one, no better and no faster, and the two men either side of him have arrived at the unspoken and unwelcome conclusion that where he is standing is the easiest place left to stand.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"
