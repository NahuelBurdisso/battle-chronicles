# is".
 bc_there_are_engines_on_this_field_toast:0 "The Timber In The Way"
 bc_there_are_engines_on_this_field_toast_desc:0 "There are engines in his column and there should not be. They were bought to open a wall that has not been reached yet, they came up the road at the pace of the slowest ox on it, and now the far side has arrived early and the whole of that timber is sitting out on a hillside where none of it will fire once. The teams go first. Something in the noise gets into the draught animals and they take the traces with them, and what is left is a great deal of frame and rope standing exactly where his second rank wanted forming. He works around it. He puts men where the frames are not, gives up the width that costs him, and watches the far side find the same gap he has just conceded and put its weight into it. He does not look at the engines again after that. Looking at them costs time, and time is the one thing on this hillside he has less of than men. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_house_guard_is_standing_here_toast:0 "The Company On His Right"
 bc_knight_the_house_guard_is_standing_here_toast_desc:0 "The company on his right is not levy and it is not hired. Somebody's great-grandfather started paying those men and nobody in that line has stopped since, and it shows inside the first minute: they do not shout, they do not drift, and the front of them moves the way a door moves. He has never stood beside anything like it. So he stops fighting the way he came here fighting. He had been working short and closed up, one eye behind him, nothing committed, which is how a man fights when the people either side of him might go - and it takes him about a hundred heartbeats to understand that there is nothing behind him worth an eye. He lengthens. He steps into the strokes instead of leaning off them. The line he is part of goes forward at the pace that company sets, which is not quick and does not stop, and the far side, which had been giving ground in an orderly way, starts giving it in a hurry. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

