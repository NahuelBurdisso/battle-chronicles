# to some months ago".
 bc_if_that_man_ever_gets_within_reach_of_him_it_is_finished_toast:0 "There Is A Version Of This Afternoon That Ends With The Two Of Them In The Same Ten Feet Of Ground"
 bc_if_that_man_ever_gets_within_reach_of_him_it_is_finished_toast_desc:0 "He has been keeping one eye on where the far banner is and it is not for the reason his own people think. It is not that he wants to get at the man under it. It is that the whole afternoon has been drifting, slowly and without anybody steering it, towards a shape in which the two of them end up in the same ten feet of ground, and he has known for hours what happens then. It is not close. He has held a sword competently since he was a boy and can defend himself against most of what walks about; the man over there is a different order of thing, the kind who was put into a yard at four and never really taken out of it, and the difference between them is not a matter of a good day and a bad one. Everything he understands about ground and lines and timing - which is a great deal, and most of it correct - is worth precisely nothing inside four paces, and his line is being pushed steadily back towards the place where four paces is all there will be. So he is fighting the whole battle at a slight angle to it, spending attention he cannot spare on staying far away from a man who is in no particular hurry, has almost certainly noticed him, and would need less than a minute.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_man_running_them_could_not_live_with_him_for_a_minute_toast:0 "He Could Take The Man Running That Side Apart And It Would Change Nothing At All"
 bc_knight_the_man_running_them_could_not_live_with_him_for_a_minute_toast_desc:0 "He has watched the far banner long enough to have formed an opinion, and the opinion is that the man under it cannot use a sword. It shows in small things. He carries the weight wrong. When a fight came near him earlier he moved like somebody who has been taught the moves and has never had to make one against a person genuinely trying, and he was got out of it by other people quickly, and he let them. Any minute of any afternoon, on any ground, that would go one way and only one way. What he cannot decide is what to do with knowing it. It is a long way over there through a great many men who are not going to stand aside, and his own stretch of the line is doing extremely well precisely because he is in it and not somewhere else, and the whole thing would come apart behind him for the sake of an errand that finishes with one man dead who was never the reason any of them are here. So he stays. He does the work in front of him, which is going his way, and every so often he looks up at the banner the way a man looks at a debt he has decided not to collect.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

