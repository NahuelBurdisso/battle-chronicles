 bc_the_far_side_is_commanded_by_his_blood_brother_toast:0 "Sworn, Once"
 bc_the_far_side_is_commanded_by_his_blood_brother_toast_desc:0 "There was an afternoon a long way back with a knife and two palms and no witness who counted, and the pair of them meant it, and both of them have gone on meaning it, and none of that has been the slightest use to anybody since the spring. The line is bending. He can feel where it will go and roughly when. What he does about it is not clever and he does not pretend it is: he puts himself at the worst of the bend and stays there, and stays there, and goes on staying there long after the arithmetic has stopped agreeing with him. It is not tactics. Of all the men alive who might watch him give ground this afternoon there is exactly one whose watching he cannot have, and so the position holds longer than it has any right to and costs more than it is worth, which are two ways of saying the same thing. Somewhere behind his teeth he knows the other one is doing the job properly and would never have asked this of him. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_swore_blood_with_the_man_giving_the_orders_toast:0 "The Oath With No Lord In It"
 bc_knight_he_swore_blood_with_the_man_giving_the_orders_toast_desc:0 "The one giving the orders is the one he swore with, and the swearing was no ceremony: it was a bad idea two young men had at the end of a long night and then declined to be embarrassed about for the next twenty years. The far line is opening now. Everything in him wants to be first through the gap, because being first through it is the kind of thing a man can mention afterwards. He does not go first. He goes at the pace the men on either side of him can actually hold, he keeps his dressing, and he lets the gap open the way it needs to open rather than the way it would look best opening. That is all of it. Nobody will ever know he decided anything. But an oath between equals is a promise to be useful to a man rather than impressive at him, and he has never once been confused about which of those he signed up for. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


