# will alter nothing for any of the four".
 bc_the_problem_in_front_of_him_is_not_his_department_toast:0 "Not His Department"
 bc_the_problem_in_front_of_him_is_not_his_department_toast_desc:0 "His competence is a real thing and all of it is filed somewhere else. He is good with ledgers, or with quiet men, or with the part of a year that decides whether anybody eats; the seat he holds was given him for that and the giving of it was correct. Nobody consulted him about this afternoon. He has been standing on this rise since the light came up, watching something he can describe with complete accuracy and cannot alter by describing it, and what he keeps arriving back at is the single instinct his whole working life has trained into him, which is never to spend a thing that cannot be got again. So the line does not go forward and it does not come back. It thickens. It gets shorter and denser and much harder to shift, which is what a careful man does with anything he has been handed, and it may even turn out to have been right. He will not know for another hour. Knowing was never the part he was kept for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_can_hear_what_they_are_telling_each_other_toast:0 "He Can Hear Them"
 bc_knight_he_can_hear_what_they_are_telling_each_other_toast_desc:0 "He collected them the way other men collect scars - one in a household he was sent to and did not want to be in, one from a woman who believed she was teaching him something else entirely, one out of four winters of undiluted boredom. Nobody has ever suggested it was worth anything. Now across forty paces of churned ground the men opposite are talking to each other constantly, because men do, and none of it is meant for him, and every word of it is arriving. He repeats none of it to anybody. He simply moves left before there is a visible reason to move left, and is standing where the weight is going to fall a moment before it falls, and the men beside him come across with him without asking, because he has been right four times running and that is enough for anyone. The whole of his advantage is that he is hearing the shape of the next quarter of an hour while everybody around him is hearing noise.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

