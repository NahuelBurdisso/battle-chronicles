# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 393.
 bc_the_same_word_damns_them_both_toast:0 "The Same Fault In Two Men"
 bc_the_same_word_damns_them_both_toast_desc:0 "He worked out what the man opposite is inside the first half hour, and the trouble with it is that he worked it out by looking inward. They have the same failing. Two different sets of priests, two different books, and both books carry the same short sentence about men like the pair of them. So he can foretell the far side beautifully: where that man will grasp, where he will hurry, where he will spend something he ought to have kept - and he is right about every one of them, and each time he is right he gets a fraction slower, because this is not really foretelling, it is recognition, and recognition is a slow sour business. He commits nothing he cannot take back. He probes where he ought to lean. Late in the day he has been correct about everything and has got nothing whatever out of being correct, while the far side, which has never spent one moment thinking about him in this way, is a hundred paces further up the field. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_same_word_speaks_well_of_them_both_toast:0 "Praised For The Same Thing"
 bc_knight_the_same_word_speaks_well_of_them_both_toast_desc:0 "Whatever it is the two of them have in common was put into each of them by different people in different halls, and both sets of people thought well of it. That is rarer than blood. It means the man giving the orders and the man standing in the fourth rank hold the same idea of what a well-spent hour looks like, which sounds like nothing at all until a line comes under pressure and every man in it is choosing, thirty times an hour, between what feels urgent and what is right. He takes the second one every time, and he takes it in the same direction his commander is taking it, with not one detail of the afternoon discussed between them beforehand. No signal passes. None is required. The front where he stands goes forward at the pace of somebody in no hurry who has not yet been wrong about which foot goes next. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

