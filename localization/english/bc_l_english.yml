# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 260.
# of him and all of it is in the way".
 bc_they_are_still_here_because_they_like_him_toast:0 "They Are Still Here"
 bc_they_are_still_here_because_they_like_him_toast_desc:0 "Nobody has ever said he was much of a soldier and he has never said it either. What he is good at is people. He remembers which man has a sick wife and which one has a brother he does not speak to; he says the right thing at the right moment without appearing to have chosen it; men who arrive at his hall disliking him leave four days later unable to say why they no longer do. None of that was ever meant to be load-bearing. It is load-bearing now. Whatever order this part of the field had is gone, the shouting has stopped meaning anything, and the men around him are staying exactly where they are for one reason, which is him. Not his orders. Him. It is holding. It is the only thing that is holding, and affection was never built to take this kind of weight for very long. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_one_hour_that_asks_for_his_best_toast:0 "The One Hour"
 bc_knight_the_one_hour_that_asks_for_his_best_toast_desc:0 "Take him away from a fight and there is not much to look at. He is a poor talker and a worse manager, has never had an idea worth repeating, and has sat through a hundred evenings of other men being interesting while he worked out what to do with his hands. The one thing he has ever been the best in a room at is this. And this is what is happening. Whatever shape the fighting had an hour ago is gone; it is a scramble now, men coming at him out of the press with no warning and no order to any of it, and a scramble asks precisely one question and asks it over and over. He knows the answer. He has always known the answer. For the length of this hour, and no longer, the world wants exactly the thing he is best at. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

