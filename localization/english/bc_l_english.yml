# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 162.
# whatever to do with the slope".
 bc_the_men_he_brought_are_exactly_what_was_written_down_toast:0 "He Brought The Number He Owed And The Number He Owed Is Lying Out On The Grass"
 bc_the_men_he_brought_are_exactly_what_was_written_down_toast_desc:0 "The line he is holding is the correct length. That is the entire trouble with it, and he has not been able to stop turning the thought over since the second push. Every man standing on it is out there because a document says he must be, and the document was drawn up by somebody who has never seen this field and will hear about today in a fortnight, from a clerk, in a warm room. The figure it sets is a high one - higher than what the men who hold either side of him carry, high enough that he has spent every peaceful year of his life resenting it quietly and every year of war finding fresh reasons to - and it has been met exactly, to the man. He brought what he owed. He brought nothing whatever beyond what he owed, because the men beyond what he owed are the men who plough, and taking them would have ruined him inside three years no matter how this afternoon went. So the correct figure is out on the grass, and the correct figure is not enough, and there is no version of today in which he did the wrong thing. That is the part he cannot get around. He kept to the terms. The terms are being settled now, in the only currency they were ever really written in, and he is standing in the middle of the settlement watching it counted out.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_written_down_required_him_to_come_toast:0 "Nothing Anybody Ever Wrote Down Required Him To Be Standing Here"
 bc_knight_nothing_written_down_required_him_to_come_toast_desc:0 "On paper he owes next to nothing, and the men either side of him are perfectly aware of it, and that awareness is doing something out here that no obligation has ever done for anyone. Somebody a long way back got the terms cut, or a lord in a hurry once settled with his people cheaply, and the upshot is a household that could have sat out this whole season with nothing owing and nothing said about it afterwards. He came regardless. He is not sure he could give a decent account of why if anyone pressed him, and he has noticed that nobody has, and that the not-pressing is a sort of statement in itself. What he does know is how differently a man fights when the thing that put him on this grass was a decision and not a schedule. There is no grievance in his arm. He is not doing sums between pushes about what this is costing him measured against what he was required to lose. He went where it was thickest at about the third hour and he has stayed there since, on the reasoning that having chosen to come it would be absurd to then stand somewhere comfortable. The stretch of line around him has been widening all afternoon, because men keep drifting toward the part of it that is plainly, and rather infectiously, enjoying itself.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 148 - what is standing on this ground ----------------------------
#
# THE FIRST MAY NOT NAME a place, a castle, a house, a sigil, a title or an
# ancestor, quote a saying, have a rider arrive or a message go out. He may not
# order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME a place, a house, a sigil or a title, or quote a
# saying. Nobody may cheer him or use his name. He may not kill a named man,
# reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 163.
# enjoying itself".
 bc_the_walls_over_this_field_are_not_going_to_open_toast:0 "The Gate Has Been Shut Since Morning And Both Sides Know Quite Well It Will Stay Shut"
 bc_the_walls_over_this_field_are_not_going_to_open_toast_desc:0 "The shadow they have been fighting in since about the second hour was put there four hundred years ago by people who understood exactly what they were doing, and it has been of use to nobody at all today. He can see the gate from where he is standing. It is shut. It is going to remain shut, and the men on the wall-walk have been watching all this since first light the way a farmer watches weather. Whoever holds that place is not opening it for a force this size in a fight this undecided, and would be an idiot to, and he has stood on the other side of that exact decision often enough that he cannot even resent it cleanly. What he resents is his own reasoning. He chose to fight here because of the thing above the field, and he worked it out the way everybody is taught to - high ground, a secured flank, a fixed point that cannot be turned - and every step of that working was correct as written. The flaw is simpler than any of the steps. A wall that is not yours is not a flank. It is an extremely large object that does not move, and it has spent the afternoon quietly removing his choices one direction at a time, and what he has left now is a line with nowhere remaining to bend.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_nothing_here_to_get_behind_toast:0 "There Is Nothing On This Ground To Put A Back Against And He Has Stopped Minding"
 bc_knight_there_is_nothing_here_to_get_behind_toast_desc:0 "There is nothing here. He noticed it before first light and has been working through the consequences ever since - no wall, no ditch, no barn, no bank, not so much as a serious hedge, only a wide uninterested stretch of country that has never been worth building on and, until this morning, had never been worth fighting over either. Men who have done this a few times look for something to put their back against without ever deciding to look, and finding nothing does a specific thing to a line. He has been watching it happen to the far side for hours. They keep checking behind them for a thing that is not there, every check costs a fraction, and the fractions have been accumulating since noon. His own side are doing it as well - he is doing it himself, he has caught himself at it twice - but early on he made a decision that has turned out to be the whole day: he stopped treating the emptiness as a difficulty and started treating it as the arrangement. Nowhere to fall back to also means nowhere to be come at from. No shelter for him is no shelter for them. He has fought the entire day in open air with nothing at his shoulder except the men who chose to stand beside him, and it has left him, to his own real surprise, steadier than he has ever been on ground with walls on it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 149 - what each of them could raise ------------------------------
#
# THE FIRST MAY NOT NAME a place, a house, a sigil, a title or an ancestor,
# quote a saying, have a rider arrive or a message go out. He may not order a
# withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME a place, a house, a sigil or a title, or quote a
# saying. Nobody may cheer him or use his name. He may not kill a named man,
# reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 164.
# has ever been on ground with walls on it".
 bc_there_is_nothing_left_at_home_to_send_for_toast:0 "There Is No Second Army And He Is The Only Man On This Field Who Knows It"
 bc_there_is_nothing_left_at_home_to_send_for_toast_desc:0 "There is no second army. It is a simple fact, he has been living inside it since the light came up, and it quietly alters what every other fact out here means. He called out all of it. Not most of it, not the generous-looking three quarters that leaves a man something to be reasonable with afterwards - all of it, down to garrisons that had not been emptied since long before he was born and men whose absence is going to be visible in the harvest. He did that on purpose. The alternative was turning up here able to lose politely, and he had worked out some while ago that losing politely and losing are one outcome in two coats. So there is nothing at his back. No relief. No second effort when the roads dry. No fallback that amounts to anything more than these same men standing further away. The men opposite do not know it, which is the last advantage he holds and is worth precisely what a secret is worth on the day the thing it hides is being demonstrated in public. What is being spent out there is all there is, and every man of it who goes down is replaced by nobody, ever, and the work he is doing this hour is keeping his face in the shape it would be in if there were a reserve.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_is_the_larger_power_and_he_is_taking_the_orders_toast:0 "He Takes The Orders Promptly And Without The Small Lag That Would Have Said Everything"
 bc_knight_he_is_the_larger_power_and_he_is_taking_the_orders_toast_desc:0 "On any accounting that would stand up in a hall he is the larger of the two of them, both of them know it, and neither has ever put it into words. He could raise more. Not enormously more - it is not a chasm, it is the kind of difference that turns up in ledgers rather than in rooms - but more, and it has been sitting between them politely for years. Today he takes the orders. He takes them at once, without the tiny delay men use to signal that obedience is a gift they have chosen to hand over, because he worked out a long time ago that the delay is the entire insult and everything after it is decoration. When the order is a good one he moves. When it is a poor one - there was one shortly after noon that he would not have given - he moves at the same speed regardless, and mends what needs mending on his own account later without ever mentioning that he has done it. He knows this is costing him something. He has also noticed it is not costing him what he assumed it would. What it actually costs is the pleasure of being right where people can hear. What it buys is a side that is winning, and men on either hand of him who are not spending any part of today working out which of the two of them they answer to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 150 - what the two peoples make of each other --------------------
#
# THE FIRST MAY NOT NAME a place, a people, a house, a sigil, a title or an
# ancestor, quote a saying, have a rider arrive or a message go out. He may not
# order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME a place, a people, a house, a sigil or a title, or
# quote a saying. Nobody may cheer him or use his name. He may not kill a named
# man, reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 165.
# of the two of them they answer to".
 bc_he_cannot_read_a_single_thing_the_far_line_is_doing_toast:0 "Nothing These People Do Means What It Would Mean If His Own Men Were Doing It"
 bc_he_cannot_read_a_single_thing_the_far_line_is_doing_toast_desc:0 "Nothing the far line does means what it would mean if his own men did it, and by this hour that has stopped being a curiosity and become the entire shape of his day. Twice before noon a body of them went backwards and he read it as breaking, because in every fight he has ever stood in that is what going backwards is, and both times they came on again out of the same movement, quicker, from a slightly altered angle, as though the step back had been the opening half of a sentence. Their noise tells him nothing. He cannot hear any difference between the sound they make when they are pleased and the sound they make when they are hurt, and he has been listening for one since the fighting started with the concentration of a man trying to learn a language in the middle of an argument. Nobody around him can read them either. His scouts describe honestly what they saw and what they saw is of no use, because a scout reports meaning rather than motion and none of them hold the meanings. So he is fighting the only way still open to him, which is to answer what has already finished happening, half a beat late, all afternoon, against people who have been reading him fluently since first light - because a stranger is only a stranger in one direction at a time, and they have been fighting men like him for a great deal longer than he has been fighting men like them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_men_opposite_are_not_foreign_at_all_toast:0 "He Recognised How The Man Carried His Shield A Beat After The Blow Had Landed"
 bc_knight_the_men_opposite_are_not_foreign_at_all_toast_desc:0 "The man he put down early in the third hour carried his shield in a way he last saw at a market fair, on a boy he would have guessed was somebody's second son from four valleys over, and the recognition arrived a beat behind the blow. Nothing about the men opposite is strange to him. They form up the way his own lot form up. Their sergeants shout the same short words with the weight on a different part of them. When they are about to give ground there is a particular shuffle that everybody on both sides has been doing since they were all children playing at this in the same kind of yard, and it works precisely as well against them as it has ever worked against anyone, because knowing a trick and being able to stop it are separate skills. He is fighting extremely well today. Some of that is nothing more than understanding every single thing they are about to attempt. The rest of it he will consider tonight and not before, because there is no useful moment in the middle of a battle to notice that the reason he can read them so easily is that there is nothing anywhere to tell the two of them apart except which lord's summons turned up at which hall, and that the day is going his way, and that this is what going his way looks like.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 151 - what kind of place the field belongs to --------------------
#
# THE FIRST MAY NOT NAME a place, a people, a house, a sigil, a title or an
# ancestor, quote a saying, have a rider arrive or a message go out. He may not
# order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME a place, a people, a house, a sigil or a title, or
# quote a saying. Nobody may cheer him or use his name. He may not kill a named
# man, reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 166.
 bc_the_line_has_gone_into_the_streets_toast:0 "His Battle Has Stopped Being A Battle And Become Four Hundred Separate Fights Between Buildings"
 bc_the_line_has_gone_into_the_streets_toast_desc:0 "The fighting is between buildings now and he has lost the whole of it in one movement, because a line that goes into a town does not stay a line for as long as it takes to say so. He gave ground once, on purpose, at a place where giving ground was cheap, and the giving carried his right wing back past the first row of workshops, and from that moment he has been commanding a thing that has no shape and cannot be given one. He cannot see forty paces in any direction. What he has instead of a battle is a great many small ones happening in yards and doorways and along walls, each of them going its own way, none of them aware of the others, and men who were in the same rank an hour ago are now fighting different fights with different odds two streets apart. Somebody's roof is burning and the smoke is deciding where his flanks are. The people who live here have not all left and every so often one of them runs across the fight and both sides stop for the length of it, which is the only thing either army still does together. He is aware, in the flat way a man is aware of a bill he will be handed later, that whatever is left standing when this finishes will be worth a fraction of what he rode past this morning, and that it belongs to somebody who did not ask for either of them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_ground_under_him_belongs_to_the_faith_toast:0 "The Men Watching Him Work Are Not Soldiers And They Are Not Leaving"
 bc_knight_the_ground_under_him_belongs_to_the_faith_toast_desc:0 "The ground he is holding is the faith's ground and the men standing on it who are not fighting have not gone anywhere. They came out when it started and they have stayed out, in a doorway and along a low wall, saying nothing, doing nothing, watching him do the work at a distance of perhaps thirty paces with the steadiness of people who have decided that leaving would be a kind of answer and they would rather not give it. It makes him careful in a way he cannot entirely account for. His feet stay where he puts them. He does not chase, he does not open up, he takes the man in front of him properly and then takes the next one, and the small tidy piece of the line he is responsible for has not moved a yard backwards since well before noon while both the pieces beside it have gone forward twice. He could not say whether he is behaving because of what is built behind him or because of who is stood under it, and he suspects the honest answer is that neither has ever been separate from the other for anybody, which is rather the point of putting a building there. The day is going well. Some of that is him. Some of it is that a man does his best work when he can feel he is being looked at by people he cannot argue with afterwards.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 152 - what he came for and what the far man will not do ----------
#
# THE FIRST MAY NOT NAME a place, a people, a house, a sigil, a title or an
# ancestor, quote a saying, have a rider arrive or a message go out. He may not
# order a withdrawal, rally, turn the day, or end the day.
