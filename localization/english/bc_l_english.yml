# else, because for most of his life it did".
 bc_he_still_does_everything_correctly_and_it_is_still_going_backwards_toast:0 "He Is Still Doing Every Part Of It Correctly And It Is Still Going Backwards"
 bc_he_still_does_everything_correctly_and_it_is_still_going_backwards_toast_desc:0 "There was an appointment once that a man is supposed to hold until he dies, and he does not hold it any more, and nobody has ever put in writing what he did to lose it. What he kept was the training. He is still the most correct man on this field. His ranks are dressed, his intervals are right, his reserve is standing exactly where a reserve is supposed to stand, and every order he gives goes out in the proper form with the proper words in the proper sequence. All of it is immaculate and all of it is moving slowly backwards. That is the thing nobody warned him about while they were teaching it to him: that the form and the outcome are two separate objects, that a man can execute every part of the craft without a flaw and still be losing, and that being looked at while it happens is the part he was most thoroughly trained for and the part that hurts.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_thing_that_happened_to_him_once_is_happening_again_toast:0 "The Thing That Happened To Him Once Before Is Happening Again"
 bc_knight_the_thing_that_happened_to_him_once_is_happening_again_toast_desc:0 "It happened to him once before, years ago, and everybody who saw it has been careful around him since. He does not remember it as anything at all. That is the part that unsettles the ones who were there - not what he did, but that afterwards he asked them, quite reasonably, what they were staring at. It is happening again. He can tell because the noise has gone a long way off, as though the afternoon were taking place on the other side of a wall, and because his arm has stopped consulting him about anything. The ones in front of him have stopped being opponents. They are objects in the way of something, and he could not tell you what the something is. He is soaked to the shoulder and none of it came out of him, and there is a quiet, agreeable, entirely absent feeling sitting in his chest that he will be ashamed of tomorrow and cannot get at today.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

