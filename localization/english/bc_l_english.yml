 bc_the_seat_behind_him_is_on_the_table_toast:0 "The Second Account"
 bc_the_seat_behind_him_is_on_the_table_toast_desc:0 "He knew before he rode out that a document exists somewhere with his own seat written into it, and the knowing has been sitting under everything he has done since. It sits under this. The line ahead of him is bending and he is doing all the correct things to stop it bending, calmly, in the correct order, while some part of him keeps a second account running in parallel: what today costs, what today is worth, whether any of it is being spent on the right argument. A man who loses a field can go back and be a smaller man in a hall that is still his. He is no longer certain he has that. He gives the next order in the same flat voice he gave the last one and the men take it and nobody looking at him would guess, and holding the voice steady is costing him more than the ground is. What is left of the formation goes backwards without coming apart, which is the most he can honestly ask of it, and he keeps himself the same way and for the same reason.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_seat_across_the_field_is_on_the_table_toast:0 "Nothing Magnificent"
 bc_knight_the_seat_across_the_field_is_on_the_table_toast_desc:0 "Somebody told him, before any of this started, what the men opposite are actually defending, and he has carried the fact around all morning like a stone in his boot. They are not out here for pay, or for a border, or because they were told to walk this far. They are out here because if the day goes wrong there is a chair that stops being theirs. That makes them worth more than any count of heads suggests, and he has been treating them as though it does, and it also means every hour taken off them is an hour they will not get back. So he refuses to spend himself. He takes the small thing in front of him and keeps it, then the next one, then a third, without hurrying, turning down three separate chances to be magnificent, because magnificent is precisely how you hand a desperate man something to work with. Their front is thinner than it was and the thinning is entirely his doing, and not one moment of it will ever be worth a song. He would rather have the ground.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

