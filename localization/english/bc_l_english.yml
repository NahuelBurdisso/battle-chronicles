 bc_the_name_he_carries_is_bigger_than_he_is_toast:0 "What They Expect Of It"
 bc_the_name_he_carries_is_bigger_than_he_is_toast_desc:0 "The trouble with being known for a thing is that everybody arrives already knowing it. His own look for it before they look at the ground. The men opposite have built their entire morning around it - a deeper line where he is, a reserve kept back with no other purpose, instructions given about him personally by somebody who has never met him. So he spends the hours being what he is known for in the places where it does the least good, because the alternative is to stand somewhere quiet and let it fall apart elsewhere, and there is no version of today in which he is permitted to be an ordinary man doing a competent job. He adjusts, and adjusts again. He goes where the noise is; the noise moves; he goes there too, and each time he arrives the thing that wanted him has already resolved itself the wrong way. Quite late he understands the arrangement properly. They are not fighting his army at all. They are fighting a reputation, and they have worked out that it can only stand in one place at a time.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_name_they_gave_him_never_grew_toast:0 "Still the First Rung"
 bc_knight_the_name_they_gave_him_never_grew_toast_desc:0 "They gave it to him a dozen winters back in a hall with wet floors and a great deal of noise, and then nothing else ever happened to it. It sits at the bottom of whatever list such things sit on. Younger men have gone past it. He stopped mentioning it a long time back and he has never once stopped thinking about it, which are two separate facts and he knows exactly how far apart they are. Today the line bends at his own feet and he does not bend with it. He sets them feet, gets the shield onto his shoulder properly for the first time in a year, and simply will not move, and the men to either side discover that they cannot move either without everybody seeing them do it. There is nothing else to the thing. It is not a spectacle and nobody afterwards will call it one. But the bend stops at him, and the ground behind stays where it was, and somewhere in the middle he understands that he is not doing this so the thing will grow. He is doing it because standing here is the only part of the whole business that was ever really his.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

