 bc_six_roofs_answer_to_him_directly_toast:0 "Six Roofs"
 bc_six_roofs_answer_to_him_directly_toast_desc:0 "Six roofs are his and every one of them wants something from him before winter. He knows the state of each granary the way other men know their own hands, and the knowing does not leave him just because there is shouting. Somewhere behind his eyes a mill is still broken, a bridge is still half paid for, and a steward he mistrusts is still holding a tally he has not seen. All of it is present, all of it is unhelpful, and none of it can be put down. So when the line in front of him bends he does what a careful holder of things does, which is to stop giving any of it away. He plants what he still has where it stands, tells the men to keep what is under their feet and nothing further, and refuses to spend one more thing on ground he is not sure he can hold. It wins him nothing. It is the choice of a man who spent twenty years learning that what you can still count is worth more than what you might have had, and the arithmetic today is smaller and meaner than he would like.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_everything_he_holds_is_one_roof_toast:0 "One Roof"
 bc_knight_everything_he_holds_is_one_roof_toast_desc:0 "Everything he owns stands under a single roof, and he could walk its whole boundary before the porridge went cold. That is not a complaint. It is a small thing, held clean, and he has spent seven years discovering that a man with one of something guards it differently than a man with nine. Today the guarding has moved outdoors. He goes forward because forward is where the day is going and he means to be in front of it rather than behind it, and he pays for the distance in the usual currency: a split along the forearm that will want sewing, a shallow one over the eyebrow that fills his left eye and stays filled, and something in the ribs he decides to look at later. None of it stops him. He is bleeding and he is still moving and both are true at once, which is the arrangement he came here expecting. When it is done he will have exactly what he had this morning, plus whatever a man is owed for standing where it was worst, and he already knows which of those two he actually came for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

