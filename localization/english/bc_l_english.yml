# "ninety seconds later the hollow part comes apart exactly where he was
# standing waiting for it".
 bc_they_have_never_liked_looking_at_him_and_today_it_costs_him_toast:0 "They Have Never Much Liked Looking At Him And Today It Is Costing Him"
 bc_they_have_never_liked_looking_at_him_and_today_it_costs_him_toast_desc:0 "He gave the order plainly and loudly and in the correct words, and the sergeant nearest him looked at the ground while receiving it, the way men have looked at the ground near him for as long as he can remember. The order went out anyway. It went out through men who could not quite bring themselves to face the source of it, and by the time it reached the third rank it had lost the shape he put on it and become a rumour of an order, which every man interpreted in the direction of his own preference. So the left goes forward and the centre does not, and the ground between them fills up with people who have no idea whose fault that is. He knows exactly whose fault it is. It is not a thing he can mend by saying it again, louder.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_whole_line_can_find_him_without_being_told_where_to_look_toast:0 "The Whole Line Can Find Him Without Being Told Where To Look"
 bc_knight_the_whole_line_can_find_him_without_being_told_where_to_look_toast_desc:0 "He is not doing anything the men either side of him are not also doing, but he is the one they can see. Whatever accident of bone happened in him before he was born left a face that carries at forty paces in bad light, and forty paces in bad light is the entire problem of holding a line together. So the ones at the end, who cannot make out a word of what is being shouted, have simply been watching his head. When it goes forward they go forward. When it stops they stop, and they stop level, which is the harder of the two and the one that keeps a line a line rather than a crowd walking in the same direction. He has known since he was small that men look at him, and he has spent most of his life resenting it, and this afternoon it is doing more work than his arm is.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

