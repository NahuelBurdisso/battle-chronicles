# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 489.
 bc_this_war_is_over_the_sea_lanes_toast:0 "The Cargo"
 bc_this_war_is_over_the_sea_lanes_toast_desc:0 "Somewhere behind all of this there is a number, and he knows it to the barrel. That is the whole quarrel: goods lifted off the water, a ledger with a wrong entry in it, an arrangement broken by men who were being paid to keep it. Now eight hundred people are standing in a wet field about that number, and he is losing, and the losing does not feel like defeat so much as a bad purchase. He keeps the thing tidy anyway. Reliefs go in when they are supposed to. Nothing is thrown away for a gesture, and every foot he gives up is given up against something he could name aloud if anybody asked. It is the most careful work he has done in a year and it will not be enough. What sits badly is not the arithmetic in front of him but the arithmetic under it - that all of this already had a price written down against it somewhere, and the price was never worth what is being paid out here.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_war_is_about_who_owns_whom_toast:0 "The Iron Comes Off"
 bc_knight_this_war_is_about_who_owns_whom_toast_desc:0 "He has looked closely at what a collar does to a neck over years, the way the skin goes hard and shiny and stops being skin, and once a man has looked at that properly a certain kind of careful fighting stops being available to him. So he is not careful. He goes at the nearest of them and keeps going, and the horse under him is finished by the second time across and he takes it across a third, and somewhere in the middle of that he stops hearing anything at all. None of it is skilful and every man watching can see as much. It is only that the ones opposite are out here for wages and a law, and he is out here because of a neck, and the gap between what those two things are worth spending turns out to be the entire difference. He comes back on his feet, blowing, shield gone, no idea where. Their line has given way. It gave way because he would not.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

