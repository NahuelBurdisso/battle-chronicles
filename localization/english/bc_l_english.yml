# collect".
 bc_losing_to_that_man_will_be_written_down_differently_toast:0 "Nobody Writing This Down Afterwards Will Record That He Was Outmatched, Only That He Lost"
 bc_losing_to_that_man_will_be_written_down_differently_toast_desc:0 "The man handling the far side stands two full steps above him and everything about the afternoon is quietly organised around that. It shows up in ways he did not expect and cannot answer. The men over there came because somebody very large asked, so their households sent their best and sent them early, and they have been paid in advance and expect to be paid again. His own came because he asked, which is a smaller word, and about a third of them are here as a favour, and a favour is a thing men look at again in the afternoon. He is aware that he has been outweighed rather than outfought, and equally aware that the distinction will not survive the week. What will be said is short. It will not mention that one side had four times the reach in the countryside behind it, or that the summons which raised the far host went out under a name that nobody in three regions may refuse. It will say who stood where and how it ended, and everyone who hears it will arrange the two of them in their heads by the sizes they already know, and the arrangement will be the one that was true this morning before either army moved.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_is_the_biggest_man_on_this_field_and_he_is_in_the_line_toast:0 "There Is Nobody On This Field He Answers To Except The Man Who Asked Him To Come"
 bc_knight_he_is_the_biggest_man_on_this_field_and_he_is_in_the_line_toast_desc:0 "He is two full steps above the man running the other side and he is standing in a rank with a shield on his arm, which is a thing he chose this morning and has not revisited. He could be on the rise behind, being handed reports. He is not especially noble about the reason. He is here because the fighting is here and because the men either side of him are people he has known for years and because watching would have been intolerable, and none of those reasons would sound well said out loud, so he has never said them. The odd thing is how little difference it makes where he is standing. The man next to him has not adjusted his footwork. Nobody has offered him a better place in the line. When the line steps forward he steps with it and when it holds he holds, and the sum of what he personally is contributing today is one competent shield and about the same weight of work as anybody else in that stretch. The day is going well and it would be going about as well without him. He finds, somewhat to his surprise, that this is the most agreeable thought he has had in a year.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

