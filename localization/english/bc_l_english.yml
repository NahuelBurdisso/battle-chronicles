# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 399.
 bc_there_are_five_names_on_him_already_toast:0 "The Names He Already Has"
 bc_there_are_five_names_on_him_already_toast_desc:0 "There are five men in the ground because of him, and what that leaves behind is not guilt, it is procedure. He has done this before. He knows what has to be settled afterwards, who has to be paid and who will not accept payment, and somewhere under the noise he is already settling it - ranking the whole afternoon by what it will cost to close rather than by what it might still be worth. So his line is tidy. His instructions are exact and not one of them is wrong. They are all half a step behind the field, because a man totting up what the aftermath will take is not totting up the middle of the thing, and the middle of the thing is where he is standing, and it is walking away from him. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_follows_a_man_with_five_names_on_him_toast:0 "The Man He Stands Behind"
 bc_knight_he_follows_a_man_with_five_names_on_him_toast_desc:0 "He has never put anybody in the ground. Not one, in all the years of carrying a shield for somebody who has put five there, and the odd part is that the count between them makes no difference whatever to how the two of them work. He does not flinch at the man's shadow. He does not go looking for a sixth on his behalf either. He does what he is told, on the beat, in the place he was told to do it, and the doing of it is so unremarkable that the ranks either side steady without working out why. There is a kind of steadiness that comes of being frightened of nothing, and a better kind that comes of having weighed a man honestly and found nothing in him to be frightened of. He has the second kind, and the ground in front of him keeps getting further from where it was. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

