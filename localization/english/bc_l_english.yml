# competent shield and about the same weight of work as anybody else in that
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 270.
# mention it are behind him, going where he goes".
 bc_all_four_of_his_qualities_want_something_different_toast:0 "Four Ways At Once"
 bc_all_four_of_his_qualities_want_something_different_toast_desc:0 "There is a great deal of him, and every part of it is real. He is the kind of man other men describe at length, and no two of them describe the same man, and all of them are right. That has been an asset for thirty years. It is not one now. The last hour has put four questions to him and each of the four things he is answered a different one first: one of them wanted him to wait, one of them wanted him to spend everything at once, one of them wanted to be certain, and one of them could not stand another moment of not moving. So he did all four, in order, each of them a little late. Every single decision was defensible on its own terms. Laid end to end they are a man arguing with himself in front of an audience that is dying while he does it. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_one_word_for_him_and_today_it_pays_toast:0 "The One Word"
 bc_knight_there_is_one_word_for_him_and_today_it_pays_toast_desc:0 "Nobody has ever needed a second sentence about him. He has been the same thing since he was a boy of eight and he will be it until something stops him: an entirely uncomplicated man, no wit to speak of, no opinions worth having, nothing behind the eyes that anybody has ever wanted to hear more about. In a hall he is furniture. Out here he is the piece of the line that does not move. Men have come at that stretch of ground four separate times and each time the same unremarkable person was still standing on it afterwards, breathing hard, waiting for the next lot, not appearing to have had a thought about any of it. Complicated men are elsewhere doing complicated things. This is what the whole afternoon has been resting on. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

