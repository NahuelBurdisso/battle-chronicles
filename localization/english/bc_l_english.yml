 bc_he_has_another_rising_behind_him_toast:0 "The Other Fire"
 bc_he_has_another_rising_behind_him_toast_desc:0 "Somewhere behind him, men who owe him everything have gone into arms against him, and he has known it for weeks. Nothing on this field has the smallest connection to that quarrel. The men opposite want no part of it and would have marched out here regardless. He is nonetheless fighting two things at once and only one of them is in front of him, and it shows in how he spends the afternoon: he will not commit the reserve, because that reserve is also what he has left for the other business, and a man keeping something back cannot at the same time be pressing. The rank in front of him wanted weight behind it in the first hour and did not get any. By the second it is bending. He alters what he is doing, and alters it again, and each alteration is a smaller version of the one before, and the whole shape of the day is being set by an argument going on a fortnight's ride from here. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_far_lord_has_a_rising_behind_him_toast:0 "Their Lord Has Two Wars"
 bc_knight_the_far_lord_has_a_rising_behind_him_toast_desc:0 "The men across from him are not badly made and they are not badly led and they are coming apart anyway, and it takes him some while to work out why. They keep looking sideways. Not at him - at each other, at the ranks beside their own, the way men look when they are not sure the fellow on their flank will still be standing there in an hour. Something back where they come from has taken up arms against the lord who brought them, and a good number of these have kin in it. So he does not press. He works at the pace of a man laying a wall, one course at a time, taking a step where the step is free and none where it is not, and lets the looking-sideways do the work that hurrying would have spoiled. The line opposite opens along the seams it carried onto the grass with it. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

