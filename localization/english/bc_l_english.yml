 bc_the_country_out_here_will_not_tell_him_anything_toast:0 "There Is Nobody Left Out Here Who Could Have Told Him What Was Behind The Rise"
 bc_the_country_out_here_will_not_tell_him_anything_toast_desc:0 "He is good at this. Give him a farmer, a miller, a boy minding geese, and he will have the shape of twenty miles out of them inside an hour, and he will know which parts of it to disbelieve. That skill has been the most useful thing he owns for most of his adult life and out here it is worth nothing whatever, because the farms were empty when they passed them and had been empty a while. The mill has no wheel in it. Whoever is supposed to be collecting from this country stopped reaching the far end of it some years ago and everybody who could leave has, and what is left is a landscape that answers questions with silence in every direction at once. So he has been reading the ground itself all morning, which is a much poorer instrument, and he has read it wrong twice. The second time cost him the left. He is now working out what the third mistake is going to be from inside it, which is the worst place to do that work from.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_somebody_has_been_looking_after_this_country_for_years_toast:0 "Every Gate Out Here Is Hung Straight And Every Ditch Has Been Dug Twice"
 bc_knight_somebody_has_been_looking_after_this_country_for_years_toast_desc:0 "Whoever this country belongs to has been minding it properly and for a long time, and the difference is not sentimental, it is under his boots. The lane they came up is metalled and drains to both sides. The field walls are squared and gapped at intervals somebody thought about. There is a causeway across the wet part that should not, by the look of the wet part, exist. He has spent the last two years fighting across country where every second step is a decision, and here the landscape simply tells him where he can go, and he can go there quickly, and so can the eleven men keeping station off his shoulder. They are not clever men. They do not need to be today. The ground is doing the thinking and all any of them has to do is keep the line straight and keep walking forward, and the thing in front of them is coming apart faster than it can back away from them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

