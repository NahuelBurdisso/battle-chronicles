# it was".
 bc_there_are_two_boys_of_his_out_here_toast:0 "The Two He Is Teaching"
 bc_there_are_two_boys_of_his_out_here_toast_desc:0 "Both of them are somewhere behind his right shoulder, which is where he put them, and he has spent the morning quietly rebuilding the whole day around that fact. He does not say so. He would not say so under torture. But every adjustment he makes has a second reason underneath the first one, and the second reason is always the same pair of lads: this flank rather than that one because the going is kinder, this pace rather than a quicker one because a boy on a blown horse comes off it, this instruction given twice because the first time he was watching to see whether they had understood. Every piece of it is sound taken singly. Taken together it is a plan with a hole where its nerve ought to be, and the far side, which has nothing at all behind its right shoulder, keeps finding the hole without ever once knowing it is there. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_one_boy_of_his_own_toast:0 "The Boy Is Watching"
 bc_knight_he_has_one_boy_of_his_own_toast_desc:0 "There is one of them, twelve years old and useless in the way all of them are useless at twelve, and this morning it was he who paced out where the boy would stand: far enough back to be safe, near enough to see everything. Which is why he is fighting the way he is fighting. Not harder. Cleaner. Every motion he makes is one he would be content to have copied, so the wasteful ones have gone - the flourish, the extra step, the half-second spent being angry - and what is left is a shorter, duller and far more effective version of him. He is not showing off; that is the opposite of this. He is demonstrating. And the men either side of him have started doing it his way without being asked, because a thing done slowly and correctly in front of you is very hard not to imitate. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

