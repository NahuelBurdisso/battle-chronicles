# can see it".
 bc_the_hall_at_home_is_thinner_than_his_rank_toast:0 "Thinner Than The Rank"
 bc_the_hall_at_home_is_thinner_than_his_rank_toast_desc:0 "There is a great hall behind him with an expectation attached to it, and the hall has not met the expectation in some years. The tapestries went first, then the second cook, then the roof over the west range, which is still open to the sky and which he has stopped mentioning. All of it went into what is in front of him now - the horses, the mail, the wages of men who wanted paying before they would ride. He can put a figure on every piece of it, to the last coin. That is the trouble. He is standing in the middle of a bad hour holding an exact price for it, and the two things refuse to sit next to each other, so he keeps ordering work done that would be worth what it cost if it took, and it is not taking, and he orders the next one anyway. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_his_hall_is_finer_than_his_station_toast:0 "Finer Than The Station"
 bc_knight_his_hall_is_finer_than_his_station_toast_desc:0 "His hall is better than he is and everybody, himself included, knows it. The glass, the singers, the plate that comes out for guests who were not expecting plate - none of that is owed to a man standing where he stands, and he has been paying for it since he was young enough to be told not to. What it bought was not respect exactly. It was the habit of being looked at, of walking into a room already arranged so the eye finds him, and of not minding that it does. The habit has come out here with him. When the far line starts to bend he does not check whether anyone is watching, having never once assumed they were not, and he goes into the bend at the widest part of it, where the most eyes are. It holds. Being looked at and being useful are not usually the same work, and this afternoon they are. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

