 bc_battle_memory_won_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and you were the ones still standing on it"
 bc_battle_memory_won_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and was among those still standing on it"

 bc_battle_memory_lost:0 "lost a battle at [ROOT.Var('battle_location').GetProvince.GetNameNoTooltip]"
 bc_battle_memory_lost_desc:0 "I stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"

# The 2026-08-17 session added bc_nemesis_memory and bc_lifesaver_memory and gave
# both a full set of nine descriptions, but no NAME key - the bare type id, which
# is a separate key from every `_desc` and is what the memory list prints as the
# entry's title. The engine reported it at load as
# `character_memory_type.cpp:63: Character memory name 'X' is not localized`, the
# first and only `bc_` lines in a 416k-line error.log. Their descriptions sit
# with the rest of the 08-17 variants further down; the names belong here, beside
# the other three, because this is where a reader looking for a title will come.
#
# NO PARTICIPANT TAG IN EITHER TITLE. Both types declare one - `nemesis` and
# `lifesaver` - and every one of their descriptions uses it, but the titles
# follow bc_shieldbrother_memory above, which also has a tag available and also
# spends none of it: a title is a list-entry heading and the participant is
# already named in the line the reader opens.

 bc_nemesis_memory:0 "was beaten a third time by the same man"
 bc_lifesaver_memory:0 "was pulled out of a press by a knight"

# --- memory variants (2026-08-17) -------------------------------------------
#
# Two more per perspective, pooled by the `random_valid` block each memory type
# already carried in bc_memories.txt. A knight who fights a long war collects
# these by the dozen and they all read identically until now.
#
# THE PERSPECTIVES OF ONE VARIANT ARE THE SAME SENTENCE IN THREE VOICES, and
# the engine picks a line per perspective block rather than picking a variant
# once. Keeping the three pools in the same order is what keeps a comparison
# between two of them looking deliberate; bc_memories.txt says so at the call
# site too.
#
# `we` IS USED IN THE FIRST PERSON ONLY, and its second-person form is `you`
# doing the work of a plural - the same thing the shipped `you were the ones
# still standing on it` already does. Third person avoids the problem by naming
# the man.
#
# NO FULL STOP, PAST TENSE, LOWER CASE. Same rule as the nine above.
 bc_shieldbrother_memory_desc_b:0 "I held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of us"
 bc_shieldbrother_memory_desc_b_second_perspective:0 "you held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of you"
 bc_shieldbrother_memory_desc_b_third_perspective:0 "[owner.GetName] held the flank beside [shieldbrother.GetFullName] until there was nobody left in front of them"

# --- the nemesis memory (2026-08-17) ----------------------------------------
#
# Written on the defeat that makes it three at the same man's hands, and only
# ever on that one. THE LOSER CARRIES IT AND THE WINNER DOES NOT, so all nine
# lines are about being beaten; the type's header in bc_memories.txt argues why.
#
# ALL NINE ARE PAST TENSE AND LOWER CASE with no full stop, the vanilla standard
# the shieldbrother set follows.
#
# THE THREE VARIANTS ARE THREE READINGS OF THE SAME FACT, not three degrees of
# it - the count is already three, and a variant hinting at four would be
# reporting something the ladder never wrote. THE THREE POOLS STAY IN ORDER, for
# the reason the shieldbrother header gives: the engine picks per perspective
# block, so a reader comparing two of them expects the same variant.
#
# THEY MAY NOT REUSE THE RIVALRY TOASTS' WORDS. bc_rivalry_nemesis_desc already
# spends "three fields, three defeats, one man" and "stopped thinking about the
# war"; bc_reason_battle_nemesis spends "has broken him three times on the
# field".
 bc_nemesis_memory_desc:0 "[nemesis.GetFullName] took the field from me for the third time, and after that I stopped calling it luck"
 bc_nemesis_memory_desc_second_perspective:0 "[nemesis.GetFullName] took the field from you for the third time, and after that you stopped calling it luck"
 bc_nemesis_memory_desc_third_perspective:0 "[nemesis.GetFullName] took the field from [owner.GetName] for the third time, and after that nobody called it luck"
 bc_nemesis_memory_desc_b:0 "I rode away from a third field that belonged to [nemesis.GetFullName], and I could name every man I left on it"
 bc_nemesis_memory_desc_b_second_perspective:0 "you rode away from a third field that belonged to [nemesis.GetFullName], and you could name every man you left on it"
 bc_nemesis_memory_desc_b_third_perspective:0 "[owner.GetName] rode away from a third field that belonged to [nemesis.GetFullName], and could name every man left on it"
 bc_nemesis_memory_desc_c:0 "three times I drew up against [nemesis.GetFullName] and three times I was the one who had to explain it afterwards"
 bc_nemesis_memory_desc_c_second_perspective:0 "three times you drew up against [nemesis.GetFullName] and three times you were the one who had to explain it afterwards"
 bc_nemesis_memory_desc_c_third_perspective:0 "three times [owner.GetName] drew up against [nemesis.GetFullName] and three times it was [owner.GetName] who had to explain it afterwards"

 bc_shieldbrother_memory_desc_c:0 "[shieldbrother.GetFullName] and I were the last two upright in that corner of it"
 bc_shieldbrother_memory_desc_c_second_perspective:0 "you and [shieldbrother.GetFullName] were the last two upright in that corner of it"
 bc_shieldbrother_memory_desc_c_third_perspective:0 "[owner.GetName] and [shieldbrother.GetFullName] were the last two upright in that corner of it"

 bc_battle_memory_won_desc_b:0 "I was at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and I watched it go"
 bc_battle_memory_won_desc_b_second_perspective:0 "you were at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and you watched it go"
 bc_battle_memory_won_desc_b_third_perspective:0 "[owner.GetName] was at [ROOT.Var('battle_location').GetProvince.GetName] on the day their line went, and watched it go"

 bc_battle_memory_won_desc_c:0 "we carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and I have not forgotten what it cost"
 bc_battle_memory_won_desc_c_second_perspective:0 "you carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and have not forgotten what it cost"
 bc_battle_memory_won_desc_c_third_perspective:0 "[owner.GetName] carried the day at [ROOT.Var('battle_location').GetProvince.GetName], and has not forgotten what it cost"

 bc_battle_memory_lost_desc_b:0 "I was at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and I walked away from it"
 bc_battle_memory_lost_desc_b_second_perspective:0 "you were at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and you walked away from it"
 bc_battle_memory_lost_desc_b_third_perspective:0 "[owner.GetName] was at [ROOT.Var('battle_location').GetProvince.GetName] on the day it broke, and walked away from it"

 bc_battle_memory_lost_desc_c:0 "we were beaten at [ROOT.Var('battle_location').GetProvince.GetName], and I remember the road afterwards better than the fighting"
 bc_battle_memory_lost_desc_c_second_perspective:0 "you were beaten at [ROOT.Var('battle_location').GetProvince.GetName], and remember the road afterwards better than the fighting"
 bc_battle_memory_lost_desc_c_third_perspective:0 "[owner.GetName] was beaten at [ROOT.Var('battle_location').GetProvince.GetName], and remembers the road afterwards better than the fighting"

# --- pop-up events ----------------------------------------------------------

 bc_chronicles.0001.t:0 "The Banner Falls"
 bc_chronicles.0001.desc:0 "The standard goes down.\n\nIt is not a sound so much as an absence. The men who were dressing on it turn, and find nothing to dress on, and the turn spreads outward faster than any order could.\n\nThe standard-bearer is somewhere under the feet of the melee. The staff is still visible, canted, being trodden lower."
# THE TWO ADDED 2026-08-17 DESCRIBE THE SAME THIRTY SECONDS AND RESOLVE NONE OF
# IT. The four options below own the resolution, so neither may have the bearer
# dead, the staff lifted, or the line already gone.
 bc_chronicles.0001.desc_b:0 "It goes down in the middle of everything, and for a moment nobody nearby seems to have seen it.\n\nThen the men at the edges of that space stop doing what they were doing. There is a shape to a host that has something to look at, and the shape is coming apart from the inside outward while everyone in it is still facing the right way.\n\nThe staff is down there somewhere among boots and it is not still. It is being moved by the crowd, a little further each time."
 bc_chronicles.0001.desc_c:0 "Above the heads of ten thousand men there was one thing worth looking at, and there is not now.\n\nIt did not fall cleanly. It went over slowly, the way a thing goes over when several people are trying to hold it up and none of them can get their footing.\n\nWhat is happening in the next few ranks is not panic yet. It is every man in them turning to ask the same question of somebody who has no more idea than he does."
 bc_chronicles.0001.a:0 "Then I will carry it myself."
 bc_chronicles.0001.b:0 "Sound the withdrawal. Reform behind the line."
 bc_chronicles.0001.c:0 "No man steps back from where it fell."

 bc_chronicles.0002.t:0 "Rally the Line"
 bc_chronicles.0002.desc:0 "The line has not broken. It is doing something worse, and slower: it is thinking about breaking.\n\nMen at the back are looking over their shoulders and measuring the distance. Nothing has been decided yet. It will be decided in the next few moments, by whoever speaks into them."
# THE TWO ADDED 2026-08-17 MAY NOT BREAK THE LINE AND MAY NOT STEADY IT. This
# pop-up is only reachable while faltering and every option is a different way
# out, including the one where he says nothing, so the desc has to leave all
# four standing. It may not name the thing that frightened them either - the
# mod does not know what it was.
 bc_chronicles.0002.desc_b:0 "Nothing has given way. What has happened is quieter than that: the whole line has taken half a step it did not mean to take, and taken it backwards, and every man in it did that on his own.\n\nThey are still facing the right way. They are standing a little further apart than they were an hour ago, and they are listening for something, and it is not the enemy they are listening for."
 bc_chronicles.0002.desc_c:0 "The front rank is doing its work. It is the four ranks behind it that have gone strange - too quiet, and full of men who have started to think about the road.\n\nNobody has run. A man who is going to run stands exactly like this first, for about as long as this, and then somebody either speaks or does not.\n\nThere is time to do one thing."
 bc_chronicles.0002.a:0 "Ride the length of the line where they can see me."
 bc_chronicles.0002.b:0 "Promise them the spoils, and pay it out now."
 bc_chronicles.0002.c:0 "Say nothing. Let them steady themselves."

 bc_chronicles.0003.t:0 "The Van Breaks Through"
 bc_chronicles.0003.desc:0 "The leading ranks have found the seam and put a wedge in it, and the wedge is going deeper than anyone intended.\n\nIt can be driven all the way. It can also be driven so far that it comes out the far side alone, with the enemy closed up behind it."
# THE TWO ADDED 2026-08-17 MAY NOT SAY WHETHER THE WEDGE HOLDS. All four
# options act on it - pressed, halted, turned onto the flank, or traded for the
# baggage - so neither may close it off, and neither may put the wagons out of
# reach or the flank out of the question.
 bc_chronicles.0003.desc_b:0 "Somewhere in the last few minutes the leading ranks stopped pushing and started walking, and nobody sent word back about it.\n\nThey are a long way in. The men who went in first can see the other host's baggage over the heads in front of them, and the men who went in last can see their own line getting smaller behind them.\n\nIt is going the way a thing goes when it is either about to be a victory or about to be a very expensive lesson."
 bc_chronicles.0003.desc_c:0 "The point of the van has gone through something that was supposed to hold and is still going.\n\nFrom here it looks like a finger pushed into cloth - deep, and thinning, and with the cloth closing quietly along both sides of it. The men in it have not noticed the sides. They can only see forward.\n\nWhatever is going to be done about that has to be done in the next few minutes and by somebody who can see the whole of it."
 bc_chronicles.0003.a:0 "Press it. Everything behind the wedge."
 bc_chronicles.0003.b:0 "Hold them. Keep the line whole."
# --- pop-up contextual options (2026-08-17) ---------------------------------
#
# Five options added across the three pop-ups, on the pattern the eve set with
# its f, g and h. They are gated on the MAN and never on the battle, because a
# pop-up is a character_event and scope:combat_side does not cross the
# trigger_event boundary - see the block comment in bc_events.txt.
#
# EVERY ONE OF THEM NAMES ITS PRICE OR ITS PAYMENT IN THE TEXT. The eve's f set
# that rule for the same reason it applies here: the player is choosing before
# he knows how the battle ends, and an option whose cost only shows up in the
# modifier tooltip is a choice made blind. 0001.e names the coin, 0002.d names
# the horses, 0003.c names what is being given up to get the plunder.
#
# THE SPENT PHRASES IN THE POP-UP OPTIONS, which these five may not reuse:
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 11.
# back". 0003.c therefore says baggage and wagons rather than spoils.
 bc_chronicles.0001.d:0 "Have the prayers said aloud, and loudly. Let them hear whose side this is."
 bc_chronicles.0001.e:0 "Open the war chest. Coin in hands, now, and they stand."
 bc_chronicles.0002.d:0 "Everything still horsed, at the men doing the pushing. The horses will not be good for anything after."
 bc_chronicles.0003.c:0 "Let them have the baggage train. The wagons are worth more than the pursuit."
 bc_chronicles.0003.d:0 "Wheel the wedge onto their flank and roll it up."

# --- the fourth pop-up (2026-08-17) -----------------------------------------
#
# bc_flank_collapses grows a pop-up branch, the first template to do so since
# plan 1. EVERY ANSWER HERE IS A BAD ANSWER, which no other pop-up in the mod
# can say - the flank is already gone when the player is asked - so the four
# option strings must not read like victories. What they differ in is what the
# man pays to make it cheaper.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 12.
# there, and d here turns a second line round to face one, which is a
# different manoeuvre and must not borrow the same verb.
 bc_chronicles.0004.t:0 "The Left Is Gone"
 bc_chronicles.0004.desc:0 "The flank does not break so much as dissolve. One moment there are ranks there and the next there are men running between them, and the enemy is already pouring into the space where an army used to be.\n\nWhatever is decided now, it is decided about a battle that has just become smaller. The only question left is how much smaller."
# THE TWO ADDED 2026-08-17 MAY NOT LOSE THE BATTLE. The flank is gone; the
# battle is not, and one of the four options is to bring a second line round
# in order. Neither may say the host is surrounded or that the field is lost.
 bc_chronicles.0004.desc_b:0 "There were ranks on the left an hour ago and there is a crowd there now, moving the wrong way, and behind the crowd there is grass.\n\nThe enemy over there has stopped fighting anybody, because there is nobody to fight, and they are looking along the inside of what used to be a line. It has occurred to them what that means. It has occurred to everyone.\n\nThe rest of the host is still where it was put and has not been told anything."
 bc_chronicles.0004.desc_c:0 "It did not break in a place. It stopped being an army from the outside inward, one file at a time, in the space of about a minute, and the men doing it were not cowards this morning.\n\nWhat is left is two thirds of a battle line with an open side, and an enemy that now has somewhere to walk. The centre does not know yet. The centre will know very soon.\n\nEverything after this is about the size of the hole."
 bc_chronicles.0004.a:0 "Bend the line back and brace it. They can have the ground."
 bc_chronicles.0004.b:0 "Nothing. Let it go and save what is still standing."
 bc_chronicles.0004.c:0 "Everything still mounted, into the gap, with me at the front of it."
 bc_chronicles.0004.d:0 "Bring the second line round to face it. Slowly, and in order."

# --- the fifth pop-up, and the first one asked of a knight (2026-08-17) ------
#
# THIS ONE MAY NAME THE OTHER MAN. Every note in this file about pop-ups says
# they cannot reach across the field, and that remains true of the four
# commander ones - a character_event cannot see scope:combat_side. This event is
# different because the man it is about is on the player's OWN side and was
# saved as a scope before the raise, so [bc_chronicle_subject.GetName] resolves.
#
# THE DESC MUST NOT SAY HE IS DYING. The phase event applies nothing to the
# commander's health on any path, and a desc that promised a death the script
# never writes would be caught by the player the first time the man walked away
# from it. He is down and he is not getting up on his own; that is all of it.
#
# OPTION b IS NOT THE COWARD'S ANSWER and is written so that it cannot be read
# as one. It names what staying is for - the hole he would leave - and the men
# either side of him are in the sentence.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "carry it myself" and "no man steps
# back" (0001), "keep the line whole" (0003.b), "where they can see me"
# (0002.a), "with a man on his shoulder" (bc_knight_pulls_him_out_toast_desc,
# which is the toast for the same moment and which a player on this path will
# never see - but an AI knight in the same battle can produce it).
 bc_chronicles.0005.t:0 "He Is Down"
 bc_chronicles.0005.desc:0 "[bc_chronicle_subject.GetName] is somewhere in that, and he is not coming out of it upright without help.\n\nThe press closed over the place where he went down and it has not opened since. It is perhaps thirty feet. Thirty feet is nothing at a walk and it is a very long way through this.\n\nThe men either side of you have not moved. They are waiting to see what you do, which means that whatever you do, they will do."
# THE TWO ADDED 2026-08-17 MAY NOT KILL HIM AND MAY NOT GET HIM OUT. The four
# options are the whole of the resolution - going himself, staying, taking the
# line in with him, or sending three men - and one of them costs him the man,
# so a desc that has him dead or already moving takes that away. THE DISTANCE
# STAYS THIRTY FEET: option a is the word "thirty" and nothing else works.
 bc_chronicles.0005.desc_b:0 "[bc_chronicle_subject.GetName] went down about thirty feet to the right and has not come back up.\n\nThat is not the same as dead and everybody watching knows the difference. A man on the ground in that has some time, and the amount of it is not something anyone here can estimate.\n\nThe press over the place has thickened rather than moved. And the men on either side of you have gone quiet in the particular way men go quiet when they have decided to do whatever you do."
 bc_chronicles.0005.desc_c:0 "There is a churn about thirty feet off where the footing is bad and too many people are standing on one piece of ground, and [bc_chronicle_subject.GetName] is under it somewhere.\n\nHe was up a moment ago. It is the sort of thirty feet that takes a long time and costs whatever it costs on the way, and the shortest version of it goes through the middle.\n\nNobody near you is looking at the enemy. They are all looking at you."
 bc_chronicles.0005.a:0 "Thirty feet. I have been further into worse."
 bc_chronicles.0005.b:0 "If I go, this part of the line goes with me. I stay where I was put."
 bc_chronicles.0005.c:0 "On me — everyone on this side of the banner. We are going through it together."
 bc_chronicles.0005.d:0 "You three. Wide, from the left, and take him under the arms. I will hold what opens."

# --- nickname tooltips ------------------------------------------------------
#
# The ONE place this mod writes a key it did not invent. CK3 builds the nickname
# tooltip in the character sheet from `<nickname>_desc`, so there is no bc_-
# prefixed alternative: either the engine's key exists or the tooltip has nothing
# to say. AGOT defines all 27 names but only ONE of these descriptions
# (nick_agot_the_painter_desc), so 26 of the names this mod hands out hovered
# blank. That is what these fill.
#
# ADDITIONS, NOT OVERRIDES. Verified against the whole AGOT localization tree
# before writing: none of the 26 keys below is defined anywhere in it. A key that
# is defined twice is a `Duplicate localization key` line in error.log and the
# loser is silently discarded, so if AGOT ever ships its own, DELETE ours - do not
# rely on load order to pick a winner.
#
# These render for ANY bearer, including canon characters who start the game with
# the name. So each one is written as a byname a fighting man earns, never as
# something that only makes sense for a commander this mod just promoted, and each
# uses the vanilla gendered tokens rather than assuming a man.

 nick_agot_the_warrior_desc:0 "Men who have stood in the line beside [CHARACTER.GetShortUINameNoTooltipNoFormat] say the Warrior himself was wearing [CharYourHerHis(CHARACTER)] face that day."
 nick_agot_greysteel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has gone grey in the saddle, and the steel in [CharYourHerHis(CHARACTER)] hand has lost none of its edge."
 nick_agot_fireball_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] falls on a battle the way fire falls on dry grass, and leaves about as much of it standing."
 nick_agot_hardstone_desc:0 "The field threw everything it had at [CHARACTER.GetShortUINameNoTooltipNoFormat] and broke on [CharYouHerHim(CHARACTER)] like water on stone."
 nick_agot_breakspear_desc:0 "Spears splinter on [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] shield, and [CharYouSheHe(CHARACTER)] keeps coming."
 nick_agot_oakenfist_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] fist closes on a battle like oak, and what it takes hold of does not get loose."
 nick_agot_greatheart_desc:0 "There is no braver heart on any field [CHARACTER.GetShortUINameNoTooltipNoFormat] has ridden onto, and every man who followed [CharYouHerHim(CHARACTER)] there knows it."
 nick_agot_ironheart_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] watched the line break and did not flinch. Men have called [CharYouHerHim(CHARACTER)] iron-hearted ever since, and not all of them meant it kindly."
 nick_agot_the_neveryield_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been outnumbered, surrounded and ridden down, and has never once yielded."
 nick_agot_greycloak_desc:0 "The cloak went onto the field clean and came off it grey with ash and dust, and [CHARACTER.GetShortUINameNoTooltipNoFormat] has worn it that way ever since."
 nick_agot_longspear_desc:0 "Few men get close enough to [CHARACTER.GetShortUINameNoTooltipNoFormat] to find out what [CharYouSheHe(CHARACTER)] can do with a sword."
 nick_agot_shieldbreaker_desc:0 "Shields come away from [CHARACTER.GetShortUINameNoTooltipNoFormat] in pieces, and the arms behind them rarely fare better."
 nick_agot_shieldsmasher_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] does not go around a shield wall. [CharYouSheHe(CHARACTER)] goes through it."
 nick_agot_thunderbolt_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] arrives on a battle the way thunder arrives on a summer afternoon: all at once, and far too late to do anything about."
 nick_agot_the_steelskin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been cut, thrown and trampled, and keeps standing back up. The smallfolk have decided [CharYouSheHe(CHARACTER)] must be skinned in steel."
 nick_agot_the_woe_desc:0 "Whole houses count the day they met [CHARACTER.GetShortUINameNoTooltipNoFormat] in the field as the worst in their history."
 nick_agot_the_morningstar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rides at the head of the charge, bright and early and impossible to mistake for anyone else."
 nick_agot_oakenshield_desc:0 "Men form up behind [CHARACTER.GetShortUINameNoTooltipNoFormat] because whatever is in front of [CharYouHerHim(CHARACTER)] tends to stay in front of [CharYouHerHim(CHARACTER)]."
 nick_agot_blacksword_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade comes off the field black to the hilt, and [CharYouSheHe(CHARACTER)] has never been in any hurry to clean it."
 nick_agot_widowmaker_desc:0 "Count the widows made by the last three fields and you have counted [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] work."
 nick_agot_bloodborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] seems to have been born for a battlefield, and is never so alive as on one."
 nick_agot_starfire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] came down on them like something falling burning out of the night sky."
 nick_agot_the_windrider_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is always on the flank nobody was watching, and always sooner than anyone thought possible."
 nick_agot_swiftspur_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is first onto the field and last off it, and [CharYourHerHis(CHARACTER)] horses pay for both."
 nick_agot_battleborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has fought so many fields that men have stopped asking where [CharYouSheHe(CHARACTER)] came from and started saying [CharYouSheHe(CHARACTER)] was born out of one."
 nick_agot_swordbiter_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade has taken so many notches out of other men's steel that the armourers know [CharYouHerHim(CHARACTER)] by the work."
 bc_style_award_toast:0 "A Way of Fighting"
 bc_style_award_aggressive_attacker_desc:0 "[bc_award_subject.GetName] has won three battles by making the enemy pay for standing still. Men have started to say he does not fight so much as insist."
 bc_style_award_unyielding_defender_desc:0 "Three times now [bc_award_subject.GetName] has set his line and three times it has held. Whatever else is said of him, he does not move."
 bc_style_award_flexible_leader_desc:0 "[bc_award_subject.GetName] has won three battles on ground that did not suit him, and won them by not minding."
 bc_style_award_cautious_leader_desc:0 "[bc_award_subject.GetName] has taken three fields without spending men on any of them. The reckless captain he was is not the man who came back."
 bc_style_award_reckless_desc:0 "[bc_award_subject.GetName] has thrown himself into three battles without waiting to see the shape of them. It has worked three times."
 bc_style_award_organizer_desc:0 "Three battles, and not once has [bc_award_subject.GetName]'s line lost its shape. The men know where to be before he tells them."
 bc_terrain_award_toast:0 "He Knows This Ground"
 bc_terrain_award_desert_warrior_desc:0 "[bc_award_subject.GetName] has fought twice in the dry country and learned what it costs."
 bc_terrain_award_open_terrain_expert_desc:0 "Twice on open ground, and [bc_award_subject.GetName] has learned what open ground is for."
 bc_terrain_award_rough_terrain_expert_desc:0 "[bc_award_subject.GetName] has fought twice in broken country and stopped cursing it."
 bc_terrain_award_forest_fighter_desc:0 "Twice under the trees. [bc_award_subject.GetName] has stopped trying to make a forest into a field."
 bc_terrain_award_jungle_stalker_desc:0 "[bc_award_subject.GetName] has come out of the green twice. Not everyone does."
 bc_terrain_award_winter_soldier_desc:0 "Twice [bc_award_subject.GetName] has drawn up a line on ground that would not hold a stake, and twice he has come off it walking. The cold takes more men than the enemy does, and he has stopped letting it."
 rule_bc_rivalry:0 "Battle Chronicles: Rivalry"
 rule_bc_rivalry_desc:0 "Whether losing a notable battle to the same commander twice makes an enemy of him. The mod tracks the man regardless; this decides how far the grudge is allowed to go."
 setting_bc_rivalry_off:0 "Off"
 setting_bc_rivalry_off_desc:0 "No relations are set. Battles still remember who beat you, and the field still reads differently when you meet him again, but CK3's relation graph is left alone — and so are the schemes A Game of Thrones hangs off it."
 setting_bc_rivalry_rival:0 "Rival"
 setting_bc_rivalry_rival_desc:0 "A first loss is a grudge; a second makes him a rival. It stops there however many times he beats you."
 setting_bc_rivalry_nemesis:0 "Nemesis"
 setting_bc_rivalry_nemesis_desc:0 "The full ladder. Three losses to one man makes him a nemesis — which in A Game of Thrones is a man you may find yourself planning to kill."

 rule_bc_wounds:0 "Battle Chronicles: Wounds"
 rule_bc_wounds_desc:0 "Whether a commander can be hurt in the fighting. He is never killed, and never worse than wounded — but a wounded man cannot lead an army until he mends."
 setting_bc_wounds_off:0 "Off"
 setting_bc_wounds_off_desc:0 "Commanders come off every field whole. Battles still turn on their decisions; nothing is ever taken out of them."
 setting_bc_wounds_default:0 "Default"
 setting_bc_wounds_default_desc:0 "A commander on the wrong side of a decisive moment, in a large battle that has already been going a while, may be carried off it. At most once per battle, and never more than once at a time."

# --- rivalry ----------------------------------------------------------------

 bc_reason_battle_grudge:0 "beat him on the field"
 bc_reason_battle_rival:0 "has beaten him twice on the field"
 bc_reason_battle_nemesis:0 "has broken him three times on the field"
 bc_rivalry_toast:0 "The Man Across the Field"
 bc_rivalry_grudge_desc:0 "[bc_rivalry_foe.GetName] took the field from [bc_rivalry_subject.GetName] today. That is all it is so far — a name, and a face to put to it.[bc_rivalry_subject.Custom('bc_grudge_clause')]"
 bc_rivalry_rival_desc:0 "Twice now. [bc_rivalry_subject.GetName] has lost to [bc_rivalry_foe.GetName] twice, and the second time it stopped being bad luck.[bc_rivalry_subject.Custom('bc_rival_clause')]"
 bc_rivalry_nemesis_desc:0 "Three fields, three defeats, one man. [bc_rivalry_subject.GetName] has stopped thinking about the war and started thinking about [bc_rivalry_foe.GetName].[bc_rivalry_subject.Custom('bc_nemesis_clause')]"

# --- the dead ---------------------------------------------------------------

 bc_dead_knights_toast:0 "They Did Not All Come Back"
 bc_dead_knights_toast_desc:0 "Some of the men who rode out under [bc_bereaved_commander.GetName]'s banner are still on that field. The heralds will have their names by morning.[bc_bereaved_commander.Custom('bc_dead_knights_clause')]"

# --- the opening ------------------------------------------------------------

 bc_chronicles.0011.t:0 "The Lines Close"
 bc_chronicles.0011.desc_intro:0 "The hosts are in reach of one another and nothing has been settled yet. Whatever is chosen now will have to be lived with all day."
# THE THREE ADDED 2026-08-17 MAY NOT MENTION THE GROUND, THE OTHER HOST'S NAME,
# NUMBERS ON EITHER SIDE, OR HOW IT IS GOING - the two paragraphs that follow
# own the first two subjects and nothing has resolved yet in any case. Each ends
# on the choice, which is the paragraph's actual job.
 bc_chronicles.0011.desc_intro_b:0 "It is close enough now to hear them. Nothing has happened that could not still be undone, which will not be true for very much longer, and whatever [ROOT.Char.GetFirstName] says in the next few moments is what the rest of the day gets built on."
 bc_chronicles.0011.desc_intro_c:0 "The waiting is nearly done and the whole of it is still to come. Every man in reach is looking at somebody who will tell him what to do next, and the one they are all eventually looking at has to decide it now, with none of it in yet."
 bc_chronicles.0011.desc_intro_d:0 "There is a last quiet before this sort of thing and it is happening now. Nothing is known yet and none of it can be taken back afterwards, and the order that goes out of here in a moment is the one everything else will be answering until dark."
 bc_chronicles.0011.desc_nemesis:0 "And across the field, under the other banner, is [bc_eve_foe.GetName]. [ROOT.Char.GetFirstName] has been here before, against this man, and it did not go well."
 bc_chronicles.0011.desc_stranger:0 "Across the field the other host comes on behind a banner nobody here can name. Nobody over there is anybody [ROOT.Char.GetFirstName] knows."
 bc_chronicles.0011.a:0 "Press them before they are set."
 bc_chronicles.0011.b:0 "Hold the ground and let them come."
 bc_chronicles.0011.c:0 "Wait. See how the first ranks fare."
 bc_chronicles.0011.desc_kin:0 "The banners across the field are ones he grew up under. Somebody over there taught him to ride."
 bc_chronicles.0011.desc_heathen:0 "They will pray before this, as he will, and not to the same thing."
 bc_chronicles.0011.desc_countryman:0 "The men across the field speak as his do. Whatever is decided here, both sides will tell it in the same tongue."
 bc_chronicles.0011.desc_ground_rough:0 "The ground is broken between here and them. Whoever crosses it will arrive out of order."
 bc_chronicles.0011.desc_ground_forest:0 "The trees begin a hundred paces off and do not end. A line that goes in there stops being a line."
 bc_chronicles.0011.desc_ground_jungle:0 "The green starts where the field ends and it does not thin. Men who go in there are gone from this battle."
 bc_chronicles.0011.desc_ground_winter:0 "The cold has been in the men since before dawn. It will be in them all day."
 bc_chronicles.0011.desc_ground_desert:0 "There is no water between here and the horizon, and both armies know it."
 bc_chronicles.0011.desc_ground_open:0 "The field is what it is. Nothing on it will decide anything for you."
# --- eve variants (2026-08-17) ----------------------------------------------
#
# The eve prints one foe paragraph and one ground paragraph every time it is
# answered, and it has one of each per value. Both chains now pool their lines
# through `random_valid` in bc_eve_events.txt - the structure is vanilla's, and
# the event file's own comment carries the proof.
#
# THREE PER FOE VALUE, TWO PER GROUND BAND. The asymmetry is argued at the
# ground chain: a band's sentence has to stay true of every terrain in that
# band, and the bands were partitioned for prose rather than for tactics, so
# mountains, wetlands and bog all have to survive the same rough line.
#
# EVERY VARIANT OF A VALUE MAKES THE SAME CLAIM, because the chain has already
# decided which value speaks and a variant that added a fact would be reporting
# something nothing tested. The nemesis lines all say the two have met; the kin
# lines all say the blood is shared; the heathen lines all say the prayers
# differ; the countryman lines all say the tongue is shared; the stranger lines
# all say there is nothing between these two men but the war.
#
# THESE ARE THE EVE'S, NOT THE TOASTS'. bc_frag_bond_* is a clause appended to a
# battle toast and says `the man commanding here`; these are full paragraphs in
# a pop-up that already shows the player his own portrait, so they say `he` and
# use [ROOT.Char.GetFirstName] where a name helps. No line below is a rewording
# of a bond fragment - the two sets are read minutes apart in the same battle.
 bc_chronicles.0011.desc_nemesis_b:0 "[bc_eve_foe.GetName] is over there, under the other banner, where he has been before. [ROOT.Char.GetFirstName] has not forgotten how that ended."
 bc_chronicles.0011.desc_nemesis_c:0 "The scouts came back with one name and it was [bc_eve_foe.GetName]'s. Everything after that has been arranged around it."
 bc_chronicles.0011.desc_kin_b:0 "There are two banners here and one family under them. Whatever the heralds say, that is what this is."
 bc_chronicles.0011.desc_kin_c:0 "He knows the arms coming towards him the way he knows his own hands. He has eaten under them."
 bc_chronicles.0011.desc_heathen_b:0 "Two sets of prayers are going up on this ground this morning and they are not going to the same place."
 bc_chronicles.0011.desc_heathen_c:0 "Whatever they hold sacred over there, none of it is anything to him, and his is nothing to them."
 bc_chronicles.0011.desc_countryman_b:0 "Both hosts were raised in one country. Both will curse in the same words when it starts."
 bc_chronicles.0011.desc_countryman_c:0 "He will hear his own tongue shouted back at him all day, and it will be shouted at him."
 bc_chronicles.0011.desc_stranger_b:0 "The other host has come a long way to be here and he could not say from where. There is nothing between him and them that the war did not put there."
 bc_chronicles.0011.desc_stranger_c:0 "He looks for a face he knows over there and finds none. Whatever is settled today will be settled between strangers."
 bc_chronicles.0011.desc_ground_rough_b:0 "Nothing between the two hosts is level. Whoever moves first will spend the crossing getting untidy."
 bc_chronicles.0011.desc_ground_forest_b:0 "There is more wood than sky in that direction. Anything that goes in comes out somewhere else, and later."
 bc_chronicles.0011.desc_ground_jungle_b:0 "The green wall starts close and goes on further than the scouts got. It swallowed two of them yesterday."
 bc_chronicles.0011.desc_ground_winter_b:0 "Nobody slept warm and nobody is going to. The day will take a share of both hosts before either touches the other."
 bc_chronicles.0011.desc_ground_desert_b:0 "The heat is already standing off the ground in sheets. Whatever water is left is what there is."
 bc_chronicles.0011.desc_ground_open_b:0 "Flat, dry, and open from here to the treeline. Nothing here will help either of them."
 bc_chronicles.0011.d:0 "Let the ground fight for us."
 bc_chronicles.0011.e:0 "This time he does not ride away."
# The two contextual options added 2026-08-17. f is horse country, g is kin.
# f names its own price in the text, because it is the only option in the mod
# that applies a negative modifier and the player is choosing before he knows
# anything - an unpriced gamble presented as a free one would be a cheat.
 bc_chronicles.0011.f:0 "Loose the horse early. Spend them."
 bc_chronicles.0011.g:0 "Hold. Nobody over there dies who does not have to."
# h, added 2026-08-17, is the heathen case and the last bond value to get an
# option. It says nothing about mercy or the lack of it because the modifier it
# grants is the same one option a grants - what differs is the coin it is paid
# for, and the text names the coin.
 bc_chronicles.0011.h:0 "Have it preached before they form up. Their gods are not ours."
# i, added 2026-08-17, is the winter band and the only option in the mod that
# costs coin. It names the price in the text for the same reason f does: the
# choice is taken before anything is known, and coin is the one thing the
# player can be left measurably poorer in.
 bc_chronicles.0011.i:0 "Buy them a warm hour out of the war chest. Fires, wine, whatever is still in the wagons."
# j and k, added 2026-08-17, are the two options that read the man instead of
# the field - dread and stress. Neither names its price in the text, and that
# is the settled rule rather than an omission: f and i name theirs because one
# applies a negative modifier and the other spends coin, both of which the
# player would otherwise discover after the fact. Stress and prestige show in
# the option's own tooltip, so naming them again would be twice.
#
# SPENT PHRASES THESE MAY NOT REUSE. The nine options above already hold
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 13.
# option in the set that says out loud what the men think of him, and k is the
# only one where he stops.
 bc_chronicles.0011.j:0 "They are more frightened of me than of anything across that field. Send them forward."
 bc_chronicles.0011.k:0 "Let the captains set the watch. He is no use to anyone at dawn like this."

# --- the flesh --------------------------------------------------------------

# --- the lifesaver (2026-08-17) ---------------------------------------------
#
# THE ONLY TOAST IN THE MOD THAT NAMES TWO MEN. Every other knight toast says
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 14.
# This one is about a thing that happened BETWEEN two, so both are named:
# [bc_knight.GetName] is the knight (the toast's left_icon) and
# [bc_chronicle_subject.GetName] is the commander he went in after, which is
# the same scope the three Custom clauses hang off.
#
# THE COMMANDER IS NOT CALLED HIS LORD. A knight in a side's knight list is
# not necessarily the commander's vassal, and the mod has no trigger asserting
# he is. Naming him is both shorter and true.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "come to take him out of the line"
# and "carried off" (bc_knight_will_not_be_carried), "still on his feet"
# (bc_knight_the_old_wound). "Pulled Me Out" is the opinion modifier's name and
# is deliberately NOT repeated in the toast - the opinion is the rescued man's
# word for it afterwards, the toast is what the field saw at the time.
# --- the two men who matter to him (2026-08-17) -----------------------------
#
# The three knight relation templates. NONE OF THE THREE NAMES THE RELATION.
# `has_relation_friend` and `has_relation_rival` are engine relations with no
# story attached - the game hands them out through events the mod never sees -
# so a desc explaining how the two men came to it would be inventing history.
# All three write what the relation is doing to the fighting today.
#
# THE SECOND MUST NOT READ AS COWARDICE. bc_knight_shames_himself is the mod's
# craven case and owns that ground; this man is obeying, exactly, and the whole
# point is that nobody can put a name to what is wrong with it.
#
# THE THIRD NAMES THE ENEMY COMMANDER'S EXISTENCE BUT NOT HIS NAME. A toast is
# rendered from the commander's scope and the only character scopes it has are
# bc_knight and bc_chronicle_subject - the man opposite is in neither, and the
# ground clause hangs off the subject like every other toast in the file.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "and he has not lost sight of him
# once" (bc_his_blood_in_the_ranks_toast_desc), "where he can be seen doing it"
# (same), "keeping score" (the second's own chance-row comment, which is not
# loc but reads oddly repeated).
# --- what he is already carrying (2026-08-17) -------------------------------
#
# The three stress templates, two commander and one knight. NONE OF THEM NAMES
# THE STRESS. The word does not belong in a thirteenth-century field and the
# number behind it is an abstraction the player already has a tooltip for; what
# these three write is what a man at the second breaking point looks like from
# ten feet away.
#
# NONE OF THEM SAYS WHAT PUT IT THERE. Stress arrives from anywhere in the
# game - a dead child, a broken vow, a decade of the wrong decisions - and this
# mod has contributed thirty-four points of it without knowing about any of the
# rest. A desc naming a cause would be inventing one.
#
# THE SECOND AND THIRD MAY NOT READ AS COURAGE. bc_he_cannot_stop is a man who
# cannot put a thing down and bc_knight_the_quiet_place is a man who has found
# the only hour of his year with no room in it for thinking. The mod already
# has brave men; these are not more of them.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he is still on his feet"
# (bc_knight_the_old_wound_toast_desc), "doing it wrong now" (same), "past the
# point where anybody would have called it enough" is this block's own and may
# not be reused by a later one.
 bc_the_hands_are_not_steady_toast:0 "The Orders Are Arriving Wrong"
 bc_the_hands_are_not_steady_toast_desc:0 "He is standing where he should be standing and saying the wrong things from it. Two of the last four orders contradicted each other and the men carrying them have started arriving back for a second telling. Nothing is wrong with the army. Everything is wrong with what the army is being asked for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_cannot_stop_toast:0 "One More, and Then One More"
 bc_he_cannot_stop_toast_desc:0 "It is going his way and it is not enough, and there is no sign of what would be. He has spent the reserve, called it back and spent it again, and every man who has suggested that this might be the moment to hold has been sent away with something to do.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_quiet_place_toast:0 "The Only Quiet Hour He Gets"
 bc_knight_the_quiet_place_toast_desc:0 "Whatever he has been carrying around all year, there is no room for it in the next four feet, and he has gone into those four feet like a man going indoors out of weather. He is buying ground at the usual price and he does not appear to have noticed paying.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_for_a_friend_toast:0 "Where His Friend Can See Him"
 bc_knight_for_a_friend_toast_desc:0 "He has put himself in the part of the line that matters most to one particular man watching, and it has changed how he is fighting - further forward than his own good sense would have taken him, and staying there. The ground he is standing on has been bought at the going rate.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_owes_him_nothing_toast:0 "Exactly What He Was Told"
 bc_knight_owes_him_nothing_toast_desc:0 "He is where he was put and he has not left it. He is also not one step ahead of it, and the difference between those two things is the whole afternoon. Nothing he has done could be called a failure and nothing he has done has helped.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_knows_that_man_toast:0 "He Has Been Waiting for This"
 bc_knight_knows_that_man_toast_desc:0 "There is a man giving orders on the other side of this that he has wanted a bad afternoon for years, and today the line is going forward far enough that getting near him has stopped being a fantasy. He is spending the horse to find out how near.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_pulls_him_out_toast:0 "He Went In After Him"
 bc_knight_pulls_him_out_toast_desc:0 "[bc_chronicle_subject.GetName] went down with the press closing over him and it was [bc_knight.GetName] who turned back into it. He came out of that with a man on his shoulder and the men who watched it have not stopped talking about it since.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE NINE MEMORY LINES. The RESCUED man carries this memory, so all nine are
# written from his side and `lifesaver` is the tag naming the knight - the
# mirror of the nemesis set, where the loser carries it and the tag names the
# winner.
#
# ALL NINE ARE PAST TENSE AND LOWER CASE with no full stop, and THE THREE POOLS
# STAY IN ORDER, for the reason the shieldbrother header gives: the engine picks
# a line per perspective block, so a reader comparing two of them expects to see
# the same variant.
#
# NONE OF THEM SAYS WHAT THE WOUND WAS or how close it came. The template fires
# on a losing side and applies nothing to the rescued man's health, so a line
# claiming he was dying would be reporting something no script wrote.
 bc_lifesaver_memory_desc:0 "[lifesaver.GetFullName] came back into that for me when nobody was going to make him"
 bc_lifesaver_memory_desc_second_perspective:0 "[lifesaver.GetFullName] came back into that for you when nobody was going to make him"
 bc_lifesaver_memory_desc_third_perspective:0 "[lifesaver.GetFullName] came back into that for [owner.GetName] when nobody was going to make him"
 bc_lifesaver_memory_desc_b:0 "I was under it and going nowhere, and [lifesaver.GetFullName] got me out"
 bc_lifesaver_memory_desc_b_second_perspective:0 "you were under it and going nowhere, and [lifesaver.GetFullName] got you out"
 bc_lifesaver_memory_desc_b_third_perspective:0 "[owner.GetName] was under it and going nowhere, and [lifesaver.GetFullName] got him out"
 bc_lifesaver_memory_desc_c:0 "I owe [lifesaver.GetFullName] a day I would otherwise not have had"
 bc_lifesaver_memory_desc_c_second_perspective:0 "you owe [lifesaver.GetFullName] a day you would otherwise not have had"
 bc_lifesaver_memory_desc_c_third_perspective:0 "[owner.GetName] owes [lifesaver.GetFullName] a day he would otherwise not have had"

 bc_wounded_toast:0 "Carried From the Field"
 bc_wounded_toast_desc:0 "[bc_wounded_commander.GetName] was brought down in the thick of it and carried out. He will live. He will not sit a horse at the head of an army until he mends.[bc_wounded_commander.Custom('bc_wounded_clause')]"

# --- the aftermath clauses (2026-08-17) --------------------------------------
#
# NO FRAGMENT HERE MAY NAME A CHARACTER, A HOUSE, A PLACE OR THE GROUND. The
# desc that calls it has already printed the names; these say what the fact
# means and have to be true of any battle in the game. Each is one sentence and
# each opens with a space, because it is appended to a finished sentence.
 bc_frag_grudge_a:0 " He has not said the name out loud yet. He will."
 bc_frag_grudge_b:0 " It is the kind of thing a man tells himself he has put down and then carries for years."
 bc_frag_grudge_c:0 " Nothing follows from it today. Something usually does."
 bc_frag_rival_a:0 " Twice is a pattern, and a pattern is a thing other people notice as well."
 bc_frag_rival_b:0 " There is now a version of this war that is only about the two of them, and it has started."
 bc_frag_rival_c:0 " He has begun rereading the first one, which is not a useful thing to be doing."
 bc_frag_nemesis_a:0 " He has worked out that there is no third answer to this that involves both of them living long lives."
 bc_frag_nemesis_b:0 " Whatever the war was about, it is not what he is going to be thinking about at night."
 bc_frag_nemesis_c:0 " Men have been known to lose everything else while settling one thing like this."
 bc_frag_dead_knights_a:0 " Somebody will have to write to the houses, and it will not be done well."
 bc_frag_dead_knights_b:0 " There are horses standing about out there with nobody looking for them."
 bc_frag_dead_knights_c:0 " The ones who came back are being very quiet about which of them was where."
 bc_frag_wounded_a:0 " The men who carried him out have already told the story twice and it has grown once."
 bc_frag_wounded_b:0 " Somebody else gives the orders until then, and everybody knows who."
 bc_frag_wounded_c:0 " He is furious about it, which the physician says is a good sign."

# --- where he learned it, and the man with no house (2026-08-17) ------------
#
# THE FIRST TWO ARE THE TWO ENDS OF ONE AXIS and must not sound like the same
# sentence twice. bc_taught_to_do_this is a man doing the thing he was made
# for, and bc_never_learned_the_trade is a man doing a thing nobody ever showed
# him. Neither is about how GOOD he is - the mod has martial for that and eight
# toasts already say it - so neither desc may reach for skill or the lack of
# it. One is about recognition and the other is about unfamiliarity.
#
# bc_never_learned_the_trade MAY NOT READ AS STUPIDITY OR COWARDICE. The man is
# very often the cleverest person on the field; he is applying a good mind to a
# problem that does not answer to the kind of thinking he was taught. The mod
# already has bc_the_hands_are_not_steady for a man coming apart and
# bc_no_fear_in_them for men who have stopped, and this is neither.
#
# bc_knight_no_house_behind_him IS NOT A COMPLAINT ABOUT HIS BIRTH. He is not
# resentful and the desc may not make him so - he is simply the only man in
# that part of the line for whom the day is an opportunity rather than a duty,
# and that shows in how he is fighting.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 15.
# block), "he is still on his feet" (bc_knight_the_old_wound_toast_desc).
 bc_taught_to_do_this_toast:0 "This Is What the Yard Was For"
 bc_taught_to_do_this_toast_desc:0 "He is not thinking about any of it. The line wants shortening and it shortens, the reserve wants moving and it moves, and every one of those decisions was drilled into him in a courtyard before he was tall enough to hold the shield he was given. Twenty years of somebody else's patience are being spent here in the space of an afternoon.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_never_learned_the_trade_toast:0 "Nobody Ever Showed Him This"
 bc_never_learned_the_trade_toast_desc:0 "He was raised for the other rooms - the ledger, the audience, the long careful conversation - and the day has asked him a question none of that answers. What he is doing is reasonable. It is also half a step behind what is happening, and the gap has been widening since noon.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_no_house_behind_him_toast:0 "Nothing Behind Him but the Shield"
 bc_knight_no_house_behind_him_toast_desc:0 "The device on that shield is one he chose himself and nobody has been obliged to remember it before today. He is further into this than the men either side of him, and staying there, because the whole of what he might yet be is standing in the ten feet in front of him and the host is winning enough for it to be seen.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the same name on both sides (2026-08-17) -------------------------------
#
# THE TWO ARE THE SAME FACT READ FROM OPPOSITE ENDS and the descs must make
# that legible without either explaining the other. The commander is a man who
# can afford mercy and spends it; the knight is a man who cannot afford to be
# overlooked and does not intend to be. Neither is written as noble.
#
# NEITHER MAY SAY "BROTHER" OR "COUSIN". bc_foe_is_house_trigger excludes close
# family outright, and bc_kin_across_the_line and bc_knight_meets_his_cousin
# own that ground with prose that names it. What these two share with the man
# opposite is a NAME, and the descs say so - the shield, the arms, the word
# itself - and never a degree of blood.
#
# THE COMMANDER'S DESC MAY NOT NAME THE ORDER HE DID NOT GIVE as a mercy or as
# a failure. He simply does not give it and the men simply notice, which is
# what the ordered/down cell means mechanically as well: nothing is handed out.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "the usual price" and "the going
# rate" (the knight toasts that already close that way), "nothing behind him
# but the shield" (bc_knight_no_house_behind_him_toast, which is about a man
# with NO name and must not blur into these two, who have one).
 bc_he_will_not_chase_them_toast:0 "The Order Nobody Hears Him Give"
 bc_he_will_not_chase_them_toast_desc:0 "The other host is coming apart at the far end of the field and this is the moment the horse goes after it. The horse is standing. He is watching a shield down there with his own arms on it going the other way, and he says nothing at all until there is nothing left worth saying it about. Two of his captains looked at him. Neither asked.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_other_branch_toast:0 "The Same Name, and the Lesser Half of It"
 bc_knight_the_other_branch_toast_desc:0 "The man commanding the other host carries the name he carries and got the better share of it two generations before either of them was born. He has been in front of the line since the second charge, where every man on both sides can see whose arms those are, and he has not once looked for a place to stand that is safer than the one he is in.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the state of the chest (2026-08-17) ------------------------------------
#
# TWO MEN IN DEBT ON THE SAME AXIS AND THEY MUST NOT SOUND ALIKE. The commander
# is watching a bill arrive that he has been outrunning since the spring; the
# knight is looking at the one afternoon of the year when the bill can be
# answered. One desc is about arithmetic catching up and the other is about
# work.
#
# THE KNIGHT IS NOT A LOOTER AND THE DESC MAY NOT WRITE HIM AS ONE.
# bc_knight_strips_the_dead owns robbery and shames him for it. This man is
# taking prisoners, which is a trade with rules, and the only thing unusual
# about him is how much he needs it to go well.
#
# THE COMMANDER'S DESC MAY NOT NAME MUTINY. Nothing has broken and nobody has
# refused anything - the men are simply, visibly, doing the sum. The mod has
# bc_no_fear_in_them for a host that has stopped and bc_the_hands_are_not_steady
# for a man coming apart, and this is neither of those yet.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 16.
 bc_the_chest_is_empty_toast:0 "They Have Started Doing the Arithmetic"
 bc_the_chest_is_empty_toast_desc:0 "It has been three months since anything came out of the chest, and until this afternoon nobody was counting out loud. The line is going backwards at the far end and the men in the middle of it have begun asking each other a question that has an obvious answer. Nothing has been refused. Everything is being weighed.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_ransom_he_needs_toast:0 "Worth More Sitting Up"
 bc_knight_the_ransom_he_needs_toast_desc:0 "He is not killing the ones with good harness. He is putting them on the ground, taking the helm off to be sure of the face, and handing them back to two men he has told to keep them alive and separate, and he has been doing it since the other host started to bend. Somebody is going to be paid for all of this and he knows to the copper what he is owed elsewhere.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the gods, and what a knight hears across the field (2026-08-17) --------
#
# THE COMMANDER'S DESC MAY NOT DECIDE WHETHER IT WORKS. He plants himself and
# the line forms on him; whether the gods had anything to do with the rest of
# the afternoon is not the toast's business, and a desc that settles it turns a
# moment into a verdict. The modifier is the only claim being made.
#
# THE TWO KNIGHT DESCS ARE THE TWO HALVES OF ONE LOOK ACROSS THE FIELD and may
# both render on the same battle for the same man - the foe triggers are not
# mutually exclusive. So neither may claim to be the whole of what he thinks
# about the men opposite.
#
# bc_knight_they_sound_like_home IS NOT REMORSE AND NOT REFUSAL. He is doing
# the work; the volume is down. bc_knight_walks_them_back owns keeping shape
# while going backwards and bc_knight_shames_himself owns coming apart, and
# this is neither - which is also why it hands out no modifier.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 17.
 bc_the_gods_are_watching_toast:0 "He Has Stopped Where the Banner Is"
 bc_the_gods_are_watching_toast_desc:0 "It has been going the wrong way since the middle of the morning and he has not moved a foot from where the standard is planted. Men who were falling back are forming up on him because he is the only fixed thing in that part of the field, and he is saying something that is not an order. Whatever comes at that spot next will find it occupied.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_against_unbelievers_toast:0 "The Fight He Was Promised"
 bc_knight_against_unbelievers_toast_desc:0 "Everything he was ever told about what a sword is for was told to him about a day like this one, against men who kneel to something else. He has been in the front of it since it started and he has not needed anybody to explain to him why. Whatever it costs him he has already agreed to pay.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_they_sound_like_home_toast:0 "They Are Shouting in His Own Accent"
 bc_knight_they_sound_like_home_toast_desc:0 "The men on the other side of his shield are saying the same words for things that he says, in the same order, and one of them called for his mother in a way he recognised. He has not stopped and he has not slowed. He has simply gone quiet, and he is being extremely careful about what he does next, which out here is not the same as being safe.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the body, from the saddle (2026-08-17) ---------------------------------
#
# BOTH ARE ABOUT REACH AND NEITHER IS ABOUT PAIN. The knight body batch is
# written from inside the ranks and is allowed to be about how it feels; from
# the saddle the only thing a wound changes that an army notices is where the
# man can get to and how fast. A desc here that dwells on the wound itself is
# the knight batch's sentence in the wrong file.
#
# THE FIRST MAY NOT BLAME HIM AND MAY NOT EXCUSE HIM. His orders are right and
# they are late, and the toast says both without deciding which matters. It
# hands out no modifier for the same reason.
#
# THE SECOND MAY NOT READ AS TRIUMPH OVER ADVERSITY. He is not overcoming
# anything; he worked out a method some years ago and it is simply how he
# fights now. The men treat it as ordinary, because to them it is.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he is still on his feet" and "doing
# it wrong now" (bc_knight_the_old_wound_toast_desc), "the orders are arriving
# wrong" (bc_the_hands_are_not_steady, which is a man coming apart and must not
# blur into a man who is simply too far away).
 bc_he_cannot_get_there_toast:0 "It Is Half a Mile to Where He Is Needed"
 bc_he_cannot_get_there_toast_desc:0 "Something is going wrong at the far end and he has known about it for a quarter of an hour, which is how long it took a rider to find him and will take another to get back. What he sent is the right thing to have sent. It was the right thing when the rider left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_holds_one_place_toast:0 "Everybody Comes to Him"
 bc_he_holds_one_place_toast_desc:0 "He has not moved from the rise since the host formed up and nobody expected him to. The captains have been coming and going all afternoon on a rota somebody worked out years ago, and the whole army knows where the answer to any question is standing. It is not the way it is done in the songs. It is working.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the other three numbers (2026-08-17) -----------------------------------
#
# THREE DESCS, THREE DIFFERENT KINDS OF COMPETENCE, AND NONE OF THEM IS "he is
# good at fighting". That sentence is already written a dozen times in this
# file off `martial` and `prowess`, and if any of these three drifts back
# towards it the template has been wasted.
#
# THE FIRST MAY NOT EXPLAIN THE TRICK. The whole texture of an intrigue moment
# is that the men in the ranks do not know what happened and the man across the
# field is still working it out. A desc that spells out the manoeuvre turns it
# into a tactics toast, which is bc_ground_favours_us's ground.
#
# THE SECOND IS ABOUT A BOOK AND MUST SAY SO PLAINLY. Every other losing desc
# in this file gets its knowledge out of the man's own past on a field. This
# one gets it out of a page, read in a room, years before any of this - and
# that is the only thing making it a new sentence.
#
# THE THIRD MAY NOT MENTION FEAR OR OBLIGATION IN ANY FORM. The instant it
# says the men stay because of what leaving would cost them, it is
# bc_they_fear_me_more with different words. They stay because of him.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 18.
 bc_the_trick_they_did_not_see_toast:0 "What Was Never on the Left"
 bc_the_trick_they_did_not_see_toast_desc:0 "The men the other side has been carefully avoiding all morning were not there, and had not been there since before the sun came up. Nobody in the ranks understands what has just happened to the field; they only know it opened where it had no business opening, and that somebody is already going through the gap. He has not explained it to anyone and does not intend to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_has_read_about_this_toast:0 "He Has Seen This Written Down"
 bc_he_has_read_about_this_toast_desc:0 "It is going wrong in a shape he recognises, and not from any field he has stood on. Somebody set this down two centuries ago and he read it in a cold room as a boy, and he knows which part of the line goes first and roughly how long the rest of it lasts after that. The order he is giving now is being given while it is still early enough to be worth giving.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_came_for_him_toast:0 "Nobody Has Gone Home"
 bc_they_came_for_him_toast_desc:0 "They are being pushed back and they are being pushed back in one piece. Two of the lords holding that end of the line came to this war on nothing but their own word, with somewhere better to be this afternoon and every reason to remember it, and neither of them has so much as glanced behind him. None of that was arranged out here. It was arranged at a long table, over a great many years, by a man who was good at tables.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the man on the other side is also commanding (2026-08-17) --------------
#
# NONE OF THE THREE MAY DESCRIBE THE ENEMY COMMANDER AS A PERSON. The mod
# knows one number about him. It does not know whether he is old, calm, cruel
# or lucky, and a desc that says any of those is inventing a character the
# save may flatly contradict - the man across the field is somebody's
# playable lord. Everything here has to be written from what arrives on THIS
# side of the field.
#
# THE FIRST MAY NOT MAKE OUR COMMANDER LOOK FOOLISH. That is the entire
# difference between it and bc_never_learned_the_trade. His decisions are
# good ones. They are being answered.
#
# THE SECOND MAY NOT EXPLAIN THE MISTAKE IN TACTICAL TERMS. A desc that names
# the manoeuvre turns it into a lecture; what the toast wants is the moment
# somebody on this side realises what they are looking at.
#
# THE THIRD IS FORTY FEET OF SHIELDS AND NOTHING ELSE. The instant it tells
# the reader what the enemy commander intended, it has given a knight a view
# of the field he does not have.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "he knows what comes next"
# (bc_he_has_read_about_this), "the field opened" (bc_the_trick_they_did_not_
# see), "doing the right thing at the right moment" (used in three headers).
 bc_the_other_man_is_better_toast:0 "Everything Is Being Answered"
 bc_the_other_man_is_better_toast_desc:0 "He has changed the shape of this twice since midday and both times the change was correct and both times something was already standing where he sent it. Nobody on this side has done anything wrong. The orders went out clearly, the men carried them out, and it has not mattered once, and he is beginning to understand that whoever is holding the other standard has been a full step in front of him since before the first horn.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_gap_he_left_toast:0 "Somebody Over There Has Blundered"
 bc_the_gap_he_left_toast_desc:0 "It takes him a moment to believe what he is seeing, because no one who had ever been made to stand in a yard and be shouted at would have done it. Then he stops trying to believe it and starts shouting, and the riders are moving before he has finished the sentence. Whatever else this afternoon turns out to be, that was a present.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_something_is_always_there_toast:0 "There Is Always Something Waiting"
 bc_knight_something_is_always_there_toast_desc:0 "Four times now they have gone forward into a place that looked empty and four times there have been spears in it. He does not know why and he has no way of finding out from where he is standing, behind a shield, in the fifth rank of a push that has stopped again. He only knows that it keeps happening, that the men on either side of him have gone quiet about it, and that nobody wants to be in the front of the next one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the name he already has (2026-08-17) -----------------------------------
#
# NONE OF THE THREE MAY QUOTE THE NICKNAME. The gate is `has_any_nickname`,
# which means the name could be any of thirty-five AGOT keys or something out
# of a save this mod has never seen, and a desc that puts words in the men's
# mouths will be wrong most of the time. All three are written around the
# name without ever saying it, which is also how it actually sounds from
# fifty yards away.
#
# THE FIRST IS NOT A COMPLIMENT TO HIM. The host is going forward on
# something that has nothing to do with the orders he is giving, and it is
# spending horses doing it. He is not entirely in charge of this.
#
# THE SECOND MAY NOT BE SELF-PITY AND MAY NOT BE HUMILIATION. It is the exact
# moment a man notices that the people around him expected somebody else, and
# it costs fifteen stress rather than the file's usual ten for that reason.
#
# THE THIRD IS TOLD FROM FOUR HUNDRED YARDS. The knight has never met the man
# on the other banner and never will; what he has is a lifetime of hearing
# about him, and the sight of that banner going backwards.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 19.
# (bc_the_other_man_is_better).
 bc_they_are_shouting_his_name_toast:0 "They Are Not Waiting to Be Told"
 bc_they_are_shouting_his_name_toast_desc:0 "Somewhere in the middle ranks a man started shouting what people have called him since before this war, and it has gone along the line the way fire goes along a hedge. They are going forward. They are going forward faster than anybody ordered and the riders on the flank have been at a canter for a quarter of an hour with nothing in front of them yet. It is working, and he did not do it, and he cannot stop it either.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_name_is_a_weight_toast:0 "They Came Expecting Somebody Else"
 bc_the_name_is_a_weight_toast_desc:0 "Every man in this host walked here knowing what he is supposed to be, and it is going badly, and he can see them working out what that means. Nobody has said anything. A captain took an order from him just now and repeated it back, which is a thing that is done for a stranger. Whatever happens to the rest of the afternoon, the name is going to be attached to it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_name_across_the_field_toast:0 "That Banner Is Going Backwards"
 bc_knight_the_name_across_the_field_toast_desc:0 "He has been hearing about the man under that standard since he was old enough to hold a shield, from people who had never been within a hundred leagues of him. He is within four hundred yards of him now, and the standard has moved twice, and both times it moved the wrong way. Getting this far has cost the front of the push almost everything it had. He is going to be telling people about this for thirty years.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the mod reads its own army state back (2026-08-17) ---------------------
#
# ALL THREE MAY SAY "ALREADY TODAY" AND NONE MAY SAY "LAST TIME". The gates
# read a live verb modifier, and the verb families are wiped at combat end, so
# what they are looking at was granted by an earlier moment in this same
# battle or by the eve immediately before it. A desc that reaches back to a
# previous battle is claiming something the code cannot support.
#
# THE FIRST MAY NOT BE ABOUT A DECISION. bc_he_will_not_chase_them is the
# template where he could and will not; this one is the template where he
# would and cannot. If a reader can confuse the two toasts, this one is
# written wrong.
#
# THE SECOND IS A REVERSAL AND HAS TO FEEL LIKE ONE. The same men, the same
# afternoon, the other way round. It should be uncomfortable rather than
# tragic - nothing has been lost yet, it has simply turned over.
#
# THE THIRD IS AT GROUND LEVEL AND SEES NOTHING BUT CHURN. He does not know
# there is a pursuit. He knows the ground he is walking on has been ridden
# over twice and that nobody who went that way has come back past him.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 20.
# running away have his name" (the house block), "the horses have been at a
# canter" (bc_they_are_shouting_his_name).
 bc_the_horses_are_already_gone_toast:0 "Nothing Left to Chase With"
 bc_the_horses_are_already_gone_toast_desc:0 "The other side has come apart and the road behind them is open and there is not one animal on this field with a gallop still in it. He sends what he has anyway and watches it go off at a walk. Everything he needed to end this today is standing in front of him with its head down and its sides going like a bellows.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_were_chasing_an_hour_ago_toast:0 "It Has Turned Over"
 bc_they_were_chasing_an_hour_ago_toast_desc:0 "Not long ago these were the men going forward through a gap, loose and quick and shouting, and now the same men are strung out across ground they took at a run and something is coming back at them across it. Men in open order do not receive a push well. He is watching the shape of his own morning being used against him and there is no version of the next quarter of an hour that is cheap.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_horses_went_past_toast:0 "They Have Already Been Here"
 bc_knight_the_horses_went_past_toast_desc:0 "The riders went by him a long while back, close enough that he had to step aside for them, and nobody has come the other way since. Now he is walking forward over ground that has been ridden across twice and churned into something that pulls at his feet, past things he does not look down at. Whatever is at the far end of this, the horses got there first and are still there.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the ledger as a gate (2026-08-17) --------------------------------------
#
# BOTH DESCS ARE ABOUT TIME AND NEITHER MAY NAME AN HOUR. The gate counts
# moments, not minutes, and a battle that produced three of them could have
# taken half a morning or most of a day. "Since midday" and "for two hours"
# are claims the code cannot make. What it can say is that a great deal has
# already happened.
#
# THE FIRST HAS NO SIDE ROW AND THE PROSE MAY NOT LEAN EITHER WAY. It renders
# on a field being won and a field being lost, so every sentence in it has to
# be true of both. That is unusual in this file and it is the hardest
# constraint in the block.
#
# THE SECOND IS THE ONE PLACE THE MOD IS ALLOWED TO BE TIRED. Every other
# knight desc is written at the pitch of the thing happening; this one is
# written at the pitch of the fourth time it has happened. It should read
# slower than anything else here.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "it has turned over"
# (bc_they_were_chasing_an_hour_ago), "nobody wants to be in the front of the
# next one" (bc_knight_something_is_always_there), "the whole of the world".
 bc_this_has_been_a_long_afternoon_toast:0 "This Is Not Going to Be Quick"
 bc_this_has_been_a_long_afternoon_toast_desc:0 "Enough has happened here now that nobody is trying anything elegant any more. The lines have closed up and gone heavy, the reserves have been in and come out and gone in again, and whatever either side arrived intending to do has been used up. He has stopped thinking about how to win this and started thinking about who will still be standing in order when it stops, which is a different question and the only one left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_lost_count_toast:0 "He Has Stopped Counting"
 bc_knight_he_has_lost_count_toast_desc:0 "He could tell you what happened the first time and most of the second. After that it is one thing. His shield arm has gone somewhere he cannot feel and he is not sure when he last saw the man who was on his left, and none of it has decided anything, and it is still going. Somewhere behind him a horn is saying something he used to know the meaning of.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the top of the ladder (2026-08-17) -------------------------------------
#
# THESE TWO ARE THE LOUDEST STATES THE MOD PRODUCES AND THE PROSE HAS TO EARN
# THAT. Both gates take a chain of moments to reach, which means a player who
# sees either toast has already read three or four others in the same battle.
# Anything merely energetic will land as one more of those. These have to
# read like the afternoon has decided.
#
# THE FIRST MAY NOT PROMISE A VICTORY. The rung is not the end of the battle
# and the mod has no idea how this finishes; what it knows is that right now
# nothing on the other side is answering. A desc that says they have won is
# writing a cheque the aftermath may not honour.
#
# THE SECOND MAY NOT KILL ANYBODY AND MAY NOT ROUT THE HOST. The standing
# rule holds - the mod does not narrate deaths it has not caused - and a rout
# is the aftermath's to declare. This is the moment before all of that, which
# is worse to stand in than either.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 21.
# stopped counting" (bc_knight_he_has_lost_count), "nothing left to chase
# with" (bc_the_horses_are_already_gone), "it has turned over".
 bc_nothing_is_stopping_this_toast:0 "Nothing Is Answering"
 bc_nothing_is_stopping_this_toast_desc:0 "Every order he has given for some time now has been carried out roughly as he imagined it, which has never once happened to him before. The far end of the line moved when he asked it to. The reserve went in where he pointed. Whatever is being done on the other side to stop this is not arriving, and the men have noticed, and they are asking him for things instead of waiting to be told.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_bottom_of_it_toast:0 "The Ground Behind Him Is Empty"
 bc_knight_the_bottom_of_it_toast_desc:0 "He turns around for the first time in a long while and there is a great deal more space back there than there ought to be. Not a rout, not yet, not quite: men are still facing the right way, and there are simply fewer of them doing it, and the ones at the edges keep glancing at the treeline. A riderless horse goes past at a flat gallop with nobody trying to catch it. Whatever this becomes, it has already stopped being a battle in the sense he came here for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- what the host had opinions about this morning (2026-08-17) -------------
#
# THE WHOLE OF BOTH DESCS IS THAT THE ARGUMENT HAS STOPPED, AND NEITHER MAY
# STAGE THE ARGUMENT IN ORDER TO WIN IT. No sceptic gets a line of dialogue
# and then gets corrected. Nobody thinks better of anything. The moment being
# written is later than that: a host that has other things to attend to and
# has quietly reallocated the attention. A desc that puts the doubt on the
# page has made the doubt the subject, and the doubt is not the subject.
#
# NEITHER MAY SAY "FOR A WOMAN" OR "FOR A LOWBORN" IN ANY CONSTRUCTION,
# including one an admirer would say. Praise on that axis is the argument
# again with better manners, and the templates gate on a field that is being
# won, where the question has stopped being asked at all.
#
# THE FIRST IS ABOUT LATENCY AND SHOULD READ LIKE A MEASUREMENT. What has
# changed over the morning is the gap between an order leaving her and a line
# moving, and that is a thing a commander can actually feel closing. Keep it
# concrete - the runner who no longer waits to be sure, the serjeant who has
# already started.
#
# THE SECOND MAY NOT NAME A FUTURE. He is not being knighted at the end of
# this and the mod does not know whether he lives to supper. What he has is
# the thing itself, happening, with witnesses - which is what the prestige is
# for and is enough.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 22.
 bc_the_orders_are_taken_toast:0 "The Orders Are Simply Taken Now"
 bc_the_orders_are_taken_toast_desc:0 "At dawn there was a beat between her saying a thing and the thing beginning - short, but there, the length of a man deciding to move. It has gone. The runner leaves before she has finished the sentence because he already knows the end of it. The serjeant on the right has the wing turning while the order is still crossing the field to him. Nobody has announced this and nobody will mention it afterwards, and it is the reason the line is where it is.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_no_name_at_all_toast:0 "No Name At All"
 bc_no_name_at_all_toast_desc:0 "There is no house behind him, no seat, nothing that would get him a bed in a keep on a wet night, and the men who have been doing what he says since morning are winning with it. They are shouting to each other about the ford and the flank and about him, using the only thing they have to call him by, which is not much of a thing but is being used a great deal. Whatever else comes of today, a few hundred men now know exactly whose afternoon this was.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- whose war it is (2026-08-17) -------------------------------------------
#
# THE FIRST MAY NOT SAY THE WORD "FAULT" OR ANY SYNONYM FOR IT. What is true
# is narrower and harder: there is no one above him in this. Every other man
# on the field can say afterwards that he was sent, and he cannot, and that
# is a fact about the chain of command rather than a verdict on his judgement.
# The moment he is written as guilty the desc has become a small morality
# play and stopped being a battle.
#
# THE FIRST ALSO MAY NOT CONCEDE THE WAR. It is one bad afternoon in a
# quarrel the mod knows nothing else about, and the aftermath decides what it
# costs.
#
# THE SECOND AND THIRD SHARE A TRIGGER AND MUST NOT SHARE AN IMAGE. Both are
# looking at the same banner. The commander's is an arithmetic problem - that
# man, if he changes his mind, ends this, and he is having a bad afternoon
# where everyone can see. The knight's is a distance in yards that is not
# going to close. Do not let the knight's desc reason about the war and do
# not let the commander's desc want to reach anybody.
#
# NOBODY IS CAPTURED, WOUNDED OR KILLED IN ANY OF THE THREE. The standing
# rule holds and it is sharpest here, where the temptation is a lord in
# reach. The mod does not narrate a capture it has not caused.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 23.
# counting".
 bc_the_war_has_his_name_on_it_toast:0 "There Is Nobody Above Him In This"
 bc_the_war_has_his_name_on_it_toast_desc:0 "The men going backwards past him were raised on his word, marched here on his word, and are being pushed off this ground for a quarrel that has his name written at the top of it in a maester's hand. There is no rider he can send to ask what to do. Every other man here will be able to say he was sent; he will have to say something else, and he has an hour or two yet before anyone asks him for it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_man_who_started_it_toast:0 "The Man Who Started It Is Here"
 bc_the_man_who_started_it_toast_desc:0 "It is not a castellan over there and it is not a son sent out to learn the trade. The banner in the middle of that line belongs to the man who could have let all of this alone and did not, and he has come out to see it done himself, and it is not being done. He is having to be told things by riders who do not want to tell him. Whatever else is decided today, it is being decided in front of the one man it belongs to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_banner_answerable_toast:0 "Three Hundred Yards Of It"
 bc_knight_the_banner_answerable_toast_desc:0 "He can see the banner. It has not moved all morning and it is not far - a field, a ditch, a great many men - and everything that has happened to him today comes from under it. He has spent himself twice trying to get closer and the ground between has only got worse for the trying. His horse is finished and his arms are heavy and the distance is exactly what it was when he first looked up and found it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- why he is here (2026-08-17) --------------------------------------------
#
# NONE OF THE THREE MAY NAME THE HOOK. The mod does not know what it is - a
# secret, a debt, a letter, a child in somebody's hall - and a desc that
# invents one is writing content the save file will contradict on the next
# read. What may be said is only that it exists, that both men know it, and
# what it is worth this afternoon.
#
# THE FIRST MAY NOT LET HIM CONSIDER LEAVING. He is a commander in the middle
# of a battle and the leash is why he is standing here at all, not an option
# he is weighing this hour. Make it a decision and the moment shrinks to a
# man sulking.
#
# THE SECOND MAY NOT GLOAT AND MAY NOT NAME A PRICE. He is not going to
# collect this afternoon and he is not thinking about the terms. What has
# changed is the size of the account, and one sentence noticing that is the
# whole of it.
#
# THE THIRD IS THE SHORTEST OF THE THREE AND SHOULD BE. A knight in the ranks
# has no room for the reasoning the commander gets; he has the leash and the
# next four feet. Write it at that length.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 24.
 bc_the_thing_they_have_on_him_toast:0 "He Did Not Choose This Field"
 bc_the_thing_they_have_on_him_toast_desc:0 "There was a conversation in a warm room some months ago that ended with him agreeing to be here, and the agreeing was not really the word for it. He has thought about that room perhaps twice since. He is thinking about it now, with the left of his line going and the light getting on, and the thought is not doing him any good and will not stop.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_leash_runs_the_other_way_toast:0 "The Account Grows"
 bc_the_leash_runs_the_other_way_toast_desc:0 "He rode out for this on his own account and with his own men, and he did not have to, and the man at the top of this war knows exactly why he did not have to. Nothing on the field looks any different for it. What is different is that by tonight there will be one more thing owed in that direction, and both of them will have been counting all day.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_leash_holds_toast:0 "He Could Have Gone At Dawn"
 bc_knight_the_leash_holds_toast_desc:0 "He could have gone at dawn and it would have cost him one thing only, and he knows the price of it to the penny. He is still here. The rank he is standing in has no idea any of this is true and would not care much if it did.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the office he holds at home (2026-08-17) -------------------------------
#
# THE FIRST IS WRITTEN AT THE DISTANCE OF THE DRILL, NOT THE AFTERNOON. What
# is being praised happened over two years of winters on a muddy field behind
# a town, and the toast is the moment he sees it come back. It may not become
# a sentence about him being clever today - bc_the_orders_are_taken already
# owns the closing gap, and this is the thing that was true before anyone
# rode out.
#
# THE SECOND MAY NOT MAKE HIM A COWARD OR A FOOL, and that is the hardest
# constraint in the block. He is good at a job that is not this one. He reaches
# for the thing that has always worked, which is walls and patience, and out
# here it is the wrong reach - but a desc that sneers has turned into
# bc_knight_shames_himself with a council seat.
#
# THE THIRD MAY NOT PUT A KING ON THE FIELD. A Kingsguard is very often on
# detached service, the mod has no idea who he is guarding today, and nothing
# available here can support it. It also renders on a field going either way,
# so every sentence in it has to be true of both - the second time this
# session that constraint has come up and the harder of the two, because the
# temptation to write the cloak as winning is strong.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 25.
# over".
 bc_the_marshals_own_work_toast:0 "Two Years Of Winters"
 bc_the_marshals_own_work_toast_desc:0 "The wing wheels because a serjeant three ranks back knows the horn call, and he knows it because of a wet field behind a town where nobody wanted to be and where the same call was blown four hundred times. None of that was interesting at the time and none of it was thanked. It is happening now, in front of him, at the speed it was supposed to happen at.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_castellan_outdoors_toast:0 "He Has Always Had A Wall"
 bc_the_castellan_outdoors_toast_desc:0 "Every hard hour of his life has been spent behind good stone with the other fellow outside it, and he was very good at those hours. So he does what has always worked: closes the ranks, shortens the front, tells them to stand and let it come to them. Out here there is no gate to hold and nothing at his back, and the thing coming to them has room to go round.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_white_cloak_toast:0 "The White Cloak"
 bc_knight_the_white_cloak_toast_desc:0 "It is filthy by now and it is still the most visible thing on this field, and men who have never been told his name are putting their shoulders where they can see it. He is not doing anything remarkable. He is doing the ordinary work at the ordinary pace with a great many people watching, which is the whole of what the cloak is for, and it works the same today whichever way today is going.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the Wall and the boy (2026-08-17) --------------------------------------
#
# THE FIRST MAY NOT NAME A WHITE WALKER, A WILDLING, OR THE WALL ITSELF. The
# Watch fights ordinary wars in AGOT - against wildlings, against pirates,
# against whoever the game has put in front of them - and the mod has no idea
# who is opposite. What is true of every one of those fights is the
# arithmetic: fewer than there were, and nobody sending more.
#
# THE FIRST MAY NOT BE ABOUT VOWS. A desc that recites the oath has written a
# ceremony instead of an afternoon, and the vow is not what is short today.
#
# THE SECOND MAY NOT KNIGHT HIM AND MAY NOT PROMISE TO. He is having a very
# good hour. Nobody in a position to reward it is thinking about him yet, and
# the mod cannot write a ceremony it does not schedule.
#
# THE THIRD MAY NOT KILL HIM, WOUND HIM OR SEND HIM RUNNING - the standing
# rule, and bc_knight_shames_himself owns running. What happens is smaller and
# permanent: the picture he had is replaced by the thing itself and he has
# several hours left to stand in it.
#
# THE SECOND AND THIRD ARE THE SAME BOY AND MUST NOT SHARE AN IMAGE. Nothing
# about him decides which of the two he gets - only what the rest of the field
# is doing - so neither may reason about his character.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 26.
# stopped counting".
 bc_the_watch_has_no_reserve_toast:0 "Nobody Is Sending More"
 bc_the_watch_has_no_reserve_toast_desc:0 "He can put a number on what he has left and the number is smaller than it was at noon. That is the whole of the problem: every man he loses today is lost for good, and the ranging that would have replaced him is not coming, and the other fellow does not have that difficulty. So the ones still standing fight the way men fight who have understood the arithmetic, which is harder than they should and with less care than he would like.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_squires_best_day_toast:0 "Nobody Has Told Him To Slow Down"
 bc_knight_the_squires_best_day_toast_desc:0 "Some time in the last hour he stopped being frightened and did not notice it happening. He is where the fighting is, and then he is ahead of it, and the horse under him is doing more than any horse should be asked to do in an afternoon. Grown men are shouting things at him that are half warning and half something else. He will pay for the horse tomorrow and he does not know it yet.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_what_he_agreed_to_toast:0 "This Is What It Is"
 bc_knight_what_he_agreed_to_toast_desc:0 "He had a picture of this. He has had it for years, and it was quite detailed, and it is being taken away from him a piece at a time by the actual noise and the actual smell and the way the man beside him keeps saying the same short word over and over. Nothing has happened to him. It is only that he now knows what he agreed to, and there are hours of it left.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the other diagonal of the empty purse (2026-08-17) ----------------------
#
# NEITHER DESC MAY USE "THE ARITHMETIC" OR ANY FORM OF IT. It is the title of
# bc_the_chest_is_empty_toast and it appears again in the Watch block, and a
# third use in the mod's other money template would turn a phrase into a tic.
#
# THE FIRST MAY NOT HAVE THE MEN DOUBTING HIM. That is bc_the_chest_is_empty
# and it is the losing half of this same gate; here nobody in the ranks knows
# there is a number, and the pressure is entirely inside the man giving the
# orders.
#
# THE SECOND MAY NOT NAME A PRICE OR COUNT COPPERS - bc_knight_the_ransom_he_
# needs owns the man who knows what he is owed to the copper. This one is
# about being worth nothing to the people deciding, which is a different
# sentence and must not borrow that one's vocabulary.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 27.
 bc_the_short_war_toast:0 "It Has to Be Today"
 bc_the_short_war_toast_desc:0 "There is a version of this where he holds what he has taken, sits down in front of them and waits a month, and it is the better version and he cannot have it. He has known since before the horns that whatever he does not finish this afternoon he will not be able to feed. So the horses go forward again when they should be walked, and the wing that was holding is sent, and he is buying an ending with the only thing he still has to spend.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_pays_for_him_toast:0 "No Reason to Take Him Gently"
 bc_knight_nobody_pays_for_him_toast_desc:0 "The men coming at him can read harness as well as he can, and there is nothing on him that says somebody would send for him. He worked that out an hour ago. It means the door the others still have is not there for him, and a man who cannot put his hands up fights in a particular way - forward, and without much left over for the fellow beside him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the name he was given (2026-08-17) --------------------------------------
#
# NONE OF THE THREE MAY PRINT A SURNAME. Snow, Sand, Rivers, Stone, Flowers,
# Pyke, Hill, Storm and Waters are all correct for somebody and wrong for
# everybody else, and the mod has no idea which region it is standing in. The
# descs say what the name does, never what it is.
#
# NONE OF THE THREE MAY HAVE A CHARACTER SAY IT OUT LOUD. Nobody remarks on a
# man's birth to his face during a battle. What the mod may write is what he
# assumes is being thought, which is the actual mechanism in all three.
#
# THE FIRST MAY NOT SOUND GRATEFUL AND MAY NOT SOUND BITTER. The decree is
# years old and settled; what has not settled is the memory of the men.
#
# THE SECOND MAY NOT NAME THE REAL TACTICAL REASON HE IS LOSING - the point is
# that nobody is going to go looking for it.
#
# THE THIRD MAY NOT BE ABOUT GLORY OR RISK. bc_knight_the_glory_hound owns the
# man doing something dangerous for the story. This one is about a rate of
# work, which is the opposite failing.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 28.
 bc_the_parchment_and_the_men_toast:0 "The Decree Is Years Old"
 bc_the_parchment_and_the_men_toast_desc:0 "He is winning, and he is winning it neatly, which is not the same thing and is the thing he has decided to have. The flanks are covered before there is anything on them. The chase goes out in threes with a man over them who has been told twice. Every grey head in this host was standing somewhere when he was a different kind of person, and none of them will ever mention it, and he has never once commanded as though he believed that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_have_their_reason_toast:0 "Nobody Will Have to Look Far"
 bc_they_have_their_reason_toast_desc:0 "Another man loses an afternoon like this one and it gets argued about for a winter - the ground, the hour, the fellow on the left who was late. He is not going to get that argument. The answer is already written down and it was written before he ever sat a horse, and it will be said kindly by people who like him. He gives the next order anyway and it is a reasonable order.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_twice_as_good_toast:0 "Good Enough Is Not Available"
 bc_knight_twice_as_good_toast_desc:0 "The day is already going their way and he has not changed his pace since the first hour. Men either side of him have taken the moment everyone takes - a breath, a look around, a drink - and he has not, because a share of a good day is not a thing he will be given afterwards and he has known that since he was small. So he goes on working at a rate the line cannot hold, and the line tries to hold it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the body he was born with (2026-08-17) ----------------------------------
#
# THE FIRST MAY NOT MAKE HIM A GOOD FIGHTER. The gate is build, not prowess,
# and a knight of prowess 6 can fire it. What is true of him is mass, reach
# and a long arm, and none of that is skill.
#
# THE SECOND MAY NOT WOUND HIM, KILL HIM OR SEND HIM RUNNING - the standing
# rule and bc_knight_shames_himself's territory. He is still standing there,
# which is the whole of what the template says about him.
#
# THE THIRD MAY NOT PUT A JOKE IN ANYONE'S MOUTH AND MAY NOT ANSWER ONE. A man
# in a host does not say a word about his commander's height while there is
# fighting on, and a desc that has him proving somebody wrong makes the moment
# about the somebody. It is about an afternoon going the way he arranged it.
# It also may not have him fighting or in the line - he is not there.
#
# NONE OF THE THREE MAY USE THE WORD FOR WHAT HE IS. The trait gates it; the
# prose does not need to name it and reads as gawping when it does.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 29.
 bc_knight_built_for_it_toast:0 "Harder to Move Than Anything Beside Him"
 bc_knight_built_for_it_toast_desc:0 "Whatever else is true of him, he is a great deal of man, and for about a quarter of an hour that has been the most important fact on this part of the field. Things come at him and stop. The two men either side have quietly given up their own footing and taken his, and the shape of the line here now has a corner in it that the other host keeps walking into.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_it_weighs_the_same_toast:0 "It Weighs What It Weighs"
 bc_knight_it_weighs_the_same_toast_desc:0 "Sixty pounds of harness weighs sixty pounds on everybody and it has not been the same sixty pounds for him since the second hour. He is doing the work at half speed and a beat late, and he knows he is a beat late, and he has been correcting for it all afternoon with the only thing he has left, which is being there. Nobody has said anything to him about it. He has said a great deal to himself.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_small_man_toast:0 "It Is Going the Way He Said It Would"
 bc_the_small_man_toast_desc:0 "He has not touched a weapon today and does not intend to. What he has done is put the right men in the wrong place for the other fellow four separate times since noon, and the fourth one has just come apart in exactly the direction he said it would at breakfast. The riders coming back to him are taking their hats off first now, which they were not doing this morning.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# ---------------------------------------------------------------------------
# BATCH FIFTY. The man AGOT took the spurs from.
#
# THE DESC MAY NOT KNIGHT HIM AND MAY NOT PROMISE THAT ANYONE WILL. The trait
# is a standing state, not a wound that closes, and a toast that hints at its
# reversal writes a promise no other file in the mod can keep.
#
# IT MAY NOT SEND HIM RUNNING. bc_knight_shames_himself owns running, and this
# man is the opposite case: he is the one still in the place he was put.
#
# IT MAY NOT SAY WHAT HE DID. Whatever it was, AGOT does not record it, the
# player did not choose it, and inventing the crime would put a fact in the
# player's world that no other file agrees with. The men around him do not
# know either. That is most of the point.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 30.
 bc_knight_the_spurs_they_took_toast:0 "He Stands Where They Put Him"
 bc_knight_the_spurs_they_took_toast_desc:0 "Whatever it was, it was some years ago and in front of enough people that the story travels ahead of him. He was given the worst piece of the line this morning by a captain who did not trouble to look at him while saying it, and he has been standing in it since, without a device on him and without anyone to hold it if he goes down. The line is falling back everywhere else. It is not falling back here, and the four men nearest him have stopped asking themselves why they are still level with him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-ONE. The mod reading its own record back to the player.
#
# NEITHER DESC MAY NAME THE STYLE. The gate on the first is a count, not a
# kind: the same paragraph is rendered for a man who has won twice by holding
# and a man who has won twice by charging, and any sentence that pictures one
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 31.
#
# NEITHER MAY NAME A PREVIOUS BATTLE. The mod knows the count and nothing else
# - not where, not against whom, not what it was called - and a toast that
# invents a name puts a fact in the player's world that no other file agrees
# with.
#
# THE FIRST MAY NOT PROMISE A TRAIT. Three battles and a budget gate decide
# that, out of the template's sight and possibly against it.
#
# THE SECOND MAY NOT KILL HIM, MAY NOT LOSE THE BATTLE AND MAY NOT HAVE HIM
# CHANGE HIS MIND. `reckless` and `cautious_leader` are opposites and only the
# reward chain may make that swap.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 32.
 bc_the_thing_he_always_does_toast:0 "They Move Before He Says It"
 bc_the_thing_he_always_does_toast_desc:0 "The rider he sent out is still forty yards short of the captain he was sent to and the captain has already turned his men into it. Nobody has drilled this. It is only that they have stood in this shape beside this man often enough to know what the second half of the order is going to be, and this afternoon the half-second they save on every one of them has begun adding up in a direction the other host can see from where it stands.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_gamble_that_does_not_pay_toast:0 "The Same Throw, A Worse Field"
 bc_the_gamble_that_does_not_pay_toast_desc:0 "He asked for the whole of it at once, the way he asks for it, and the ground gave him back about a third and kept the rest. The horses that went furthest are the ones not coming back, and the men behind them are looking at the gap where those horses were and doing the arithmetic on it out loud. He is watching the same gap. Nothing he is thinking about it has reached his face.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-TWO. The two counters, on the afternoon that contradicts them.
#
# NEITHER DESC MAY NAME A NUMBER. The mod holds `bc_notable_battles` and
# `bc_nemesis_losses` as integers and holds nothing else - no place, no year,
# no name of a previous field - so "the fourth time" and "since the Trident"
# are both inventions that no other file in the mod agrees with.
#
# THE FIRST MAY NOT PUT A DEFEAT IN HIS PAST. The counter is incremented only
# in the winner's arm of the aftermath chain; it is a tally of victories, and a
# sentence about all the fields he has seen is reading a number that does not
# say that.
#
# THE SECOND MAY NOT KILL EITHER MAN, MAY NOT PUT THEM WITHIN REACH OF EACH
# OTHER AND MAY NOT SETTLE IT. `bc_chronicles.0005` owns the thirty feet, the
# rivalry chain owns the escalation, and the battle is still going.
#
# NEITHER MAY BE ABOUT SURPRISE. Both men know exactly what is happening to
# them; that is the whole difference between these two and the ordinary
# losing-side templates.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 33.
 bc_the_record_does_not_help_him_toast:0 "They Are Waiting For Something He Has Not Got"
 bc_the_record_does_not_help_him_toast_desc:0 "Everything he has sent out this hour has been the right thing sent to the right man at the right moment, and every one of them has arrived into a field that has stopped answering. The captains keep looking back up the slope at him between orders, waiting for the one they have all heard about, and he can see them doing it. There is no such order. There was never going to be one today, and he worked that out some time before they will.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_man_who_has_done_this_before_toast:0 "He Knows That Banner Too Well"
 bc_the_man_who_has_done_this_before_toast_desc:0 "The shape of it came apart in the same direction it came apart last time and he recognised the direction before the messengers did. Everything is going the way it went before, and he is doing the only thing left that he can still choose to do, which is stand exactly where he is standing and make the men either side of him do the same. The banner opposite has not moved either. Neither of them is going anywhere.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-THREE. The commander's wound, seen from the ranks.
#
# NEITHER DESC MAY SAY WHERE THE WOUND IS. The trait is `wounded` and the mod
# knows nothing beyond that - no limb, no weapon, no rider who brought him in.
# A toast that supplies one puts a fact in the player's world that the four
# other files touching this trait would contradict.
#
# NEITHER MAY HEAL HIM OR GET HIM OFF THE FIELD. Vanilla's recovery pulse owns
# how long `wounded` lasts and the battle is not over.
#
# NEITHER MAY BE ABOUT AN OLD WOUND. `bc_battle_wounded` is cleared at combat
# end and means "hit today"; `bc_knight_the_old_wound` owns the other reading,
# on the knight himself.
#
# THE SECOND MAY NOT LET THE RUMOUR BE TRUE. He is wounded and he is
# commanding. `bc_banner_falls` owns the banner going down and
# `bc_chronicles.0002` owns a line deciding what it is frightened of.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 34.
# down the line" in the prose itself, "nobody has told him".
 bc_knight_the_lord_is_still_up_toast:0 "The Man on the Grey Has Not Sat Down"
 bc_knight_the_lord_is_still_up_toast_desc:0 "Half the men in this part of the line saw it happen and have been working from the same short list of facts since: he was hit, he did not come off, and the horse is still turned the way it was turned before. They have not fought better this afternoon than they fought this morning. They have fought considerably harder, and the other host has been paying the difference for about a quarter of an hour without quite understanding where the bill came from.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_word_came_down_the_line_toast:0 "By the Fifth Rank It Is a Worse Story"
 bc_knight_word_came_down_the_line_toast_desc:0 "What happened is that he was hit and stayed up. What arrives here, four mouths later and travelling against the direction of the fighting, is a good deal shorter than that and stops after the first half. The orders keep coming and they are the same orders they have been all day, and the men taking them have started asking the rider who sent them, which is a question nobody asked at noon and which nothing in the answer can now settle.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-FOUR. The country the war kept him in.
#
# NEITHER DESC MAY NAME A TERRAIN. `bc_terrain_last` holds one of six BUCKETS,
# never a terrain key, so the mod does not know whether the last three fields
# were hills or mountains, bog or floodplain - only that they were the same
# kind of country. No river, no ridge, no wood may be named as though the
# player's map would agree with it.
#
# NEITHER MAY SAY HE CHOSE THE GROUND. The streak effect's own header settles
# this: terrain is not chosen, a commander goes where the war goes.
#
# THE SECOND MAY NOT NAME THE ENEMY OR MAKE HIM AN OLD OPPONENT. It reads a
# terrain counter, not `bc_battle_foe`; the man opposite may be a complete
# stranger who has simply been campaigning in the same country, and
# `bc_the_man_who_has_done_this_before` owns the case where he is not.
#
# NEITHER MAY COUNT THE BATTLES ALOUD - the standing rule for every counter in
# this family.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 35.
 bc_the_same_country_again_toast:0 "Nobody Has to Be Told Twice Here"
 bc_the_same_country_again_toast_desc:0 "The outriders came back with less than they used to and it was worth more, because everybody receiving it already knew which half mattered. Nothing has been explained on this field since dawn. The scouts went where they were going to go, the captains put their flanks where this sort of country always wants them, and the whole apparatus has been running a quarter of an hour ahead of the other host all afternoon without anyone raising his voice about it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_learned_it_too_toast:0 "He Was Already Standing There"
 bc_he_learned_it_too_toast_desc:0 "Every move he has made this afternoon has been the correct move for this kind of country, and every one of them has arrived at a place where somebody was already waiting. It is not that he has been outfought. It is that he has spent long enough here to stop noticing that the campaign has been teaching the other side the same lessons at the same speed, and this is the hour in which that arithmetic finishes.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-FIVE. Three sets of gods, and what the man beside him expects.
#
# NONE OF THE THREE DESCS MAY QUOTE A CREED. The mod gates on `has_religion`
# and knows nothing else - not which faith inside the religion, not which
# septon or priest or grove, not what anybody was taught. A remembered line of
# scripture in a toast is a fact about a branch the gate did not test.
#
# NONE MAY PERFORM A MIRACLE OR MAKE A GOD DO ANYTHING. Every one of these is
# about what the men present assume will happen next, which is the only way a
# god reaches a battlefield in this mod.
#
# THE FIRST MAY NOT PROMISE THEY HOLD AND MAY NOT LOOK LIKE A RALLY -
# `bc_rally_the_line` owns that, and nothing here reverses.
#
# THE SECOND MAY NOT BURN ANYBODY AND MAY NOT PUT A PRIEST IN COMMAND. The
# commander is still the commander; the mod has no way to put anyone else
# there.
#
# THE THIRD MAY NOT PRAY ALOUD, MAY NOT PUT A TREE ON THE FIELD AND MAY NOT
# MAKE HIM DOUBT. He is not having a crisis of faith, he is having an ordinary
# bad hour with nothing to fill the silence with.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 36.
 bc_they_do_not_ask_for_terms_toast:0 "Nobody Here Is Selling Himself Back"
 bc_they_do_not_ask_for_terms_toast_desc:0 "A herald came across an hour ago and went away again with the same answer he arrived with, and the men who heard it did not react to it in any way, because it had not occurred to any of them that a different answer was available. They are giving ground about a foot at a time and charging for every foot of it. Whatever the other host thought this last hour was going to cost, it is costing more than that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_fire_is_ahead_of_him_toast:0 "They Have Stopped Waiting For The Order"
 bc_the_fire_is_ahead_of_him_toast_desc:0 "He sent the centre forward and the centre went a good deal further than he sent it, and the two wings went with it without being asked, and the whole thing is now perhaps eighty yards past where he intended it to stop. It is working. It is also no longer entirely his, and he has spent the last few minutes riding along behind an army that is certain of something, trying to decide whether to spend the afternoon steering it or the afternoon getting it back.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_to_say_over_him_toast:0 "There Are No Words For This Part"
 bc_knight_nothing_to_say_over_him_toast_desc:0 "The man on his left went down twenty minutes ago and there was nothing to be said over him, so nothing was. Down the line somebody southron is being given the whole of it, the seven of them named one after another by a voice getting steadily higher, and it is carrying rather better than the fighting is. He has been listening to it and doing his work and has not yet decided which of the two of them is worse off.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-SIX. The war behind the afternoon, read for the first time.
#
# NEITHER DESC MAY NAME THE WAR, THE ENEMY, A HOUSE, A KING OR A CLAIM. The
# gates know one bit each - that the quarrel is internal, that the quarrel is
# his - and nothing whatever about who is in it or what it is for.
#
# THE FIRST MAY NOT SAY BROTHER, COUSIN OR KIN LITERALLY. `is_civil_war` is
# not a relation check; no relative has been tested and none may appear. It
# may not be a scene of recognition either - nobody spots a face he knows.
#
# THE SECOND MAY NOT HAVE HIM DECIDE ANYTHING, SURRENDER, SEND FOR TERMS OR
# CONTEMPLATE EITHER. He is a war leader losing an hour, not a war; the
# aftermath owns endings and this does not touch them.
#
# NEITHER MAY REVERSE THE HOUR OR PROMISE THE LINE HOLDS - both are losing
# templates and the mod does not undo a side's state in a moment toast.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 37.
 bc_the_other_half_of_the_realm_toast:0 "The Same Drill, Learned In The Same Yard"
 bc_the_other_half_of_the_realm_toast_desc:0 "Everything the other host has done this afternoon has been done the way he would have done it, and each time it works there is a half-second in which he approves of it before he remembers who it is happening to. Neither side has given a foot cheaply. Neither side is going to be the one that turns first while the other is still watching, and so the hour is costing both of them roughly twice what an hour against strangers would.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_his_own_war_toast:0 "There Is No One To Send To"
 bc_his_own_war_toast_desc:0 "Twice in the last hour he has turned in the saddle to send word to somebody, and twice there has been nobody at the end of it, because the name at the top of this quarrel is his own and has been since the first day of it. So the reserve went in. Then the escort went in. He is aware, in the flat and unhurried way a man is aware of weather, that there is nothing left behind him now and no one who will be asked about it afterward except him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-SEVEN. The body he arrived with.
#
# NEITHER DESC MAY NAME THE ILLNESS OR DESCRIBE A SYMPTOM THAT NAMES IT.
# Sixteen traits share this gate - a pox, a plague, a cancer, a bad chest, a
# bad joint - and they have nothing in common except that he is not well. No
# cough, no rash, no named fever, nothing a maester would write down.
#
# NEITHER MAY BE A DEATHBED, MAY NOT HAVE HIM NEARLY FALL, AND MAY NOT PUT
# ANYONE BESIDE HIM TO FUSS. He is doing his job through it and is still doing
# it when the toast ends.
#
# THE FIRST MAY NOT SAY HE IS BRAVE ABOUT IT AND MAY NOT REVERSE THE HOUR. It
# is a losing template about buying the shorter option and letting the men pay
# the difference, which is the opposite of a gallant one.
#
# THE SECOND MAY NOT HAVE HIM WIN THE BATTLE, GIVE A SPEECH OR BE CHEERED -
# the whole point is that he spends nothing, and a cheer is somebody else's
# moment.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 38.
 bc_the_shorter_of_the_two_orders_toast:0 "Every Choice Today Has Been The Near One"
 bc_the_shorter_of_the_two_orders_toast_desc:0 "There were two ways to answer the last push and he took the near one, as he took the near one before that, because the other would have meant crossing the field twice and he does not have two crossings in him this afternoon. Each of them was defensible. Together they have quietly turned a battle of movement into a battle of pushing, and pushing is being paid for in the ordinary currency by men who were not consulted about the exchange rate.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_does_not_move_from_the_rise_toast:0 "He Has Given Four Orders Since Noon"
 bc_he_does_not_move_from_the_rise_toast_desc:0 "He picked his ground at midday and has not left it since, and in three hours he has sent four riders out, which is fewer than he has sent in any battle of his life. It turns out that most of what he usually does is telling men he is watching them. They knew. The captains have been running their own halves of it all afternoon and running them well, and the only thing on this field that has not moved is the one thing that did not need to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-EIGHT. The mod's own verdict on the afternoon, read back.
#
# THE FIRST MAY NOT WIN THE BATTLE, MAY NOT ROUT ANYBODY AND MAY NOT NAME THE
# ENEMY COMMANDER. Phase events do not end battles and a rout is a word the
# aftermath owns. It is a host that has been ahead for a while, not a host
# that has just finished the job.
#
# THE FIRST MAY NOT BE A SPEECH OR A CHARGE ORDER either - `bc_rally_the_line`
# and the charge templates own those, and nothing here is being reversed or
# begun.
#
# THE SECOND MAY NOT NAME OR SHOW THE COMMANDER, MAY NOT SAY WHAT IS WRONG
# WITH HIM, AND MAY NOT HAVE ANYBODY DECIDE TO RUN. The knight does not know
# why the orders stopped arriving. He knows they stopped. Nothing in the gate
# tells him more than that and the desc may not either.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 39.
 bc_they_have_the_shape_of_it_now_toast:0 "The Third Time It Worked, Nobody Waited"
 bc_they_have_the_shape_of_it_now_toast_desc:0 "It has worked twice already and the second time it worked faster than the first, and when the same opening appeared a third time the captains on both wings went into it without sending back to ask. There is a rhythm to the afternoon now that everybody on this side of the field can hear and nobody has had to describe. He has spent the last quarter of an hour giving permission for things that have already started.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_is_coming_from_behind_toast:0 "The Riders Stopped Arriving A While Ago"
 bc_knight_nothing_is_coming_from_behind_toast_desc:0 "Twice an hour, all morning, somebody came up from the rear with a word about what the rest of the field was doing, and at some point that stopped and nobody can say exactly when. So the line has done the only thing a line can do without being told: it has closed up, shortened its front, and settled into holding a piece of ground nobody has yet explained the value of, on the assumption that this is what would have been asked for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH FIFTY-NINE. Two afternoons in the service of a man he does not like.
#
# NEITHER DESC MAY SAY WHY. The gate is an opinion number and knows no reason
# for itself - no insult remembered, no land taken, no woman, no slight named.
# If a desc supplies a cause it is inventing a fact the mod did not check.
#
# NEITHER MAY HAVE HIM DISOBEY, SABOTAGE, RUN, OR SAY ANY OF IT ALOUD. Both are
# about a professional doing the work; the moment either of them becomes
# insubordination it is a different template and a different mod.
#
# THE FIRST MAY NOT BE BITTER IN THE NARRATOR'S VOICE. He has done his part
# well and the record will belong to somebody else, which is a fact rather than
# a complaint, and the toast reports it as one.
#
# THE SECOND MAY NOT MAKE HIM THE REASON THE SIDE IS LOSING. He is one man in a
# line. What is missing is the unasked-for extra that a bad hour runs on, and
# it is missing quietly.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 40.
# stopped".
 bc_knight_it_will_be_his_name_toast:0 "It Will Be Written Down As His"
 bc_knight_it_will_be_his_name_toast_desc:0 "He took the ground he was sent for and held the corner of it that mattered, and did both about as well as they can be done, because the alternative would have cost him and not the man who sent him. Somewhere behind him that man is being handed the afternoon. In a year this will be one line in somebody's account of the war and it will have one name in it, and he has known which name since he was told where to stand.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_exactly_what_was_asked_toast:0 "To The Letter, And Not A Step Past It"
 bc_knight_exactly_what_was_asked_toast_desc:0 "Every order that reached him has been carried out exactly, which is the whole of it. Twice this hour there has been a half-chance on his right that a man might have gone for without being told, and both times he has looked at it and stayed where he was put, and both times he has been entirely within his instructions. A bad afternoon runs on the things nobody thinks to ask for. This one is not getting any.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY. The Watch and the free folk: no exit, and nothing but exits.
#
# NEITHER DESC MAY BE A LAST STAND OR KILL ANYBODY NAMED. Both are afternoons
# in the middle of something and the mod does not end battles in a toast.
#
# THE FIRST MAY NOT QUOTE THE OATH, NAME A CASTLE OR A RANGING, AND MAY NOT
# PUT WILDLINGS ACROSS THE FIELD. The gate says who these men are and nothing
# at all about who they are fighting; the Watch has been pulled into southron
# quarrels often enough that the enemy may not be assumed.
#
# THE FIRST MAY NOT CALL IT BRAVERY. A line that cannot leave gets closer
# together because those are the only two things available to it.
#
# THE SECOND MAY NOT HAVE HIM LEAVE, MAY NOT HAVE ANYONE ELSE LEAVE, AND MAY
# NOT SNEER AT KNEELERS. He is still fighting when the toast ends. The moment
# is that the arithmetic is available, not that anybody has done the sum.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 41.
 bc_there_is_nowhere_to_desert_to_toast:0 "The Line Is Getting Narrower And Not Shorter"
 bc_there_is_nowhere_to_desert_to_toast_desc:0 "The flanks have come in twice in the last half hour, not because anyone ordered it but because there is nothing on either side of this field that a man in black could walk toward and still be alive in a month. So the front narrows and thickens and the men in it work at the range of about a foot, and the whole apparatus has quietly stopped being an army manoeuvring and started being a wall with hands.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_here_is_sworn_toast:0 "He Picked This Man In A Different Month"
 bc_knight_nobody_here_is_sworn_toast_desc:0 "Nobody in this host swore anything to anybody. He came because the man leading it had been right three times running, and standing here in the fourth hour of being wrong he can feel exactly how much of an army is a stack of private opinions that have not yet been revised. He is still working. The man on his left is still working. Neither of them has said the obvious thing, and both of them know the sum and how easy it would be to do.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-ONE. The county the battle is standing in belongs to him.
#
# NEITHER DESC MAY NAME A HOLDING, A VILLAGE, A RIVER OR A ROAD. The gate knows
# the county is inside his realm and knows nothing else - not its name, not
# what stands on it, not whether he has ever set foot here before today.
#
# NEITHER MAY MOVE ANYTHING ON THE MAP. No village burns, no crop is counted,
# no holding changes hands; the mod does not touch the map and a toast may not
# imply that it did.
#
# THE FIRST MAY NOT MAKE THE SMALLFOLK CHEER, MAY NOT PRODUCE A LEVY FROM
# NOWHERE AND MAY NOT WIN THE BATTLE. It is an advantage made entirely of
# knowing things, and it stays that size.
#
# THE SECOND MAY NOT PUT A NUMBER ON THE DAMAGE AND MAY NOT HAVE HIM REGRET
# GIVING BATTLE HERE. He chose this field this morning. The toast is about what
# choosing it is turning out to mean.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 42.
 bc_every_ditch_here_has_a_name_toast:0 "Half The Line Grew Up Inside Thirty Miles"
 bc_every_ditch_here_has_a_name_toast_desc:0 "The ground rolls in a way that looks like nothing from the far side and is not nothing, and this side has spent the afternoon being told about it by men who cut hay on it. Where the wet part starts. Which hedge has a gap and which has a ditch behind it. Nothing about this is martial and all of it has arrived a quarter of an hour before it was needed, which is the difference between the two hosts today.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_it_is_his_own_country_underfoot_toast:0 "Whatever This Costs, He Is Paying It Twice"
 bc_it_is_his_own_country_underfoot_toast_desc:0 "Everything being ruined here this afternoon was already his before either host arrived, and it is being ruined at the rate a losing fight ruins things. He keeps feeding men into it well past the point the odds would justify, and the reason is not stubbornness: giving way here does not end the afternoon, it moves the identical afternoon eight miles further in, onto ground that is also his and has more on it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-TWO. Which of the two hosts chose this.
#
# NEITHER DESC MAY DISENGAGE, WITHDRAW OR CALL ANYTHING OFF. Phase events do
# not end battles and "he broke off the attack" is ending one.
#
# THE FIRST MAY NOT NAME THE OBJECTIVE, MAY NOT PUT A NUMBER ON THE ATTEMPTS
# AND MAY NOT HAVE HIM REGRET COMING. The gate knows he walked onto them and
# that it is going badly, and knows nothing about what he came for.
#
# THE SECOND MAY NOT COUNTERATTACK, MAY NOT BREAK THE ENEMY AND MAY NOT MAKE
# HIM CLEVER. Every interesting decision today was made by the other man and
# none of them worked; the toast may not steal any of them back.
#
# NEITHER MAY USE THE WORD FOR THE WAR'S ATTACKER. This is a combat-level fact
# about who walked onto whom this morning, not about who declared anything.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 43.
 bc_he_chose_the_hour_toast:0 "Nobody Made Him Come Up This Slope"
 bc_he_chose_the_hour_toast_desc:0 "The ground was his choice and so was the morning and so was the shape of the thing, and none of it is doing what it was picked to do. What happens now is that the same push gets made again, because ordering it costs a sentence and admitting it does not work costs the rest of the campaign, and the second push is going in over the ground the first one paid for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_they_came_to_him_toast:0 "He Has Not Done Anything All Day"
 bc_they_came_to_him_toast_desc:0 "He picked this place two days ago, put the host on it, and has done nothing since except decline to leave. Everything clever that has happened this afternoon was thought of by the man opposite, and all of it has arrived here in pieces, at the pace the ground allows, into a line that has not had to change its mind about anything. There will be no story in this for him. There is a good deal of story in it for the other one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SIXTY-THREE. There is a river in this province.
#
# NEITHER DESC MAY NAME THE RIVER OR THE FORD. The gate is a flag on a province
# and knows nothing else - not the name, not the width, not the season it was
# last in flood.
#
# NEITHER MAY DROWN ANYBODY, and neither may put a bridge on the field. The mod
# does not kill in a phase event, and a bridge is a structure the gate did not
# check for.
#
# THE FIRST MAY NOT HAVE HIM SHIFT THE BATTLE ELSEWHERE OR FIND A SECOND FORD.
# A funnelled battle cannot be un-funnelled by the man losing it, which is the
# whole moment.
#
# THE SECOND MAY NOT HAVE HIM CROSS, MAY NOT WIN THE BATTLE AND MAY NOT MAKE
# THE WATER A METAPHOR. He is in it, the fighting is in it, and he is still
# standing in it when the toast ends.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 44.
# not done anything".
 bc_it_all_comes_down_to_the_crossings_toast:0 "Three Places, And He Needs All Three"
 bc_it_all_comes_down_to_the_crossings_toast_desc:0 "There are three places on this front where men can actually reach each other and both hosts had them marked before noon, which was an advantage this morning and is arithmetic now. The same numbers are trying to fight along a third of the frontage. Nothing can be pulled back from a crossing without the crossing going with it, so nothing is pulled back, and the rate at which this is costing him has very little to do with how well anyone is fighting.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_water_is_over_his_boots_toast:0 "Nobody Fights Well On Stones He Cannot See"
 bc_knight_the_water_is_over_his_boots_toast_desc:0 "He has been standing in it long enough to stop noticing the cold and not long enough to trust his footing, and every man he has put down in the last half hour went down inside the length of his own arm, because there is no other range available here. The side is winning. This particular twenty yards of it is being bought at a price that will not appear in anybody's account of the day.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the edge that cannot be turned ------------------------------------------
#
# TWO MOMENTS ON A COASTAL FIELD. The first is the commander with a flank the
# enemy cannot buy; the second is a knight at the waterline getting off a
# horse that has stopped being any use.
#
# NEITHER MAY PUT A SHIP ANYWHERE. No sails on the horizon, no landing behind
# either host, no fleet coming, no fleet leaving. The gate checked whether the
# province touches salt water and nothing else, and a ship is an entire other
# battle that the mod has no business inventing in a toast.
#
# NEITHER MAY DROWN ANYBODY AND NEITHER MAY KILL ANYBODY. The mod does not
# kill in a phase event.
#
# THE FIRST MAY NOT SAY THE ENEMY IS BEATEN and may not have him commit the
# men he has saved. The whole moment is that they are still standing there
# unspent, which is what `measured` means.
#
# THE SECOND MAY NOT PUT HIM BACK ON THE HORSE, may not have the horse die,
# and may not turn the dismount into a victory. He gets off because the ground
# made him, the side is still going backwards when the toast ends, and the
# horse is simply somewhere behind him being no use to anyone.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 45.
 bc_the_sea_holds_that_flank_toast:0 "One End Of It Is Not His Problem"
 bc_the_sea_holds_that_flank_toast_desc:0 "Whoever is commanding opposite him has spent the morning looking for the end of this line and there is not one, because it runs into salt water and stops. Every man sent to find a way round has come back or not come back, and the effect either way is that the fighting is happening exactly where he decided it would. He has companies standing behind the right that have not been asked for anything yet, and the longer that stays true the more the afternoon belongs to him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_leaves_the_horse_in_the_shallows_toast:0 "The Ground Made The Decision"
 bc_knight_he_leaves_the_horse_in_the_shallows_toast_desc:0 "The animal has been in up to the hocks for a quarter of an hour and has gone from a weapon to a thing that has to be kept alive, so he swings down into water that comes over the top of his boots and hands it off to nobody in particular. On foot he is a shorter, slower, better-armoured man than he was, and he is now fighting at the only place on this field where being pushed backwards has an actual limit.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the men who are here for money ------------------------------------------
#
# TWO MOMENTS IN A FREE COMPANY. The first is a captain losing men who are his
# stock rather than his subjects; the second is a rider in the same company on
# the one afternoon of the year the arrangement pays properly.
#
# NEITHER MAY NAME A COMPANY. No Golden Company, no Second Sons, no Windblown,
# no Stormcrows. The gate asked whether the government is a mercenary one and
# nothing else, and the mod does not invent an organisation for a man who has
# one already.
#
# NEITHER MAY TAKE THE HOST OFF THE FIELD. A phase event does not end a battle,
# so no withdrawal, no disengagement, no terms and nobody riding away.
#
# NEITHER MAY MENTION A SPECIFIC SUM. The mod has never put a number of gold in
# a toast and is not starting; the point is what men cost, not what they cost
# in coin.
#
# THE FIRST MAY NOT SAY THE COMPANY IS BEATEN and may not have it break. The
# entire moment is that it does not break. It may not make him regretful about
# the trade either - he is doing arithmetic, and it is arithmetic he does well.
#
# THE SECOND MAY NOT SACK ANYTHING, may not take a prisoner, may not find any
# named object, and may not let him leave the battle. He is riding down men who
# are already running, in the direction where their carts are.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 46.
 bc_they_are_not_his_smallfolk_toast:0 "Every Man Here Was Bought Once"
 bc_they_are_not_his_smallfolk_toast_desc:0 "The line is going backwards and it is going backwards the way it was taught to, a step at a time with the ranks still in the order somebody spent years putting them in, because the alternative has been explained to every man in it in terms he understood. A lord who spends a thousand men has spent a thousand of somebody's sons and will hear about it in eight months. He has spent a thousand of the only thing he owns, and he is watching the rate of it with the attention of a man watching a granary burn.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_where_the_wages_are_toast:0 "The Contract Never Mentioned This Part"
 bc_knight_where_the_wages_are_toast_desc:0 "The men in front of him stopped being an enemy some minutes ago and became a crowd going the same direction, and behind the crowd, at the pace of an ox, is everything the crowd owns. He is not the first rider to work this out and he will not be the last one down that road today. The horse under him has one such afternoon in it and is spending the whole of it now, which he knows, and which is not going to stop him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- what the man across the field is worth ----------------------------------
#
# TWO MOMENTS ABOUT A CROWN ON THE OTHER SIDE. The first is a commander whose
# army has just been given one thing to look for; the second is a knight
# meeting the men that crown pays for.
#
# NEITHER MAY NAME THE KING, HIS KINGDOM, HIS HOUSE OR HIS SIGIL. The gate
# asked one question - is the highest title the man opposite holds a kingdom or
# better - and knows nothing else about him. The bond clause printed underneath
# will say whether he is kin, a countryman, a heathen or a stranger, and that
# is the only other thing either desc is entitled to imply.
#
# NEITHER MAY NAME A GUARD OR AN ORDER. No Kingsguard, no Golden Company, no
# household with a name. The mod has one Kingsguard template already and it is
# gated on the council positions; inventing an order here would collide with a
# gate that actually checks.
#
# NEITHER MAY KILL, CAPTURE OR END ANYTHING. A phase event does not take a
# prisoner and does not finish a battle.
#
# THE FIRST MAY NOT PUT THE KING IN REACH and may not say he is running. His
# host is going; what he is personally doing is not visible from here and the
# desc may not guess.
#
# THE SECOND MAY NOT MAKE HIM COWARDLY AND MAY NOT MAKE HIM HEROIC. He is being
# outspent, which is a thing that happens to good men at a steady rate all
# afternoon, and the toast is about the rate.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 47.
# man here".
 bc_the_other_banner_is_a_kings_toast:0 "One Thing Worth Chasing"
 bc_the_other_banner_is_a_kings_toast_desc:0 "An ordinary host coming apart sends a thousand men after a thousand different things and the chase is worth nothing by dusk. This host is coming apart around a banner that everybody on this field, on both sides, has been keeping track of since the lines closed. He does not have to give an order about it. He has an army that all wants the same thing at the same moment, which is a condition he may not see twice.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_men_a_king_can_afford_toast:0 "They Do Nothing Else All Year"
 bc_knight_the_men_a_king_can_afford_toast_desc:0 "The third one he has faced in this stretch of line has plate where the last two had mail and has been drilled by somebody who was paid well to do it, and none of them have been hungry this season. He is not being outfought by a scheme or worn down by the ground. He is meeting men whose kit was bought by somebody who never had to ask what it cost, one after another, and the difference is coming off this side at a rate anyone standing here could measure.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- the man who is not entirely here ----------------------------------------
#
# TWO MOMENTS ABOUT A MIND THE MOD HAS NEVER READ. The first is an order that
# does not follow from anything; the second is a man in a line that is coming
# apart around him, who is not coming apart.
#
# NEITHER MAY NAME THE CONDITION. No madness, no lunacy, no possession, no
# devils, no gods talking, no voices, no fits, no fever. The gate matched one
# of four trait keys and none of the four tells the mod what it looks like from
# the outside. The descs work entirely from behaviour that the men around him
# can see.
#
# NEITHER MAY BE COMIC AND NEITHER MAY BE PITYING. Both men are competent
# enough to be where they are, and the other men on this field are afraid of
# the situation rather than of him.
#
# THE FIRST MAY NOT STATE THE ORDER, may not have anybody question or refuse
# it, and may not say afterwards whether it was right. Nobody in the toast
# knows that. It may not have him explain himself either.
#
# THE SECOND MAY NOT GIVE HIM A SPEECH, may not have anybody praise him, may
# not say what he is thinking, and may not make him invulnerable - he is not
# doing better than the men beside him, he is doing the same thing for longer.
#
# NEITHER MAY KILL ANYBODY.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 48.
 bc_the_order_nobody_can_explain_toast:0 "It Went Down The Line Anyway"
 bc_the_order_nobody_can_explain_toast_desc:0 "Something has been moved that was not in any plan discussed this morning, on a reading of the field that begins and ends inside one man, and the runners took it because runners take what they are given. The captains it reached have carried it out at the speed of people who intend to be able to say they carried it out. Wherever it turns out to have been going, the numbers have not improved since, and there is nobody in this host who could describe the reasoning if the day were lost on it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_has_changed_for_him_toast:0 "The One Account Not Running Out"
 bc_knight_nothing_has_changed_for_him_toast_desc:0 "A line does not run out of men before it runs out of each man's willingness to be the one still there when his neighbour is not, and along this stretch that has been going for some time. He is drawing on none of it. He is doing at this hour precisely what he was doing at the last one, no better and no faster, and the two men either side of him have arrived at the unspoken and unwelcome conclusion that where he is standing is the easiest place left to stand.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-THREE. What the ground underfoot is worth.
#
# NEITHER DESC MAY NAME A HOLDING, A VILLAGE, A TOWN, A ROAD OR A RIVER, and
# neither may give the county a name. The gate knows one number about this
# place and knows nothing else - not what stands on it, not whose it is, not
# whether either man has ever been here before this morning.
#
# NEITHER MAY MOVE ANYTHING ON THE MAP. Nothing burns, nothing is sacked,
# nothing is counted, nothing changes hands and nobody is turned out of
# anywhere. The mod does not touch the map, and a toast that implies it did is
# a lie about what the save now contains. Both descs may NOTICE what is around
# these men and neither may alter it.
#
# NEITHER MAY PUT A NUMBER ON ANYTHING. No hides, no acres, no hearths, no
# marks of silver. The one number in this axis lives in the gate and stays
# there.
#
# THE FIRST MAY NOT SAY THE PEOPLE HERE ARE WORTHLESS. He is reading a position
# and finding no use in it - no wall, no store, no junction - and that is a
# statement about ground and not about anybody living on it. It may not have
# him say any of this out loud, may not give him a speech to his captains, and
# may not win the battle: he is already winning, and all he does here is
# decline to stop.
#
# THE SECOND MAY NOT MAKE HIM SENTIMENTAL AND MAY NOT MAKE HIM A LOOTER. He is
# not grieving for a place he has never seen and he is not pricing it either.
# What he has is a working problem - this is not the fight he has been having
# all afternoon - and the noticing is what comes with solving it. It may not
# have him address anybody, may not have anybody thank or blame him, and may
# not kill anybody.
#
# NEITHER MAY USE THE WORDS "rich" OR "poor" OF THE COUNTY. Both toasts are
# written from what a man standing in it can see, and no man standing in a
# field has ever seen a development level.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 49.
 bc_the_thin_country_toast:0 "There Is Nothing Here To Stand On"
 bc_the_thin_country_toast_desc:0 "The scouts came back an hour ago with the shape of the country ahead and it is the same country as the country behind: a track, a ford somebody's grandfather cut, sheep on a slope, and no stone anywhere that was put on top of another stone by anybody who meant it to stay. A host that wins here has won the use of a track. He has the field and he is going to keep having it, and he has decided that keeping it is not the same as sitting on it, so the column is already forming to go on while the far side is still working out that it has lost.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_ground_here_was_worth_something_toast:0 "This Was A Place Before This Morning"
 bc_knight_the_ground_here_was_worth_something_toast_desc:0 "He has been giving ground since the second hour and the ground has been changing under him while he did it - out of the open, through a hedge that took some planting, into lanes with walls on both sides that are the wrong width for a horse and exactly the right width for the two men he can hear behind him. Everything he learned about fighting in a line stops applying at about the depth of a doorway. He is working it out at the speed the situation allows, which is roughly one corner at a time, and somewhere under that he is aware of how long all this took to build and how briefly the argument over it is going to last.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-FOUR. How the other man's afternoon is going.
#
# NEITHER DESC MAY EXPLAIN WHAT WENT WRONG OVER THERE. The gate knows that the
# man opposite is carrying a faltering rung and knows nothing whatever about
# how he came by it. Neither toast may invent a cause, a casualty, a collapsed
# flank or a piece of news, and neither may have anybody on this side of the
# field be told one.
#
# NEITHER MAY SHOW THE ENEMY COMMANDER. He is not on screen, not named, not
# described and not looked at. Everything either man knows about him is
# inferred from the behaviour of the troops between them, at the range at which
# that behaviour is visible.
#
# NEITHER MAY TURN THE BATTLE. The first is losing at the end of it and the
# second is winning at the end of it, exactly as at the start; the mod does not
# decide combats and a toast may not imply it did.
#
# THE FIRST MAY NOT MAKE HIM GLOAT AND MAY NOT MAKE HIM DESPAIR. What he has
# lost here is an explanation, not a hope. It may not have him say any of it
# aloud, may not have a captain deliver the observation to him as a report, and
# may not have him blame anybody by name.
#
# THE SECOND MAY NOT LET HIM UNDERSTAND IT. He has no idea there is a commander
# involved and the desc may not hint that he suspects one. It may not break the
# enemy line, may not kill anybody, may not have him shout an order to anyone
# who is not within arm's reach, and may not last longer than the few seconds
# such a gap actually lasts.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 50.
# corner at a time".
 bc_the_other_mans_trouble_toast:0 "The Explanation Has Stopped Working"
 bc_the_other_mans_trouble_toast_desc:0 "For most of the afternoon there has been a tidy account of why this is going the way it is going, and the account has a man in it, on a horse, on the far rise, doing everything correctly. Watching the far bank for a while has taken that away. The runners over there are going out and coming back to the same place twice; a wing has been asked for and then not used; the whole apparatus opposite has the particular slackness of an argument nobody is winning. Which means the day is not being lost to a better man. It is being lost to the field, and the field is his to have read.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_orders_have_stopped_arriving_toast:0 "They Are Still Doing The Old Thing"
 bc_knight_the_orders_have_stopped_arriving_toast_desc:0 "The rank in front of him is dressing itself against a flank that is no longer where it was, and has been for long enough that it is now a habit rather than a formation. Nobody has come to tell them. He does not know why nobody has come and it does not occur to him to wonder, because the space this opens is about four yards wide and lasts about as long as it takes to say so. He is into it with the two men who were watching his shoulders, and the shape they were holding goes with them, and behind that the rest of the line finds it has somewhere to go.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-FIVE. The men opposite were not trained on the same field.
#
# NEITHER DESC MAY NAME A PLACE, A PEOPLE, A CITY, A TONGUE OR A WEAPON. The
# gate knows one thing: the man opposite is outside the descent tree AGOT calls
# Westerosi. That covers a Braavosi captain, a Ghiscari phalanx, a khalasar, a
# Summer Islander and a dozen things in between, so any noun specific enough to
# be vivid would be wrong most of the times the toast fired. Both descs work
# entirely from shape, distance and timing, which are the things that are
# actually true of all of them.
#
# NEITHER MAY BE CONTEMPTUOUS. The men opposite are not savages, not cowards,
# not treacherous and not less than men; they are competent people doing a
# competent thing that neither of these two has been drilled against. Contempt
# would also be false to the mechanics - this is a side that is beating one of
# these men and losing to the other.
#
# NEITHER MAY EXPLAIN THE ENEMY'S METHOD TO THE READER. No toast may set out
# what the far side is doing as though somebody had worked it out. The whole
# subject is two men who have not worked it out.
#
# THE FIRST MAY NOT HAVE HIM RECOGNISE THE PROBLEM ALOUD, may not have a
# captain explain it to him, may not name what he ought to have done, and may
# not turn the battle. What he does is one thing and it is a retreat into
# training.
#
# THE SECOND MAY NOT LET HIM WIN THE EXCHANGE. He ends it even. It may not kill
# anybody, may not have him teach anybody else the trick, and may not let him
# say what he changed - he does not know, and that is the point.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 51.
 bc_the_wrong_war_entirely_toast:0 "He Is Fighting The Only Battle He Knows"
 bc_the_wrong_war_entirely_toast_desc:0 "Everything he was taught assumes the other man wants the same things: the flanks, the high ground, a decision before dark. The host in front of him has spent the afternoon declining to want any of them, and doing so in a way that has cost it very little and cost him a great deal. There is no time left to learn it and no one here to learn it from, so he does what a man of his training does with a field he cannot read - he brings the wings in, thickens what is left, and gives an order that amounts to standing still and being difficult. It is not an answer. It is the last thing he is sure of.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_reach_is_wrong_toast:0 "His Feet Have Sorted It Out"
 bc_knight_the_reach_is_wrong_toast_desc:0 "The first exchange went wrong for reasons he could not have named, and so did the second: the distance he has been keeping since he was nine years old turns out to be about a hand too short today, and the guard he expects to see is not where it is kept. By the fourth he is standing somewhere slightly different and it has stopped going wrong. He could not explain any of that and will not try. The man opposite is not worse than him and has not been beaten; the two of them have simply arrived at the same problem from opposite ends of the world, and one of them has caught up.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-SIX. The season, which is not the terrain.
#
# NEITHER DESC MAY PUT A LENGTH ON THE WINTER. Nobody in this setting knows one
# - not the maesters, not the man who has lived through two - and both moments
# depend on that being unavailable. No toast may say how long it has run, how
# long it has left, or that anybody has an opinion worth acting on.
#
# NEITHER MAY BE ABOUT BEING COLD. bc_winter_bites and
# bc_knight_stands_in_the_snow already own cold as a condition, in both
# directions. These two are about time: a season that outlasts the thing being
# fought over, and an afternoon with an edge on it. Snow may fall on either
# desc as scenery and may not be the subject of either.
#
# NEITHER MAY END OR TURN THE BATTLE. The first is winning at the end of it and
# the second is losing at the end of it. Dark does not arrive inside either
# toast; it is a thing being counted toward.
#
# THE FIRST MAY NOT TAKE THE WIN AWAY FROM HIM and may not make him regret
# fighting. The field is his and the toast says so. What has changed is his
# estimate of what having it is worth by spring. It may not have him address
# anybody, may not name a granary, a store or a number, and may not have him
# decide anything about the campaign - he is a man doing a sum, not writing an
# order.
#
# THE SECOND MAY NOT MAKE HIM BRAVE ABOUT IT. Nobody in that rank is being
# heroic; they have worked out that a line which holds until dark walks away
# and a line which breaks before dark does not. It may not have anybody order
# them to hold, may not kill anybody, and may not let him be certain how long
# is left - he is guessing at the light like everyone else.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 52.
 bc_the_winter_outlasts_the_war_toast:0 "The Season Does Not Care Who Won"
 bc_the_winter_outlasts_the_war_toast_desc:0 "The field is his. The far side has stopped being an army in the way that matters and the rest of the afternoon is going to be tidying. Standing in it, breathing something that hurts to breathe, what he finds himself doing is not counting the enemy dead but counting forward: what is in the ground here, what is not, how many mouths came with him, and how much of any of that survives the thing the world is currently doing. He has won a battle inside a problem the battle is not the size of, and it will still be going on long after everyone has agreed who holds this ford.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_light_is_going_toast:0 "There Is Not Much Afternoon Left"
 bc_knight_the_light_is_going_toast_desc:0 "Nobody along this stretch is talking about winning any more. What is being worked out, silently and by every man in the rank at about the same speed, is how far off the dark is and whether the shape they are standing in can last that long, because a line still in one piece when the light goes gets to walk away from this and a line that comes apart before then does not get to do anything at all. So it goes backwards at the pace of men who have all done the same sum and none of them have said it. It is not courage. It is a clock made out of daylight, and everybody here can read it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-SEVEN. This is not the only war he is in.
#
# NEITHER DESC MAY NAME THE OTHER WAR. Not its enemy, not its front, not where
# it is, not how it is going, not what it is about. The gate knows a count and
# the count is all either toast is entitled to. No messenger arrives from it,
# no report is read, and nobody mentions it by name.
#
# NEITHER MAY PUT A NUMBER ON WHAT IS COMMITTED ELSEWHERE. No hundreds, no
# thousands, no proportion of the levy. The first man knows the figure exactly
# and the toast may not print it; the second does not know it exists.
#
# THE FIRST MAY NOT NAME THE MOVE HE IS DECLINING TO MAKE, may not have anybody
# urge it on him, and may not have him explain himself to a captain. It may not
# turn the battle and may not make him a fool - he is right, and being right is
# the expensive part. It may not have him resent anybody.
#
# THE SECOND MAY NOT LET HIM WORK IT OUT. There is no second war in his world
# and the desc may not hint that he suspects one. It may not sneer at the men
# beside him, who are doing the job; it may not have him instruct, correct or
# rescue anybody by name; it may not kill anybody; and it may not make him the
# reason the side is winning. What he has done is stop measuring the men here
# against men who are not.
#
# NEITHER MAY USE THE WORD "reserve". It is the exact right word for the first
# toast, which is why it is the first thing a reader would notice being used
# twice.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 53.
 bc_the_other_front_toast:0 "He Will Not Spend What Would Win This"
 bc_the_other_front_toast_desc:0 "There is a way to have this afternoon back and he has been looking straight at it for some minutes now. It costs one thing, and that thing is already owed against a promise made in a different month to a problem that will still be a problem in spring, whatever happens on this ford. So the order does not go. The line stays as it is and gets worse at the rate a line gets worse when nothing arrives to help it, and the man who could have stopped that stands where he can see it happening and keeps his hands still. He is not being cautious. He is being correct, which today is more expensive.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_these_are_the_ones_who_stayed_toast:0 "He Has Stopped Waiting For The Old Company"
 bc_knight_these_are_the_ones_who_stayed_toast_desc:0 "The man on his shield side does not step where the last one stepped, and neither does the one behind, and for the first hour that cost him something every time. It has stopped costing him. Somewhere in the middle of the afternoon he quietly put down the version of this rank that lives in his head and started working with the one that is actually standing here, which is slower, greener, and holding. He has not said a word about it to anybody and would find it hard to. The far side is going backwards all the same.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-EIGHT. What is behind each of them if he does not get up.
#
# NEITHER DESC MAY MAKE THIS ABOUT BEING AFRAID. The mod already has fear, in
# bc_he_looks_for_the_road and everything gated on craven, and both of these
# men can be entirely steady and still be doing the arithmetic. If a reader
# comes away thinking either one flinched, the toast is wrong.
#
# THE FIRST MAY NOT NAME OR AGE THE CHILD. Not a name, not a number of years,
# not a boy or a girl, not a son or a daughter or a ward. It may not put the
# child on the page at all - no memory of him, no picture of him, no last time
# he was seen. It may not have anybody on this field mention him, because the
# men in front of this commander do not know and would not raise it. It may
# not name the inheritance either, and may not say what would happen to it.
#
# THE FIRST MAY NOT HAVE HIM RETREAT. He is further back than he was and the
# line is still his; the moment is a price being revised, not a field being
# left. It may not have a captain notice, may not have him explain, and may
# not make him ashamed of the sum. It may not turn the battle.
#
# THE SECOND MAY NOT NAME THE TITLE OR THE PLACE. No hall, no seat, no county,
# no house, no number of years until. It may not make him noble about standing
# there, may not have anybody defer to him or thank him or notice what he is
# worth, and may not kill anybody.
#
# THE SECOND MAY NOT HAVE HIM THINK ABOUT INHERITING. The whole moment is that
# the thought is available and he is not picking it up - the instant the desc
# lets him weigh it, the man becomes someone deciding rather than someone
# already standing. It may not have him compare himself to the men either side
# and may not have them know what he is.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 54.
# this rank".
 bc_the_heir_is_a_child_toast:0 "He Is Not His Own To Spend"
 bc_the_heir_is_a_child_toast_desc:0 "Somewhere in the last half hour he did a small sum about what his body is currently worth to people who are nowhere near this ford, and the answer changed how he is standing. Not much. A horse length, a slower ride down the line, a place chosen where the arrows are thinner. He would tell you plainly that he is not frightened and he would be telling the truth. The thing he is carrying is simply not his to lay down out here on an afternoon that is already going badly, and knowing the sum is right turns out to be a wholly separate matter from being able to stand in the middle of it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_hall_is_waiting_for_him_toast:0 "He Need Not Be Here At All"
 bc_knight_a_hall_is_waiting_for_him_toast_desc:0 "Of the men along this stretch he is the only one whose falling would move anything beyond a widow and a shallow trench, and the ones to either side of him are worth exactly what this afternoon is worth and not a copper more. He is standing where they are standing. He has been all day. Nobody put him here and nobody would have questioned it if he had spent the battle somewhere with a better view, and the rank holds the way it is holding partly because of that - men will keep their feet a long time next to someone who could be elsewhere and is not.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH SEVENTY-NINE. The body he was dealt, and what was decided about it.
#
# NEITHER DESC MAY NAME WHAT HE WAS BORN WITH. The gate is the engine's count
# of bad genetic traits and it is indiscriminate on purpose - it covers a
# clubfoot, a stutter, a hunched back and a dull wit with the same number - so
# every sentence in both toasts has to be true of all of them. No limp, no
# stammer, no shortness, no crooked anything. Neither desc may describe his
# body at all, and neither may name a thing he cannot do.
#
# NEITHER MAY HAVE ANYBODY SAY IT. No jeer, no whisper, no captain hesitating,
# no man in the rank glancing. The verdict in both moments is old and settled
# and does not need saying today, and a desc that stages somebody saying it
# turns a lifetime into an incident.
#
# THE FIRST MAY NOT HAVE HIM PROTEST IT, and may not have him prove anybody
# wrong. He is losing; the line holds and that is all. It may not turn the
# battle, may not have him make a speech, may not have him think about his
# father or his childhood, and may not name whatever will be said about him
# afterwards - it may only let him know that it is already written. It may not
# let him be bitter about it either, because bitterness is a thing you feel the
# first few hundred times.
#
# THE SECOND IS AN ABSENCE AND THE ABSENCE IS THE WHOLE MOMENT. Nobody is
# looking at him. It may not have anybody praise him, thank him, be surprised
# by him, or defer to him; it may not have him notice that nobody is looking,
# because noticing is looking; it may not have him fight in some clever
# compensating way; and it may not kill anybody. He is doing the work and the
# work costs and that is the entire content.
#
# NEITHER MAY USE THE WORD "despite". It is the word both moments are built to
# avoid, and it would undo either of them in a single sentence.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 55.
 bc_the_story_is_already_written_toast:0 "The Account Of This Was Settled Long Ago"
 bc_the_story_is_already_written_toast_desc:0 "He knows what will be said about today, and he knows it will not be said about the ford or the numbers or the hour the rain started. That account was closed before he was old enough to argue with it and nothing he does out here will reopen it. So he does not try. He gives the one order the afternoon still allows - stand, and go backwards slowly, and be a shape at dusk instead of a rout at four - and he gives it in the flat voice of a man who has long since stopped spending anything on being understood. The line does what he tells it. That is not nothing, and it is also not going to change a word.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_has_looked_at_him_since_dawn_toast:0 "There Is No Audience Out Here"
 bc_knight_nobody_has_looked_at_him_since_dawn_toast_desc:0 "The men to either side of him have not had a spare thought to spend on anything but the ground in front of their own feet since the light came up, and they are not going to find one before dark. There is only the next shield and the next step and the arm that has to keep coming up, and the arm is getting slower and comes up anyway. He is bleeding somewhere that will need attention tonight. The far side has been going backwards since noon. Nothing he has done today has been for anyone's benefit but the man beside him, and the man beside him has been too busy to work out whose help he is taking.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY. What his own faith makes of him.
#
# NEITHER DESC MAY NAME A FAITH, A GOD, A SEPT OR A GODSWOOD. The gate is the
# engine's count against whatever the man happens to believe, so both toasts
# have to be true for the Seven, the old gods, the Drowned God and R'hllor at
# once. No prayer, no septon, no red priest, no heart tree, no oath sworn on
# anything nameable. Neither desc may put a holy man on the page at all.
#
# NEITHER MAY NAME THE TRAITS THE COUNT IS COUNTING. The first may not say
# which sins; the second may not say which virtues. The number is two or more
# and the toast is not entitled to know which two.
#
# THE FIRST MAY NOT BE DEFIANT. He is not spitting at anything, not laughing at
# anybody's judgement, and not enjoying being what he is - that is a smaller
# and more familiar man than the one this gate found. It may not have him win
# *because* of what he is, may not have an enemy call him anything, may not
# have his own men be uneasy about him, and may not promise him a reckoning
# later. What he has is a working understanding of what a field does and does
# not care about, and he has had it a long time.
#
# THE SECOND MAY NOT RESCUE ANYTHING. He is losing when it starts and losing
# when it ends. It may not have him hold a gap that saves the line, may not
# have anybody thank him or notice him, may not kill anybody, may not let him
# doubt what he is - doubt is a different and much easier moment - and may not
# have him decide anything. He is doing it the way he has always done it, in
# the order he has always done it, and the order is not producing the result
# the order is supposed to produce.
#
# NEITHER MAY USE THE WORD "deserve", in any form. Both moments are built on
# the field not having the concept, and one appearance of it in either toast
# would put the concept back.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 56.
 bc_the_field_keeps_no_accounts_toast:0 "The Ground Has No Opinion Of Him"
 bc_the_field_keeps_no_accounts_toast_desc:0 "A field wants four things answered and none of them are about the man answering. Where the ground rises. How many are on it. How far the far side has to come and how long that takes them. What hour it is. He worked that out somewhere a long way back, and he has been quietly better at afternoons like this one ever since than men who go into them expecting the world to be keeping a tally somewhere on their behalf. There is no tally. There is a slope, and a stream that is deeper than it looks, and a wing that came too late, and by the middle of the day all three of them are his.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_it_was_never_a_bargain_toast:0 "He Is Doing It The Way He Has Always Done It"
 bc_knight_it_was_never_a_bargain_toast_desc:0 "Shield up, feet where they belong, the man on his left covered before himself, no step taken that the rank behind him cannot take too. He has done it in that order since he was young enough to be corrected for getting it wrong, and he is doing it in that order now, and the ground he is standing on is further back than the ground he started on and will be further back again within the hour. Nothing about the way he is fighting suggests he expects that to change. He was never told it would work. He was only ever told to do it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-ONE. What he was raised to be.
#
# NEITHER DESC MAY NAME THE EDUCATION. The first may not name a book, a
# maester, a chain, a library, a tutor or a lesson, and may not have him quote
# or recall anything he ever read. The second may not name a poison, a knife in
# the dark, a spy, a room, a debt or a piece of previous work. Both gates read
# an education trait and both toasts have to be about the man the education
# produced, not the education.
#
# NEITHER MAY MAKE THE OTHER MEN CONTEMPTUOUS. No captain rolling his eyes, no
# sergeant humouring anybody, no knight who knows better. Both moments are
# private and neither is being watched.
#
# THE FIRST MAY NOT BLAME HIM AND MAY NOT LET HIM BLAME HIMSELF. He is doing
# the only thing anybody ever taught him to do with a hard problem, and doing
# it properly; the problem is simply faster than the method. It may not have a
# captain overrule him, rescue the situation, or suggest anything. It may not
# have him panic, freeze or despair - all three are easier moments and none of
# them is this one. It may not name what he should have done instead, because
# the toast does not know either.
#
# THE SECOND IS A HABIT BEING SET DOWN, NOT A HABIT BEING RESISTED. It may not
# have him consider a treachery today and decline it, may not have anybody
# suspect or watch him, may not have him enjoy the plainness, may not make him
# newly honest, and may not kill anybody. He looked for the angle for an hour
# because that is what he does, found that there was not one, and got on with
# the work. That is the whole event.
#
# NEITHER MAY USE THE WORD "should". Both moments are about method and neither
# is about regret, and "should" is regret's first word.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 57.
# order he was taught".
 bc_the_wrong_instrument_beautifully_toast:0 "He Is Solving It Correctly And Too Slowly"
 bc_the_wrong_instrument_beautifully_toast_desc:0 "He takes the afternoon apart the way he takes everything apart: the near wing first, then the ford, then the slope, each one settled before he lets himself move to the next, nothing assumed that has not been checked. It is good work. It is the only kind of work anybody ever showed him how to do. And it runs at the speed of a careful man, while the thing in front of him runs at the speed of eight thousand frightened people, and the gap between those two speeds is being paid out steadily along the line in ones and twos by men who will never know what it was spent on.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_no_seam_in_a_shieldwall_toast:0 "There Was Nothing To Find"
 bc_knight_there_is_no_seam_in_a_shieldwall_toast_desc:0 "For the first hour he was doing what he has always done, which is look: for the loose fastening, the tired one, the one whose falling rearranges everything behind him. He is good at that. There was nothing to find. A line is only a line, and it does not have a weak place so much as it has a near end and a far end, and the work is the same at both. So he put it down somewhere around noon and has been fighting like the man beside him ever since, one step and then the next one, and the far side has been giving ground since he did.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-TWO. How many banners are standing on this side.
#
# NEITHER DESC MAY NAME A HOUSE, A SIGIL, A LORD OR A PLACE. The gate is a
# count and the count is all either toast is entitled to. No colours, no
# devices, no "the men of somewhere". Both descs have to read the same for a
# Northern host, a Reach host and a company of sellswords.
#
# NEITHER MAY PUT A NUMBER ON THE BANNERS. The first knows it is three or more
# and may not say four, five or any other figure; the second knows it is one
# and may not announce that either, because a man does not think in counts
# about a thing he can see the whole of.
#
# THE FIRST MAY NOT STAGE A COUNCIL. No tent, no argument the night before, no
# lord being talked round, no plan being agreed - all of that happened
# somewhere the toast does not go. It may not have anybody thank or
# congratulate anybody, may not have him take the credit, may not name what any
# banner was supposed to do, and may not have one of them do it late and be
# forgiven. The moment is that the arrangement held, which is rare, and that
# nobody on the field has time to notice how rare it is.
#
# THE SECOND MAY NOT HAVE ANYBODY LOOK FOR HELP. No horizon watched, no rider
# sent, no rider failing to arrive - a rider who does not come is still a
# rider, and the whole content of the moment is that there is nobody to send
# one to. It may not name what is not coming. It may not have him despair, may
# not have him resolve anything, may not kill anybody, and may not let the line
# be saved. What happens is smaller than any of that: the shape gets tighter.
#
# NEITHER MAY USE THE WORD "alone". It is the word the second toast is about
# and using it would let the toast say the thing instead of showing it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 58.
 bc_every_banner_did_its_part_toast:0 "It Held, Which It Almost Never Does"
 bc_every_banner_did_its_part_toast_desc:0 "The wing that was supposed to come round came round, at something close to the hour it was meant to, and did not stop halfway to see what the rest of the field was doing first. The centre stayed where it was told without needing to be told twice. Nobody sat still waiting to see who was going to lose before committing. He has spent his life watching arrangements like this one come apart before noon over precedence, or grazing, or a grandfather, and this one simply did not, and there is no time today to stand still and be amazed by it. The far side is running and there is an intact line to run after them with.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_no_second_host_toast:0 "Everything There Is Is Already Here"
 bc_knight_there_is_no_second_host_toast_desc:0 "He does not look at the ridge line, because there is no reason to. Whatever is going to stand on this ground today is standing on it, and has been since the light came up, and the men to his left are the only men who are ever going to be to his left. That is not a thought he has to have twice. It removes things rather than adding them, and what is left when it has finished removing is very simple and very small: shoulder into the man beside him, shield an inch higher, feet closer together, and let the next hour be as expensive as it wants to be.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-THREE. The sword itself.
#
# NEITHER DESC MAY NAME THE SWORD OR THE HOUSE THAT OWNS IT. The gate is a
# variable on an item and both toasts have to be true of every one of them, so
# no name, no lineage, no "since the Conquest". Neither may say the words
# Valyrian or Valyria either: the toast is written from inside the afternoon
# and nobody in it is delivering a history lesson.
#
# NEITHER MAY DESCRIBE THE BLADE. No ripples, no dark smoke in the metal, no
# colour, no edge that never dulls, no weight that is wrong for its size. Every
# desc in this mod refuses to describe things that a man in the middle of a
# battle would not be looking at, and a sword he has carried for years is the
# clearest case of that rule there is.
#
# THE FIRST MAY NOT HAVE ANYBODY IDENTIFY IT ALOUD. No captain naming it, no
# shout down the line, no man who has seen it before. What he has is a place on
# the field where his arrangements keep failing and a good idea of why. It may
# not have him send men to take it, may not have him despair, may not kill him,
# and may not let him solve it - the arithmetic not closing is the moment.
#
# THE SECOND MAY NOT HAVE ANYBODY RECOGNISE IT and may not have him think about
# who held it before him - an inheritance is a different moment and this one is
# a working afternoon. It may not name a man he kills, may not count what he
# has killed, may not have anybody cheer, and may not make him magnificent. It
# is going well and it is costing the horses, and both halves of that have to
# be in the toast.
#
# NEITHER MAY USE THE WORD "steel". It is the word both of these would reach
# for first and it would drag the description of the blade in behind it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 59.
# already here".
 bc_the_bright_thing_on_the_far_side_toast:0 "His Arrangements Keep Failing In One Place"
 bc_the_bright_thing_on_the_far_side_toast_desc:0 "There is a stretch of the far side about forty yards wide where nothing he sets down stays set. He moves men into it and the shape of them is gone within a quarter hour; he thickens it and the thickening disappears; he leaves it thin on purpose to see what happens and what happens is worse. He knows perfectly well what is standing in that forty yards and he has known since mid-morning, and knowing has not helped once, because a commander cannot order a field to contain one fewer man. So the afternoon gets built around a gap that will not close, and the sum at the end of it comes out the way sums do when one of the numbers is wrong and cannot be changed.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_wedge_behind_one_man_toast:0 "The Line Stopped Being A Line An Hour Ago"
 bc_knight_the_wedge_behind_one_man_toast_desc:0 "Whatever was meant to happen here, what is happening is that he goes forward and a rough triangle of shouting men goes forward behind him because there is nowhere else for them to be. Nobody ordered it. It is simply where the ground opened. He has been going at the pace of a thing that does not have to stop and the animals underneath all of it have been going at that pace too, and they were not built for four hours of it. Somebody will count the lamed ones tonight and the number will be ugly, and it will still have been the hour that broke the far side.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-FOUR. What has already been taken off him.
#
# NEITHER DESC MAY SAY HOW IT HAPPENED. No battle named, no man named, no year,
# no siege, no accident, no tourney. Both gates read a trait that the engine
# hands out for a dozen different reasons and the toast has to be true under
# every one of them.
#
# NEITHER MAY HAVE HIM REMEMBER IT. A man who has had a thing for years does
# not spend the fourth hour of a battle thinking about the afternoon he got it,
# and a flashback would turn a working moment into a wound.
#
# THE FIRST MAY NOT PUT A PATCH OR A SCAR ON THE PAGE, may not have anybody
# notice him or accommodate him or ride up on the correct side, and may not let
# the moment be about courage. What it is about is arithmetic: a fraction of a
# second per look, spent several hundred times an afternoon, on a day where he
# does not have the fractions to spend. It may not have him fail to see the
# thing that loses him the battle, because that makes the eye the villain and
# the eye is nine years old and has been fine.
#
# THE SECOND MAY NOT DESCRIBE HIS FACE. No scar, no burn, no missing anything,
# no side that is worse than the other, no mask, nothing. It may not say what
# did it, may not have anybody flinch or fail to flinch on the page, and may
# not kill anybody. The moment is that a rank in the fourth hour is the one
# gathering of people in the world with nothing spare to spend on looking at
# him, and that this is a rest rather than an ache.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 60.
# are the four this pair would reach for and every one of them is a verdict the
# mod has no business issuing.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 61.
 bc_the_fractions_are_adding_up_toast:0 "He Turns His Whole Head To Look"
 bc_the_fractions_are_adding_up_toast_desc:0 "Everything about the way he reads a field was rebuilt some years ago and the rebuild works. He has fought since, and won since, and does not think about it from one month to the next. What it costs is a fraction of a second each time the world on one side of him has to be checked, and today the checking is constant and the fractions are coming due faster than he has them to pay. He is not behind because of it. He is behind, and it is one of the things that is making catching up expensive, and there is no order he can give that buys any of it back.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_shoulder_to_line_up_on_toast:0 "A Shoulder To Line Up On"
 bc_knight_a_shoulder_to_line_up_on_toast_desc:0 "He has spent most of his life being the reason a conversation goes quiet, and a rank in the fourth hour of a battle has nothing spare in it for that. The men to either side have looked straight at him several hundred times since the light came up and taken exactly one thing from it, which is where he is standing, which is all they need. So he stands there. The shape holds along this stretch of the line, and it holds partly because the fixed point in it does not move, and for a few hours he is a place rather than a thing to look at.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-FIVE. Whose name this is.
#
# NEITHER DESC MAY NAME A HOUSE, quote a word, describe a sigil, or name a
# seat. Both gates read a link and both toasts have to be true of a Frey, a
# Reed and a hedge knight's grandson equally.
#
# THE FIRST MAY NOT HAVE HIM PLEASED WITH HIMSELF. It is not a man enjoying
# his own name; it is a man noticing, on an afternoon that is going well, that
# the afternoon is going to be filed under one word and that he is currently
# what the word means. It may not have him think about an ancestor, may not
# have anybody address him by the name on the page, may not mention a maester
# or a book or a singer, and may not promise him anything after the battle.
#
# THE SECOND MAY NOT PUT THE TWO MEN IN THE SAME SENTENCE LOOKING AT EACH
# OTHER. No glance down the line, no order given on the page, no recognition.
# It may not make him resentful and may not make him devoted - both are the
# easy version - and may not have him think about inheriting anything or about
# what he would do differently. He is going backwards in good order at the
# pace the rank is going, and that is the entire moment.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 62.
# this pair would reach for and all three would write the moment for it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 63.
 bc_the_word_they_will_write_it_under_toast:0 "It Will Be Filed Under One Word"
 bc_the_word_they_will_write_it_under_toast_desc:0 "Whatever this afternoon turns out to have been, it will be written down in six different rooms by men who were not here, and every one of them will use a single word for it, and at present he is what that word means. Not the men holding the centre, who will not be named. Not the wing that came round on time. One word, doing the work of nine thousand people, and it happens to be attached to him this year. He has no time to decide whether that is fair and it would not help if he did. What it does is settle a question he did not know was open: there is nothing to be careful of here except the outcome, because the outcome is the only part that survives.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_man_who_is_the_name_toast:0 "He Goes Back At The Pace The Rank Goes"
 bc_knight_the_man_who_is_the_name_toast_desc:0 "The ground behind him is where the line will be in an hour, and it is being given up a step at a time and not a step faster, which is the hardest thing this rank knows how to do and the thing it has practised most. He does it the way he does everything, which is well and without being asked twice. Somewhere behind the standards the arrangements for the rest of the day are being made by a voice he has known since he was eight, and he has never once been in the room where that happens. The step comes. He takes it. The shape holds.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-SIX. What his own world has already convicted him of.
#
# NEITHER DESC MAY NAME A CRIME OR A VICTIM. Both gates catch a wide field of
# men - one a running total, one a trait the engine hands out for several
# different killings - and both toasts have to be true of every one of them.
#
# THE FIRST MAY NOT HAVE ANYBODY OBEY HIM OUT OF FEAR ON THE PAGE. No shrinking
# captain, no man who does not meet his eye, no order given twice. It may not
# have him justify anything, may not have him be sorry, and may not tell the
# reader which of the two reasons is the better one. It knows perfectly well
# which reason is holding this line and it will not say the word.
#
# THE SECOND MAY NOT SAY WHO DIED OR WHAT THEY WERE TO HIM - no brother, no
# father, no son, no name, no room, no year. It may not have him remember it,
# may not have anybody on the field know about it, may not make him monstrous
# and may not make him tragic, and may not let anything forgive him, including
# the battle. What it may have is a man working at exactly the rate the work
# arrives, on an afternoon that is going well, because the worst number in his
# life was settled some years ago and nothing here is bigger than it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 64.
# the pair the first desc is built to walk around without naming, and the other
# two would turn the second into a sermon.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 65.
 bc_the_other_reason_men_stand_toast:0 "The Line Holds For The Reason He Built It To"
 bc_the_other_reason_men_stand_toast_desc:0 "There are two things that keep men standing in a rank that is going backwards, and he chose between them a long time ago, in a series of rooms, on days he could mostly justify at the time. The choice is working. The line is bending and it is not breaking, and the men in it are staying where they are put for exactly the reason he arranged for them to stay where they are put. Nobody will write that down. He would rather it were the other thing holding them and there is no version of this afternoon, or of the eleven years behind it, in which it could have been.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_sums_were_finished_years_ago_toast:0 "Nothing Here Is Bigger Than It"
 bc_knight_the_sums_were_finished_years_ago_toast_desc:0 "Every other man along this stretch is doing arithmetic about tonight, in the back of his head, whether he knows it or not - what he might lose, what it would cost, what would be left. That arithmetic finished for him some years ago and the answer has not moved since and never will. So there is nothing in front of him this afternoon that is a larger number than the one already behind him, which is not courage and is not despair and does not feel like either. It feels like work arriving at a rate, and being met at that rate, hour after hour, while the far side gives ground.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-SEVEN. The crown that is not on him yet.
#
# NEITHER DESC MAY NAME A CROWN, A SEPT, A SEPTON OR A THRONE. The whole point
# of both moments is that the ceremony has not happened and may never happen,
# and putting the furniture of it on the page would hand the reader the ending.
#
# NEITHER MAY NAME A RIVAL CLAIMANT or reference another king by any
# description. The gate reads one man's own state and says nothing at all about
# who else is calling himself what.
#
# THE FIRST MAY NOT HAVE HIM DOUBT HIS RIGHT. He is not wondering whether he
# ought to be king; he is watching the only mechanism that could ever make him
# one run backwards for an afternoon. It may not have him imagine the ceremony,
# may not have anybody address him as king or pointedly fail to, may not have
# him think about a father or a line, and may not let him decide anything.
#
# THE SECOND MAY NOT HAVE HIM SEE THE COMMANDER or be seen by him - no glance,
# no standard picked out of the field, no voice. It may not have anybody cheer
# or swear anything, may not have him imagine a reward or a holding or a
# knighting, and may not make him a believer. What he has worked out is
# mechanical rather than devotional and the toast has to stay on that side of
# the line.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 66.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 67.
 bc_the_argument_that_he_has_one_toast:0 "He Is Being Beaten Out Of An Argument"
 bc_the_argument_that_he_has_one_toast_desc:0 "What he is standing on this afternoon is a sentence. Men say it, and other men repeat it, and the only thing that has ever turned a sentence like that into a fact in this country is a long enough run of days that went the right way. Today is not one of those days. He is not losing ground he holds, which he could bear and has borne; he is losing the argument that there is any ground he holds, and every quarter hour that the far side keeps pushing is a piece of it going. He can feel exactly how thin the thing under his feet is, and he has known how thin it was since long before this morning, and knowing has never once made it thicker.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_what_a_run_of_afternoons_gets_called_toast:0 "He Is One Of Several Thousand Men Making It"
 bc_knight_what_a_run_of_afternoons_gets_called_toast_desc:0 "He came for the ordinary reasons, which is to say his lord came and there was no version of the summer in which he stayed home. Somewhere in the last few hours the thing they are all doing quietly stopped being an opinion that people hold and started being a thing that is true. Nobody announced it. It is simply visible in which direction the ground is moving. What he understands now, without ever putting it into words, is that a thing like this is not handed to anybody in a room - it is what a long enough run of days like this one gets called afterwards, and he is inside one, and his part of it is about eight feet wide. So he works it faster.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-EIGHT. The marriage.
#
# NEITHER DESC MAY NAME A WOMAN or describe her in any way - no age, no hair,
# no room, no window, no waiting. Both gates read a link to somebody who is not
# on this field, and the moment is what the link does to a man who is, which
# means she may be the reason for the whole toast and may not appear in it.
#
# THE FIRST MAY NOT SAY WHAT THE MAN OPPOSITE IS TO HER. No brother, no father,
# no uncle, no by-marriage anything. It may not mention a wedding, a contract,
# an alliance or a betrothal, may not have him regret the match, may not have
# him think about what she will be told or who will tell her, and may not let
# him hate the man opposite or forgive him. What it is allowed is the shape of
# a careful retreat and one sentence about why it is careful.
#
# THE SECOND MAY NOT GUESS THE SEX OF THE CHILD, may not have him picture it,
# may not have him choose a name or think of one, may not have him promise
# anything to anybody, and may not have him afraid. Fear is the obvious version
# and it is wrong: what the gate produces is not a frightened man, it is a man
# whose shield is in the correct place for four hours instead of the
# comfortable place, which is a much duller and much better thing.
#
# THE SECOND ALSO MAY NOT ASSUME HE IS A MAN WAITING ON NEWS. The gate catches
# a pregnant knight as well, deliberately, and every sentence in the toast has
# to be true from inside either body.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 68.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 69.
 bc_a_room_somewhere_in_tonight_toast:0 "Nothing Gets Committed That Cannot Be Recalled"
 bc_a_room_somewhere_in_tonight_toast_desc:0 "He is losing, and he is losing slowly and tidily, and the tidiness is not a tactic. There is a version of this afternoon in which the ground behind him fills up with people he is bound to, and a version in which it fills up with people the man opposite is bound to, and the second one is arriving whether he likes it or not. What is still his to decide is how much of the first one arrives alongside it. So the line comes back a step at a time and holds each step for longer than it strictly needs to, and nothing is thrown at anything on the chance that it works, because whatever else tonight turns out to be, there is a room in it he is going to have to sit down in.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_half_step_more_careful_toast:0 "The Shield Is Where It Ought To Be, Not Where It Is Comfortable"
 bc_knight_a_half_step_more_careful_toast_desc:0 "Something changed a few weeks ago that has nothing to do with this field, and the result of it on this field is very small and completely constant: every single thing done since dawn has been done a half step more carefully than it would have been last summer. No stepping out after a man who is probably beatable. No taking the opening that is probably an opening. Four hours of holding a heavy thing exactly where it is supposed to be rather than where the arm wants it, which nobody has noticed and nobody will thank him for, and which has quietly kept two other people upright all afternoon. The far side is going backwards. He is not going after them any faster than the line is.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH EIGHTY-NINE. The paper that put them here.
#
# NEITHER DESC MAY NAME A LORD, A REALM, A HOUSE OR A DOCUMENT. Both gates read
# an arrangement between two men and both toasts have to be true of every
# arrangement the engine can produce, including several the reader will never
# have heard of.
#
# THE FIRST MAY NOT BLAME THE ALLY. He may not be slow, may not be unwilling,
# may not have failed at anything, may not argue about precedence, may not send
# a messenger, and may not be described at all beyond being there. The toast is
# about a geometrical fact - two hosts have a join in them and a join is a
# place - and the moment it becomes about somebody's character it is a
# different and much cheaper moment. The alliance may not break on the page.
#
# THE SECOND MAY NOT HAVE HIM RESENT IT AND MAY NOT HAVE HIM APPROVE OF IT.
# Both are opinions and he is not having one; he is seeing a shape for the
# first time, the way a man sees a road he has walked for years from the top of
# a hill. It may not mention a wedding, a hostage or a sum of money, may not
# have him think about going home, and may not have him decide anything about
# any of it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 70.
# Every one of them would put the document on the page, and the document is the
# thing both toasts are walking around.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 71.
 bc_the_join_is_a_place_toast:0 "Two Hosts Have A Join In Them"
 bc_the_join_is_a_place_toast_desc:0 "Nobody over there is doing anything wrong. They came when they said they would, they are where they were asked to be, and they have not given a foot more than his own men have. It does not matter. Two hosts standing beside each other are two hosts with a seam down the middle of them, and a seam is a location, and some time before noon the far side found it the way water finds a crack. It is not a question of willingness and never has been. It is that orders on one side of forty yards come out of a different mouth, arrive a beat later, and mean very slightly different things, and that is where the afternoon is being spent.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_chain_that_put_him_here_toast:0 "He Has Followed It All The Way Back"
 bc_knight_the_chain_that_put_him_here_toast_desc:0 "There is a lot of standing about in a battle and he has spent this afternoon's share of it working backwards. This hedge because of the ford, the ford because of the muster, the muster because his lord was asked, and his lord was asked because of something agreed in a hall neither of them has ever stood in, years ago, between two men, one of whom is dead. It runs all the way back and every link holds. He has never seen the whole of it before and it turns out to be short, and dry, and to have nothing in it about him at all. It is also winning, which is the only part of the chain that is any of his concern before dark.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY. Owned and held are two different questions.
#
# NEITHER DESC MAY NAME THE COUNTY, a village, a river, a keep or a road. Both
# gates read title links and both toasts have to be true of a marsh in the
# Neck, a stone valley in the Vale and a beach in Dorne without alteration.
#
# THE FIRST MAY NOT HAVE HIM REGRET TAKING THE PLACE and may not have him blame
# a scout, a guide or a captain. It may not mention a siege, a garrison, a
# burning or a levy, may not have a local man refuse him anything on the page,
# and may not let him solve it - the point of the moment is that the missing
# information cannot be acquired between now and dusk. It may not say how long
# he has held the county except in the vaguest possible terms, because the
# engine will not tell it and it may not invent a number it does not have.
#
# THE SECOND MAY NOT HAVE HIM HATE THE PEOPLE WHO LIVE HERE and may not put a
# single one of them on the page - no farmer, no burnt roof, no child watching
# from a treeline. The country is doing the work in that toast and the country
# is empty in it. It may not have him decide to die, may not make him noble
# about staying, and may not have anybody give a speech.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 72.
# ground". All four are the reader's words rather than his, and all four turn
# a working observation into a position.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 73.
# back".
 bc_eleven_days_of_hearsay_toast:0 "Somebody Here Has Known About The Ford Since He Was Nine"
 bc_eleven_days_of_hearsay_toast_desc:0 "Everything he knows about this ground he has been told, recently, mostly by people who would be happier if he drowned in the river he was asking about. It has been enough for two weeks of marching and it stops being enough at about the third hour, when the shape of the afternoon starts depending on things nobody thought to mention: which of two identical-looking slopes turns to grease after rain, where the dry crossing is, why the drove road bends. The man on the other side was not told any of it either. He simply grew up with it. There is no order that fixes that and no scout to blame for it, and it is being charged for now, in the ordinary way, a few yards at a time.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_man_who_runs_here_runs_into_it_toast:0 "There Is Nowhere To Go That Is Not Also Theirs"
 bc_knight_a_man_who_runs_here_runs_into_it_toast_desc:0 "It is going badly and there is a thing every man along this stretch has worked out separately and none of them have said: in a country like this one, running is not a direction. Every treeline, every ford, every sunken lane for a day in any direction is known to the men trying to kill him and unknown to him, which means the ground behind the line is not an escape, it is simply more of the same problem with fewer people in it. So the shield stays up and the feet stay planted and the whole miserable business gets done standing, because standing is the only version of this afternoon that has ever worked for anybody in his position, and everyone here can feel that without being told.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-ONE. What was chosen for him, and what he chose.
#
# NEITHER DESC MAY NAME A LIFESTYLE, A FOCUS, A PERK OR A TREE. Both gates read
# an education trait against a lifestyle, and both toasts have to read as a
# fact about a man rather than as a readout of two fields on his sheet.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 74.
# and all five turn a plain observation into a verdict.
#
# NEITHER MAY PUT A TUTOR, A MASTER-AT-ARMS OR A SEPTON ON THE PAGE, and
# neither may have him remember a particular day of his childhood. The
# education trait is a fact about what was decided, not a scene, and the mod
# does not have the scene.
#
# THE FIRST MAY NOT NAME THE THING HE DOES INSTEAD - no ledgers, no books, no
# hawks, no council chamber, no bedchamber. The whole point is that the habits
# arrive without their origin attached. It may not have anybody praise him or
# remark on it, may not let him be pleased with himself, may not have him
# compare himself to another commander, and may not have him conclude anything
# about his life.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 75.
# not "twenty years", not "late". It may not name the trade he came from, may
# not have him regret the choice, may not have another man sneer at him or
# notice him at all, may not have him think about who taught him, may not have
# him be afraid, and may not kill him or take a limb. The cost is arriving in
# quarter-beats, not in wounds.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 76.
 bc_the_habits_he_actually_kept_toast:0 "He Is Doing This The Way He Does Everything Else"
 bc_the_habits_he_actually_kept_toast_desc:0 "It is going well and the reasons it is going well are not soldier's reasons. He has held something back that nobody asked him to hold back. He has done the four things in the order that means none of them has to be done twice. He knows, without checking, what he has left, because knowing what is left is a habit he acquired somewhere that had nothing to do with any of this. All of that was in him before the horns went, and none of it was put there by the men who decided, once, what he was going to be. It works. It has been working since mid-morning, and the only strange part of it is how little of what he was taught he has needed today.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_did_not_start_at_seven_toast:0 "He Chose This, And It Is Charging Him For The Difference"
 bc_knight_he_did_not_start_at_seven_toast_desc:0 "Nobody handed him this. He went and got it, on his own time, off men who had no particular reason to teach him, and he got far enough with it to be standing where he is standing. That was never the doubtful part. The doubtful part is the one that only ever shows up on an afternoon like this one, when it has gone long and gone wrong and there is no thinking left in him to spend: the block is right and comes a hair late, the shield goes back to somewhere reasonable instead of to the one place, and the difference between doing a thing correctly and never having done it any other way turns out to be worth exactly that much. He is still on his feet. He is simply on them expensively.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-TWO. The household, as opposed to the levy.
#
# NEITHER DESC MAY NAME AN OFFICE. No champion, no bodyguard, no huntsman, no
# master-at-arms, no cupbearer. Both gates read an employment iterator that
# does not care which post it is, and a toast that names one would be making up
# a fact the engine did not give it.
#
# NEITHER MAY PUT A SUM ON THE PAGE - no coins, no marks, no wage, no figure of
# any kind. The arrangement is the subject; the price of it is not, and a
# number would turn both of these into complaints about money.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 77.
# The first three are the reader's contempt rather than anybody's position, and
# the fourth is a word the mod has not earned.
#
# THE FIRST MAY NOT HAVE ANY OF THEM SPEAK TO HIM or be spoken to, may not have
# him decide to reward anybody after the battle, may not have him be fond of
# them, may not have him feel guilty, and may not let the sum come out as a
# conclusion about the kind of man he is. It is an accounting done while
# winning and it stays an accounting.
#
# THE SECOND MAY NOT HAVE HIM LOOK AT THE COMMANDER or be looked at by him -
# the whole moment happens at two hundred yards and inside one head. It may not
# have him say the word "dismissed" or think it in so many words, may not have
# him resent the arrangement, may not have him swear an oath or renew one, may
# not have him imagine what happens to him afterwards in any detail, and may
# not have him be brave about it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 78.
 bc_the_men_he_knows_the_names_of_toast:0 "He Has Seen Those Faces At Breakfast"
 bc_the_men_he_knows_the_names_of_toast_desc:0 "The stretch that is winning this is the stretch he could put names to in the dark, and knowing that does not warm him, it sets him counting. He knows which of them has a woman in his kitchens and which has been owed a raise since the autumn. He knows how few men in the world do that work properly and how long it takes to find one. He knows, roughly, what the afternoon will have used by dusk, and he keeps spending it, because they are the ones who will stand there and everyone on this field including them understands that this is what the arrangement has always been for. The sum comes out clean. He does not much like the look of it and he does not stop.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_place_is_an_arrangement_toast:0 "Not The Field. The Man."
 bc_knight_the_place_is_an_arrangement_toast_desc:0 "Every other man along this stretch has something behind him that stays where it is if today goes wrong - a valley, a name, a roof with his people under it. What he has is an agreement, and an agreement does not survive on its own. So while it comes apart he finds that the thing he is holding has quietly stopped being this hedge and these forty yards, which were never his and never going to be, and become one rider back there on the slope, because everything he owns is downstream of that rider still existing at dusk. Nothing about his footing changes. He does not announce it. He simply knows, somewhere after the middle of the day, what he is actually out here doing, and it is not the same answer the men beside him would give.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-THREE. The one he buried.
#
# NEITHER DESC MAY NAME A WIFE, living or dead, and neither may say how she
# died or how long ago. The engine holds a marriage that ended and nothing
# else; a cause, a year or a name would be invented.
#
# NEITHER MAY PUT A CHILD ON THE PAGE. Children are batch eighty-eight's
# subject and a different gate entirely, and both of these moments are about
# the shape of a household rather than its contents.
#
# NEITHER MAY HAVE HIM PICTURE HER, remember a room, hear a voice or hold an
# object. The mod does not do flashbacks and the toast has one afternoon in it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 79.
# than anything he would recognise, and the first gate in particular collapses
# into sentiment the moment one of them appears.
#
# THE FIRST MAY NOT MAKE HIM BRAVE and may not let him or anybody else read it
# as courage - the whole point is that a brake is missing rather than that an
# engine was added. It may not have him wish to die, may not have him seek
# death, may not have anybody on the field know anything about his household,
# and may not make him tragic or admirable.
#
# THE SECOND MAY NOT HAVE HIM MAKE A PROMISE, may not have him be afraid, may
# not have another man notice what he is doing or thank him for it, may not
# have him think of the second marriage as a replacement in so many words, and
# may not have him be bitter about having built it all again.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 80.
# that rider".
 bc_nothing_waiting_at_the_other_end_toast:0 "He Goes Into The Gap Without The Argument First"
 bc_nothing_waiting_at_the_other_end_toast_desc:0 "Most men of rank carry a small fitting behind the breastbone that makes them take the third-best line instead of the best one, and it costs half a second, and the half second is the reason they are still doing this in ten years. His came out some while back and was not put in again. It has nothing to do with nerve and he would say so shortly if anybody asked, which nobody will, because nobody out here knows the first thing about his household and there is no reason they should. What it means in practice is that when the far side opens at the shoulder he is already moving, with no quiet conversation to have about it first, and the gap gets used while it is still a gap. That is why this is working. It is also why the horse lines will be short in the morning.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_seen_a_household_stop_toast:0 "He Knows Which Parts Seize First"
 bc_knight_he_has_seen_a_household_stop_toast_desc:0 "He has been through the whole business once before and then built the entire apparatus a second time, which means he is the only man on this stretch who has watched from the inside as a house that was working stops working. Nobody plans for the second week. So the afternoon comes apart and he does the least stirring thing available to him: back one pace when the pace is called, shoulder still touching the shoulder beside him, and a flat refusal of every opportunity the day offers to make itself memorable. The rank goes backwards and does not open. He is not being careful with himself, exactly. He is being careful with a set of arrangements that only stay standing while he does.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-FOUR. The paper that is still good.
#
# NEITHER DESC MAY QUOTE THE DOCUMENT or put a single word of it on the page,
# may not name the war that produced it, may not say which year it was signed
# in, and may not say how long it has left to run. The engine holds that a
# truce exists and nothing else.
#
# NEITHER MAY HAVE THE TWO MEN SEE EACH OTHER, meet, exchange a herald, parley,
# or send anybody across. Both toasts happen at the distance a battle actually
# has in it, which is too far to recognise a face.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 81.
# first three are the reader laughing at the situation from outside it, and the
# fourth is exactly what neither of these men is - that is the entire subject.
#
# THE FIRST MAY NOT HAVE HIM CONSIDER BREAKING IT, may not have him be merciful
# in so many words, may not have him give an order that a reader could copy,
# may not have him feel good about himself, and may not turn the restraint into
# a virtue. It is a calculation about a table in a year's time and it stays
# one.
#
# THE SECOND MAY NOT DESCRIBE THE EARLIER BATTLE - no field, no weather, no
# moment from it - may not say what the terms were, may not have him ransomed
# or held on the page, may not have him warn anybody or be believed, may not
# have him be resigned to dying, and may not let him be right about the future
# in any specific way. He recognises a shape; he does not have information.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 82.
 bc_the_seals_are_still_wet_enough_toast:0 "Neither Of Them Declared Anything"
 bc_the_seals_are_still_wet_enough_toast_desc:0 "In a chest at home there is a folded thing with two seals on it, and it has years left on it, and nothing happening on this field touches it - a third man opened this war and read out a list, and both their names were on it, at opposite ends. So the fighting is entirely real and so is the agreement, and holding the two of them in one head at the same time produces a very practical set of limits now that the day is going his way. He can have the field. He cannot have the afternoon that would feel best, because the afternoon that would feel best is one he would be sitting across a table explaining next spring, under those same seals, to the man he would have taken it from. It stops being a question of temper somewhere in the middle of the day and becomes a question of what is worth the table.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_read_these_terms_before_toast:0 "He Is The One Who Agreed To It"
 bc_knight_he_has_read_these_terms_before_toast_desc:0 "Every other man along here is guessing what the far side will do next. He is not guessing, and it is worth nothing to him. He knows how that host moves once it has the shoulder, what it does with a flank that has started to bend, how long it keeps coming after the point where a reasonable host would stop. He knows because he was standing in the losing half of it once already and because he was in the room afterwards, dry-mouthed, while it was settled. None of that changes a single thing he can do about his own forty yards. It only means that where the men beside him are learning today as it happens, he is watching an itemised list he has seen before being read out again, and there is nothing to do with the knowledge except carry it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-FIVE. What the noise on the far side means.
#
# NEITHER DESC MAY NAME A LANGUAGE OR A PEOPLE. Not the Common Tongue, not the
# Old Tongue, not High Valyrian, not Dothraki, and no country of origin for
# anybody. Both gates read a court language against a character and neither
# knows which tongue it was.
#
# NEITHER MAY QUOTE A WORD ANYBODY SAYS, in any language, translated or not.
# The first cannot because he cannot understand it; the second must not,
# because a quoted line would be the mod inventing dialogue for a host it knows
# nothing about.
#
# NEITHER MAY PUT AN INTERPRETER, A HERALD, A CAPTURED MAN OR A DESERTER ON THE
# PAGE. The whole subject is what does and does not cross four hundred yards of
# open air on its own.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 83.
# All four are contempt rather than observation, and the first toast in
# particular is about a man losing an instrument, not about him despising
# anybody.
#
# THE FIRST MAY NOT HAVE HIM MISHEAR SOMETHING AND ACT ON IT - that would be a
# different and much cheaper moment - may not have anybody offer to translate,
# may not have him wish he had learned it, and may not let him solve the
# problem in any degree.
#
# THE SECOND MAY NOT HAVE HIM TELL ANYBODY WHAT HE HEARD, be asked, be
# believed, be thanked, or be noticed doing it. It may not have him take a
# prisoner, may not have him feel sorry for the far side, may not have him
# explain where he learned it, and may not have the hearing be a talent - it is
# an accident of which hall he belongs to.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 84.
 bc_it_arrives_as_weather_toast:0 "It Comes Across With No More In It Than Rain"
 bc_it_arrives_as_weather_toast_desc:0 "There is a thing every man who has ever run a field does without once deciding to do it, which is listen to the other host. Not for words, particularly. For the correction shouted twice, which says a line is being dressed and not re-formed. For one name repeated, which says who has gone down. For the moment the noise stops being aimed at anybody and becomes men speaking to the men next to them. He has had that for nothing his whole life and today he has none of it. What crosses the open ground reaches him with exactly as much in it as rain on a roof, and so the afternoon is being run on sight, which is half of what he is used to working with, on the day it is going the wrong way. There is no fixing it before dark and he has stopped trying.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_understands_the_far_rank_toast:0 "Nobody Beside Him Knows What He Just Heard"
 bc_knight_he_understands_the_far_rank_toast_desc:0 "They are from somewhere else entirely and he follows them as easily as he follows his own rank, which he never earned and never had a use for before this afternoon. For most of the day it was only odd. Then it turns his side's way and the oddness quietly becomes something else: an instruction given a second time, which means the first one went nowhere. A name called in a register nobody uses for an order. A stretch of them stopping speaking outward and beginning to speak to each other. The rank in front of him is still perfectly upright and admits nothing, and he moves half a pace anyway, and he is right, and he is right again eleven minutes later. He does not say a word about it to the men on either side of him, and there would be no time and no way to explain it if he tried.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-SIX. The fostering.
#
# NEITHER DESC MAY NAME THE OTHER MAN, give his house, his seat or his age, or
# say how many years ago the fostering was. The engine holds a relation and
# nothing else, and a number would be invented.
#
# NEITHER MAY STAGE THE CHILDHOOD AS A SCENE. No hall, no hearth, no first
# morning, no goodbye at a gate. Both toasts may refer to what was learned,
# because that is present on the field this afternoon, and neither may go and
# stand in the past to look at it.
#
# NEITHER MAY HAVE THE TWO OF THEM SEE EACH OTHER, be pointed out to each
# other, send anything, or be reported to each other by a rider. The distance
# is the point.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 85.
# fostering is precisely the bond that is none of those, which is why it is
# worth a batch, and the first of those words collapses it into batch
# eighty-five's territory.
#
# THE FIRST MAY NOT HAVE HIM FEEL PROUD, may not have him spare anybody or
# consider it, may not have him give an order a reader could copy, may not have
# him remember teaching a specific thing on a specific day, and may not soften
# the ending. It is a pursuit and it is working.
#
# THE SECOND MAY NOT HAVE HIM WANT TO BE SEEN DOING IT, may not have him hate
# the man, may not have him forgive him, may not have him remember being
# struck, may not have anybody praise him for holding, and may not let the
# holding save the afternoon. It does not.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 86.
 bc_he_taught_that_retreat_toast:0 "There Is Nothing About It He Has To Guess"
 bc_he_taught_that_retreat_toast_desc:0 "The far side has begun to give ground and it is being given in a pattern, and he owns the pattern. Which foot goes first. How many paces before the second rank is called through. The one thing that always gets done a beat late by a man doing it under pressure, because it was always done a beat late in a cold yard by a boy who was bad at it for two years and then very good. So he does not wait to see where the movement ends. He calls it, and it is there, and eleven minutes later he calls it again and it is there again, and the horse comes round the shoulder of it exactly where he said. Nobody watching him would say he looks pleased. He looks like a man doing arithmetic he did once before with the answer in front of him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_lesson_holds_the_line_toast:0 "The One Part He Can Still Do Correctly"
 bc_knight_the_lesson_holds_the_line_toast_desc:0 "Everything clever has gone out of him. It is that hour. What is left is the piece that was put in before any of the clever parts existed, low down, under where the fear reaches: where the left foot goes, what the shield does when the weight comes on, that the man beside you is the point of the entire exercise. He is not deciding to do it. It is simply what his body does when the day turns, and the two men on either side of him set themselves because he did, and the stretch stands for a good while longer than it has any business standing. It changes nothing about how this ends. He is aware of that. He is also aware, in a distant and unhelpful way, that the one thing he is still doing properly out here is somebody else's, and that the somebody else is four hundred yards away winning.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-SEVEN. Which way the war travelled.
#
# NEITHER DESC MAY NAME THE WAR, its cause, its claim, the title being fought
# over, the man at the top of either side, or any place at all. The engine
# holds two list memberships and nothing else, and everything else would be
# invented.
#
# NEITHER MAY PUT A DATE ON THE PAGE. No month, no year, no count of days, no
# season named outright even where the first one is entirely about seasons.
# The first toast may describe weather and roads and grain, because a man
# standing in a field can see all three; it may not tell the reader when.
#
# NEITHER MAY QUOTE OR DESCRIBE A DOCUMENT. Batch ninety-four owns paper. Both
# of these men know things that are written down somewhere, and neither may go
# and look at the writing.
#
# NEITHER MAY REPORT ON THE WAR AS A WHOLE. Who is winning the afternoon is a
# thing a man on the field can see. Who is winning the war is not, and the mod
# does not let anybody guess.
#
# THE FIRST MAY NOT HAVE HIM PLEASED WITH HIMSELF, may not use the word clever
# or any synonym of it about him, may not have anybody praise the arrangement
# to his face, may not have him explain it to a subordinate, and may not have
# any part of it go wrong so that he can be seen recovering. Nothing goes
# wrong. That is the entire content of the moment.
#
# THE SECOND MAY NOT NAME WHAT HE STANDS TO LOSE, may not have him blame the
# man who brought him, may not stage leaving as an option he weighs and nobly
# declines, may not have anybody notice what he is doing, and may not send
# anybody to get him out. Nobody is coming.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 87.
 bc_the_season_was_his_to_choose_toast:0 "None Of This Is Arriving Unannounced"
 bc_the_season_was_his_to_choose_toast_desc:0 "He is not surprised by any of it, and that turns out to be the whole of what he feels. The roads held. The grain was in. A levy raised at the point in the year he raised it is a levy of men who have nothing at home still standing in a field, and men like that come when they are called and stay when they are stood somewhere. The far side is where he expected them to be, because there was nowhere else on this stretch of country a sensible man would put them. He does not think of any of that as skill and would not thank anybody for saying it was. It is only the difference between an afternoon that happens to a man and an afternoon a man ordered a long time ago in a warm room with the shutters closed, and the second sort arrives with hardly anything left in it for him to decide. He watches it come in the way a man watches a barn go up after he has already paid for the timber.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_cannot_be_the_one_who_left_toast:0 "There Is No Version Of This Where He Is Carried Off It"
 bc_knight_he_cannot_be_the_one_who_left_toast_desc:0 "It is going badly, and there is a shape this could take in which a man is allowed to be swept off the end of it. Most of the men beside him have that shape available. They came because somebody they follow came, and a tide that brings a man to a field can take him off it again, and nobody in any hall says his name twice about it afterwards. That is not available to him. His name is in the quarrel itself, put there in a small careful hand by somebody who has never been within sight of a field like this one, and what is being settled out here is not whether a battle is lost. So the fighting quietly turns into something else in his hands, without him announcing it to anybody: he stops trying to win any of this and starts working out what can still be kept from them before dark. This hedge. This next hour. He is aware it is a poor trade and he makes it, and he is not certain, in the part of his head that is still adding, whether the thing he is out here protecting is the land or only the sentence that gets written about him either way.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-EIGHT. What he is carrying that nobody here can see.
#
# NEITHER DESC MAY SAY WHAT THE SECRET IS, hint at its kind, or narrow it. The
# engine holds a list and a count of knowers, and the mod's own gate cannot
# tell a murder from a parentage from a faith. Every word that narrows it is
# invented, and the moment stops working the instant a reader can name it.
#
# NEITHER MAY PUT ANYBODY CONNECTED TO IT ON THE PAGE. No knower, no accomplice,
# no witness, nobody who was there. The second toast especially: the man who
# knows is not at this battle, has not sent anything, and is not on his way.
#
# NEITHER MAY THREATEN TO COME OUT. Nothing is closing in on either of these
# men this afternoon. A desc that lets the day nearly expose something has
# written a different template, and a better one for a different mod.
#
# NEITHER MAY HAVE HIM NEARLY SAY IT, be asked anything, be looked at oddly, or
# confess to the reader in the last sentence.
#
# THE FIRST MAY NOT BE RELIEVED and may not be frightened either. The list of
# men who could say it is empty and both of the obvious feelings about that are
# wrong; what is there is arithmetic he cannot finish. It may not have him
# decide anything about it, and it may not let him die on the page.
#
# THE SECOND MAY NOT HAVE ANYBODY NOTICE what he is doing with the credit, may
# not have him refuse an order, sandbag the work, or be praised out loud, and
# may not have him enjoy the winning. He is winning. That is the difficulty.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 88.
 bc_it_goes_where_he_goes_toast:0 "The Only Copy Is Walking Backwards With Him"
 bc_it_goes_where_he_goes_toast_desc:0 "The line is coming back the way it should, in order, at a pace, and he is doing that part of it correctly with about two thirds of himself. The other third has gone somewhere entirely useless. It has worked out — not decided, worked out, the way a man works out how much daylight is left without looking up — that there is exactly one place the thing he has been carrying since a particular year exists at all, and that place is walking backwards across this field at the moment with everything else. If today finishes the way today is currently arranged, it stops existing. No one is left to say it, no one is left to have to be watched, no one is left who would ever look at him differently. He turns that over and cannot get it to come out as either good or bad. It sits there being the only thought of his all afternoon that the field cannot touch and cannot help with, and the line keeps coming back, and he keeps it in order, and it is not a comfort.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_would_rather_not_be_remembered_toast:0 "He Does It Well And He Does It Quietly"
 bc_knight_he_would_rather_not_be_remembered_toast_desc:0 "It is going their way and the work he has done is a decent part of why, and he is spending a small steady portion of his attention on making sure that fact settles somewhere else. Not by doing less. He would rather be dead than do less, and the men beside him have never had a reason to wonder about him. He simply lets the man on his right be the one standing forward when the thing gives, and lets the shout that goes up go up with somebody else's name in it, and when a rider looks along the line for who did that he is already turned away and moving. It is not modesty and he has never once been tempted to think of it as modesty. A name that gets written down gets read, and read by people who read a great many of them, and there is a man out there in the world with one other thing he could set beside it. So he wins the afternoon and lets it belong to whoever wants it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH NINETY-NINE. Weight, as opposed to rank.
#
# NEITHER DESC MAY NAME ANYBODY, give a title, a seat, a realm or a hall, or
# say how many men of that weight there are. The engine answers a yes and a no
# and the mod has no access to the arithmetic behind either.
#
# NEITHER MAY HAVE THE TWO MEN SPEAK, look at each other, send anything, or be
# pointed out to one another. The whole subject is a calculation each of them
# is doing privately about the other's existence.
#
# NEITHER MAY HAVE ANYBODY ELSE NOTICE. No sergeant remarks on it, no rider
# carries a message about it, nobody in the ranks understands what is being
# arranged around them. If it were visible it would be politics; kept quiet it
# is the thing this batch is about.
#
# THE FIRST MAY NOT RESENT IT, may not have the great man do anything
# remarkable - the point is that he is not being allowed to - may not have the
# arrangement fail or nearly fail, and may not explain itself to a subordinate.
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 89.
#
# THE SECOND MAY NOT NAME WHAT HE STANDS TO LOSE, may not have him think a
# single word about the man commanding him, may not have him consider leaving,
# may not have anybody thank him, notice him or come and stand with him because
# of who he is, and may not let the holding change how the afternoon ends. It
# does not.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 90.
# gets read".
 bc_the_one_he_cannot_spend_toast:0 "He Builds The Afternoon Around One Man And Does Not Use Him"
 bc_the_one_he_cannot_spend_toast_desc:0 "There is a place out there where this is going to be decided, and it has been obvious for an hour which place it is, and standing thirty feet away with a sword and a wet surcoat is the man best able to go and decide it. He does not send him. Sending him puts him in front of everyone who is going to talk about today for the rest of the year, and a man of that size does not need to be made any larger by anybody's help. Keeping him back where somebody could remark on it does the same job from the other direction. And if he goes and does not come out of it, there is a chair empty next spring that takes a year to fill and costs more than the field is worth. So he builds a slower version. Two units that do not much want to be where he is putting them, a delay he would rather not have taken, a wider angle onto the same ground, and it works, and it takes longer, and nobody will ever know that the shape of the win was decided by an arithmetic that had nothing to do with the ground.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_here_is_owed_toast:0 "Whatever Gives Today Will Not Be The Part He Was Standing In"
 bc_knight_nothing_here_is_owed_toast_desc:0 "Nothing about being here is compulsory and that is not the comfort it sounds like. No summons brought him. Nobody out here can take anything off him, and nobody who will be asked about this afternoon afterwards is going to ask the man giving the orders. Which means the whole of it — the standing, the not standing, the exact minute a thing let go — is being written down somewhere as a description of what he is like, by men who are not here and will repeat it accurately for twenty years. So he plants himself and does not move, and it is not courage arriving and it is not stubbornness. It is the one calculation available. What gives today will give somewhere else along the line, and the account of it will have another name in that sentence, and he will be in a hall next winter listening to the story with a cup in his hand and nothing in it about him. The men on either side of him think he is very brave. He would not know how to begin explaining that they have it wrong.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# ---------------------------------------------------------------------------
# BATCH ONE HUNDRED. The third relation.
#
# NEITHER DESC MAY NAME THE PERSON, give their sex, house, title, age or where
# they are from. The engine holds a relation and nothing else. This prohibition
# is stricter than the usual one and it is not squeamishness: the moment is a
# man's attention bending around somebody, and every fact supplied about that
# somebody makes it a smaller thing than it is.
#
# NEITHER MAY PUT A SCENE FROM BEFORE THE BATTLE ON THE PAGE. No room, no
# arrival, no last conversation, no thing that was said. Both men may carry
# what they know; neither may go and stand in it.
#
# NEITHER MAY HAVE THE TWO OF THEM MEET, see each other, call out, send
# anything, or receive word. The first is separated by the entire field and the
# second by a line that is coming apart, and the distance is what both toasts
# are made of.
#
# NEITHER MAY HAVE ANYBODY ELSE KNOW. No sergeant guesses, no rider carries it,
# nobody in the ranks understands what is being done or why. A bond nobody
# wrote down is not one anybody on a field is going to work out at speed.
#
# THE FIRST MAY NOT CONSIDER STOPPING, sparing anybody, sending terms, or
# easing off, and may not have any of that occur to him and be dismissed. He is
# winning properly. It may not have him weep, and it may not let him enjoy any
# part of the afternoon.
#
# THE SECOND MAY NOT FIND THEM, reach them, see them, or learn one thing about
# how they are. It may not have him abandon his place in a way that gets men
# killed on the page, may not have anybody praise or condemn what he is doing,
# and may not end well for either of them. It may not use the word "love".
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 91.
 bc_no_version_of_this_that_is_not_also_theirs_toast:0 "There Is No Good Hour Left In This That Is Only His"
 bc_no_version_of_this_that_is_not_also_theirs_toast_desc:0 "It is going well. It has been going well since the middle of the day and it is going to keep going well, and he has been handed, one after another, a series of small clean successes that each arrive with a second meaning attached to them. The flank folds: good. The flank folds onto somebody. The far line thins in the place he wanted it thin. Riders stop coming out of it. Somewhere in the second half of the afternoon he stops receiving the battle as a run of gains and begins receiving it as a list of things he is choosing, one at a time, in front of witnesses, with no way at all of choosing differently and no way of not knowing. He does not slow down. He does not do any of it less well than he is able to. The orders keep going out in the same voice they went out in at dawn and the men carrying them notice nothing whatever, and he goes on winning it, hour after hour, and there is not one part of it left that belongs only to him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_one_distance_instead_of_a_battle_toast:0 "He Has Stopped Fighting A Battle And Started Working On A Gap"
 bc_knight_one_distance_instead_of_a_battle_toast_desc:0 "Somewhere off to his left, he thinks, and it has been thinking for a while now rather than knowing, there is a part of this line that matters more to him than the rest of it does. He could not point at it. He has an idea, and an idea is the whole of what any man in a rank ever has about anything further off than his own arm, and the day is taking that idea apart at the same rate it is taking everything else apart. So he stops working on the battle. He is not much use to it any more and it is not much use to him. What he works on instead is a distance — closing it, in the pauses, three or four paces at a time, through men who are moving the other way and have every right to be, taking whatever comes at him from the side because turning to answer it properly costs ground he cannot buy back. He does not get there. That is not the point and he has stopped expecting it. The point is that the number is smaller than it was an hour ago, and he intends to spend whatever is left of this afternoon making it smaller again.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 101 - the quarrel that is waiting at home -------------------------
#
# NEITHER OF THESE TWO MAY NAME THE FACTION, name its demand, name anybody who
# signed it, or say the word "faction" on the page. The engine knows there is a
# list of names somewhere. The man knows it too. Nothing on this field says so
# out loud and nobody here is going to.
#
# NEITHER MAY PUT A NUMBER ON IT. Not how many signed, not how many men each
# one brings, not how many months it has been sitting there, and not what it
# will cost. The whole point of the thing is that it has no size a man in
# armour can hold in his head while he is working.
#
# NEITHER MAY HAVE A RIDER ARRIVE, a letter arrive, or news of any kind arrive
# from home during the afternoon. The pressure is entirely a thing he brought
# with him this morning and will take away again at dusk.
#
# THE FIRST MAY NOT DOUBT THAT HE IS WINNING and may not be shown as having
# misjudged the field. He is doing this well and the cost of doing it this way
# is not a mistake, it is a price he decided to pay before the first charge. It
# may not use the horses as a symbol of anything; they are simply used up. It
# may not have him address anybody, and it may not have him look back.
#
# THE SECOND MAY NOT ACT ON WHAT HE WANTS. He does not slow, hesitate, mislead
# anybody, hold back a step, or arrange for one thing to go wrong. That would
# be a different template. What he does is exactly his job at exactly the
# ordinary speed, which is the hardest available thing. It may not have anybody
# suspect him, it may not have him nearly say something, and it may not decide
# whether he is glad.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 92.
 bc_nothing_smaller_than_this_will_carry_toast:0 "A Sufficient Victory And A Merely Adequate One Are Different Trades"
 bc_nothing_smaller_than_this_will_carry_toast_desc:0 "He could stop this at the good part. Most men would, and most men would be right to, and the field would go into the record as a tidy piece of work by a careful man. That is precisely the shape of the afternoon he cannot use. Something at home has been assembled slowly and patiently out of exactly that kind of tidy adequate work, item by item, each one perfectly defensible and none of them enough, and a careful win today becomes the newest item on it before the horses are even cool. So he does not stop at the good part. He sends the riders out past where riders are usually sent, and then out past that, and keeps them out through the part of the day when a sensible captain calls them in, and what comes back at dusk comes back walking, blown and shaking and finished for the season, having turned a result that could be argued with into one that cannot. The mounts are the price. He worked it out this morning, before any of it, and he has not revisited the arithmetic since.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_cannot_be_seen_to_want_this_toast:0 "The Line Is Failing At Precisely The Rate He Once Hoped It Would"
 bc_knight_he_cannot_be_seen_to_want_this_toast_desc:0 "The rank gives another few feet and he goes back with it, no faster and no slower, and puts his shield where the sergeant expects a shield to be. He is very good at this today. He is being watched by nobody in particular and by every man within reach at the same time, which is the ordinary condition of standing in a line, and it has never once mattered before what his face was doing. It matters now. Everything happening in front of him is the thing he put his name to at a table in a cold room two winters ago, arriving on its own, without him, at no cost to him whatever, and if one man beside him ever comes to think that this occurred to him at any point in the afternoon then the table and the cold room and every name on the page go into the fire together. So he works. He takes his turn forward when it is his turn. He is tired at the correct hour and afraid in the correct places and he does not permit himself a single thought about any of it until well after dark.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 102 - who is allowed to put whom in a cell ------------------------
#
# NEITHER OF THESE TWO MAY NAME THE REASON. Not the crime, not the oath broken,
# not the year it happened, not who ruled on it. The engine holds an
# entitlement; the page holds two men who both know it exists and neither of
# whom is going to explain it to a sergeant.
#
# NEITHER MAY STAGE THE CAPTURE. Nobody is taken, nobody yields, nobody is
# disarmed, nobody is walked anywhere, and no hand closes on any bridle. Both of
# these are about the shape an afternoon takes when the ending is available, not
# about the ending arriving.
#
# NEITHER MAY PUT A PRICE ON ANYTHING. No sums, no ransom figures, no comparison
# of what a man is worth alive against what he is worth dead. The whole weight
# of both moments is that the ordinary trade is not on offer.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 93.
# talk like clerks and this is not a document being read out; it is a thing both
# of them have known since before they got up this morning.
#
# THE FIRST MAY NOT GLOAT, may not be shown as cruel, and may not want the man
# for anything the page names. It may not have him give an order aloud that
# explains the change, may not have the men understand what has changed, and may
# not have the far side notice. It may not fail — he is winning and it is
# working.
#
# THE SECOND MAY NOT DESCRIBE A CELL, imagine one, remember one, or mention a
# door, a room, a chain or a key. It may not have him decide anything, since the
# decision was made for him by somebody else years ago. It may not make him
# heroic, may not have anybody thank or admire him, may not kill him on the
# page, and may not let him get away.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 94.
 bc_he_would_rather_have_him_than_the_field_toast:0 "He Stops Trying To Break Them And Starts Trying To Close Around Them"
 bc_he_would_rather_have_him_than_the_field_toast_desc:0 "Everything he has done since noon has been aimed at making the far side come apart, and it is coming apart, and somewhere in the middle of watching it happen he understands that this is the wrong thing to be building. A host that comes apart scatters. Scattering is what a beaten host is for. It is also, precisely, how a particular man ends the day forty miles from here on a borrowed horse with his helm in a ditch, and that particular man is the only object on this field that is worth more to him tomorrow than everything else on it put together. So the orders change and none of them sound like a change. The pressure comes off the centre by a degree nobody in it will feel. The wings, which were pushing, begin instead to lengthen. A reserve that was going to be spent breaking something is walked sideways and left standing where a road runs, doing nothing, in front of men who cannot think why. He is no longer beating them. He is building a shape, patiently, out of the pieces of a victory he has already won, and the shape has one opening left in it, and he is minding that opening himself.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_no_ransom_in_it_for_him_toast:0 "Every Other Man In This Rank Has An Ending Available That He Does Not"
 bc_knight_there_is_no_ransom_in_it_for_him_toast_desc:0 "The men to either side of him are going to be all right. Not today, necessarily, and not all of them, but the shape of the thing they are inside has an exit in it — a hand up, a name given, a week of bad food and somebody's steward riding out with a sealed bag — and that exit is standing open for every single one of them and has never once been open for him. He knew that before the horns. He has known it for years. So the arithmetic he is doing while the line comes apart is not the arithmetic anybody near him is doing: he is not working out how to live through this, he is working out how to remain, for the next hour, an object that no reasonable man would put a hand on. He goes at them wide and low and keeps going, past the point where it is any use to the line, past the point where his own arm is answering properly, and the ground in front of him gets very bad indeed. It costs. Men beside him who would have stood are pulled forward into it and do not come out, and the line where he is standing bleeds for a decision that was never theirs and that he never once thought of as a decision.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 103 - the one who was preferred -----------------------------------
#
# NEITHER OF THESE TWO MAY NAME THE PERSON at the other end of it. No name, no
# sex, no age, no title, no position in any birth order, and no count of how
# many others there are. The engine holds one relation between two characters.
# The page holds a man in armour and a weight he is carrying, and every fact
# supplied about the other person makes the weight smaller than it is.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 95.
# and neither may state the comparison out loud. It is the sort of thing a
# household knows and never says, and a page that says it has already got it
# wrong.
#
# NEITHER MAY LEAVE THE FIELD. No flashback, no memory of a room, no scene at a
# table, no farewell at a gate, no letter. Whatever is at home stays at home and
# is present here only as pressure.
#
# THE FIRST MAY NOT ANNOUNCE A RETREAT, sound a horn, order a withdrawal in
# words, or be seen by anybody to have changed his mind. It may not have him
# consider his own death, may not have him weep, may not have him blame
# anybody, and may not promise that it works. He is losing and the page does
# not fix that.
#
# THE SECOND MAY NOT APOLOGISE FOR HIM and may not condemn him. It may not have
# him think about what he was given, may not have anybody in the ranks resent
# him or admire him, and may not have him prove anything to anybody named. It
# may not have him fall, be unhorsed on the page, or be told to stop. What ends
# is the horse, not the man, and the page may not treat that as a lesson.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 96.
 bc_what_he_is_still_meaning_to_go_home_to_toast:0 "He Quietly Changes What He Is Trying To Achieve Out Here"
 bc_what_he_is_still_meaning_to_go_home_to_toast_desc:0 "Nothing about the next hour is going to be a victory and he stops asking it to be one. The interesting thing, and he notices himself doing it, is where the new instruction comes from. It is not the men, whom he has spent his adult life being responsible for and would spend all of today for if today were still worth spending. It is not the war, which will go on being what it is regardless of what happens on this grass. It is one small thing at the far end of a road he has not travelled in months, and it is not asking him for anything, and it does not know today is happening. He gives no order that anybody could write down as the moment he stopped trying. What he does is smaller and takes longer: a company held back that would have been fed in, a flank permitted to bend rather than bought back at the price it now costs, the road behind them checked, once, without turning his head. The men around him think he is still fighting the battle. He is fighting something else now, with the same tools, at the same pace, and by dusk he will know exactly how much of it he saved and exactly what it cost the field.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_everything_he_has_was_handed_to_him_toast:0 "The First Afternoon Of His Life That Will Take Any Payment At All"
 bc_knight_everything_he_has_was_handed_to_him_toast_desc:0 "The animal under him is better than the one under any man he has passed today, and it was chosen for him, and it was chosen instead of being chosen for somebody with as much right to it as he had. So is the mail. So is the sword, so was the place in the line, so was the year of instruction from a master-at-arms who had other pupils and gave him the mornings. None of it can be given back and none of it was ever refusable and there has never before been a single thing he could do about any of it. There is today. The far side is going and he goes after it, and then he goes after it further, through the trampled ground and the dropped gear and the men who have already stopped being an army, past the last of the horns and past the point where anyone behind him could tell him anything. He does not tire. The horse does. It goes on carrying him a long time after it has stopped being able to and it will not be ridden again, and he comes back at dusk on foot, leading it, having finally spent something that was his.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 104 - whose oath is the one that broke ----------------------------
#
# NEITHER OF THESE TWO MAY NAME THE LIEGE, give his title, his house, his seat
# or his cause, and neither may state what the rebellion is about. The engine
# knows there is a man at the top of a chain and that the chain has a break in
# it. That is all either page is allowed to know.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 97.
# are words for after, said by whoever won, and both of these are happening
# during.
#
# NEITHER MAY IMAGINE THE ENDING. No block, no rope, no pardon, no terms, no
# knee, no reckoning at any later date. Both men are inside an afternoon and
# neither of them is permitted to see past dusk.
#
# THE FIRST MAY NOT DOUBT, may not regret, may not justify himself, and may not
# be shown as either right or wrong. He is winning and the win is real. It may
# not have him say any of this aloud, may not have anybody congratulate him, and
# may not have a single man in his army understand what has occurred to him. It
# may not use the word "oath".
#
# THE SECOND MAY NOT RESENT ANYBODY BY NAME, may not consider leaving, may not
# be tempted to, and may not have anybody near him desert on the page. It may
# not make him noble, may not have anybody notice what he is doing, and may not
# reward him. It may not have him think about the quarrel at all beyond knowing
# that it is not his, and it may not use the word "loyalty".
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 98.
 bc_the_word_for_this_has_one_ending_toast:0 "Winning It Is The Part That Makes It Permanent"
 bc_the_word_for_this_has_one_ending_toast_desc:0 "It occurs to him, watching a wing go in exactly where he sent it and do exactly what he asked of it, that he has been thinking about today as a thing that could still go either way, and that this has not been true for some time. There is no arrangement at the end of a field like this one. There is no version of the next year in which men sit down and agree that a misunderstanding got out of hand and everybody goes back to a slightly worse seat than they had. That version stopped existing at some point between dawn and now, and it did not stop existing because anything went badly. It stopped because things went well. Every good hour he has had out here has removed one more of the endings in which he simply carries on being what he was, and he has had a great many good hours, and there is nothing in front of him now but the one ending left. He watches the far line give again. He is entirely calm. He has the strange, weightless sensation of a man who has been carrying a decision for months and has just set it down somewhere he cannot get back to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_was_not_asked_about_any_of_it_toast:0 "He Has Kept Every Promise He Ever Made And This Is Where It Put Him"
 bc_knight_he_was_not_asked_about_any_of_it_toast_desc:0 "Not one of the reasons this field exists is a reason of his. He did not want it, was not consulted about it, does not stand to gain a foot of ground or a copper from it going well, and is going to spend the rest of his life explaining, to men who will not believe him, that he had no view on the matter whatsoever. He is not angry about that. Anger would require somebody to be angry at, and the only candidate is a man he is required to obey and has obeyed correctly every day of his adult life, which is precisely why he is here. So he narrows what he is responsible for until it is a size he can actually be responsible for. There is a man on his right. There is a man on his left. There is a stretch of churned grass in front of the three of them that is going to be given up eventually and is not going to be given up in the next quarter of an hour, and holding that — not the battle, not the war, not whatever is going to be decided about all of this in some hall at the end of it — is a job. He takes it. The three of them do not move, and the rank re-forms on them twice, and neither time does anybody ask him why.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 105 - who made whom -----------------------------------------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER MAN, give his age, house, title or
# nickname, or say how long ago any of it happened. The engine holds one
# relation between two characters. Everything else about them is the mod
# inventing a person, and the moment is smaller every time it does.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 99.
# sword, no vigil, no shoulder, no oath spoken at any age. What passed between
# them is only ever present here as something being performed.
#
# NEITHER MAY HAVE THEM SEE EACH OTHER, call out, salute, or be described as
# aware of each other's exact position. Both moments are about recognising work,
# which does not require a face.
#
# THE FIRST MAY NOT BE PROUD IN WORDS, may not congratulate anybody, may not
# think about his own reputation, and may not have the man he taught be told
# about it, then or ever. It may not have him give the order that produces the
# thing he is watching — the whole weight of it is that he did not.
#
# THE SECOND MAY NOT DESPAIR, may not decide anything about the man opposite,
# may not be angry at him, and may not be shown as outmatched in strength,
# youth, numbers or luck. He is losing to his own instruction and nothing else.
# It may not have him invent something new that works, may not have anybody
# help him, and may not let him stop.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 100.
 bc_something_he_taught_comes_back_to_him_toast:0 "He Recognises The Handwriting Before He Recognises The Man"
 bc_something_he_taught_comes_back_to_him_toast_desc:0 "A section of his line does a thing he did not ask for. It is nothing much. A push that could have gone in fast and untidy goes in slow instead, and closes up as it goes, and takes ground it can still be standing on in an hour, and the men doing it are dressing off somebody without appearing to look at him. He watches it the way you watch a stranger sign a name you know. There is a way of doing that which is not the way anybody teaches it now, and which nobody would ever call anything, and which is only distinguishable from the ordinary way if you happen to be one of about four people alive who ever thought about it. He does not send anyone. He does not adjust the thing, and he catches himself opening his mouth to and closing it again, because whatever is going on down there is finished and correct and has stopped needing him some considerable time ago. The wing goes forward at the pace he would have chosen. It is the strangest quarter-hour of his afternoon and by far the best one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_nothing_he_can_do_that_is_new_toast:0 "Every Answer He Has Was Issued To Him By The Man He Is Trying It On"
 bc_knight_there_is_nothing_he_can_do_that_is_new_toast_desc:0 "The first time it happens he assumes it is luck. The second time he assumes the far side has good sergeants. By the fourth he has stopped assuming anything, because the pattern is too tidy to be an accident: whatever he sets up gets met, not violently and not cleverly, but early, in the flat unhurried way of somebody who was already standing where the thing was going to arrive. So he goes through what he has. He is not a poor soldier and there is a great deal of it, and he works through it in the order it was given to him, which is a horrible thing to notice while you are doing it. Each one is answered before it is finished. The line behind him gives, and gives again, and the ground he is losing is being taken off him at a rate somebody worked out in advance. He does not stop. There is nowhere in the whole of him where a thing lives that came from anywhere else, and by the time the light starts going he has understood that he is not being beaten by an army at all.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 106 - the cloak and the body it is over ---------------------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER MAN or give his age, house, title,
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 101.
# hold a distance, and a distance does not need a name to be the most exactly
# maintained thing on a battlefield.
#
# NEITHER MAY HAVE THEM SPEAK to each other, look at each other, acknowledge
# each other or be acknowledged by anybody else. Nothing about this arrangement
# has ever been discussed by the two people inside it.
#
# NEITHER MAY STAGE AN ATTACK ON THE GUARDED MAN, a rescue, a near miss, an
# arrow, a rider getting through, or any moment where the arrangement is tested.
# Both moments are about a condition that holds all afternoon precisely because
# nothing comes of it.
#
# THE FIRST MAY NOT GIVE THE ORDER that produces what he is noticing, may not
# thank anybody, may not send the man away, and may not be comforted by him. It
# may not have him fear for himself, may not have him consider his own death,
# and may not turn the loss around. He is losing and the page does not fix that.
#
# THE SECOND MAY NOT COMPLAIN, may not be tempted in words, may not disobey by
# so much as a step, and may not be given anything to do. It may not have him
# resent the man he stands over, may not have anybody notice him, may not have
# him take a wound, and may not have the day end. It may not use the words
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 102.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 103.
# army at all".
 bc_the_distance_beside_him_never_changes_toast:0 "One Thing Out Here Has Not Moved All Day And It Is Not The Line"
 bc_the_distance_beside_him_never_changes_toast_desc:0 "The whole afternoon has been a slow argument he is losing about where things ought to be. The centre is not where he put it. The reserve went in somewhere approximately correct and is now approximately somewhere else. He has been shouting corrections into a shape that stopped being the shape he drew before the sun was properly up, and every one of those corrections has been an estimate, and he has known it. Then he turns his horse for the fourth or fifth time in an hour to look for something behind him, and finds, without having gone looking for it, that there is one exact measurement left on this field. It is behind his shoulder. It has been behind his shoulder through the collapse of the left, through the reserve, through the two withdrawals he has ordered and the third he has not admitted to ordering, and it is not a pace further off or a pace nearer than it was at dawn. He turns back. He does not say anything about it and there is nothing to say about it. It is simply the only thing today that has been done properly, and it is being done by a man who has not struck a single blow.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_best_afternoon_he_will_never_have_toast:0 "The Whole Of It Is Happening Just Over There And None Of It Is His"
 bc_knight_the_best_afternoon_he_will_never_have_toast_desc:0 "It is going beautifully and he can see all of it. That is the difficulty. Down in the line, where a man's world is two arms wide and full of noise, nobody knows this is a great day yet; up here it is perfectly obvious, and he has the best view on the field of the sort of afternoon that gets talked about in halls for thirty years by men who were in it. He can name the gap. He knows precisely where he would go, at what moment, and what would happen after — and there is a long stretch of the day where the knowing is worse than the not going, because the knowing keeps arriving in fresh detail and there is nothing at all to do with it. So he does the work. The work is being in one place. He shifts his weight when the ground under him gets soft and he moves when the man he is standing over moves and he does not move otherwise, not when the far banner goes down, not when the cheering starts on the right, not once. At dusk he will have taken nothing, done nothing anyone can name, and stood, correctly, through the finest hour of somebody else's life.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 107 - the marriage that is standing on both sides -----------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER MAN or give his age, house, title,
# nickname or sex, and neither may name the married child or the spouse. Neither
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 104.
# that happened years ago and is still doing work today.
#
# NEITHER MAY STAGE THE WEDDING as a scene, may not go back to it in more than a
# clause, and may not describe the contract, the terms, the negotiation or who
# got the better of it. The arrangement is finished business. Only its residue
# is on this field.
#
# NEITHER MAY HAVE THE TWO MEN SPEAK today, meet, ride at each other, or
# recognise each other across the field. Nothing in either page is an encounter.
#
# THE FIRST MAY NOT WIN THE BATTLE, may not kill or capture anybody, may not
# have him give an order that is quoted, and may not have him feel clever about
# it. It may not have him gloat, may not have him grieve, may not mention the
# marriage souring, and may not have anybody else on his own side know why the
# order was the right one. The knowing is private and it stays private.
#
# THE SECOND MAY NOT RALLY, may not turn the line, may not have him strike
# anybody down, may not have him wounded, and may not have the day end. It may
# not have him look for the other man, may not have the other man look at him,
# may not have him think about his marriage in any warm way, and may not use the
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 105.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 106.
# somebody else's life".
 bc_he_has_watched_this_man_carve_at_his_own_table_toast:0 "He Knows What That Man Does When A Thing Stops Going Well"
 bc_he_has_watched_this_man_carve_at_his_own_table_toast_desc:0 "The far side does something at midday that nobody around him can read, and he reads it immediately, and the reading does not come from any part of him that was trained. It comes from meals. It comes from years of sitting across a board from a man and watching what he did with his hands when a dish was late, when a servant spilled, when a conversation went somewhere he had not agreed to go — the small tightening, the pause, then the correction that is always one notch harder than the situation asked for. That is what is happening out there now, at the scale of four thousand men, and it is the same tightening. He says nothing about how he knows. He gives the order in the flat voice of a man who has simply decided, and it is the right order, and it goes on being the right order for two hours because the far side keeps making the correction he has already watched him make in a hall in winter with the fire going. Nobody near him will ever be told where any of it came from.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_will_not_be_the_one_who_gives_first_toast:0 "There Is Exactly One Man Here Whose Opinion Of Him Is Already Written"
 bc_knight_he_will_not_be_the_one_who_gives_first_toast_desc:0 "The line has begun to do the thing lines do before they stop being lines: the men to his left have started to find reasons to be a step further back than they were, and each reason is a good one, and the sum of them is a retreat that nobody has ordered. He can feel the pull of it in his own feet. It is not fear exactly. It is the sensible, almost administrative urge to be where everybody else is going to be in a minute. And there is one man perhaps thirty paces along the same rank who has known him since before he was worth knowing, who was owed a great deal in the making of what he now is, and who is going to spend the rest of a long life in the same halls he does. So he sets his feet where they already are and he leaves them there. The shields on either side of him find him not moving and it becomes fractionally harder for them to move either. The ground still goes. It goes slower, and it goes with the front of it intact, and the whole of the reason for that is one calculation he made about the rest of his life while the middle of the day was falling apart around him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 108 - the thing he does not have any more -------------------------
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 107.
# neither may give the animal a name, a colour, a size or a sex. Both pages are
# about a man on the ground. The engine has already established what he used to
# be and the prose does not need to say it out loud to be understood.
#
# NEITHER MAY STAGE THE LOSS. No death scene, no last flight, no falling, no
# grief in the ordinary sense, and no account of how it went. Whether it died,
# was killed, or simply stopped being his is not in either page, because AGOT
# reaches the same two traits by three different routes and the mod does not
# distinguish them.
#
# NEITHER MAY GIVE HIM ANY OF IT BACK, in a memory longer than a clause, in a
# dream, in an omen, in a shadow crossing the field, or in anybody else's
# mistaking something for it. Nothing arrives.
#
# THE FIRST MAY NOT TURN THE LOSS AROUND, may not have him win anything, may not
# have him quoted giving an order, may not have him considered great or ruined
# by anybody else, and may not have him say a word about what he used to be. It
# may not have him wounded, may not have him consider his own death, and may not
# have anybody comfort him or notice him at all.
#
# THE SECOND MAY NOT BE ABOUT THE OTHER MAN'S FEELINGS, may not have the two of
# them speak, may not have the other man look at him or acknowledge him, and may
# not have the other man do anything remarkable with a weapon. It may not kill
# anybody, may not have root wounded, may not end the day, and may not have root
# pity him, envy him, or be told anything about him by a third person. Root only
# ever has the evidence of the pace.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 108.
 bc_the_answer_he_used_to_have_is_not_available_toast:0 "Everything He Is Trying Today Is The Second Version Of Itself"
 bc_the_answer_he_used_to_have_is_not_available_toast_desc:0 "The problem in front of him is not a hard problem. That is what makes the afternoon what it is. He looked at the far side's right at some point before midday and knew, in the flat immediate way a man knows a familiar road, precisely what wanted doing about it and how long it would take and what the field would look like afterwards — and then had to put all of that down, because the doing of it required something that is not available to him, and go looking for the next best method, which is slower, and costs men, and is not certain. He finds one. It takes an hour. In that hour the far side moves and the shape he was answering stops existing, so he begins again, and the second answer is worse than the first was, and it also takes an hour. This is the whole afternoon. He is not being outthought. He is being asked to do everything by a longer route than the one he spent twenty years learning to trust, and the route is long enough that the battle keeps arriving somewhere else before he does.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_horse_is_a_very_slow_way_to_arrive_toast:0 "Whatever That Man Thinks A Charge Is, It Is Not What The Rest Of Them Think"
 bc_knight_a_horse_is_a_very_slow_way_to_arrive_toast_desc:0 "They go forward together and within a hundred paces the rank is no longer a rank, because one man in it is riding as though the animal underneath him has personally offended him by existing. It is not bravery and it does not look like bravery. It looks like impatience of a very specific and unusual kind: the impatience of somebody who is not measuring this against other charges but against some other standard entirely, one that nobody around him has access to, in which a hundred paces is not a distance worth counting. So the whole line finds itself going faster than it meant to. Root gives his horse more than he intended to give it, twice, because the alternative is to be visibly behind, and the second time he feels the animal start to change underneath him in the way they do when the afternoon is going to end early for them. They hit, and it works, and it works well, and it works partly because they arrived while the far side was still deciding. Afterwards there are more horses standing with their heads down than there ought to be, and root does not entirely know what to make of any of it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 109 - the men who are standing here as terms ----------------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER MAN or give his house, title,
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 109.
# pages hold what it looks like from inside on an afternoon when it is being
# tested.
#
# NEITHER MAY STAGE THE HANDOVER, the ride, the parting, the year of it, or any
# scene older than a clause. Neither may state the terms, name what was
# promised, or say what happens to him if the promise breaks. The threat is the
# structure of both pages and neither page says it.
#
# NEITHER MAY HAVE THE TWO MEN MEET, speak, look at each other across the field
# or be pointed out to each other, and neither may have anybody else on the
# field mention the arrangement out loud. Nobody discusses this where he can
# hear it.
#
# THE FIRST MAY NOT DECIDE ANYTHING, may not give an order that is quoted, may
# not act on what he notices, may not have him warn anybody or send anybody
# away, and may not resolve into a plan. It may not have him feel guilty, may
# not have him feel fond, and may not have him say a word to the man in
# question. The whole of it is a thing he sees and files.
#
# THE SECOND MAY NOT KILL ANYBODY, may not have him wounded, may not rally, may
# not turn the line, and may not have the day end. It may not have him try to
# reach the man across the field, may not have him consider changing sides, may
# not have him think about home, and may not have anybody notice what he is
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 110.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 111.
 bc_the_guarantee_has_picked_up_a_sword_toast:0 "The Cheapest Thing He Owns Is Doing The Most Expensive Work On This Field"
 bc_the_guarantee_has_picked_up_a_sword_toast_desc:0 "He sees it from the rise, in among a hundred other things he is seeing, and it takes him a moment longer than it should to understand what he is looking at. There is a section of his line that is not giving, and the reason it is not giving is one man in it who has decided, apparently some time ago and without telling anybody, that today is the day he stops being an item and starts being a soldier. He is doing it badly and expensively and with enormous conviction. He is also doing it. The line either side of him has stopped looking for permission to move back, because the man in the middle of it plainly has not considered the possibility. And the commander sits on his horse and watches the day being won in that one place by an arrangement that was never meant to fight, that was meant to sit quietly in a hall and be worth something by existing, and he finds he is already thinking about what he will do with it in the spring, when it stops being a good afternoon and goes back to being a piece of paper with a life attached.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_was_a_clause_in_something_before_he_was_a_man_toast:0 "He Is In This Line Because Of A Conversation He Was Not At"
 bc_knight_he_was_a_clause_in_something_before_he_was_a_man_toast_desc:0 "There is a banner on the far side that he has known the look of since he was small, and it is not a comfort, and it is not an enemy either, and the whole afternoon is being spent in the space between those two things. Everything he has ever been told about who he is came from under that banner. Everything he has actually done since he was old enough to do anything has been done a long way from it, on somebody else's ground, at somebody else's table, in a house that was scrupulously kind to him in the specific way you are kind to something valuable. So the line goes back and he goes back with it, and it goes back again, and he is not fighting well because there is nothing to fight well for: whoever wins this, the thing he is does not change, and he understood that before the first hour was out. What he does instead is refuse to be the reason it goes any faster. He takes what comes at him. He takes more of it than his share, because taking it is the only part of today that is his to decide, and by the time the light is going there is more of his own blood on him than anybody has thought to remark on, and he could not tell anybody what he is proving or to whom.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 110 - the reputations that are not his ----------------------------
#
# NEITHER OF THESE TWO MAY NAME ANYBODY, living or dead, and neither may use
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 112.
# Both pages are about reputation and neither is allowed the vocabulary of it.
#
# NEITHER MAY QUOTE A SONG, a singer, a herald, a boast or a rumour, and neither
# may have anybody on the field say anything about anybody's name out loud.
# Reputation in both pages is a thing that has already been decided somewhere
# else and arrives here as weather.
#
# THE FIRST MAY NOT COUNT THE FAR SIDE'S MEN, may not describe any one of them,
# may not have any of them do anything, and may not have him lose to one of them
# in particular. It may not turn the day around, may not have him give an order
# that is quoted, may not have him wounded, and may not have anybody comfort
# him. It may not decide that the far side's names are deserved or undeserved -
# the page is not allowed an opinion, only an observation.
#
# THE SECOND MAY NOT SUCCEED. He may not kill anybody of consequence, may not be
# seen by the person whose opinion he is riding for, may not be praised, may not
# be stopped, and may not be wounded in a way that ends anything. It may not
# name what he is inheriting or from whom, may not have him think about the
# other man's death, and may not have him admit to himself what he is doing. It
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 113.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 114.
 bc_the_names_are_all_on_the_other_side_of_the_field_toast:0 "He Is Losing To An Army That Was Better Known Than His Before Either Of Them Arrived"
 bc_the_names_are_all_on_the_other_side_of_the_field_toast_desc:0 "It occurs to him, somewhere in the wreck of the second attempt at the left, that everything coming at him today has already been talked about somewhere he was not. He does not think this bitterly and he does not think it for long. It is simply a fact about the field, the way the slope is a fact: the men over there have been paid for, in gifts and in patience and in years of somebody keeping them fed and pleased and near at hand, and the men on this side have been paid for too, in coin, at the going rate, and the difference between those two arrangements is standing in front of him doing what it was always going to do. He is not sure the far side is fighting better. That is the strange part, and he goes back to it twice while the line is coming apart. Man for man he can find nothing in it. What he can find is that his own people are waiting, in a way they would not be waiting if the ground were reversed — waiting to be told, waiting to be sure, waiting an extra half-breath for somebody to go first — and there is nobody in his household this year whose going first would settle anything.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_name_is_promised_and_the_day_is_not_toast:0 "There Is A Version Of Him Written Down Somewhere And It Is Not This One"
 bc_knight_the_name_is_promised_and_the_day_is_not_toast_desc:0 "The day has gone wrong in the ordinary way, without a moment in it anybody will remember, and that is the thing he cannot stand about it. A defeat with nothing in it. He rides at the part of the far line that is furthest from anything useful, because it is the part where a man can be seen, and he does it three times, and each time it costs the horse under him more than it costs anybody in front of him. Nothing comes of it. He does not break anything, he does not reach anybody worth reaching, and by the third pass his horse is doing something with its head that he has felt before and has never once ignored, and he ignores it. What he is riding at is not the enemy. It is a line of writing in a chamber he has never been inside, saying what he will be allowed to be called one day, on the day somebody else has finished being it, and he has begun to understand that it is a description of a man he will have to become in public rather than a promise about who he already is. The line goes back behind him while he is doing this. He knows that too.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 111 - how many people are left with that name ---------------------
#
# NEITHER OF THESE TWO MAY NAME A HOUSE, a person, a seat, a sigil or a motto,
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 115.
# a person. The engine has already done the counting. Both pages are about what
# a very small number feels like from inside on one particular afternoon.
#
# NEITHER MAY LIST THE DEAD, may not say how any of them died, may not give a
# war, a year or a place for any of it, and may not have anybody remember
# anybody. The subtractions all happened somewhere else and neither page is
# allowed to go there.
#
# NEITHER MAY MENTION CHILDREN, marriages, pregnancies, betrothals or any
# arrangement for continuing anything. Both pages are about arithmetic that has
# already been done, not about arithmetic somebody could still do.
#
# THE FIRST MAY NOT RALLY, may not turn the line, may not have him wounded, may
# not have him consider his own death directly, and may not have him say
# anything to anybody. It may not have the men around him know what he is
# thinking, may not have anybody comfort him, and may not end the day.
#
# THE SECOND MAY NOT REACH THE MAN, may not kill him, may not capture him, may
# not have him seen close up, and may not have him say a word. It may not have
# root feel pity, may not have root feel triumph, may not have root decide
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 116.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 117.
# anything".
 bc_the_arithmetic_of_the_name_is_very_small_now_toast:0 "There Is Not Very Much Of This Left And Most Of It Is Sitting On This Horse"
 bc_the_arithmetic_of_the_name_is_very_small_now_toast_desc:0 "It arrives at him sideways, the way the important things do, while he is watching the second rank shuffle to fill a gap that is going to open again in a moment. It is not a thought about dying. He has had those and they are ordinary and they do not feel like this. It is a much flatter observation, almost clerical: that whatever this afternoon does to him it is also doing to a quantity, and the quantity is now so small that it can be held in the head without effort, which was not true when he was young and is the whole of what has changed. He does not do anything about it. There is nothing to do about it that is different from what he was already doing, which is to make the men in front of him stand where they are for one more push, and then one after that. What it changes is the temperature of the standing. He stops thinking about the battle in terms of the ground and starts thinking about it in terms of hours, and he goes very calm, and the line — which has no idea why — finds that the orders coming down it have got shorter and stopped containing any doubt at all.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_end_of_a_name_is_a_short_afternoon_toast:0 "They Are Not Chasing An Army Any More And Everybody Riding Knows It"
 bc_knight_the_end_of_a_name_is_a_short_afternoon_toast_desc:0 "The fighting stopped about a mile back. What is happening now has the shape of fighting and the pace of work, and root is in it with perhaps forty others, strung out across ground that is going soft, and the thing they are following has stopped being a formation and become a direction. He is aware, in the incurious way you are aware of the weather, that this is the shorter kind of afternoon: not the sort that ends when one army has had enough, but the sort that ends because there stops being anything on the other side of the question. There is no order to that effect. Nobody has said it. It is simply understood along the whole ragged length of the pursuit, in the way that men who have done this before understand what is expected without needing to be unpleasant about it, and it makes everybody slightly quieter and slightly more careful with their horses. Root rides. The ground goes past. He is not thinking about what is at the end of it, and he notices that he is not thinking about it, and he keeps riding anyway.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 112 - the shape of the rest of his wars ---------------------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER WAR, its enemy, its cause, its place
# or its year, and neither may say how many wars there are. The engine has
# already answered that. Both pages are about what carrying that answer feels
# like on one afternoon in one field.
#
# NEITHER MAY USE A MESSENGER, a rider coming in, a letter, a dispatch, a
# report or any news arriving from anywhere. Nothing may reach either man from
# outside this field. What either of them knows about elsewhere, he brought
# with him this morning.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 118.
# the first is allowed its figure of speech and the page is not.
#
# THE FIRST MAY NOT RESOLVE INTO A DECISION. It may not withdraw, may not
# break off, may not send anybody anywhere, may not rally, may not turn the
# line, and may not end the day. It may not have him say the word "enough", may
# not have anybody advise him, and may not have him blame a single person for
# anything.
#
# THE SECOND MAY NOT BE ABOUT GREED IN WORDS, may not price anything in coin,
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 119.
# not have root resent the man he is fighting for. It may not have him charge,
# may not have him kill anybody, may not have him be praised, and may not end
# the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 120.
 bc_there_is_a_second_map_in_his_head_and_it_is_worse_toast:0 "He Is Giving Ground Here With Rather Less Than His Whole Attention"
 bc_there_is_a_second_map_in_his_head_and_it_is_worse_toast_desc:0 "The line is going backwards in good order, which is the only creditable thing about the afternoon, and he is running that retreat with a part of himself while the rest does sums about somewhere he is not. Every man he puts into the gap on the right is a man not standing in a different gap. Every hour this takes is an hour off a reckoning he is not present for and cannot hurry. He has been carrying the pair of them since the thaw and has got tolerably good at it, the way a man gets good at something heavy — not by finding it lighter but by learning precisely where to put his hands and then not moving them. What he has never got good at is being shouted at by one half while he is holding the other. The near business is loud, it is immediate, it is full of people watching his face for instructions, and it takes the whole of him by force every few minutes; and each time it lets go he has to find his place in the far one again from the top. So he gives today the smallest correct answer there is. Keep the shape. Give the ground away evenly. Put nothing into this that he will want in six weeks. It is not an answer that wins here. Here has stopped being winnable, and he worked that out early and without much feeling about it. It is an answer that still has an army in it at dusk.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_is_not_the_war_he_is_actually_fighting_toast:0 "He Is Winning An Afternoon That Belongs To Somebody Else And Means To Come Out Of It Whole"
 bc_knight_this_is_not_the_war_he_is_actually_fighting_toast_desc:0 "He has quarrels of his own and every one of them he opened. Nobody has ever come at him; he has always gone, and he knows that about himself the way he knows his own height, without approval and without shame. Today is not one of them. Today is a field he was asked onto, over a disagreement between two other men that will be settled in a room he will never see, and his name will not be in the settling. It is also going well, which is precisely the danger, because a day that is going well is a day when everybody around you wants it to go well faster. He can feel the rank wanting to move. It comes up through the men on either side of him the way a horse tells you it has decided something before it does it. What he does instead is get shorter and heavier. Shoulders down, shields in, the two on his left told twice to stop leaning out to look. Forward eats horses and wind and shins, and every one of those is a thing he will need in the spring, on ground that will be his own argument. So the line stands. The far side comes onto it and gets nothing, and comes on again and gets less, and is worse afterwards for having tried; and the afternoon shortens itself without taking anything from him that he had earmarked elsewhere.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 113 - what his years are actually going into ----------------------
#
# NEITHER OF THESE TWO MAY STAGE A MEMORY. No boyhood, no teacher, no hall, no
# courtyard scene, nobody remembered by name or by office, and no sentence that
# leaves this field for longer than the half-line it takes to say what a habit
# is. Both pages are about a practice showing up in a place it was not built
# for.
#
# NEITHER MAY NAME A BOOK, a text, a title, a language, a maester, a septon, a
# letter or a scroll, and neither may have anything written down. The first is
# about the shape of an attention, not about its subject matter.
#
# THE FIRST MAY NOT BE CLEVER AT ANYBODY. It may not out-think a named man, may
# not have him pleased with himself, may not have anybody admire him, may not
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 121.
# and it may not produce a plan that a reader could write down.
#
# THE SECOND MAY NOT PLOT. No poison, no bribe, no arrangement made on the
# field, no accomplice, no name of anybody he has ever dealt with, and no
# suggestion that he is about to do anything except be here. It may not have
# him run, may not have him captured, may not have him rescued, may not kill
# anybody, may not have him call himself a coward, and may not end the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 122.
 bc_he_learns_this_field_the_way_he_learns_anything_else_toast:0 "He Is Going Over It Again Because Going Over Things Again Is What He Does"
 bc_he_learns_this_field_the_way_he_learns_anything_else_toast_desc:0 "He has never thought of himself as a soldier and he stopped apologising for that some while ago. What he has instead is a habit, unglamorous and slow, of assuming that whatever is in front of him has rules in it he has not found yet, and of continuing to look some time after other men have decided they understand. So he watches. The far side's second attempt comes in and he watches it the way he would work at a passage he intends to go through four times — not, at first, for what it means, but for what it does twice. It does two things twice. The third attempt is still forming when he starts moving men who do not know why they are being moved, and the fourth goes into a stretch of ground he has quietly arranged to be worse than it looks. There is nothing dazzling anywhere in this. He cannot do it any faster than he does it and he takes no pleasure in it beyond the small flat satisfaction of a thing coming out where it should. It is the same ordinary labour he has applied to every difficult object of his life, turned on material he did not choose and finds a great deal cruder than he is used to, and by the middle of the afternoon he simply has more of the field in his head than the man opposite has, and that turns out to be all the difference there is.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_none_of_his_arrangements_reach_this_far_toast:0 "Everything He Is Good At Needs Quiet And Two People And He Has Neither"
 bc_knight_none_of_his_arrangements_reach_this_far_toast_desc:0 "The work he is actually good at wants two conditions this hedge cannot supply: time, and somebody willing to be alone with him. He has spent the better part of eleven years getting very accurate about how a thing is made to happen from the far side of a courtyard without the person who made it happen ever being the person seen, and the whole of that accuracy is worth nothing here, in a rank folding from the right at about the pace of a man walking. What is left him is the part he never practised. He has a sword because everybody has a sword. He knows the four things you are taught with it and he knows them the way you know words you have not said aloud since you were small — in sequence, without any sense that the sequence is going to help. The first man to reach him he manages. The second he manages worse and takes something across the forearm for it, high up, where the mail stops being generous, and the shock of it is less about the pain than about how ordinary the whole exchange was. After that it stops being anything he can influence. They arrive faster than he can account for them, and there is no room anywhere in the afternoon for the single kind of cleverness he owns.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 114 - who there is above him --------------------------------------
#
# NEITHER OF THESE TWO MAY NAME A REALM, a crown, a title, a seat, a house or a
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 123.
# whom. Both pages are about what that answer does to an afternoon.
#
# NEITHER MAY PRODUCE A LETTER, a messenger, a rider coming in or a document of
# any kind. The first is allowed its figure of speech in the title and nothing
# on the page may cash it.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 124.
# sparing. Both pages are about the absence of a third party, not about mercy.
#
# THE FIRST MAY NOT NEGOTIATE, may not rally, may not turn the line, may not
# have him blame anybody living or dead, may not have him say anything aloud,
# may not have him wounded, and may not end the day. It may not congratulate
# him on noticing.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, may not see him, may not kill or
# take anybody, may not have root think about what he will be given for this,
# may not have the horse die, and may not end the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 125.
 bc_there_is_no_letter_that_would_help_toast:0 "He Has Been Nobody's Man All His Life And It Has Never Cost Him Anything Before"
 bc_there_is_no_letter_that_would_help_toast_desc:0 "The thought turns up while the left is being pressed in for the second time, and it is not fear, and it is not new. He has always known there is nobody over him. It has been the quiet pleasure of his whole adult life, a thing he has enjoyed in a hundred small ways he would be embarrassed to list. What has changed is that the same sentence has stopped being a boast and become a description of his afternoon. There is nobody whose business this also is. Nobody with a larger interest than his own who might therefore be expected to spend men on it. No hand anywhere that is going to reach in from outside the hedge and alter the sum. So he alters what he is doing underneath the orders, which do not change and would not change if help were coming. What changes is the class of decision he is willing to make. He stops making the kind that are worth making if somebody arrives on Thursday — the ground held a little longer than it wants to be held, the line kept whole at the price of being thin — and starts making the other kind, the ones you make when the whole of the future available to you is the next two hours and the road behind. The men do not see any of this. To them he has simply got quieter and begun answering questions with one syllable.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_about_today_will_be_settled_afterwards_toast:0 "Whatever This Afternoon Turns Out To Be Worth Is Being Decided By People Who Are Currently Riding"
 bc_knight_nothing_about_today_will_be_settled_afterwards_toast_desc:0 "The far side is moving and everybody along this stretch has worked out the same thing at about the same moment, without one of them putting it into a sentence: there is no room above this. No older men in a warm chamber in the autumn, weighing what happened here against three other things and calling it a draw. Nothing that happens today is going to be revised by anybody, because the man it would have to be revised with is the man they are chasing and he is the top of it. So it has to be all of it, and it has to be now, and every part of that lands on the horses. Root asks his for the third long effort in an hour and gets it, which is the trouble with a good one — a bad horse tells you no at the second and saves itself and you learn to hate it for that, and a good horse simply keeps producing what is asked until there is nothing behind the asking. He can feel the change in it under him, in the breathing first and then in the way it comes back to his leg a beat late, and he keeps going, because the alternative is a version of this that has to be done again in the spring.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 115 - what he paid to learn about going backwards -----------------
#
# NEITHER OF THESE TWO MAY STAGE THE LEARNING. No teacher, no master-at-arms,
# no yard, no book, no named campaign where either of them worked it out, and
# nobody remembered. Both pages are about a thing already bought and being
# spent, not about the buying.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 126.
# allowed its figure of speech and neither page may cash it.
#
# NEITHER MAY RALLY, may not turn the line, may not save the army, may not end
# the day, and may not have anybody praise or thank either man. Both are losing
# and both stay losing.
#
# THE FIRST MAY NOT NAME AN ENEMY, may not have him speak to a named man, may
# not have him wounded, may not have him doubt himself, and may not have him
# feel satisfaction that is larger than the small flat kind. It may not produce
# a plan a reader could copy out.
#
# THE SECOND MAY NOT KILL ANYBODY, may not have him die, may not have him
# decide anything, may not have him be told he is right, may not have him think
# about the man beside him as a friend, and may not let the holding matter to
# the outcome.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 127.
 bc_he_paid_good_years_to_learn_this_exact_thing_toast:0 "The Worst Afternoon Of His Life Is Also The One He Is Best Prepared For"
 bc_he_paid_good_years_to_learn_this_exact_thing_toast_desc:0 "There is a moment he could put his finger on afterwards if anybody asked, which nobody will: the second push on the right goes in and does not come out again, and the day stops being something he might win and becomes a problem with a known shape. He recognises the shape. He has recognised it perhaps two hundred times in his head — on roads, in the last hour before sleep, standing on hills at other men's battles with nothing whatever to do — and every one of those times cost him something to think all the way through, and this is the afternoon all of that was for. It is not a comfort. What it is instead is a set of instructions arriving in the right order without his having to assemble them: which rank goes and how far, at what interval, who stands while it goes, how long that standing is worth and the point at which it stops being worth it. He gives them without any gaps in his voice. The army comes off the ground in pieces that are still pieces. None of it looks like anything but a defeat, because that is what it is, and the whole of what separates it from the other kind of defeat is invisible from any distance and consists of about eleven decisions taken in the right sequence.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_lesson_he_bought_only_works_one_way_toast:0 "His Answer Is Still Correct And Has Stopped Being Attached To Anything"
 bc_knight_the_lesson_he_bought_only_works_one_way_toast_desc:0 "He has one answer and it has been a good answer for eleven years. Whatever comes, the reply is to be where he already is when it gets there and to still be there afterwards, and he has made a small private religion out of that, and it has paid him more often than it has not. What it does not have is a second part. That is what he finds out this afternoon, standing in a stretch of line that is bowing at both ends: the answer works, precisely as well as it has ever worked, and it connects to nothing. He is not moved. The four men nearest him are not moved either, because he is not, and for a while there is an odd immovable lump in a line that is otherwise going quietly sideways. Then the ends come round. He is aware, dimly, with his shoulder into a shield and no breath spare to think it properly, that not being moved is a different thing from being any use, and that somewhere behind him there was a judgement to be made about the whole of this and it was never going to be his to make. He stays. It is not courage by this point in the day. It is the only instruction he owns, still running, in the middle of a situation it was never about.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 116 - how his people fight, as opposed to who they are ------------
#
# NEITHER OF THESE TWO MAY NAME A PEOPLE, a tongue, a homeland, a region, a
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 128.
# people this is. Both pages are about a method showing up in a body.
#
# NEITHER MAY HAVE ANYBODY SING, shout a war cry, invoke anything, or say a
# sentence about what their people do. Nothing on either page may be spoken by
# a group.
#
# THE FIRST MAY NOT COMPARE HIS PEOPLE TO THE FAR SIDE, may not be proud of
# them, may not have anybody admire him, may not rally, may not turn the line,
# may not have him speak to a named man, and may not end the day. It may not
# produce a plan a reader could copy out.
#
# THE SECOND MAY NOT FIND THE GAP. It may not have him get out, may not have
# him kill anybody, may not have the horse die or fall, may not have him blame
# his commander, may not have anybody order him to stop, and may not end the
# day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 129.
 bc_the_oldest_arrangement_his_people_have_is_working_toast:0 "He Has Spent The Whole Afternoon Declining To Improve Something That Is Already Working"
 bc_the_oldest_arrangement_his_people_have_is_working_toast_desc:0 "Nothing he has done since noon would be worth writing down anywhere. The line is where it was an hour ago. The second rank has gone forward twice by a few yards and come back to the same few yards. The entire substance of his afternoon has been to decline three separate opportunities to be clever, and that is a great deal harder than it sounds, and he is probably the only man on this field who knows how hard. There is a thing that happens to a man in his position when a plain arrangement starts to work: the working of it feels like an invitation, and the invitation is always to move something somewhere. He has watched better men than himself accept it and he has seen what accepting it costs. What he has instead is flat, unglamorous and older than any account of it — that the ground under your feet is the ground the whole argument is about, and that the man who moves first has answered a question nobody put to him. So he stands, and the line stands because he does, and the far side comes onto it a fourth time with less in it than the third had, and something goes out of them that is not coming back before dark. He still does not move. The entire merit of the thing is that it will be exactly the same the fifth time.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_no_version_of_this_where_they_leave_toast:0 "Every Good Thing He Knows How To Do Begins With Going Away"
 bc_knight_there_is_no_version_of_this_where_they_leave_toast_desc:0 "Everything he has ever been any good at starts with leaving. Come in at the loose edge of a thing, take what is loose, be half a mile off before the answer to it arrives — that is not a trick he was shown, it is the shape war has in his head and had in the heads of everybody he rode beside before this year. It needs one condition and only one, which is somewhere to go. There is nowhere to go. This line has both its ends fastened to other lines and it is folding inward, and what he does is the only thing his hands and his instincts will produce between them: he takes the horse out along the inside of it hunting for an edge, and finds none, and comes back, and goes out again the other way, and there is none there either. Nobody has ordered any of this. Nobody has forbidden it. The third time out, the horse is not giving him what it gave him the first time, and he can feel with complete precision how much of it he has used and how little he has bought, and he goes a fourth time regardless, because the alternative is to stand still in a rank and be a thing that gets hit, and he has no idea how to be that. It never came up.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 117 - the names that already mean an argument ---------------------
#
# NEITHER OF THESE TWO MAY NAME A HOUSE, a sigil, a seat, a river, a road or a
# person, living or dead, and neither may narrate where the old quarrel came
# from or what it was ever about. The gate is AGOT's list; the pages are not
# allowed to be a history of it.
#
# NEITHER MAY ASSERT THAT THE OTHER HALF OF THE FEUD IS ON THIS FIELD. The
# trigger answers a question about one man's name and nothing whatever about
# who is standing opposite him. Any sentence that puts the counterpart here is
# a lie the script cannot support.
#
# THE FIRST MAY NOT HAVE ANYBODY RECOGNISE HIM, may not have him say his own
# name, may not rally, may not turn the line, may not have him speak to a named
# man, and may not end the day. Nothing on the page may be spoken by a group.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, may not see his face, may not
# have this knight kill anybody, may not have him get out, may not have anybody
# explain the situation to him, and may not end the day. It may not have him
# take the far side's indifference as an insult he intends to answer later.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 130.
 bc_the_name_was_settled_before_the_hedge_toast:0 "The Meaning Of His Name Was Fixed Long Before He Was Handed It"
 bc_the_name_was_settled_before_the_hedge_toast_desc:0 "There is a thing his name does in a room, and it was doing it two centuries before anybody thought of him. He did not build it, he cannot amend it, and by the time he was old enough to be told what it was, the telling was already a formality — he had watched it work on faces since he was small and had worked out most of it himself. It is an inheritance in the way a debt is an inheritance. It arrives complete and it is not negotiable and it decides in advance how a certain sort of conversation is going to go before either party has opened it. What he is doing today has nothing to do with any of that. This is a field, and a hedge, and an hour of the afternoon, and the argument being settled here is about grain and a border and a man's claim, and it is going his way because the ground was chosen well and the second line went in when it was asked to. The name is in his ear the whole time and contributes precisely nothing. He is winning, and the winning is his, and it is a small pleasure of a private kind to notice — between one order and the next, with no time to enjoy it properly — that today is being decided by things he actually did.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_their_quarrel_is_with_somebody_else_toast:0 "They Are Fighting Him The Way You Fight A Stranger"
 bc_knight_their_quarrel_is_with_somebody_else_toast_desc:0 "The man they follow has one of those names that comes with an old and specific hatred already attached to it, and everybody on this field knows it, and none of it is aimed anywhere near this knight. He can feel that. It is in the way they come on: briskly, competently, with the flat efficiency of men doing a job of work, none of the extra half-inch that arrives when a blow has something personal loaded into it. They put him back a pace and take the pace, and put him back another and take that, and it is all quite reasonable and it is all quite thorough and it does not stop. His own line does not break for any of it — the ranks give ground the way a door gives ground, straight and grudging, without gaps — and that is the only thing he has to be pleased about, and it is getting smaller. What sits oddly, in the two or three seconds an afternoon like this allows for sitting oddly, is that whatever those men are truly angry about is not here at all, and will still be waiting somewhere for somebody else long after this hedge has been forgotten. He is simply what is in front of them. He goes back another pace with the rest of them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 118 - the men on his payroll who are not here ---------------------
#
# NEITHER OF THESE TWO MAY NAME THE PAID MAN, describe his face, give him a
# line of speech, put him on this field, or have him be thought of as a person
# with an opinion about today. Both pages are about the residue of somebody's
# year of work showing up in a place he is not.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 131.
# title being conferred, and neither may quote a letter, read a letter aloud,
# or have anybody arrive with one.
#
# THE FIRST MAY NOT RALLY, may not turn the day, may not have the commander
# decide anything about the man he pays, may not have anybody thank him or
# blame him, may not have him speak to a named man, and may not end the day.
#
# THE SECOND MAY NOT KILL A NAMED MAN, may not reach any commander, may not
# have anybody praise him, may not have him imagine the words of the record,
# and may not end the day. It may not be pleased with itself.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 132.
# them".
 bc_what_the_paid_man_left_in_their_hands_toast:0 "Everything Keeping Them Together Was Put There Last Winter By Somebody Not On This Field"
 bc_what_the_paid_man_left_in_their_hands_toast_desc:0 "They are losing and they are losing in one piece, and he is close enough to see why. It is nothing anybody is deciding. It is the shoulder going into the shield at the same moment as the foot, over and over, in men too tired to be choosing it; it is the second rank taking a half-step across without being told when a gap opens in front of them; it is the fact that when a man goes down the two beside him close without either of them looking. He knows exactly where all of that came from. It came out of a hard, boring, unglamorous winter in a yard behind his own walls, an hour at a time, done by a man he pays a salary to and has not seen since spring and who is not standing anywhere near this hedge. That is the whole of the household's contribution to today and it is the only reason there is still a formation here rather than a crowd going the same direction. He can spend it and he cannot add to it. Every ten minutes takes a little more of it out and there is no more coming, and the arithmetic of that sits behind his teeth while he watches the line back away from the pressure without breaking: this is going to run out before the daylight does.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_three_lines_of_a_letter_eventually_toast:0 "The Whole Of This Will Arrive Somewhere As Three Lines And A Date"
 bc_knight_three_lines_of_a_letter_eventually_toast_desc:0 "He is a man with tenants and a roof and an account of what the roof cost, and he is also, at present, forty minutes into pushing a shield into somebody's chest with a good deal of success. Both of those are true and they belong to different lives, and every so often on a day like this the two touch. It happens now, in the gap between one press and the next, with his own side plainly getting the better of it and the far rank giving in the untidy way ranks give when they have stopped believing: he thinks, with no feeling attached whatever, that all of this — the shouting, the going forward, the man he has just put down and the four before him, the hour it has taken and the hour it will still take — will end up somewhere behind him as a short entry with a date on it, and that the entry will be correct, and that it will contain nothing. Not a lie. Simply nothing that is happening. He does not resent it. He is not even sure he would want it otherwise. It is only strange to be inside a thing and to know already how small it goes when it is put away.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 119 - the arrangement that has not happened yet -------------------
#
# NEITHER OF THESE TWO MAY NAME THE OTHER PARTY TO THE MATCH, describe her,
# give her a house, a seat, an age or a face, or have anybody at all speak the
# arrangement out loud on this field. Neither may quote a contract, produce a
# document, or have anybody arrive with news of one.
#
# NEITHER MAY SETTLE THE MATCH IN EITHER DIRECTION. The first may not break it
# off, resolve to keep it, or decide anything about it; the second may not
# imagine the wedding happening or not happening. The gate says a promise is
# outstanding and says nothing whatever about how it ends.
#
# THE FIRST MAY NOT RALLY, may not turn the day, may not have him speak to a
# named man, may not have anybody console him, and may not end the day.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, see him, kill him, kill a named
# man at all, be ordered to stop, be admired, have the horse die or fall, or end
# the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 133.
# away".
 bc_a_date_in_the_spring_that_assumes_he_is_alive_toast:0 "There Is A Signed Thing Somewhere Whose Whole Second Half Depends On Him Getting Through This"
 bc_a_date_in_the_spring_that_assumes_he_is_alive_toast_desc:0 "The afternoon has been going against him for long enough now that he has started pricing it, which is a habit he cannot switch off and which is not helping. And the price keeps landing on the same item. There is an agreement in existence, made by men in a warm room over a season of letters, with terms in it and a season named, and every clause of it was drafted on the flat assumption that he would be a living man in the spring standing where he was expected to stand. It is not a hope. It is a schedule. Other households have already begun arranging themselves around it — travel, timber, a season's worth of small commitments — and none of those people know that this hedge exists or that the far side has been putting men into his second rank for the last hour and taking ground for it. He is bleeding it away by the quarter-hour and the odd part is how orderly it feels: not a disaster, just a slow correction, one part of a document going grey at a time. He gets his shield back up. He does not think about it again for a while. It waits, like a bill.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_feast_planned_around_a_man_we_are_trying_to_kill_toast:0 "Somewhere There Are Cooks Being Hired For A Man He Is Spending The Afternoon Trying To Kill"
 bc_knight_a_feast_planned_around_a_man_we_are_trying_to_kill_toast_desc:0 "It is common knowledge, the way these things always are — the lord on the far side is promised, the year is settled, and half the men on this field could tell you as much because it was talked about in a dozen halls before anybody drew a sword. What sits in his head, going forward again with his own side well on top, is the mundane machinery of it. Somewhere a hall is being aired. Somebody is doing sums about barrels. There are people alive today whose whole autumn is being organised around an event which the last two hours have been a sustained and quite well-managed attempt to prevent. He finds it funny in a hard, unpleasant, entirely useless way, and it is what makes him take the horse forward one more time than the situation strictly asks for, and then again after that. The animal is telling him plainly what this is costing. He is not going to get anywhere near the far end of this field and he knows it. He goes anyway, because the alternative is to stop moving and be a man who noticed a joke.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 120 - the slow thing that is running while he is here -------------
#
# NEITHER OF THESE TWO MAY NAME ANYBODY INVOLVED, describe them, place the plot
# on a map, name a house or a hall, give a method, name a poison or a weapon,
# or advance the business by a single step. Neither may have anybody on this
# field say one word about it.
#
# THE FIRST MAY NOT HAVE HIM SEND, WRITE, OR RECEIVE ANYTHING. It may not have
# him check on it, worry about it, feel guilty about it, or decide anything
# about it; it may rest on the fact that it exists and on what a good afternoon
# here is worth to it. It may not rally, may not have him speak to a named man,
# and may not end the day.
#
# THE SECOND MAY NOT LET HIM FIND OUT. He does not know, does not suspect, is
# warned by nobody, and notices nothing; the page holds the fact and he does
# not. It may not kill him, may not wound him by name, may not have the horse
# die or fall, may not have him get out, and may not end the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 134.
 bc_today_is_only_the_loud_half_toast:0 "This Is The Half Of His Year That Anybody Will Ever Hear About"
 bc_today_is_only_the_loud_half_toast_desc:0 "He gives the order to press and it is the right order and it is also, quietly, the cheap one. The far side has begun to come apart at the seam he has been leaning on since the third push, and every yard taken now costs him nothing he was not already spending, and there is a version of this afternoon he could have run more carefully. He is not running that version. He wants this finished visibly and he wants it finished today, and the reason has nothing to do with the field. There is a second thing of his in the world, patient and unhurried and considerably older than this campaign, which does not require an army and will not be written down anywhere and is proceeding at its own pace regardless of what happens here. A loud win makes that second thing easier. Not by much — by a little. Men become less careful when they are frightened of an army; households look outward; the attention of everybody who matters gets pulled onto the wrong subject for a season. So the line goes forward, and it keeps going forward, and he sits his horse with an expression that is being read by four hundred men as satisfaction, and none of them are reading it correctly.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_worst_thing_in_his_life_is_elsewhere_toast:0 "The Likeliest Cause Of His Death This Year Is Not On This Field At All"
 bc_knight_the_worst_thing_in_his_life_is_elsewhere_toast_desc:0 "He is having the worst hour of his life and it is not the dangerous one. That is the true state of affairs and he has no access to it whatever. What he has is a rank that keeps shortening, a rising and horrible clarity about which direction the day is going, and a horse he has now asked for more than the horse has, which he knows and asks again anyway, three times, because standing still while it happens is not something he can make himself do. He is aware only of what is in front of him. Somewhere else entirely — no army near it, no noise, nothing that would look like anything to a man riding past — a thing has been arranged about him and is going forward at its own pace, and it does not care in the slightest about this hedge, and it will still be there next month whether he wins here, loses here or is carried off it. He spends the afternoon fighting the wrong danger with everything he has, which is not a mistake, because nobody has ever told him there is another one, and the horse gives out under him by degrees while he does it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 121 - the other thing that is killing people this year ------------
#
# NEITHER OF THESE TWO MAY NAME A SICKNESS, describe a symptom in clinical
# terms, give it a cause, an origin, a direction of travel or a cure, blame
# anybody for it, or have a physician, a septon or a healer of any kind appear.
# Neither may have anybody die of it on the page.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 135.
# neither may have anybody on the field say what it is. Both pages are about
# arithmetic that was already done somewhere else.
#
# THE FIRST MAY NOT RALLY, may not turn the day, may not have him send anybody
# home, may not have him make a decision about the sick, may not have anybody
# report to him, and may not end the day.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, may not have him catch anything,
# be told anything, kill a named man, pity them out loud, gloat to anybody, or
# end the day. It may not have him slow down out of decency.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 136.
 bc_the_ranks_were_shorter_before_anybody_drew_toast:0 "A Good Deal Of Today's Arithmetic Was Settled Weeks Ago And Not By Anybody Here"
 bc_the_ranks_were_shorter_before_anybody_drew_toast_desc:0 "The line will not do what he asks and he understood why before he asked. He can see it from where he sits: the file that ought to be twelve deep and is eight; the two companies that took an hour longer than they should have to come up this morning and are moving now like men at the end of a long day rather than the middle of one; the ones who came, who are here, who are standing in the correct place and have nothing behind the standing. It is not cowardice and it is not the far side. Whatever has been going through the camp since before this march started has already taken its share of them and it took the share quietly, without a fight anybody could name, in tents at night over weeks, and what he has been left with is the remainder. He is now expected to win with the remainder. He tries the manoeuvre once because the situation demands it be tried and it comes apart in the middle in a way it would not have come apart in the spring, and he stops asking. There is no order that gets him the missing men back. He gives the ones he has the shortest and least ambitious task he can think of, and watches them fail to manage even that, and does not blame them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_they_were_beaten_before_he_got_here_toast:0 "The Men Opposite Are Not Giving Way So Much As Failing To Be There"
 bc_knight_they_were_beaten_before_he_got_here_toast_desc:0 "It takes him three passes to work out what is wrong with them, and when he has it he wishes slightly that he had not. They are not breaking. Breaking has a shape and he knows the shape and this is not it. What is happening is that the far rank keeps arriving at each moment a beat and a half after the moment needs them: the shield comes up late, the step across never comes at all, and twice now a man in the second file has simply sat down in the middle of it with nobody near enough to have put him there. He has seen a body of men move like that once before, in a place he does not much like remembering, and it was nothing to do with an enemy. So the day is going to be a victory and he is going to be part of it and he already knows exactly what the value of it is, which is a good deal less than the men shouting on his left believe. He does his work properly regardless. The line goes forward because there is nothing in front of it that can hold, and he keeps his mouth shut about why.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


# --- batch 122 - the other host that has his name on it ----------------------
#
# NEITHER OF THESE TWO MAY SAY WHERE THE OTHER HOST IS, who leads it, what it
# is besieging or marching to, how many men are in it, which way it is facing,
# or when it moves. Neither may have a rider arrive, a message go out, or
# anybody senior explain the war to anybody.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, and
# neither may count anything in thousands.
#
# THE FIRST MAY NOT WITHDRAW, may not order a withdrawal, may not rally, may
# not turn the day, may not decide to abandon anybody by name, and may not end
# the day. It may not be relieved.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, kill a named man, be told
# anything by anybody, say his conclusion out loud, be contradicted, or end the
# day. It may not predict what happens next.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 137.
# about why".
 bc_this_is_the_cheaper_of_the_two_toast:0 "Of The Two Efforts Carrying His Name This Month, He Has Just Worked Out Which One He Can Afford To Lose"
 bc_this_is_the_cheaper_of_the_two_toast_desc:0 "The thought arrives while he is watching his centre give for the third time, and it arrives without any drama at all, in the same flat voice he uses on himself for questions about grain. This is not the only thing he has going. He has strength committed in two directions this season and he has known the numbers on both since before the march, and up until about a quarter of an hour ago the sensible plan involved this one going well. It is not going well. So the sum reorganises itself, quietly, while men are shouting: what is standing on this grass is worth less to the year than what is standing elsewhere, and the elsewhere does not require anything from him this afternoon except that he not do something stupid here in the next hour. That is a strange thing to know while your own line is bending. It changes nothing about the orders — he still wants the flank to hold and he still means to make them pay for every yard of this — but it takes the panic out of the arithmetic and leaves something colder in its place, which is the understanding that he can survive today being a defeat and could not have survived it being a rout, and that those are two very different afternoons and the difference is entirely his to manage.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_winning_this_one_finishes_nothing_toast:0 "The Men Around Him Believe This Is The End Of Something"
 bc_knight_winning_this_one_finishes_nothing_toast_desc:0 "They are winning and it is costing more than the shouting suggests. He is going forward with the rest and taking his share of what going forward costs — a rank does not come apart politely, and the men still in it are still swinging, and there are gaps opening in his own file that will need explaining to somebody's mother. He does the work. What he cannot make himself believe, while everybody within ten yards is behaving as though the war ends when this rank does, is the thing they all seem to have decided: that the lord opposite is finished when this host is. Everyone in camp has known for a fortnight that the man has strength committed somewhere that is not here. Nobody knows where, nobody sensible pretends to, and it does not matter — what matters is that the thing they are currently paying for in the middle of this field is one host and not one enemy. So he goes forward and keeps going forward and takes the wound in his forearm that he will remember longer than the victory, and thinks, with no bitterness and no intention of saying it to anybody at all, that they are going to do this again.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 123 - the man who is holding it while he is out here ---------------
#
# NEITHER OF THESE TWO MAY NAME THE MAN AT THE OTHER END OF THE ARRANGEMENT, say
# where he is, what he is doing with the authority he has, how old he is, how he
# got it, or whether he is any good at it. Neither may suggest that the
# arrangement is illegitimate, disputed, or about to be broken, and neither may
# have anybody at home take a decision on the page.
#
# NEITHER MAY HAVE A RIDER ARRIVE, a message go out, or anybody senior explain
# the war. Neither may name a place, a road, a river crossing, a castle or a
# town, and neither may count anything in thousands.
#
# THE FIRST MAY NOT WITHDRAW, order a withdrawal, rally, turn the day, abandon
# anybody by name, be relieved, or end the day. It may not accuse anybody of
# anything.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, kill a named man, capture
# anybody, be told anything by anybody, be contradicted, end the day, or say
# what happens to the far host after today.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 138.
 bc_a_man_at_home_signing_in_his_name_toast:0 "Whatever Is Left Of Today Will Be Explained To Him By A Man Who Has Been Doing His Job Since Spring"
 bc_a_man_at_home_signing_in_his_name_toast_desc:0 "He gave the seal away himself, in a room, with the door open and two witnesses, and at the time it was the sensible thing and it is still the sensible thing. Somebody has to answer the letters. Somebody has to say yes to the millers and no to the cousins and put a name at the bottom of it, and a lord who is going to be four months in the field cannot do that from a tent. So there is a man at home doing it, correctly, and every one of those months the household has got a little better at the version of the arrangement where he is not in the room. That is the thought that arrives now, with his left wing folding and the horns going wrong and no possible use for it. He is not being betrayed. Nothing is being taken. It is simply that a man who rides home from a good afternoon walks back into his own hall, and a man who rides home from this one walks into a room that has spent the whole summer learning it can manage, and the difference is not in the ledgers and cannot be argued with and will never once be said out loud to his face. He puts it down. There is an hour of this left and it wants doing properly. But it sits there for the rest of the day like a coin in a boot.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_beating_a_man_who_owns_none_of_it_toast:0 "Halfway Through The Chase It Occurs To Him That The Man They Have Beaten Was Never The Man"
 bc_knight_beating_a_man_who_owns_none_of_it_toast_desc:0 "The far line goes and the whole shape of the afternoon goes with it, and what is left is not a formation and has not been one for a quarter of an hour: forty riders in a long ragged smear across half a mile of ground, each of them chasing whatever is directly in front of him, his own horse blowing hard enough that he can feel it through the saddle. He is not in command of anything and neither is anybody else. And somewhere in the middle of it, with his arm gone heavy and a stitch under his ribs, he remembers what the camp has been saying for a fortnight about the man whose banner they have just ridden over — that it is not his war. He holds the seat, he does not own it. Everything he did today he did on somebody else's account, and the losing of it belongs to a man who is warm, and dry, and not here. It does not make the chase stop and it does not spoil anything. It just sits alongside the good part of it, slightly cold, the way a fact does.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 124 - what is already written in him -------------------------------
#
# THE FIRST MAY NOT SAY WHAT THE EARLIER BATTLE WAS - not where, not when, not
# who was in it, not who won it, not who died in it. No name, no year, no place.
# It may not have him tell anybody about it, be asked about it, or take a lesson
# out of it and apply it. It may not withdraw, order a withdrawal, rally, turn
# the day, or end the day.
#
# THE SECOND MAY NOT SAY WHAT THE SHARED OCCASION WAS, where it was, when it
# was, or who else was at it. The recognition runs one direction only: the two
# of them may not speak, signal, or be mutually aware of each other in any way.
# It may not reach the far commander, kill a named man, be told anything by
# anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 139.
# and dry, and not here".
 bc_the_one_he_already_has_toast:0 "He Has Been Doing This Long Enough To Have One Of These Already, And It Has Chosen This Afternoon To Come Back"
 bc_the_one_he_already_has_toast_desc:0 "It is not a thought and it does not arrive in words. It is nearer to a smell, or to the particular quality of light that a certain kind of afternoon has, and it turns up between one order and the next with no warning and no relevance whatever. He goes on working. That is the strange part and the part nobody would believe: the mouth keeps issuing perfectly sound instructions in the correct sequence, the arm keeps pointing at the right sections of the line, and none of it is being supervised. Some quantity of him that he cannot get at is elsewhere, occupied entirely, running through something at its own pace and in its own order and refusing to be hurried. He does not know how long it lasts. Long enough that the horse under him has moved twenty yards without being asked. And what it costs is not courage, because he is not frightened and would say so under oath — it is that the fraction of a man which notices the second and third things is the fraction that is currently unavailable, and this is precisely the hour of the day that wants all three.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_been_in_a_room_with_that_man_toast:0 "The Banner Opposite Comes Close Enough That He Can See The Man Under It, And He Knows The Face"
 bc_knight_he_has_been_in_a_room_with_that_man_toast_desc:0 "Not a name he was told and not a thing the camp says. He has been in a room with that man. He has watched him eat, and heard the register he drops into when he is talking to somebody he does not have to be careful with, and could describe the way he holds his shoulders when he is bored. None of which is worth a single yard of ground, and he knows that, and it changes what he does anyway — because whatever else is true of this afternoon, the version of it where a man who has seen him at close quarters watches him take a step backwards is not going to exist. So he stops. Not a decision so much as a refusal: feet apart, shield up, arm braced, this precise square of churned grass and no further discussion about it. The men on either side of him settle without being told, the way men do when somebody near them has visibly stopped negotiating. It is a small piece of the line and it is going nowhere, and it holds for the rest of the hour, and not one person will ever know what the reason was.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 125 - what the house bought before he was born ---------------------
#
# NEITHER OF THESE TWO MAY NAME THE ANCESTOR, say when the thing was bought,
# what it cost, who argued about it at the time, or what the family got out of
# it before today. Neither may produce anybody who could explain it, and neither
# may put a number on it out loud.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# THE FIRST MAY NOT WITHDRAW, order a withdrawal, sound anything, name a road,
# rally, turn the day, abandon anybody by name, or end the day. The moment is
# the arithmetic and not the act.
#
# THE SECOND MAY NOT REACH THE FAR COMMANDER, kill a named man, be told anything
# by anybody, be contradicted, or end the day.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 140.
# will ever know what the reason was".
 bc_somebody_dead_already_paid_for_this_hour_toast:0 "The Most Useful Thing His Family Ever Bought Turns Out To Be The One Nobody Boasts About"
 bc_somebody_dead_already_paid_for_this_hour_toast_desc:0 "He stops solving the battle at some point in the last quarter of an hour and starts solving the other problem, and the switch is so quiet that nobody near him notices it happen. The question is no longer how this is won. The question is what it costs to be somewhere else by dark, and the difference between the two answers is the difference between a bad season and no house at all. And the odd thing, the thing that would sound like ingratitude if he ever said it, is that his people are good at this. Not at the shouting part. At this part. There is a way of coming off a field that his father did without discussing it and his grandfather did before that, and it is in the men the way a dialect is in them — the order the ranks come apart in, the thing the rear does while the front is still busy, the fact that nobody runs. None of it was his idea. He is standing inside four generations of somebody else's expenditure, spending it, and it will be written down afterwards as his good judgement, and he already knows that, and he takes the credit anyway because a man who is about to lose this badly does not get to be fastidious.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_fifteen_percent_nobody_can_see_toast:0 "He Is Better At This Than The Man Beside Him And Neither Of Them Has Ever Worked Out Why"
 bc_knight_the_fifteen_percent_nobody_can_see_toast_desc:0 "The exchanges keep going his way and they should not, not by this much. The man on his left is bigger, has the longer reach, and trained in the same yard under the same sour old master, and is having a considerably worse morning of it. It is not luck, because luck does not last four separate engagements. It is not the ground, because they are standing on the same ground. He turns it over between one push and the next and gets as far as this: something about the way he was taught to move his feet was already correct before anybody taught it to him. It was in the house. It came in with the surname, along with the colours and the debts and the particular set to the jaw that his aunts all have. Somebody long dead spent something enormous on making the men of this family slightly harder to kill, and got nothing for it in their lifetime, and the return on it is arriving right now, in this yard of mud, in the arm of a man who could not tell you their name.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 126 - the people in his hall who are not his ------------------------
#
# THE FIRST MAY NOT NAME A GUEST, say whose man he is, where he is from, what he
# thinks, or what he will say afterwards. It may not put anybody on the field
# who was not already on it. It may not withdraw, order a withdrawal, rally,
# turn the day, abandon anybody by name, or end the day.
#
# THE SECOND MAY NOT NAME HIS OWN LORD, say where he is from, why he is here,
# how long he has been here, or when he goes back. It may not have him claim
# anything, be promised anything, or be spoken to about his position at all. It
# may not reach the far commander, kill a named man, be told anything by
# anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 141.
 bc_men_under_his_roof_who_will_describe_this_toast:0 "It Is Lost, And The Only Thing Still Being Decided Is Which Version Of It Gets Repeated Somewhere Else"
 bc_men_under_his_roof_who_will_describe_this_toast_desc:0 "There are men sleeping under his roof this month who are not his. They eat at his table, they are polite about the wine, and every one of them belongs to somebody a long way off who will want to be told how his host is getting on. That is not a suspicion and it is not a grievance; it is simply what a guest is for, and he has been one himself, and he did exactly the same. So he stands in the middle of an afternoon that is finished and finds that the remaining question is small and precise and entirely presentational: not whether the line goes back — it is going back — but whether it goes back at a walk. Because one of those two things is a season's bad luck and the other is a thing that follows a name around for twenty years, and the difference between them is about ninety yards of ground and four men who have to be told, calmly, in an ordinary voice, to turn round and step off together. He gives that order. It is not a brave one and it will win him nothing, and it is the last order today that will still matter next year.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_everything_he_wins_today_he_has_to_carry_toast:0 "He Is The Only Man In This Chase Who Cannot Bank What He Does In It"
 bc_knight_everything_he_wins_today_he_has_to_carry_toast_desc:0 "He is not from here. He sleeps in this hall, he takes this hall's meat, and none of it is his — there is a lord somewhere who owns his oath and a room somewhere that has his things in it, and neither of them is on this field. Which means the arithmetic he is doing at a canter is different from everyone else's. The men around him have started easing up, quite sensibly, because the thing is won and a won thing keeps, and every one of them will be paid in the ordinary way by being seen for the rest of their lives by people who were here. He does not get that. He gets what he can carry out of this in his own two hands and describe later to people who were not, and a description is worth roughly a tenth of a memory. So he does not ease up. He goes another three hundred yards past the point where it stops being sensible, on a horse that has begun to tell him about it, taking the kind of risk that would look stupid in a man with a seat waiting for him, and it is not courage and he knows it is not courage. It is freight.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 127 - how much of this is bought and how much is owed --------------
#
# THE FIRST MAY NOT NAME A COMPANY, a captain, or a type of soldier, may not say
# how many men are in any of them, and may not give an order to one. It may not
# withdraw, order a withdrawal, rally, turn the day, abandon anybody by name, or
# end the day.
#
# THE SECOND MAY NOT SNEER. It may not call them cowards, have any of them
# break, count them, or name what they are carrying in any word that implies
# contempt - the men opposite are exactly where their lord told them to be. It
# may not reach the far commander, kill a named man, be told anything by
# anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 142.
# ordinary voice".
 bc_the_companies_are_the_part_he_can_price_toast:0 "The Part Of This Army He Pays For By The Month Is The Part Currently Being Used Up"
 bc_the_companies_are_the_part_he_can_price_toast_desc:0 "He knows to the coin what those men cost him. Not roughly — exactly, because it goes out of his hands on a fixed day whether there is a war on or not, and it has done for years, and a figure a man handles that often stops being a figure and becomes a sort of weather he lives in. So while the middle of his line does the thing that middles do, he watches the only part of this host that is still behaving like a machine hold the join together, and he is doing the sum at the same time, against his will, in a part of his head that will not be switched off. This is what they were for. He is not being robbed; he is spending them, correctly, on the one purpose that justified buying them, and the fact that they are the best thing he owns is precisely why they are where they are. And underneath that, quieter and much worse: whatever is left of them tonight is what he takes into next year, and next year is not going to be gentler, and there is no version of the winter in which he replaces this.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_over_there_is_anybodys_trade_toast:0 "He Works Out What The Far Side Is Made Of Before Anybody Has Told Him Anything"
 bc_knight_nothing_over_there_is_anybodys_trade_toast_desc:0 "It is not a guess and it takes him about the length of one held breath. Nothing over there matches. Not the helms, not the shafts, not the length of the shafts, and above all not the way the second rank is standing — which is the way men stand when they have been placed somewhere by somebody and are waiting to be told the next thing, rather than the way men stand when the next thing is their own job. There is no core to it. No block anywhere in that line that keeps its interval when the interval gets uncomfortable. It does not make him think less of them; they are farmers and cottars and the third sons of small halls, they are precisely where their lord told them to be, and several of them are going to be braver this afternoon than he is. It only tells him what the rest of the day is: not whether, but how long, and how far, and at what cost to his own side. He takes the reading, holds his place, says nothing about it to the man on his right, and adjusts what he is going to do next accordingly.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 128 - the money that left before the war did -----------------------
#
# THE FIRST MAY NOT NAME THE WORK. It may not say what it is, what it is made
# of, who is making it, what it cost or when it is due. The work may not be
# finished, arrive, be damaged or be mentioned by anybody on this field. The
# desc may not withdraw, order a withdrawal, rally, turn the day, or end the
# day.
#
# THE SECOND MAY NOT NAME THE TRADE. It may not say what he made, what it was
# made of, where it is now, or let one person on this field know about it. It
# may not reach the far commander, kill a named man, be told anything by
# anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 143.
 bc_the_work_he_paid_for_is_still_being_made_toast:0 "There Is One Line In His Accounts That This Afternoon Cannot Reach"
 bc_the_work_he_paid_for_is_still_being_made_toast_desc:0 "Somewhere a long way from here a man got up this morning and went to work on something he ordered and is paying for, and that man does not know today is happening. He will not know for a month. In the meantime he will keep at it with the ordinary care of somebody being paid properly by a patron who has never once stood over him, and one day it will be finished, and it will be exactly what was asked for. That is what the money was actually for: to buy a thing that goes on being made whether or not the man who commissioned it is having a good year. He did not think of it as insurance when he signed for it. He thinks of it as insurance now, in the fourth hour of a day that is going the other way, with his line holding where it stands mostly because it has nowhere better to stand and everyone in it has worked that out. And it steadies him, and he is not proud of why. Not because the work will outlast him — that is the kind of thought a man has in a chair, with wine. Because there is a place in the world tonight where his name is attached to something patient and undecided and entirely unconnected to arms, going forward at its own speed, in daylight, with nobody shouting.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_hands_do_not_know_the_difference_toast:0 "His Hands Were Trained Twice And Nobody Ever Told Them The Two Trades Were Different"
 bc_knight_the_hands_do_not_know_the_difference_toast_desc:0 "He finished something once. Finished it — not nearly, not enough, but the stage past which there is nothing further to be done to it, which most men who begin a thing never once reach in their lives. It took him years, it very nearly beat him twice, and there is nobody on this field who knows about it, because he has never found a way to say it to soldiers that does not come out sounding like a boast about the wrong subject. And now, with the far line opening in front of him and his own side moving into it, he catches his hands doing it again. The same small correction, made once and not repeated. The same refusal to put more force into a thing than the thing takes. The same habit of leaving alone whatever part does not need him. His forearm is opened along the outside and he has registered that, and filed it, and gone on, in precisely the way he used to go on when something went wrong late in the work and there was nothing for it but to keep the hands moving and stay in the hour. None of this was learned for a field. It came across anyway, unasked, and what he feels about it is not comfort but something stranger — that the most careful years of his life have turned out to be usable here, in the one place that has no care in it at all.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 129 - the doors at home, and the one already shut ------------------
#
# THE FIRST MAY NOT NAME A PRISONER, say who any of them is, where any of them
# is kept, or what any of them is worth in coin. Nobody may be ransomed,
# released, killed, moved or spoken to. The desc may not give an order to
# anybody about anybody, and may not end the day.
#
# THE SECOND MAY NOT NAME THE RELATION or the man holding him, say where the
# cell is, say how long it has been, or price the ransom. It may not rescue
# anybody, promise to, reach the far commander, kill a named man, be told
# anything by anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 144.
# anyway, unasked".
 bc_winning_means_the_cells_fill_again_toast:0 "He Can See The End Of This Now, And The First Thing It Puts In His Head Is The Doors At Home"
 bc_winning_means_the_cells_fill_again_toast_desc:0 "He is keeping men. Not many, and none of them interesting, and he has not thought about them properly since the spring, because that is what they turn into once the first month is over — bread, somebody to carry it, a door somebody has to check twice a day for the rest of the year. And now the far line is bending in the way that lines bend when they are not going to come back, and the thought arrives in entirely the wrong order: before the relief, before the pleasure, before anything a man is supposed to feel when the thing finally goes his way. There are going to be more of them. Not tonight — tomorrow, when the ones who cannot walk have been sorted from the ones who can and somebody who is not him has decided which of them are worth the trouble of keeping. Every one will be a price, and a season of another family arranging itself quietly around a gap, and he knows precisely how that goes, from both ends, because he has stood at both. It does not stop him and it does not slow him. It arrives, and takes its place, and settles in, and he goes on giving the afternoon the shape he wants it to have with one small permanent adjustment now made to what he privately understands winning to consist of.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_a_second_cell_in_the_same_family_toast:0 "The Men In Front Of Him Would Much Rather Take Him Than Kill Him, Which Is Exactly Why He Will Not Let Them"
 bc_knight_a_second_cell_in_the_same_family_toast_desc:0 "There is already one of his behind a door. Long enough now that the family has stopped saying so aloud and started arranging itself around the gap, the way a household arranges itself around a chair that nobody sits in any more. He knows what it costs to the last stag, not because anybody told him but because he watched what the finding of it did to the man who had to find it. And that is the thing standing at his shoulder now, late, with his side going backwards a step at a time and the blood in his boot gone from warm to cold. Nobody over there is trying to kill him. That is the part men outside a line never understand: someone in good mail with a name on his surcoat is not a corpse, he is a sum, and every man in front of him knows it and would infinitely rather have the sum. Which is the entire reason he will not go down. Not for courage, not for the banner, not for anything that would sound well repeated afterwards by people who were elsewhere. Because there is exactly one thing worse for his people than losing today, and it is losing today and then being told there is a second one to be paid for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 130 - the two relations AGOT hides on purpose ----------------------
#
# THE FIRST MAY NOT NAME HER, quote her, put her in the scene, blame her or
# blame himself in so many words, name a physician, a septon or a remedy, or
# name any relation who stands to gain. It may not withdraw, order a withdrawal,
# rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME HER EITHER, may not stage the night it started, may
# not give it a cause, and may not let one person on this field know about it.
# It may not reach the far commander, kill a named man, be told anything by
# anybody, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 145.
 bc_there_is_no_son_to_make_this_survivable_toast:0 "Other Men Can Afford To Lose An Afternoon Like This One"
 bc_there_is_no_son_to_make_this_survivable_toast_desc:0 "Eleven years, and the room upstairs is precisely as quiet as it was in the first of them. Nobody mentions it — not his steward, not his septon, not her, least of all her — and the silence around the subject has been so complete for so long that he has come to suspect it is the loudest thing in his household. It has no bearing on a field. It ought to have no bearing whatever on a field. And yet here he stands with his flank folding and his reserve already spent, and the ordinary consolation of his class is simply not available to him: other men can afford an afternoon like this one, because the losing of it is survivable, because there is somebody small asleep in a hall a long way off who will be told the story in twenty years by a man paid to make it sound better than it was. He has no such person. Which means the next hour is not a wager on his line — it is the line, the whole of it, beginning and end, standing in one tired body on one bad slope. So he asks the men nearest him for more than they have left, and asks the same of himself, and takes whatever comes of it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_no_hurry_for_the_war_to_end_toast:0 "He Catches Himself Taking The Long Way Round And Working Out Why Afterwards"
 bc_knight_no_hurry_for_the_war_to_end_toast_desc:0 "It is going well. It has been going well for a quarter of an hour, which on a field is a considerable time, and the men around him have the loose quick look of people who can already taste the end of it. Twice now he has caught himself easing his horse a little wide of the shortest line, and twice he has told himself it was the ground. It is not the ground. There is a door at home that he does not open. Nobody announced it and there was no scene worth repeating — only a night that finished in a different room, and then a great many more nights that finished the same way, and a household absorbing it the way households absorb everything, by never once referring to it. Not one man out here knows. That is the particular quality of this arrangement: it is invisible, it is meant to be, and the same men who would pity him openly for a limp or a bad debt have no idea there is anything to pity. So he asks more of the horse than the moment needs, takes the longer of the two ways round, and stays out in the one hour of his life where nothing has to be explained to anybody — and the animal under him will present the account tomorrow, and he knows it perfectly well, and does it anyway.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 131 - how much appetite each of them actually has ------------------
#
# THE FIRST MAY NOT NAME THE MAN OPPOSITE, quote him, reach him, hurt him or
# have anybody carry anything to him. It may not say what was done to build the
# fear or when, may not name a battle, a siege or a year, and may not rally,
# turn the day, or end the day.
#
# THE SECOND MAY NOT LET THE ORDER ARRIVE. Nobody may be told anything, nobody
# may shout, and no decision may be made by anybody - the whole moment is the
# waiting and it must still be the waiting when the desc stops. It may not name
# the commander, name the two occasions it went wrong, reach the far commander,
# kill a named man, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 146.
 bc_the_other_man_does_not_want_this_toast:0 "The Correct Move Costs Him Nothing At All, Which Is The Hardest Kind To Make"
 bc_the_other_man_does_not_want_this_toast_desc:0 "You can see it in what the other man is not doing. He has the ground for a push and he is not pushing. He has had two openings since noon and took neither, and both times the thing that stopped him was not the slope and was not his men — it was a piece of arithmetic he was doing about a name, and the name was this one. It is a strange thing to be, another man's reason for hesitating. Nobody builds that on purpose. It gets built out of a decade of specific afternoons, most of which he would rather not walk through again, and it does not make him proud so much as it makes him tired, and useful. So he does the only thing this actually requires, and it is nearly nothing: sets his feet, has the line dressed, tells the men either side of him to stand and go on standing, and declines every single invitation to be the one who commits first. Over there a man entirely capable of winning this is going to spend the next hour talking himself out of it. The whole of that hour is a gift. It is being handed across by somebody who does not know that he is handing it, and who will remember this afternoon for the rest of his life as the one where the ground was wrong.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_next_order_will_be_a_coin_toast:0 "He Knows Precisely What Kind Of Man Is About To Decide What Happens To Him"
 bc_knight_the_next_order_will_be_a_coin_toast_desc:0 "There is an order coming. He can feel the shape of it the way a man feels weather. The line has gone from bad to considerably worse in about the time it takes to walk a hundred paces, and this is the point in an afternoon where whoever is in charge either sets his teeth and buys a quarter of an hour with somebody's life, or does the other thing — and he happens to know exactly which of those his own commander is. Not a fool. That is what people outside a line never grasp about men of that sort: he is not stupid and he is not vain, he simply carries a wider notion of what is worth attempting than most men do, and it has come off often enough to be the reason he is standing where he stands. It has also failed. Twice, and one of those times cost people the knight could name without stopping to think. So he waits in a line that is coming apart for a decision made by a man he trusts completely and would not wager a horse on, and discovers that both of those are true at the same moment, and that neither of them will alter one thing he does. He will go. Obviously he will go. That was never in question — the only question was what it is going to be, and he has about the length of a slow count to decide how he feels about not yet knowing.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 132 - the two stories a man can be carrying onto a field -----------
#
# THE FIRST MAY NOT NAME THE LENDER, the city it sits in, the sum, the rate or
# the term. Nobody may collect, threaten, arrive or be written to. It may not
# withdraw, order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME THE ORDER HE BELONGS TO, name the man whose face it
# is, name the person he is here for, or say what he is going to do about
# either. He may not kill anybody, be recognised, be suspected, reach the far
# commander, be told anything by anybody, or end the day. He may not be better
# at fighting than the face is supposed to be.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 147.
 bc_the_schedule_does_not_care_who_wins_toast:0 "The Payments Fall Due On The Same Days Whether He Wins This Afternoon Or Not"
 bc_the_schedule_does_not_care_who_wins_toast_desc:0 "He did not pay for this host. He borrowed for it, in a small room, from a clerk who was courteous and unhurried and did not once ask what the money was for, and it is that last part that has stayed with him: the complete indifference of the transaction. Everybody else on this ground cares intensely about the next hour. The men on the slope care. The line behind him cares. Somewhere across the field a man who has disliked him for a decade cares a very great deal. The debt does not. It sits at home in a ledger doing the single thing it does, at the same rate, on the same days, and it will be doing it tonight and next month and in the spring, whichever of the two of them is still upright when this ends. He had assumed — not in words, he had never put it in words, but he had assumed it — that winning would somehow settle the question. He can feel that idea coming apart while he watches his second rank give ground. Losing costs him the war. It does not cost him the debt. It only means he will be paying, on a schedule fixed before either army was on this ground, for a thing he did not get — and that the men who come for it will be exactly as courteous as they were on the day he signed.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_is_not_the_man_whose_face_this_is_toast:0 "Not One Man In This Line Has Ever Met The Person They Think Is Standing Beside Them"
 bc_knight_he_is_not_the_man_whose_face_this_is_toast_desc:0 "The man on his left has been calling him by a name all afternoon, cheerfully, the way men do when a thing is going well, and he answers to it as readily as he answers to weather. It is not his name. He has had it eleven days. He knows the walk that goes with it, the way it holds a cup, the two words it says badly, and the small stiffness in its left shoulder, which he has been careful to keep. What he is doing out here is not fighting. It is maintenance. And the collapse in front of them is an inconvenience of the first order, because a rout invites a man to do things quickly, and at speed a body forgets what it is pretending to be. So he stays precisely as good as this face is supposed to be, and not one degree better, which is the most difficult thing he will do this year. He has watched the entire line for an hour without appearing to look at any of it. He knows which of them drink, which are frightened, which will be dull about it tomorrow. None of that is his business today. His business is one person, on a day that is not this one, and all of this — the shouting, the winning, the friendly man on his left — is only the surface of something very patient, and it costs him nothing whatever to keep it there.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 133 - who is leading the column and who is only in it -------------
#
# THE FIRST MAY NOT NAME THE DESTINATION, the road, the country he set out from
# or the reason for the journey. Nobody may arrive, be sent ahead, be sent back,
# or bring word. He may not order a withdrawal, rally, turn the day, or end the
# day, and he may not be described as having chosen this ground.
#
# THE SECOND MAY NOT NAME THE MAN HE RIDES WITH, name his own house, complain in
# words to anybody, or be answered. He may not kill a named man, reach the far
# commander, recover his own gear, be resupplied, or end the day. Nothing on the
# baggage may be described in detail.
#
# NEITHER MAY NAME A PLACE, a river crossing, a castle or a town, have a rider
# arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 148.
 bc_the_column_is_his_to_lose_toast:0 "Every Man On This Field Walked Here At A Speed He Personally Set"
 bc_the_column_is_his_to_lose_toast_desc:0 "He has been the reason this many men were in one place, moving, for longer than he cares to total up, and it turns out that is not a different job from this one. It is the same job with the shouting brought forward. Everything he is doing now he has already done on foot at dawn in bad temper: deciding how long a body can keep going before it stops being useful, deciding which complaint is a real one, deciding whether the thing in front of him is a problem or merely unpleasant. The men have been watching him make those calls every day for weeks, and the useful part of that is not that they trust him — it is that they have stopped checking. When he tells the second rank to close up they close up without the small hesitation that costs a line its shape, because a man who has told them where to sleep for a month has earned the right to tell them where to stand for an hour. He notices that the far end is holding better than it has any business holding, and understands why, and does not say so. It would spoil it. The only thing he has to do now is not become a different man from the one they have been following, which is easier than it sounds and harder than it looks.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_his_kit_is_on_a_cart_somewhere_toast:0 "Half Of What He Owns Is Two Days Behind Him And Doing Him No Good At All"
 bc_knight_his_kit_is_on_a_cart_somewhere_toast_desc:0 "He is fighting in what happened to be on him. Not what he would have chosen, not what he paid for, not the good stuff — the good stuff is strapped down under canvas with everybody else's, going somewhere at the pace of oxen, and nobody consulted him about that either. There is a specific indignity in it that he has decided not to dwell on, because dwelling is expensive today. What he has instead is the arithmetic: this much protects him, that much does not, and here are the four places on his body where the answer is no. He has already adjusted. He is standing a half-pace closer than he likes, keeping his weight further back, taking things on the flat of it rather than turning them the way he would if he had the right gear on his arm, and every one of those adjustments makes him slightly slower at a moment when slow is the whole problem. The line is going. He can hear it going. And the thought that keeps surfacing, uninvited and useless, is that not one of the men breaking on his right knows he is doing this at half his weight, and none of them would care if they did, and he is not sure they should.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 134 - what the crown on this side is actually worth ---------------
#
# THE FIRST MAY NOT NAME THE OFFICE, the title, the seat, the man he took it
# from, the manner of the taking, or any year. Nobody may renounce him, defect,
# refuse an order, or say anything to him. He may not order a withdrawal, rally,
# turn the day, or end the day, and no crown, circlet or chair may be described.
#
# THE SECOND MAY NOT NAME HIS COMMANDER, name his own house, name what is wrong
# with the claim, or discuss it with anybody in words. Nobody may desert, be
# accused, or be overheard. He may not kill a named man, reach the far
# commander, be spoken to by his commander, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 149.
 bc_nobody_here_swore_to_the_office_toast:0 "Every Man Out Here Is Following A Person This Afternoon, Which Is A Thinner Thing"
 bc_nobody_here_swore_to_the_office_toast_desc:0 "It has taken him until the second hour of a bad afternoon to work out what is actually missing, and now that he has it he cannot put it down. These men came because of him. Not because of what he holds — because of him, personally, because of things he did in front of them or for them or to somebody they hated, and every one of those debts is finite and every one of them is being spent right now at a rate he cannot control. A man who is followed for his office has something underneath him when the day goes wrong. The office does not get tired. It does not have a bad hour. It is still there in the evening whatever happened at noon, and the men who stood for it stood for something that outlasts the standing. He has none of that. He has only the sum of what people privately think of him, and he is watching that sum get smaller in real time, in the specific way the second rank is looking at him and then not looking at him. The awful part is that he cannot even be angry about it. Nobody has broken a word. They never gave him the other kind of word to break.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_line_holds_anyway_toast:0 "They Are Not Convinced And They Are Not Moving, And Those Are Two Different Facts"
 bc_knight_the_line_holds_anyway_toast_desc:0 "He has been in lines that believed and lines that did not, and he can tell them apart from the inside without turning his head. This one does not believe. There is a particular quality to the silence when men have doubts they have decided not to raise today, and it has been sitting over this ground since dawn, and he would be lying if he said no part of it was his. And the line is holding. That is the thing worth noticing, and nobody outside it ever does. Belief is not what keeps a rank together in the third hour. What keeps it together is the man on either side of you, and the fact that stepping back is a decision you would have to make on purpose while two people watch, and thirty years of everyone agreeing that the ones who step back are the ones we do not speak to afterwards. All of that works perfectly well without anybody being convinced of anything. He can feel the enemy front starting to come apart under exactly that arithmetic, applied to men with the same doubts and a worse hour, and he thinks — briefly, and then puts it away, because there is work — that a great deal of what people call loyalty is simply a habit that has not yet had a reason to stop.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 135 - which direction the last peace ran --------------------------
#
# THE FIRST MAY NOT NAME ANY OF THE BARRED MEN, name what he took from them,
# name the settlement, state a term, or say when any of it runs out in months or
# years. Nobody may arrive, send word, or break anything. He may not order a
# withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME THE MAN WHO HOLDS IT, name his own house, name the
# field where it happened, or describe the surrender itself. Nobody may recognise
# him, taunt him, or refer to it. He may not kill a named man, reach the far
# commander, surrender again, be captured, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 150.
 bc_the_list_of_men_who_may_not_come_toast:0 "There Are Men Alive Today Who Would Be Here If They Were Allowed To Be"
 bc_the_list_of_men_who_may_not_come_toast_desc:0 "The thing nobody understands about winning is that it does not remove enemies, it only schedules them. He knows the schedule. He could recite it standing here with his ears full of this, the way another man knows his own children's ages: this one is quiet until the harvest after next, that one longer, that one is nearly out and has been very careful lately to be seen doing nothing. Not one of them has forgiven anything. They are simply barred, by an arrangement that everybody signed and nobody meant, and the arrangement is the only reason his flank is not currently a problem. That is what he is actually standing on this afternoon — not the ground, not the men, but a set of dates. It makes the whole thing feel less like a victory and more like a lease. He is winning here, and the winning is real, and he will take it. He is also aware, in the back part of his head that never quite stops working, that he is spending men and reputation and hours today on one afternoon, while three other afternoons sit somewhere in the future with his name on them, waiting for a season to turn.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_stopped_before_toast:0 "He Already Knows What The Last Half Hour Of This Feels Like, Which Is The Problem"
 bc_knight_he_has_stopped_before_toast_desc:0 "Men who have never lost one think the bad part is the fear. It is not. The bad part is that it happens slowly and you are awake for all of it, and he is awake for this. He recognises the stage they are at. He recognised it about twenty minutes ago and has said nothing, because the men beside him have not got there yet and there is no benefit in their arriving early. He knows what comes after this stage too, and the one after that. There is a version of him that could put his sword down at the correct moment and be perfectly alive in the morning, and he has met that version, and does not care for the acquaintance. So he goes forward instead, harder than the situation warrants, into a part of the line that does not need him — and it is not courage, he would be embarrassed to have it called that. It is closer to being unwilling to sit through the whole thing a second time and know at every point exactly where he is. The horse will not thank him for this. Neither will anybody watching, if anybody is. He is not doing it for them.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 136 - which of the two sides did not come alone -------------------
#
# THE FIRST MAY NOT NAME AN ALLY, name a house, name what was promised or paid
# for the help, or count the contingents. Nobody may leave the field, refuse an
# order, or send to him. He may not order a withdrawal, rally, turn the day, or
# end the day.
#
# THE SECOND MAY NOT NAME ANY BANNER, house, sigil or colour, name his own side,
# or say who the enemy contingents belong to. He may not exploit the seam by
# name, be ordered into it, tell anybody about it, kill a named man, reach the
# far commander, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 151.
 bc_part_of_this_line_is_on_loan_toast:0 "A Third Of What He Is Standing In Belongs To Somebody Who Can Take It Home"
 bc_part_of_this_line_is_on_loan_toast_desc:0 "His own men will stand until he tells them not to, and some of them past that, and he has never once had to think about why. The rest is different. The rest came because a thing was owed and a thing was called in, and every man in it is standing here inside an arrangement rather than a loyalty, and arrangements have an end that everybody can feel approaching. He can feel it approaching. It is not that they are giving way — they are not, they are doing exactly what was agreed and doing it competently — it is that they are doing it like men fulfilling a term. There is a difference between a rank that will hold and a rank that will hold until the debt is considered settled, and the difference is invisible from any distance and enormous from here. He is losing slowly. Slowly is survivable. What he does not know, and what he is trying very hard not to be seen wondering, is which of the men to his left has already privately decided what the debt was worth, and what hour of this afternoon that decision comes due. He cannot ask. Asking is the one thing that would make it happen.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_banners_opposite_do_not_match_toast:0 "The Men In Front Of Him Are Not One Army And He Has Just Found The Join"
 bc_knight_the_banners_opposite_do_not_match_toast_desc:0 "He did not work it out by looking. You cannot see anything from in here. He worked it out because the pressure on his shield changed character about four paces ago, and men who have trained together give way in the same direction and these did not — one part went back and the part beside it went sideways, and there is now a hand's width of daylight between them that neither of them owns. That is the whole of it. Not a weakness, exactly. A seam. Two groups of perfectly good men who have never had to hold a line together and are discovering, right now, that holding a line together is a skill and not an intention. His arm is opened along the outside and he has noticed and set it aside; the arithmetic is favourable and he is not going to spoil it by being careful. What he wants is another four paces of exactly this, applied to the same spot, and he is going to get it, because the seam cannot close while both halves are still expecting the other half to close it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 137 - what each of them is owed on paper --------------------------
#
# THE FIRST MAY NOT NAME THE TITLE, the seat, the man holding it, the document,
# the person who witnessed it, or any year. Nobody may arrive, send word, or
# concede anything. He may not order a withdrawal, rally, turn the day, or end
# the day.
#
# THE SECOND MAY NOT NAME ANY OF THE TITLES, say how many there are, name who
# holds them now, name his own house, or say who he inherited them from. He may
# not kill a named man, reach the far commander, be promised anything, be
# noticed by anybody who matters, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 152.
# expecting the other half to close it".
 bc_the_parchment_is_being_decided_today_toast:0 "The Document Is Perfectly Clear And Is About To Be Overruled By A Field"
 bc_the_parchment_is_being_decided_today_toast_desc:0 "He has read it more times than is dignified. He could recite the operative sentence, and the two clauses that qualify it, and the phrase that the other side pretends means something else, and every one of those words was chosen by careful men in a warm room for exactly this contingency. And none of it has any purchase out here. That is the discovery, and he is annoyed with himself for how late it has come. The parchment does not care that his second line is bending. The field does not care what the parchment says. In an hour somebody will be able to state, as a plain fact about the world, who was right — and the mechanism by which that fact gets established is currently a lot of frightened men pushing at each other in the wrong order. He had believed, in some unexamined way, that being correct was load-bearing. It was not a stupid belief. Everyone he has ever dealt with behaved as though it were true. It is simply that this afternoon is the one procedure in which it does not come up at all, and he is finding out about that while it is happening to him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_has_ever_come_for_what_he_is_owed_toast:0 "He Has Been Owed Things For Twenty Years And Nobody Has Ever Once Been Inconvenienced"
 bc_knight_nobody_has_ever_come_for_what_he_is_owed_toast_desc:0 "There are things that are his. Not in the sense that he has them — in the older, colder sense, the one that is written down somewhere and is entirely true and has never in his lifetime cost the men sitting on them a single hour of sleep. He stopped mentioning it a long time ago, because mentioning it makes people uncomfortable in a way that ends conversations, and because the fourth time you say a thing out loud and nothing happens you understand that saying it is not the mechanism. Nothing is the mechanism. Nothing has ever been the mechanism, except this, and this almost never comes. And here it is: a line already going, men already leaning back, and no reason on the earth to be careful. So he is not careful. He goes at the failing part of it like a man settling something, and it is not really about anybody in front of him, and he knows that, and it does not slow him at all. Nobody watching will connect the two. There is nothing to connect — it is a good knight fighting well on a good afternoon. He will pay for the horse in the morning. He would pay considerably more than that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 138 - whether this field already belonged to somebody -------------
#
# THE FIRST MAY NOT NAME THE FAITH, the god, the site, the rite, the building, or
# the people whose place it is. Nobody may pray, kneel, curse, or invoke
# anything, and no priest, septon, godsworn or holy man may appear. He may not
# order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME HIS FAITH, name a god, quote a prayer, name the site,
# name his own house, or be seen to pray. Nobody may bless him, notice him, or
# say anything to him. He may not kill a named man, reach the far commander, or
# end the day. He may not describe what the place is for.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 153.
 bc_the_field_belongs_to_a_god_he_does_not_keep_toast:0 "He Picked This Ground For Its Slope And Somebody Else Picked It Centuries Ago For Other Reasons"
 bc_the_field_belongs_to_a_god_he_does_not_keep_toast_desc:0 "He looked at this place the way he looks at any place: the fall of it, the footing, where a horse can turn and where it cannot. It took him until well into the afternoon to understand that he was the only man here reading it that way. The others came up this slope already knowing what it was. He can see it in how they are fighting, which is not harder exactly — harder would be simpler — but with a kind of settledness, as though giving way here would be a different and worse category of thing than giving way somewhere ordinary. Nobody has said a word about it. They do not need to say anything about it to each other, which is the entire problem, and he has no equivalent to offer his own men because to him it is a field with a good slope. He has spent his whole life being told that terrain is the thing you cannot argue with. It turns out there is a second thing, older, sitting underneath the first one, and he walked his line onto it this morning without noticing, and it has been quietly working against him since.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_will_not_be_moved_off_this_ground_toast:0 "Of All The Places He Could Have Been Told To Stand, He Has Been Told To Stand Here"
 bc_knight_he_will_not_be_moved_off_this_ground_toast_desc:0 "He has not said anything and does not intend to. It would come out wrong, and half the men around him would think he was making a claim about himself. What he has instead is the thing his feet are doing, which is not moving. Not one boot-length, not the little accommodating shuffle a line makes a hundred times an hour without anybody deciding to. He has always known where he is. That knowledge sat in the back of his head all morning while he checked straps and complained about the wait like everybody else, and it has quietly changed what he is willing to do, and the change is not dramatic and not visible and is worth more this afternoon than his sword arm. The push comes and he does not go back. It comes again and he still does not, and the two men either side of him find themselves not going back either, because that is how a line works — it is nobody's decision, it is a series of small ones made by whoever is least willing. Today that is him. He is aware that this will look, afterwards, like courage. It is not. It is that he cannot make his feet do the other thing.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 139 - the household that is not the marriage ---------------------
#
# THE FIRST MAY NOT NAME the woman, name a child, name his wife, say the word
# for the arrangement, or describe anybody at home. Nobody may speak to him
# about it and no letter may arrive. He may not order a withdrawal, rally,
# turn the day, or end the day.
#
# THE SECOND MAY NOT NAME the woman, say when or how it ended, name a child,
# or name his house. Nobody may notice, ask, or say anything to him. He may
# not kill a named man, reach the far commander, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 154.
 bc_the_household_he_answers_to_is_larger_than_the_marriage_toast:0 "He Is Winning And What He Is Actually Doing Is Dividing It Up"
 bc_the_household_he_answers_to_is_larger_than_the_marriage_toast_desc:0 "The day has turned and he is not taking any of the pleasure in it that the men behind him are taking. What he is doing instead, without having decided to, is arithmetic. Whatever comes out of this afternoon - and something will, the far line has that loose look now - has to be cut into more parts than any man shouting his name this morning would guess at, and he has always carried the exact figure, and the figure is not one and it is not two. So he is careful with it. He does not send the reserve at the moment when sending the reserve would feel best. He does not take the wing that would make the finer story and cost him forty horse he has no way of replacing out of what is actually his. He has spent years quietly keeping a household that is larger than the one people count when they count his, and what that leaves in a man is neither generosity nor meanness; it is a permanent low awareness of how far a given quantity has to reach. It reaches, today, precisely as far as he chooses to make it reach. So he wins slowly and at a price, and in a manner nobody afterwards will think worth the retelling, and he goes home with very nearly everything he set out with.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_other_household_is_already_shut_up_toast:0 "There Was Somewhere Else He Used To Be Careful For"
 bc_knight_the_other_household_is_already_shut_up_toast_desc:0 "The rank he is standing in is coming apart and he knows the exact spot where it will finally go, four men along on his left, and what carries him toward that spot is not any kind of decision. There was, in his life, a second set of rooms. Somewhere with its own hours and its own small settled routine and its own manner of asking what sort of day it had been. That is over. It is no business of anybody's and he has never once put himself in the way of a question about it, and the two men either side of him have no notion that there is a question available, and he prefers it that way. What the ending has left in him does not look like sorrow from outside. It works more like subtraction. He used to fight the way a man fights with two things to come back for, and this afternoon he is fighting with one, and the difference arrives as a willingness that was simply not in him a year ago. He takes a blow he could have slipped, because slipping it meant surrendering the width of his own boots. Then he takes another. There is blood coming down out of his hair and the whole of that side of his face has gone wooden and he does not shift, spending himself on a lost afternoon at a rate that will read, to anyone who saw it, as devotion to the men beside him. It is not that either. It is that the thing he used to keep something back for is no longer there to keep anything back for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 140 - the two appetites that are not courage ---------------------
#
# THE FIRST MAY NOT NAME a god, a faith, a prayer, a rite, a septon or a holy
# man, quote scripture, or have anybody pray. He may not say aloud to anyone
# what he believes, and nobody may ask him. He may not order a withdrawal,
# rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME his commander, quote the order in speech marks, name
# a god or a faith, or name his house. Nobody may apologise to him, thank him
# or explain anything to him. He may not kill a named man, reach the far
# commander, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 155.
 bc_the_reason_he_gives_is_not_the_reason_they_would_give_toast:0 "They Will Give Him The Credit For Cleverness And It Was Never Cleverness"
 bc_the_reason_he_gives_is_not_the_reason_they_would_give_toast_desc:0 "They will say afterwards that he saw the far line go early, and they will have the fact right and everything underneath it wrong. He did see it early. What he has told none of them, and will not, is that he has been watching for it since before the first rank moved, because he did not ride onto this ground carrying a question. Every other man on this slope came here to do a piece of work, and a piece of work has a natural place where it is finished, and men who can see that place begin without knowing it to steer toward it. He has no such place. So when the far right started to drift wide around midday he did not weigh it as a danger set against a gain - the private balance every other man on this slope was keeping simply does not exist in him - and he was therefore looking straight at what was there a good half-hour before anybody else could afford to look at it. It is not sharper eyes. His eyes are ordinary and getting worse. It is that a man who long ago finished deciding what the whole afternoon is for stops spending any part of himself on deciding it, and gets that part back, and has it available for the field. So the credit will go where credit goes. He could not explain the difference in a way that would survive being said, and he is not going to try.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_order_came_from_a_man_who_can_afford_it_toast:0 "Somewhere Behind Him A Small Sum Was Done And He Was One Of The Figures"
 bc_knight_the_order_came_from_a_man_who_can_afford_it_toast_desc:0 "It came down the rank the way these things come, three men repeating it badly and the fourth getting it right, and he had all of it at once, including the half that nobody said. He is to go into the part that is worst and he is to keep going into it. That is the entire instruction. There is no second portion where somebody comes out after him. He has been in enough afternoons to know the shape an order has when it has a second portion, and this one is not that shape. A hundred paces back somebody has looked at the day, and looked at what is left, and worked a small sum in which he appears as a quantity and not as a man, and the answer came out acceptable. He is not even angry, which is the part he notices while it is happening - the anger does not arrive, and something brisk and practical moves into the space where it should have been. He puts the horse at it. He gets four good strides out of the animal and then it is screaming and going over on the near side, and he is on his feet in the worst ground on the field with the whole thing still opening around him, doing exactly what he was told to do, at the price that had already been allowed for. Nobody will come and say a word to him about it later. From where the sum was worked there is nothing that needs saying.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 141 - whether the chain of command is a chain of homage ----------
#
# THE FIRST MAY NOT NAME the man opposite, name a title, name a house, name a
# war, quote an oath, or use the word for what has been done to him. Nobody
# may bring him word of anything. He may not order a withdrawal, rally, turn
# the day, or end the day.
#
# THE SECOND MAY NOT NAME his commander, name his land, name a title or a
# house, or quote an oath. Nobody may thank him, single him out or say
# anything to him. He may not kill a named man, reach the far commander, or
# end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 156.
 bc_the_man_across_the_field_holds_his_land_of_him_toast:0 "Everything The Man Beating Him Owns, He Owns Because Of This House"
 bc_the_man_across_the_field_holds_his_land_of_him_toast_desc:0 "There is a way he has of thinking about other men that has served him for thirty years and has been failing him steadily since about the second hour. It runs: what does this one have, who did he get it from, and what would it cost him to lose it. That is not cynicism, it is closer to bookkeeping, and it has told him in advance what nearly every man he ever dealt with was going to do, because nearly every man does the thing that keeps what he has got. The one directing the far line has more to lose today than anybody standing on this slope, and every scrap of it came from here. And he is out there regardless, in good order, unhurried, not making one of the errors a cornered man makes - which is the detail that keeps coming back round, because cornered is what the bookkeeping insists he ought to be. So the method has a hole in it, and it has probably had the hole in it the whole time. Somewhere in all those years he stopped noticing that the ledger only predicts the men for whom the ledger is the point. He is being taken apart this afternoon by an exception to his own rule, and there is a part of his mind that has begun going back through the entries looking for where it was first written down, and that part is no use to him at all, and it will not leave off.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_holds_his_land_of_the_man_giving_the_orders_toast:0 "He Is Standing Here Because Of An Arrangement And He Has Read The Arrangement"
 bc_knight_he_holds_his_land_of_the_man_giving_the_orders_toast_desc:0 "Most of the men in this rank are here because somebody they answer to is here, and if you traced that back far enough you would come to an actual reason, and not one of them has ever traced it. He has. He is here on a particular understanding with a particular man, in particular terms, and the terms set out how many days and with what and in whose company, and he has met every line of it exactly, which is a different thing from meeting it handsomely. He counted the days off on his fingers in the yard before he rode out. There is nothing stirring about any of this. It is the least rousing reason to be standing on a field that has ever been thought of, and it is also - he has watched this happen a dozen times now - the reason still standing after the rousing ones have burned themselves out somewhere in the middle of the day. The far line goes at last and the whole front of it opens up, and the men on either side of him are already shouting and moving badly, and he goes forward at a speed the rest of them can actually hold, keeping his own dressing, because that is what going forward means and the other thing is only running. Nobody sees him do it. In an hour it will turn out that the chase kept its shape, and that this was worth more than the shouting was, and there will be no way for anyone to say why.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 142 - the roster, and who is actually on it ----------------------
#
# THE FIRST MAY NOT NAME a knight, give a total for the household, name a
# house, a title or a device, or have anybody report to him. He may not order
# a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME his commander, name a wage or any sum, name a house
# or a title, or speak to anybody. Nobody may use his name or address him
# directly. He may not kill a named man, reach the far commander, or end the
# day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 157.
 bc_the_men_being_used_up_are_the_ones_he_pays_toast:0 "The Day Is Going Beautifully And It Is Going Beautifully Through Men He Feeds"
 bc_the_men_being_used_up_are_the_ones_he_pays_toast_desc:0 "The wing is going in again and it is working, and he can tell from here which of them are at the front of it - not from anything painted on a shield but from the way they move, because he has watched most of them move for years. He knows the one who has never in his life gone in on the second rank. He knows the one who drifts a little to the right under pressure, who has been told about it more than once and cannot stop doing it. He knows which of them is standing there only because his father stood there. And they are doing precisely what they cost, which is the entire point of keeping men on the household rather than hiring them by the season: on the afternoons that matter they go in first, and the going in first is what the money has always been for. What he had not thought through, across all those years of quarter-days and grain and stabling and the small endless business of keeping such men, is what it would be like to stand and watch the thing he bought being delivered to him. It is being delivered faultlessly. The line ahead is opening. And when somebody totals this up in a week it will come out as a set of particular men whose habits he could recite from memory, and he has already begun composing that set, while the good news is still arriving.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_man_shouting_the_orders_is_the_man_who_pays_him_toast:0 "The Voice Carrying Down From The Right Is The One That Buys His Horses"
 bc_knight_the_man_shouting_the_orders_is_the_man_who_pays_him_toast_desc:0 "Nine parts of this line would be entirely within their rights to look at what is coming and think of it as somebody else's quarrel. He does not have that available to him. It is not a matter of what he feels, and there is nothing stirring in it - the man whose voice keeps carrying down from the right is the man from whose hand every animal under him has come, and every mail shirt, and the roof his people are under this winter. That understanding does not have a version of itself that pauses when the day goes wrong. So he sets his feet and stays, and the reason he stays has no nobility in it whatsoever: there is no direction he could move in that would still have the arrangement in it that he has spent his whole adult life standing inside. The shields on his left begin to give. He does not go back with them. He is bleeding and being shoved and the ground under him has turned to a paste, and what keeps him in it is not courage and it is certainly not love - it is the flat fact that the voice off to the right is the one that has always told him where to be, and it has not yet told him anything else.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 143 - how many seats each of them actually holds -----------------
#
# THE FIRST MAY NOT NAME a seat, a title, a house, an heir or a wife, give a
# total for what he holds, or have anybody bring him word. He may not order a
# withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME his holding, a title or a house, give a figure for
# his acres, his rents or his men, or speak to anybody. He may not kill a
# named man, reach the far commander, or end the day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 158.
 bc_there_is_more_than_one_seat_behind_him_to_lose_toast:0 "Losing Here Does Not Cost Him One Thing, It Costs Him Several Different Things"
 bc_there_is_more_than_one_seat_behind_him_to_lose_toast_desc:0 "A man with one seat behind him is fighting for one thing and can hold that one thing whole in his head while he works. He cannot. What stands behind him is not a thing, it is a set, and every part of the set has its own hall and its own steward and its own quiet men who will hear about this afternoon at different speeds and draw quite different conclusions about what it means for them. That is what he has been doing all day instead of the simpler work - not commanding so much as running each part of it forward in his mind and watching what today does to it there. It has cost him. Twice now he has taken longer over a decision than the moment allowed, because the answer was obvious for one part of what he holds and plainly wrong for another, and while he was reconciling the two the moment went by and took something with it. There is a version of him that could have fought this the way the smaller men are fighting it, with nothing in his head but the ground immediately in front, and that version would be having a better afternoon than he is. He can see that version quite clearly. He cannot get inside it. He has been the sum of those places for so long that he has lost the trick of being one man standing on a slope.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_a_seat_of_his_own_and_it_is_a_small_one_toast:0 "Everybody Here Knows To Within An Acre What He Has, Which Is The Problem"
 bc_knight_he_has_a_seat_of_his_own_and_it_is_a_small_one_toast_desc:0 "He is not one of the household men and he is not one of the great ones, and there is no restful place to stand between those two. The household men have nothing and are owed everything. The great ones have everything and are owed nothing. He has a roof that is his, and the ground under it, and just about enough coming off that ground to keep one good animal and the harness to put on it - and the whole condition of a man in his position is that everyone can see the size of what he holds and can therefore judge, to a nicety, whether he is carrying on as though he deserved more of it. He is conscious of this the way you are conscious of a stone in a boot. So when the far line starts to buckle he does not wait to be sent, and he does not go at the pace that keeps a horse alive for a second day, and he does not go at the pace a sensible man would choose either. He goes flat out into the gap with whatever men happen to be watching him, and the animal - which cost him a full year of what that ground makes - is being ruined underneath him while he does it, and he knows it, and it is the cheapest thing he will pay for today. It works. It works loudly, in front of precisely the people who needed to see it work, which is the whole reason he did it in that particular manner, and he will not admit that to a living soul.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 144 - what the name is worth -------------------------------------
#
# THE FIRST MAY NOT NAME a house, a name, a sigil, a title or an ancestor,
# quote a saying, or have anybody bring him word. He may not order a
# withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME his house, his father, an ancestor, a sigil or a
# title, or quote a saying. Nobody may cheer him, use his name or say anything
# to him. He may not kill a named man, reach the far commander, or end the
# day.
#
# NEITHER MAY NAME A PLACE, a road, a river crossing, a castle or a town, have a
# rider arrive or a message go out, or count anything in thousands.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 159.
 bc_the_heavier_of_the_two_names_is_the_other_one_toast:0 "The Two Names On This Field Are Not The Same Weight And Everybody Knows Which Way"
 bc_the_heavier_of_the_two_names_is_the_other_one_toast_desc:0 "He has spent a lifetime keeping an accurate map in his head of what every name in the world is worth, and it has been the most useful thing he owns, and this afternoon it is standing at his shoulder doing nothing but harm. The men opposite are not better. He has watched their left do something twice now that a competent captain would have taken hold of, and nobody took hold of it. But the men on his own line carry the same map in a rougher version, and they have known since the banners went up which of the two names out here is the older and heavier thing, and knowing it has not turned them into cowards - it has done something considerably more expensive than that. It has made them wait. A quarter-beat before each push. A fraction less in each recovery. An unwillingness to be the first to commit that no man would own to and no man could be charged with. He has never in his life had to give an order against a feeling, and he does not have the words for that order, and he is not going to find them between now and dusk. So every instruction he sends out arrives at a line that is already, very slightly, expecting to be somewhere else in an hour.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_name_is_doing_some_of_the_standing_for_him_toast:0 "Some Of What Is Holding This Stretch Of Line Is Not Him"
 bc_knight_the_name_is_doing_some_of_the_standing_for_him_toast_desc:0 "The stretch of line he is standing in is holding, and he is aware - in a way he would have trouble putting into words if anybody were tactless enough to ask - that he is not the whole reason for it. Men are standing here who would not be standing somewhere else. Part of that is him. He has done the work, his arm is doing what it has been trained since childhood to do, and he is not going to pretend otherwise out of modesty. But part of it is a thing he was handed before he could walk and has never earned in any sense he can defend, and it acts on the men either side of him whether he wishes it to or not: they have quietly adjusted where they put their feet because of what he is called. He first noticed that at fifteen and it embarrassed him badly. Then it stopped embarrassing him, which turned out to be worse. What he has arrived at, at whatever age this is, is the only settlement he can live inside - which is to be worth it. To make sure that the thing these men are standing beside is also, separately and on its own account, somebody who can hold a piece of ground. So he holds it. The push comes and nothing gives, and afterwards there will be no way for anyone to pull the two reasons apart, and he has stopped needing them pulled apart.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 145 - the reach and the grip -------------------------------------
#
# THE FIRST MAY NOT NAME a place, a road, a river crossing, a castle or a town,
# name a house, a sigil, a title or an ancestor, quote a saying, or have a rider
# arrive. He may not order a withdrawal, rally, turn the day, or end the day.
#
# THE SECOND MAY NOT NAME his estate, a steward, a wife or a child, name a house,
# a sigil, a title or an ancestor, or quote a saying. Nobody may cheer him or use
# his name. He may not kill a named man, reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands, have a message go out, or give a
# figure for his rents.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 160.
 bc_most_of_what_answers_to_him_is_not_his_toast:0 "The Reach Was Never The Same Thing As The Grip And This Is The Afternoon He Learns It"
 bc_most_of_what_answers_to_him_is_not_his_toast_desc:0 "Everything wide about what he holds is held for him by other men, and until this afternoon that had never once cost him a night's sleep. The levies drawn up on his right came off ground he has never walked, mustered by a man he sees twice a year, marched here by that same man, and watched over now - he can see it from where he stands - by that man's eye, which keeps drifting sideways looking for the moment when going badly becomes bad enough to justify going home. What sits under his own hand is small. It is very good and it is very small and it is not the part that is failing. He was raised to believe the wide version was the real measure of a man, and he half believed it, and what he has understood since noon is that it measures how far he can ask and not how hard he can hold. Asking worked beautifully while the asking was easy. Holding is what today wants, and holding is the one number he never grew, because growing it would have meant taking ground back off men who would have made him fight for it, and he preferred them settled. They are settled. They are also, at this particular hour, doing arithmetic. So he sends the order out anyway, along a structure that was built for quiet years and is being asked, for the first time in his life, to be something other than quiet.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_ground_he_owns_is_in_his_own_two_hands_toast:0 "He Left A Working Estate Standing In Order To Come And Do This Properly"
 bc_knight_the_ground_he_owns_is_in_his_own_two_hands_toast_desc:0 "He is out here because a man he owes came and asked, and the asking was polite, and that politeness is worth more to both of them than either would say aloud. What he left behind to come is not a bed in somebody else's hall. It is four separate stretches of working ground that he personally worries about, with his own hand in every decision on all of them, and a set of people who will do the sensible thing while he is away only because he spent years making certain the sensible thing was the obvious one. He knows what this day costs him in a way the men either side of him cannot. They are losing wages and a chance at something. He is losing a season's attention at the exact point in the year when attention is worth the most it will ever be worth. And even so, what he is doing on this stretch of line is better than what they are doing - not out of duty, and not out of any warmth toward the man whose orders these are, but because somebody who has spent fifteen years making things run properly cannot switch it off merely because the things in front of him have faces. So he holds it the way he holds everything he owns: by noticing early, correcting small, and never once permitting a problem to grow large enough to become interesting.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 146 - the temper of the country ----------------------------------
#
# THE FIRST MAY NOT NAME a place, a road, a river crossing, a village, a castle
# or a town, name a house, a sigil, a title or an ancestor, quote a saying, or
# have a rider arrive. He may not order a withdrawal, rally, turn the day, or
# end the day.
#
# THE SECOND MAY NOT NAME a place, a house, a sigil, a title or an ancestor, or
# quote a saying. Nobody may cheer him or use his name. He may not kill a named
# man, reach the far commander, or end the day.
#
# NEITHER MAY count anything in thousands, have a message go out, or give a
# figure for anybody's rents.
#
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 161.
# enough to become interesting".
 bc_the_country_here_will_not_help_either_of_them_toast:0 "The Country Around This Field Has Decided That None Of It Is Any Of Their Business"
 bc_the_country_here_will_not_help_either_of_them_toast_desc:0 "By mid-morning he had stopped expecting anything from the country around him, and by now he has stopped resenting it, which he recognises as the worse of the two signs. Nobody has come out. No boy has turned up at the edge of a field to say where the soft going is. Nobody has sold his quartermaster anything at any price, nobody has lied to him and nobody has told him the truth, because doing either of those requires having a view about who ought to win, and the people who work this ground gave up having one several years before he was ever likely to ride across it. Their own lord is hated here. The hate went cold a long while back and turned into something more useful to them than anger, which is a vast and even-handed indifference lying over every hedge and gate for a day's ride in any direction. His hurt men are being carried past doors that stay shut. His left went into a hollow that anybody local could have warned him about. And the part he cannot give an order about is the simplest part: men fight better when they think the country behind them is glad they came, and his have spent the afternoon working out that they could be finished here entirely and the ground would be tidied up afterwards by people who would have done precisely the same tidying for the men opposite.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_country_here_has_already_taken_a_side_toast:0 "Water Keeps Arriving And Nobody Anywhere Has Asked For It To Be Brought"
 bc_knight_the_country_here_has_already_taken_a_side_toast_desc:0 "Something has been going on at the edges of this fight all day that he has no proper word for and has given up looking for one. Water arrives. It arrives without being asked for, brought up by people who have no business within a hundred paces of any of this, who set it down and turn round and go back for more. Hurt men - he does not know whose, and he suspects the carriers do not either - have been pulled into the shade behind a wall and had their belts loosened by hands that were digging a ditch this time yesterday. Where the soft going was, he knew before dawn, because a man walked out and told him and then would not take a coin for it. He has been at this long enough to know how unusual the whole business is. Most country puts up with an army the way a hand puts up with a splinter. This country has decided, under no obligation he can find anywhere, that it would rather this line were the one still standing at the end. So the line stands. He is not fighting better than he fights on any other day - what is different is that he is doing it without the small permanent cost of minding his own back, and somewhere around the fourth push it occurs to him that this is the thing men are talking about when they say the ground was with them, and that it has nothing whatever to do with the slope.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 147 - the terms he holds by --------------------------------------
#
# THE FIRST MAY NOT NAME a place, a house, a sigil, a title or an ancestor,
# quote a saying, have a rider arrive or a message go out. He may not order a
# withdrawal, rally, turn the day, or end the day.
