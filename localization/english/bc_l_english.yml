 bc_five_great_men_stand_under_him_toast:0 "Five Large Men"
 bc_five_great_men_stand_under_him_toast_desc:0 "There are five of them and each one arrived with an opinion. Not disloyal, none of them, or none so far - simply large, and used to being the largest thing in whatever field they are standing in. Every order he gives has to be worded so that no one of the five hears it as being addressed to him in particular, and every order therefore arrives a little late and a little softer than he meant it. This morning that costs him. Something on the right needs doing at once and doing hard, and the doing of it belongs to a man who has decided to be careful with his own strength today, and rather than spend an hour on him the commander goes and does it himself, with what he has to hand and at a pace nobody has agreed to. It works, roughly. The horses will not forgive it and neither will the men who had to keep up. He gets back to where he started, out of breath, in time to watch the same thing begin somewhere else, and understands with great clarity that he is not commanding an army. He is negotiating with one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_five_great_men_stand_under_the_man_he_follows_toast:0 "Before It Comes"
 bc_knight_five_great_men_stand_under_the_man_he_follows_toast_desc:0 "The orders here have a shape to them. They come slowly, they come hedged, and by the time one has been passed along it has usually been softened twice by men who did not want to be the one to say it plainly. He worked this out in his second summer of service and he has never bothered to be annoyed about it, because it turns out to be useful: if you know what an order is going to say, you can be already halfway through doing it when it turns up. So when the gap opens on his left he does not look round, and he does not wait to be told. He takes eleven paces sideways, closes it with his own body and the four men who happen to be beside him, and stands there doing an ordinary and unremarkable job in a place where nobody had thought to put anybody. The order to do exactly that arrives some while afterwards. He accepts it politely. It is a small piece of the day and it costs nothing and nothing is wasted, which is the whole of what he was aiming at.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

