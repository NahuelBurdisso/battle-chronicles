 bc_he_was_made_correctly_and_it_is_not_enough_toast:0 "Made Correctly"
 bc_he_was_made_correctly_and_it_is_not_enough_toast_desc:0 "He was born with everything a man is supposed to want and none of the things he is supposed to dread. Tall, sound, clear-eyed, quick to understand a thing said once, a face that people trust before he has opened his mouth. Nothing was ever wrong with him. His whole life has been other people looking at him and concluding, without troubling to check, that whatever was coming would be handled. He is handling it. That is the difficult part to explain afterwards. Every call he has made in the last hour has been the correct one, made early, made on good information, and the ground has gone on being lost at the same steady pace regardless. It turns out that being well made and being enough are separate questions, and nobody has ever asked him the second one until today. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_blood_they_whisper_about_toast:0 "The Blood They Whisper About"
 bc_knight_the_blood_they_whisper_about_toast_desc:0 "His father and his mother were closer kin than anybody cares to say out loud, and everyone he has ever stood next to knows it. It arrives ahead of him in a room. It has been the thing men are careful not to mention and then mention anyway, three cups in, as a kindness or as a knife. He has spent his whole life being examined for it - watched for the tremor, the stammer, the thing they were all waiting to find. What is coming out of him now is coming out through a gash above the knee and another one across the forearm, and it is running down into the mud the same colour and the same speed as everybody else's. He has not stopped. The men who were careful not to mention it are behind him, going where he goes, and the ground in front of him keeps giving way. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

