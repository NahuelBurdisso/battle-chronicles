 bc_six_of_them_are_waiting_at_home_toast:0 "Six At Home"
 bc_six_of_them_are_waiting_at_home_toast_desc:0 "There are six of them and he can put them in order without thinking, which he has been doing all morning without meaning to. The eldest is nearly a man and the smallest cannot walk yet. Somewhere under his breastbone there is a sum running that has nothing to do with the field - what each of them becomes if he is carried back instead of walking, which of his own people would deal honestly with the little ones and which would quietly not. So when the line in front of him needs somebody to step out ahead of it and be seen doing it, he stays where he is, behind the second rank, doing the work carefully and from a sensible distance. It is not cowardice and nobody who watched him today would call it that. It is only that the right move this afternoon wants a man with less arranged behind him, and there is not one anywhere in the middle of this line. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_is_waiting_on_word_of_him_toast:0 "Nobody Waiting"
 bc_knight_nobody_is_waiting_on_word_of_him_toast_desc:0 "He is forty-six and there is no one. No smaller version of him being taught the grip somewhere, nobody who will hear about this afternoon from a man who was standing here. He settled a long time ago what that means: whatever he is going to be remembered as has to happen in the open, in daylight, close enough that other men can see the whole of it. So he does not hoard himself. He goes at the sagging part of the far line and keeps going, and when he is opened along the arm he changes hands and keeps going, and the men coming up behind him find the gap already twice the width it was. The cut will scar, and there is nobody at home who will ever ask him where he got it, which is exactly why he could afford to take it. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

