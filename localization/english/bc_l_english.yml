 bc_he_is_working_against_the_man_across_from_him_toast:0 "The Slow Thing And The Fast One"
 bc_he_is_working_against_the_man_across_from_him_toast_desc:0 "Something is already in motion against the man on the far side of this grass, and it has nothing whatever to do with the afternoon. It was set going in a room, months ago, by people who are not here and will not be here. It will take another six weeks, or it will come to nothing, and either way it is indifferent to what happens on this slope. He is aware of it the entire time. That is the difficulty. He gives the orders a man in his position gives and he gives every one of them a half-beat late, because some portion of him is busy with the other arithmetic - what today costs that, whether that would be simpler if today went badly, whether he would prefer it so. He settles none of those questions. He merely fails to settle the one in front of him quickly enough as well, and half a beat, repeated along a line for two hours, is a hole. When the hole finally shows from where he stands, it belongs to somebody else to fall into. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_is_working_against_the_man_he_follows_toast:0 "Two Things At Once"
 bc_knight_he_is_working_against_the_man_he_follows_toast_desc:0 "He means to be rid of the man whose banner he is standing under. Not today - what he has begun is slow, and slowness is the whole merit of it - but he means it, and he has meant it long enough now that meaning it has stopped feeling like much of anything. None of which prevents him from fighting for the man, and fighting extremely well, and that is the part nobody understands who believes people are one thing at a time. What this line needs is somebody who will change what he is doing every few minutes without being told, and he does precisely that: shortens where the footing narrows, opens out where it widens, gives back a pace to let a bad patch of ground pass beneath him and comes on again into the space it leaves behind. He is worth two of anyone near him. He will still be worth two of them next year, when the slow thing arrives. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

