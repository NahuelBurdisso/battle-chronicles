# either side of him".
 bc_he_could_have_made_this_war_himself_toast:0 "The Suit He Never Brought"
 bc_he_could_have_made_this_war_himself_toast_desc:0 "He has a cause against that man. A real one, the kind a court would hear without laughing, and he has been carrying it for years without ever finding the season to spend it. He could have chosen the month. He could have chosen the ground, the weather, the year his granary was full and the other one's was not. Instead he is standing on a day he did not pick, in a quarrel belonging to somebody above him, looking across at the one man alive he had a lawful right to come for on his own terms. It sits under everything he orders. Not rage - he is far too old for rage - but a slow, distracting arithmetic about how differently this might have gone, and while he runs it his orders arrive slightly after the moment they were meant for, and slightly overworked when they do, and the far side is not overworking anything. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_could_lawfully_fight_his_own_side_toast:0 "The Debt He Set Down"
 bc_knight_he_could_lawfully_fight_his_own_side_toast_desc:0 "The man whose orders he is taking owes him something, and he can say exactly what: the size of it, the year it began, the argument that would carry it. He has rehearsed that argument in the dark more times than he would ever admit to. And this morning he folded it up and put it away, because a debt is a thing you can take out again unchanged, and a line that breaks cannot be taken out again at all. So he fights for him. Properly, without reservation, harder than men who are owed nothing, and the strange effect of setting a grievance aside on purpose is that it leaves the hands very free. Nothing he does out here is complicated by wanting anything. He will want it again soon enough. Not while this is still going on. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


