 bc_the_war_is_with_the_man_next_door_toast:0 "The Next Valley"
 bc_the_war_is_with_the_man_next_door_toast_desc:0 "They have been arguing about a strip of pasture for eleven years. He knows the other man's steward by sight, has drunk his wine twice, sent back three of his runaway smallfolk without being asked to and once had a bull returned in kind. Every single thing either of them wanted could have been settled by two men and a table in one afternoon, and instead it is being settled out here at a cost neither of the original arguments was ever worth. That is not the worst of it. The worst of it is that eleven years of sitting across from that man taught him exactly how the man thinks, and taught the man the same about him, so every move he makes now is one his opposite number has watched him make before, over smaller things, in warmer rooms. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_rode_out_for_the_lord_next_door_toast:0 "The Lord Next Door"
 bc_knight_he_rode_out_for_the_lord_next_door_toast_desc:0 "He can see that ridge from his own gate on a clear day, and that is the whole of why he is standing on it. The man he is following this afternoon is not his liege and never has been. He is the lord on the far bank of the same stream, whose strayed sheep have been walked back and whose dogs have been cursed at and whose harvest is late this year for exactly the reasons his own is late. So when the far side comes on at the same place for the fourth time he gives none of it back. He knows what is behind him in a way no drawn map could teach anybody - which track turns to porridge under rain, where a horse can come up the bank and where it certainly cannot - and he uses it the way a man uses a room he grew up in, without deciding to. The line bends around him and does not open. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

