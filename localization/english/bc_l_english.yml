 bc_the_man_opposite_has_learned_something_he_has_not_toast:0 "Somebody Taught Him That"
 bc_the_man_opposite_has_learned_something_he_has_not_toast_desc:0 "The thing that is happening to his left is being done on purpose, and it is being done by a man who was shown how. There is a word for it somewhere, in some hall where old soldiers argue, and he does not know the word and has never seen it worked. What he can see is that each part of it prepares the next, which is the mark of a taught thing rather than a lucky one: the pressure comes off where he strengthens and arrives where he has just thinned, twice, and the second time before he has finished thinning. A man cannot answer a method he cannot yet describe. So he does the only thing available to somebody being outthought, which is to make the front narrower and thicker and refuse to be shifted off it, and to pay for every yard he does not give with the men who stand in the paying place. It holds. Holding is the whole of what it does. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_learned_something_the_man_leading_him_has_not_toast:0 "Taught, Not Told"
 bc_knight_he_has_learned_something_the_man_leading_him_has_not_toast_desc:0 "Nobody above him has ever done this, which he worked out years ago and has had the sense to keep behind his teeth. He was drilled in it by somebody patient, in a yard, at an age when he resented every hour of it, and the drill is now what his hands do when the shouting starts and nothing arrives that fits. What does arrive fits the field in general and not this twenty yards of it. So he obeys roughly, and underneath the obeying he sets his own small patch of men the way he was taught: shields lapped the other way round, the second rank standing closer than feels right, the whole of it leaning very slightly into the slope. It ought not to matter. It matters enormously. The push that folds the ranks either side of him arrives at his and stops as though it had walked into a wall built by somebody who knew about walls. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

