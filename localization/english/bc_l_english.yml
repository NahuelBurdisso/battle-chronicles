 bc_this_whole_war_is_on_his_own_ledger_toast:0 "His Own Account"
 bc_this_whole_war_is_on_his_own_ledger_toast_desc:0 "Everything that has happened in this war so far happened because he paid for it. The levies, the carts, the winter fodder, the smiths kept working past the point where it made any sense - all of it came out of one purse and the purse was his. The others came when they came and went home when they liked. Now the ground is going wrong in front of him and he does the only sensible thing left, which is to give up the shape he has been holding and stand in a worse one that will last longer. It works for a while. It works less well than he needed and he can already see the hour when it stops working at all. What sits badly is not the losing, which he has thought about carefully and often. It is that there is nobody to divide it with. A war fought by many men can be lost by many men. This one has a single name written against every entry, and whatever gets written at the bottom tonight will be written under that same name.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_far_lord_has_carried_this_whole_war_toast:0 "The Man Who Paid For All Of It"
 bc_knight_the_far_lord_has_carried_this_whole_war_toast_desc:0 "The one opposite has fought this war by himself and it shows in the way the far rank refuses to come apart. Whatever is over there, he put it there, out of his own stores, and there is no part of it he has not touched. Which is why the knight does not push. He has an opening and he lets it sit. He plants his feet, gets his shoulder where it belongs, and offers nothing to work with: no forward lean to catch, no hole behind him, no reason to hope. He has seen what happens to men who hurry a thing like that. It rewards them for about a minute. So he holds, and goes on holding, and the weight of a war that one man has been carrying alone since the first thaw settles down onto that one man a little further with every minute nobody spends being clever.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

