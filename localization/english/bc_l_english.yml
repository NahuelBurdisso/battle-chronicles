# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 435.
 bc_this_war_has_a_crowd_of_names_in_it_toast:0 "Everybody's War"
 bc_this_war_has_a_crowd_of_names_in_it_toast_desc:0 "There are more parties to this than he can hold in his head without effort, and every one of them wants something slightly different out of the afternoon. Some of them are here. Most of them are not. All of them will hear about it. So he does the sum properly, every term of it in its place: what the ground will bear, what his men have left in them, what the far side is trying to buy and how much it is prepared to pay. The sum comes out clean and it says exactly what it said an hour ago, which is that this afternoon is not winnable in the way anybody would like it won. He is right. Being right is not the difficulty. The difficulty is that a war with this many names on it contains nobody at all who can be handed an unwelcome answer and simply take it, and he will have to explain, separately, to each of them, why an afternoon spent doing the arithmetic correctly looked so exactly like a man not trying.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_war_has_only_two_names_in_it_toast:0 "Nobody Else Came"
 bc_knight_this_war_has_only_two_names_in_it_toast_desc:0 "Two names in the whole business. One man said a thing to another man and the other man answered it, and then the world at large declined to have an opinion: no allies, no favours called in, nobody arriving late to be thanked for it afterwards. Two households and a field. He finds that clarifying. There is no wider account to protect out here and no third party whose feelings today has to accommodate, and so when the far line gives he goes at it without a scrap of the caution a complicated war teaches a man. He is spending things he would ordinarily hoard - wind, horse, the good arm, the few seconds of surprise a man gets exactly once - and spending all of them at once, because there is nothing to save them for and no one else's timetable to keep. It is not restraint and it is not trying to be. Somewhere underneath it he understands that a quarrel small enough for two names is also small enough to be settled for good, and things settled for good do not come back in the spring.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

