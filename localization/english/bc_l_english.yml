 bc_he_has_three_living_brothers_toast:0 "Three Behind Him"
 bc_he_has_three_living_brothers_toast_desc:0 "There are three of them and he can place each one exactly. The second is back with the baggage being competent and visible about it. The third holds a keep two weeks north that nobody has bothered to attack in forty years. The fourth married into somewhere warm and is agreeable in a way he has learned to read twice. None of them wishes him dead; he is nearly sure of that. What he is entirely sure of is that if he stops being useful before sundown there is no gap at all, no scramble, no widow holding a boy up in front of a hall full of doubtful men - there is only a shorter queue, and the queue barely has to move. He turns this over while the second rank is being pressed back onto the third, and it changes what he picks to do next. He leaves off trying to win it and begins trying to make the losing of it look chosen, because a man who manages that is remembered as a soldier, and a man who does not is remembered as an opportunity.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_three_living_sisters_toast:0 "Three Married Out"
 bc_knight_he_has_three_living_sisters_toast_desc:0 "Three sisters, all living, all married outward, and between them they cost his father everything the family owned that was not land. He grew up with that sum said out loud at table, not unkindly, just as a fact of the house: the girls are the expense and you are what we have left. So he learned early to be worth the difference, and being worth it turned out to mean being dependable rather than brilliant. He is dependable now. When the far line splits and the whole rank goes forward, he does not go forward fastest. He goes at whatever speed the two men to his left and right are able to keep, and he watches the spacing, and twice he puts a hand out and slows somebody who has smelled the finish and means to be first at it. The rank gets where it is going still shaped like a rank. Three households will hear about that by winter, each of them slightly wrong, and he does not mind.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"
