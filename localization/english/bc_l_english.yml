 bc_he_can_see_what_needs_doing_and_cannot_make_himself_reach_for_it_toast:0 "He Knows The Order. He Has Known It Since The Second Line Bent. He Has Not Given It"
 bc_he_can_see_what_needs_doing_and_cannot_make_himself_reach_for_it_toast_desc:0 "There is an order that would help and it has been sitting fully formed in his head for the better part of an hour, and he has not given it. Not from doubt. He can name the company that ought to move, the ground it ought to move to, and roughly what the move would cost, and he could probably get the whole of it out in nine words. What is absent is whatever turns nine words inside a man into nine words out of him, and it has been absent for some years now, and today of all days it has not come back. So he watches the bend get worse. Someone at his elbow puts a question to him and he answers it correctly and briefly and then stops again. The tired part of him, which is by now most of him, keeps offering the observation that it is probably too late for that company to matter, and with every quarter hour that passes the observation gets truer on its own, without his having to do anything at all to help it along.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_not_stopped_moving_since_the_horns_toast:0 "Somebody Counted Afterwards And Made It Six Separate Places He Was Needed"
 bc_knight_he_has_not_stopped_moving_since_the_horns_toast_desc:0 "He was over the ditch first, which nobody had asked of him. He came back through his own front at a run to fetch the second rank up and did not turn round to check whether they were following, and they were. He was holding the left when the left wanted a body in it and he was eleven minutes later on the right. Two wounds so far, neither of them worth stopping for, both collected in spots where he had no particular business standing. He does not experience any of this as courage and would be genuinely puzzled to hear it called that. Staying in one spot with a shield up and waiting for something to come to him is the single most unbearable thing he can picture doing, and every time the choice arrives he takes whichever half of it involves going somewhere. The horse is finished. He knows the horse is finished. He has already worked out where he wants to be standing when the next thing starts.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

