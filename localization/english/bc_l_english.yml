 bc_the_levies_are_thin_because_he_is_spread_thin_toast:0 "Spread Thin"
 bc_the_levies_are_thin_because_he_is_spread_thin_toast_desc:0 "There are more seats in his own hand than one man was ever meant to keep. He took the last of them because there was nobody left to hand it to, and the ones before it came the same way, each of them sensible on the day it happened. What arrives with a seat is a hall, a steward, a set of accounts and a levy, and what a man gives back for it is his attention, which does not divide as neatly as land does. So the muster came in short. Not empty. Short by exactly the amount you would expect from ground that has not seen the man whose name is on it in three years. He is looking at that shortfall now, in the field, as a thinness on his left where there should be none, and he can account for every bit of it, and the account comes back to him. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_moving_him_is_not_a_realistic_plan_toast:0 "Not A Realistic Plan"
 bc_knight_moving_him_is_not_a_realistic_plan_toast_desc:0 "He is a wide man. It has been remarked upon at every table he has ever sat down at, always as a joke, and he has laughed at all of them, and not one of the men who made the joke ever put a shoulder into him and tried to move him backwards a single pace. Two have tried it here in the last quarter of an hour. Both are behind him now and one of them is not getting up again. The trouble with a man built like that is supposed to show up once the fighting has gone on a while. It has gone on a while. He is still standing precisely where he started, still swinging the same heavy thing at the same unhurried rate. The line has quietly stopped trying to go round him and started forming up on him instead. There is a great deal of him and all of it is in the way. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 173 - which of his five is the best one --------------------------
#
