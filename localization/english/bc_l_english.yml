 bc_the_faith_is_running_hot_toast:0 "A Loud Few Years"
 bc_the_faith_is_running_hot_toast_desc:0 "It has been a loud few years. The temples are full, people who never used to discuss such matters discuss very little else, and every reverse anybody has suffered since the last harvest has already been explained to a crowd by somebody who was nowhere near it. He is about to hand them another one. He can hear how this afternoon is going to sound from a pulpit before the afternoon has even finished - an argument he will not be there to answer, made in a building he will not be standing in, to people who will nod along to it. Knowing that changes nothing whatever about the hillside, so he does not let it change him either. He counts what is actually left to him instead: two companies still in some kind of shape, the distance across to the trees, how much daylight the far side has to spend. Then he makes the small correct decisions in the order they want making, with nothing on his face at all, because his face is the one part of this that is certain to get repeated. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nobody_much_is_praying_this_year_toast:0 "Nothing Above Him"
 bc_knight_nobody_much_is_praying_this_year_toast_desc:0 "Hardly anybody has prayed about anything in years. The temples are cold, what comes in barely keeps the roofs on, and whatever is supposed to be up there has not been asked for a thing by anybody he knows for longer than he can date. He is aware of all that the way a man is aware of weather, which is to say it does not come up. What comes up, when the far side finally arrives at the exact patch of dirt he is standing on, is that there is nothing over his head to appeal to and nothing on its way, and that the whole of what is going to keep this ground is the shield on his arm, the shoulder pressed against his own, and the plain fact that neither of them has any intention of being the first to give. It keeps. It keeps through the second push. The third one goes into it and stops dead, and by then the far side has started to lean, and the lean is worth a good deal more than the dirt is. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

