 bc_the_boy_who_used_to_beat_him_commands_the_far_side_toast:0 "What The Body Remembered First"
 bc_the_boy_who_used_to_beat_him_commands_the_far_side_toast_desc:0 "He is forty-six years old, he has commanded in nine campaigns, and there is a particular way his shoulders came up an hour ago when he understood whose hand was on the far line, and they have not come down since. He knows exactly what that is worth. It is worth nothing. The one directing the far side cannot get within a quarter mile of him, has no more men than he has, and is by every measure that matters out here a moderate soldier. None of which has the slightest effect on the part of him that was nine, and is still nine, and is quicker than he is, and reaches every decision a half-step ahead of him. So it all goes out hot. He commits early because waiting feels like being made to wait. He answers pressure where it lands instead of where it is going. He never once asks what the far side wants of him, because he is not fighting the far side at all, and everything he has learned in thirty years is standing behind a boy in a doorway waiting to be let past. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_boy_he_used_to_beat_commands_the_far_side_toast:0 "The Smaller One"
 bc_knight_the_boy_he_used_to_beat_commands_the_far_side_toast_desc:0 "He did not know the far side's hand at first. He knew what it was frightened of, and that is the worse of the two, because he is the reason it ever learned to be. There was a smaller one in a hall a very long time ago and there was him, and none of it was large: a shove going through a doorway, something wet put in a bed, a word repeated until it stuck to somebody for good. He had honestly not thought about a minute of it in twenty years. He is thinking about it now, in the middle of a rank that is going forward, and it has made him extremely quiet and extremely exact. No shouting. Nothing wasted. He is doing this as well as he has ever done anything and taking no pleasure in it whatever, and the part he cannot get round is that doing it well is the only apology available to a man out here, and it is not one. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"


