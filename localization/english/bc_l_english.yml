# him".
 bc_the_column_under_him_is_starving_toast:0 "The Empty Sacks"
 bc_the_column_under_him_is_starving_toast_desc:0 "The sacks went empty four days ago and what the men had this morning was what a man could hold in one fist. He has known the figure to the day for a fortnight, because he is the sort who keeps the tally himself, and the tally has done him no good whatever - a number written down twice a day does not turn into bread. So the rank in front of him is standing on nothing, and it is standing, which is the part he did not expect. He puts himself into the notch where the ground drops away and takes the weight there with the rest of them, on the same empty belly they have, because it is the only thing he has left to give and giving it costs him nothing he still owns. The rank holds. It also does not move, and cannot, and he works out while he is standing in it that not moving is now the entire extent of what he is able to do. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_host_came_here_to_plunder_toast:0 "What They Came For"
 bc_knight_this_host_came_here_to_plunder_toast_desc:0 "These men did not march out here for a war. They came for cattle and grain and whatever else would lift, and the shape of the whole morning has been men peeling off in twos towards a barn door with a sack in hand. Then the far side folds, and all that peeling off turns from a nuisance into the difference between finishing this and making a mess of it. He does not go to the barn. He sets himself at the shoulder of the fold and holds the men either side of him straight by the plain method of being visibly straight himself, repeating the same short order until it stops being anything anyone hears and becomes something their feet do without troubling them. The ones who wanted the barn stay. What goes forward goes forward as a line, at a walk, and takes in a quarter of an hour what a scatter of thieves would have spent the afternoon failing to take. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

