# standing when the next thing starts".
 bc_every_man_out_there_took_his_orders_from_somebody_else_two_years_ago_toast:0 "Two Summers Ago Every Man Out There Was Taking His Orders From Somebody Else"
 bc_every_man_out_there_took_his_orders_from_somebody_else_two_years_ago_toast_desc:0 "The seat is not two years under him yet and the day is going the wrong way, and those two facts are being quietly attached to each other by everybody on this side of the field at once. Nobody says it. What happens instead is that his instructions arrive a half-beat late, get carried out exactly, and get carried out by men who glance at each other first. That glance costs nothing measurable. It is not disobedience and he could not name a single one of them for it. But he can feel the whole apparatus running at a slight discount to what it would give a man it had known longer, and he cannot argue with the discount because he has not earned the argument. The line is still square. It is going backwards square, which is the worst possible version, because it means nobody will be able to blame the men, and when a line keeps its shape all the way to the bottom of a field there is only one person left to hang the afternoon on. He has been that person for twenty-one months.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_been_holding_his_own_ground_since_before_most_of_them_were_born_toast:0 "He Has Been Holding The Same Piece Of Ground Since Before Most Of Them Were Born"
 bc_knight_he_has_been_holding_his_own_ground_since_before_most_of_them_were_born_toast_desc:0 "There is a stretch of hedgerow eleven days' ride from here that he has been responsible for since he was a young man, and he has been responsible for it without interruption ever since, through four bad harvests and two winters that took children. He is not commanding anything today. He is in the fourth or fifth position from the end of a line, doing the simplest job on the field, and doing it with an economy that the men on either side of him have started copying without meaning to. He does not step back when the pressure comes on. He does not step forward either, which is the part the young ones cannot manage. Thirty years of being the man who stays where he said he would stay has produced, among other things, a very specific physical habit: when something heavy arrives he sets his weight and it goes past him, and the two men beside him are still there afterwards because he was. The line bulges everywhere except the width of him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

