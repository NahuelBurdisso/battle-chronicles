 bc_the_part_he_is_good_at_finished_a_fortnight_ago_toast:0 "The Part Of This He Is Genuinely Good At Finished A Fortnight Ago"
 bc_the_part_he_is_good_at_finished_a_fortnight_ago_toast_desc:0 "Everything he is genuinely excellent at was finished a fortnight ago and nobody was there to watch him do it. He got an army across bad country in the wet without losing the carts. He kept the bread coming when the roads were mud to the axle. He is the reason these men are standing here at all rather than strung out along forty miles of track eating their own boots. And none of it is any use now. What is happening in front of him is a question of who leans harder for longer, and there is no clever arrangement of anything that answers it, and he can see with a horrible clarity that the answer is no. He is standing in a trade that stopped needing him the instant the lines touched, and the one skill he has left is being able to work the sum exactly, and the sum is not one he wants.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_done_this_before_without_a_cause_attached_toast:0 "He Has Done This Exact Work Before With No Cause Attached To It"
 bc_knight_he_has_done_this_before_without_a_cause_attached_toast_desc:0 "There is a particular moment when a frightened body of men stops being a body of men and becomes a number of separate people who have each privately decided to be somewhere else, and he can feel it coming the way other men feel weather in a knee. He did not learn that here. He learned it on beaches and in yards and in places where the ones opposite were not soldiers, where there was no cause involved and nothing at stake but what could be carried away. The skill transfers perfectly. He goes at the seam half a breath before it opens, which looks like courage from behind and is only familiarity, and the ones who go through it after him will remember the afternoon as the part where everything came right. His horse is finished. He rode it the way he has always ridden one, as though it belonged to somebody else, because for most of his life it did.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

