 bc_this_ground_is_already_in_other_hands_toast:0 "Somebody Else's Field"
 bc_this_ground_is_already_in_other_hands_toast_desc:0 "The holding behind them changed hands before he ever got here and the men sitting in it are not his. He knows it the way a man knows a bad tooth. Everything today is being done on borrowed ground: the fodder is gone, the wells are watched, and the tracks he would want for shifting a wing are tracks somebody else has been using for a fortnight and knows better than he does. So he does it by the book instead. He forms clean, he gives each instruction to the man it belongs to in the order it belongs in, and the whole thing goes off as neatly as a drill on a summer morning. None of it helps. Doing it properly on ground that is not yours is a very tidy way to lose, and he can watch the tidiness of it from where he stands - each part correct, each part arriving a fraction after the moment that would have made it worth its price - while the holding behind him goes on belonging to somebody else.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_ground_is_being_stripped_while_they_fight_toast:0 "While The Barns Burn"
 bc_knight_this_ground_is_being_stripped_while_they_fight_toast_desc:0 "They are winning and there is smoke in the wrong direction. Not off the fighting. Out past the treeline, where somebody's riders are working through the same county at their leisure, taking what they find and burning what they cannot carry, and none of it has the least connection to who wins here. He has been in the front rank long enough today to have another man's blood drying in the creases of his hand, and he is still going forward, hard, because forward is the only thing available to him. He is not going to catch riders. He knows that perfectly well. The whole shape of the afternoon is that the thing he can beat is standing directly in front of him and the thing that will actually cost this county its winter is four miles off and has never once been inside his reach. So he takes it out on what is to hand. It is not clever and it is extremely effective, and the men beside him have stopped asking why he will not stop for water.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

