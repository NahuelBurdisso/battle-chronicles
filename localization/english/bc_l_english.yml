 bc_the_thing_behind_him_will_be_here_long_after_today_toast:0 "Whatever Happens To Him Here The Great Grey Thing Behind His Shoulder Will Not Notice"
 bc_the_thing_behind_him_will_be_here_long_after_today_toast_desc:0 "It is behind his right shoulder and it has been there since he formed up, and it took longer to build than his line has been alive. He knows roughly when it went up and roughly what it took, and both of those figures make the afternoon he is having look extremely small. His men are braced against it, in the plain practical sense - they have put their backs to the stone because stone is the one thing on this field that will not give way, and they are holding a shorter frontage than they should be because of it, and losing more slowly than they would in the open, which is the only good news he has had for some hours. Every time he looks up, though, he gets the other half of it. Nothing that happens below it today will make the slightest difference to it. It was not put here for a battle, it does not care which way this goes, and whoever holds this ground at dusk it will be exactly where it is, unmarked, doing the thing it was made for. He has been trying to take that as steadiness and it will not sit that way. What it actually feels like is being told, patiently and without malice, by something that has watched a great many afternoons, that this one is not going to be remembered by anybody who was not standing in it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_is_fighting_across_somebody_elses_unfinished_plan_toast:0 "Somebody Levelled This Ground For Something Enormous And Then Never Built It"
 bc_knight_he_is_fighting_across_somebody_elses_unfinished_plan_toast_desc:0 "The strip he is working along is far too flat and far too wide to have happened on its own. Somebody cleared it. There is cut stone half-sunk in the grass at intervals, in a line, and the line goes somewhere and then simply stops, and what was supposed to stand at the end of it was never begun. It is the best fighting ground on this whole field and nobody meant it to be. No ditches, no ruts, nothing to turn an ankle on for a good long stretch, footing like a yard, and he has been taking every scrap of that and running with it - going forward faster than he has any business going, taking men at a flat run where on ordinary ground he would be picking his way, coming off one and onto the next while they are still deciding where he went. He has no idea whose plan this was or why it stopped, and he has spent no time at all wondering, because the only thing about it that matters to him is that it is level. Somebody's grandfather wanted something here badly enough to move a hill for it, and the sole use it has ever been put to is letting a stranger kill people on it quickly.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 154 - how long each of them has been at war ----------------------
#
