 bc_he_holds_three_men_by_the_throat_toast:0 "Three Ropes"
 bc_he_holds_three_men_by_the_throat_toast_desc:0 "He has spent a great deal of his life gathering things that other men would rather were not said aloud, and he has been careful never to spend one of them. Three men owe him quiet. Two of the three are grown enough to be dangerous. It has always felt like weight in a pocket - not comfortable, exactly, but reassuring, the sort of thing that makes a room easier to walk into. Out here the pocket is empty. There is nobody to lean on and nothing to imply, and the line in front of him could not care less what he knows about anybody. He catches himself reaching for that feeling regardless, the way a man reaches for a purse he left on a table, and every time he finds nothing there he loses half a heartbeat deciding what to do instead. His formation holds. It goes backwards, but it holds, and that is the one piece of the morning he can honestly claim. What arrives while it is going backwards is this: everything he built his standing on requires somebody willing to be shamed, and out here nobody is available for that.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_man_opposite_holds_three_that_way_toast:0 "What Holds Them"
 bc_knight_the_man_opposite_holds_three_that_way_toast_desc:0 "It takes him most of the morning to work out what is wrong with the men he is pushing against. They are not frightened, or not only that, and they are certainly not eager. They fight like men doing a job they were told to do by somebody who knows something about them, and once he has seen it he is unable to unsee it. There is a difference in how a man plants his back foot when he is here because he chose to be. These did not choose. So he stops leaning where the shields are thickest and starts leaning where the faces look least willing to be looked at, and it gives, slowly to begin with and then in a way that is almost uncomfortable to watch. Nobody breaks and runs. That is not the shape of it. What happens is that a half step back gets taken by one of them, and then allowed by the man beside him, and then the whole business begins to sag inward like wet cloth, because not one of them is sure the others will still be there in a moment, and not one of them will say so out loud.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

