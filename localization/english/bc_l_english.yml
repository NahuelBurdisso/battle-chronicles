# separate times".
 bc_the_dream_keeps_getting_in_front_of_the_field_toast:0 "The Dream Keeps Getting In Front Of The Field"
 bc_the_dream_keeps_getting_in_front_of_the_field_toast_desc:0 "He has had exactly one dream in his life that turned out to be a report. It was short, it was years ago, and every detail in it arrived afterwards in the correct order, including the details he had spent a season trying to prevent. Since then he has not been able to look at anything without checking it against a thing that is not there. He looks at the soft ground on his left and revises. He looks at the horse-lines and revises again. Every revision is intelligent and every one of them is a little later than the situation it describes, because half of his attention is permanently occupied by an afternoon he cannot get back to and cannot use. The men around him believe they are watching him think. He is remembering. And the worst of it, the part he will not say aloud to anyone, is that what he was shown was never about today at all, and he has spent this entire afternoon questioning it anyway.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_here_is_the_thing_he_is_afraid_of_toast:0 "Nothing Here Is The Thing He Is Afraid Of"
 bc_knight_nothing_here_is_the_thing_he_is_afraid_of_toast_desc:0 "Twice a year, since long before anybody put a sword in his hand, he burns. Not painfully. He is simply somewhere with a great deal of fire in it, and something enormous is moving through the fire on purpose, and then he is awake in the ordinary dark with the smell of it still on him. He has told two people in his life. Neither was the slightest help. What it has done to him is this: he cannot be hurried. The line he is standing in has been gaining ground for twenty minutes and the men to either side of him have gone loud with it, and he is working at precisely the rate he began at, taking what is offered him, declining what is not, stepping over the ones already down without looking down at them. It is not courage and he would not claim it was. It is that whatever this is, it is not the thing that is coming, and some part of him has known the difference for most of his life.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

