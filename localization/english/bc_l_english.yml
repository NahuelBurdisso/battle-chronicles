# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 275.
 bc_nobody_told_him_what_the_noise_is_like_toast:0 "Nobody Told Him"
 bc_nobody_told_him_what_the_noise_is_like_toast_desc:0 "He has held his seat for years and it has been a peaceful holding. Rents collected, disputes heard, two dry summers got through without anybody starving. He assumed, in the way a man assumes the roof will hold, that if this ever came he would find it recognisable from the accounts of it. It is not recognisable. Nothing had prepared him for how loud it is, or that the loudness never stops to let a man finish a thought, or that he would be unable to see anything past the third rank, or that the reports reaching him would be old by the time they arrived and wrong by the time he acted on them. He is not a coward and he has not run. He is simply a man discovering, at the worst possible moment to discover it, that everything he knew about this he learned from people describing it afterwards. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_eighth_war_of_his_life_toast:0 "The Eighth"
 bc_knight_the_eighth_war_of_his_life_toast_desc:0 "This is the eighth. He could name them in order if anybody asked, and nobody does, and he would not enjoy it. What eight of them leave a man is not courage exactly - it is closer to an absence of surprise. He is not startled by any of this. He knows how long the shouting lasts before it changes pitch, what a line looks like a minute before it goes, which of the men near him will still be there in ten minutes and which one is about to find a reason to be somewhere else. So when the far side bends, he is already moving into the bend, at a pace that will not blow the horse or leave him alone in front of it, because he has watched better men than himself throw away exactly this by going at it too eagerly. He does not throw it away. He never has. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

