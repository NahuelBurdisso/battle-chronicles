# next quarter of an hour while everybody around him is hearing noise".
 bc_there_is_nothing_here_for_him_to_build_toast:0 "Nothing To Build"
 bc_there_is_nothing_here_for_him_to_build_toast_desc:0 "Give him a week and a river and he will put an army across it. Give him a wall and he will tell you which course to strike and how many days it takes, and he will be right to the day, because he has been right to the day since he was thirty years old. None of that is what is being asked of him. There is no wall. There is a slope, a great deal of open grass, and a line of his own men giving ground at a rate that is not a rout yet and will not become one all at once either. So he does the one thing left that still resembles his craft. He keeps them in their ranks. He walks the back of it and moves men from where there are too many of them to where there are too few, and shuts gaps as they open, arithmetic worked against a hillside, and it is done well, and all of it amounts to a structure coming apart rather faster than one careful man can hold it together.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_is_the_part_he_has_done_a_hundred_times_toast:0 "A Hundred Times"
 bc_knight_this_is_the_part_he_has_done_a_hundred_times_toast_desc:0 "The footing is worse and the men are trying considerably harder and nobody has agreed to any rules, and underneath every bit of that it is the same problem it has always been. Two arm's lengths. A man's weight settling forward onto his front foot before he swings, which he cannot help doing and cannot hide. The half-beat after a shield comes up in which the body behind it is briefly deciding nothing at all. He spent twenty summers in churned sand learning to read precisely that, at a cost of three fingers' worth of scars and a shoulder that warns him about rain, and it was never once the useful accomplishment his people had hoped he was acquiring. It is useful now. He is not fighting harder than the men to either side of him. He is arriving at the right answer eleven times in twelve while they arrive at it seven, and across a quarter of an hour that gap is the whole afternoon.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 172 - more than he can hold, and more than he can carry ----------
