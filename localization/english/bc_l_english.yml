 bc_half_his_saddles_came_empty_toast:0 "Empty Saddles"
 bc_half_his_saddles_came_empty_toast_desc:0 "He is entitled to a dozen sworn men and he has ridden out with three. The rest are dead, or ransomed, or were never taken into the household at all, and which of those it is stops mattering the moment the horns go. What matters is that the work those men would have done still wants doing and there is nobody to hand it to. A lord in a field is supposed to be a hub with spokes: he sees a fault, he says a word, and somebody sworn to him goes and closes it before it widens. Today he sees the fault and there is no spoke. So he goes himself, and then again, and the second time he is slower coming back, and the third time he is not quick enough at all. A spear comes up under the skirt of his mail and finds the thigh. He stays in the saddle, which is the one part of it he manages well, and the blood works down into his boot and stays there. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_far_lord_rode_out_short_handed_toast:0 "Nobody Comes To Mend It"
 bc_knight_the_far_lord_rode_out_short_handed_toast_desc:0 "The men across from him are put together well enough, and there is nothing behind them. He finds this out the way such things are found out, by opening a fault in their front and waiting to be punished for it, and no punishment arrives. On a proper field a gap like that is shut inside a minute by whoever the far lord keeps for shutting gaps. Here it simply stays open. So he goes into it, and he keeps going into it, and by the third time he has taken a cut across the forearm and another he does not locate until much later, and neither slows him, because a man who has found the one soft place on a line does not stop to take stock of himself. He is bleeding freely by the time that front bends back off the crest. He was the only thing pushing on it. That was enough, because there was nobody there to push back. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

