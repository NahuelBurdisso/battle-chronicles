# that finishes with one man dead who was never the reason any of them are
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 229.
# competent shield and about the same weight of work as anybody else in that
# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 230.
 bc_the_line_holds_because_going_back_means_going_past_him_toast:0 "The Line Holds Because Going Back Means Going Past Him"
 bc_the_line_holds_because_going_back_means_going_past_him_toast_desc:0 "Everyone in this wing knows what the room under his hall is for, and a good many of them know somebody who has been in it. It is not a rumour and he has never troubled to keep it as one. He does the work himself, without hurrying, having found early on that letting other people do it wastes half the effect. The wing is losing and has been losing for some time. It has also not moved. Every man in it has quietly done the arithmetic that frightened men do - how far back it is, what the ground behind is like, who is standing on it - and has arrived at the conclusion that the people in front will probably only kill him. So they are still here, packed shoulder to shoulder, holding a stretch of mud that is no longer worth holding, for a reason he spent years building into them and cannot switch off now that he would rather have something else. He would like, very much, to be followed for a different reason today. He has spent his entire life making certain that nobody would offer him one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_finds_the_seam_the_way_he_once_found_a_door_toast:0 "He Finds The Seam The Way He Once Found A Door"
 bc_knight_he_finds_the_seam_the_way_he_once_found_a_door_toast_desc:0 "He killed a man in a passage once, at night, who was not armed and was not expecting it, and the business was found out inside a week. He has worn the word for it ever since and nobody has ever let him set it down. What is not said aloud, because it would be a peculiar thing to say, is that he was good at it. Not the cruelty - there was none, it was over very quickly - but the reading. He knew where the man would be standing, and which way he would turn when he heard something, and how much time that left. He is doing precisely that now, in daylight, in an enormous amount of noise, against people who are trying to do it back to him. There is a fault in the line opposite, perhaps eight paces to his right, and it comes open for less than a breath at a time. He has been watching it for a while now. He already knows which breath he intends to use.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

