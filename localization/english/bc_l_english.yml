 bc_the_far_people_make_war_the_way_his_do_toast:0 "The Same Trade"
 bc_the_far_people_make_war_the_way_his_do_toast_desc:0 "It takes him until the second charge to work out what has been bothering him, and after that he cannot stop seeing it. That wheel they just did on the left - he has done that wheel. He was taught it at fourteen by a man with a stick, and so, apparently, was somebody over there, in another tongue, four hundred leagues away, and the two of them came out the same. They are working from one book. That is not comforting. It means every clever thing he has left is a thing the far side already has the answer to, and he can watch the answers arriving before he has finished asking. He tries something ugly and unschooled purely to break the pattern, and it goes worse, because ugly and unschooled is exactly what the book warns you about and they punish it the way he would have punished it himself. He is being taken apart at his own trade by strangers, in the right order, and he can name each step as it is done to him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_far_people_make_war_nothing_like_his_toast:0 "No Shape to Break"
 bc_knight_the_far_people_make_war_nothing_like_his_toast_desc:0 "Everything he was drilled against is missing. They will not close and they will not hold; they slide off at the shoulder, come apart on purpose, and gather again somewhere he was not looking, and the first time it happens he very nearly rides into open air. Then something in him gives up on being correct about it. If there is no shape to break he will be the shape himself - forward without waiting to learn what he is going forward into, on the theory that whatever they are doing still requires them to be somewhere, and somewhere is enough to arrive at. It ought not to answer. It answers. He is through them before the pattern has finished closing around him and he keeps going, and the tidy thing they were assembling folds up behind him because the middle of it now has a very loud man standing in it. He could not do that twice. He will not have to.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

