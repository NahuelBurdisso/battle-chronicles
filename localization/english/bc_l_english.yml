 bc_the_law_at_home_says_they_must_obey_him_toast:0 "Absolute In His Own Hall"
 bc_the_law_at_home_says_they_must_obey_him_toast_desc:0 "At home there is a document, and the document is unusually clear about him. His lords cannot raise a levy without his leave, cannot war on one another, cannot take a case anywhere but his hall. It took his father and then him the better part of forty years to get it written that way, it is the achievement of his life, and it is worth precisely nothing here. Nobody out in front of him has read it. The far host is not a vassal to be corrected. The men in his own centre are not disobeying him either - they are being pushed backwards faster than an order can travel, which no clause anywhere covers, and he keeps giving orders anyway, because for thirty years giving them has been the whole of the job. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_law_never_gave_him_anything_toast:0 "Nothing By Right"
 bc_knight_the_law_never_gave_him_anything_toast_desc:0 "His grandfather traded the last of it away for peace and coin, and what came down to him was a seat with no teeth in it. His own lords answer when it suits them, keep what they collect, settle their quarrels between themselves and tell him afterwards if they remember. He grew up understanding that nothing is ever going to arrive because he is owed it. Everything he has wanted he has had to go and stand in front of and take, and he has become very good at the standing part. So he does not wait to be told the far side is thinning, and he does not wait for somebody to be sent. He goes, because going has always been the only method available to him, and today the method works where people can see it. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

