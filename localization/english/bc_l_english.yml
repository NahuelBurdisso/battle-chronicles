l_english:

# Battle Chronicles.
#
# MUST stay UTF-8 WITH BOM. Without it CK3 drops the entire file and every key
# renders as its raw name. Entry syntax is exact: one leading space, KEY:0 "text".
#
# The momentum modifier names below are NOT internal labels. The combat advantage
# breakdown prints them verbatim, in a list next to "Commander Martial Skill" and
# "Leading Own Soldiers". Verified in game. Write them as causes a maester would
# record, never as mechanics.

 bc_momentum_minor:0 "The Line Steadies"
 bc_momentum_minor_desc:0 "The shouting has changed. They are listening again."
 bc_momentum_major:0 "The Line Surges Forward"
 bc_momentum_major_desc:0 "The line is moving forward and it is moving together."
 bc_momentum_decisive:0 "The Field Is Ours"
 bc_momentum_decisive_desc:0 "It is over. They have not all worked that out yet."
 bc_faltering_minor:0 "The Line Wavers"
 bc_faltering_minor_desc:0 "Men are looking over their shoulders. Not many. Enough."
 bc_faltering_major:0 "The Banner Wavers"
 bc_faltering_major_desc:0 "The banner is where the line should be, and the line is not there."
 bc_faltering_decisive:0 "The Line Is Breaking"
 bc_faltering_decisive_desc:0 "It is not a battle any more. It is a crowd running in one direction."

# Family 2, the character of the fight. These are `army_*` / `knight_*` tags, so
# they do NOT appear in the combat advantage breakdown the comment above is about
# — they show in the army stat breakdown and the character's modifier list, both
# of which render the name and the _desc. Nothing in the toolchain warns when one
# of these is missing: `--strict`'s loc cross-check covers traits, decisions and
# character interactions only, so an unlocalized modifier renders its raw key at
# the player and validates clean forever.
 bc_bloodied:0 "Blood for Ground"
 bc_bloodied_desc:0 "They have paid for every step they have taken, and they mean to be paid back."
 bc_shieldwall:0 "The Shields Are Locked"
 bc_shieldwall_desc:0 "They have set their feet. Nothing is getting through, and nothing is getting done."
 bc_spent_horse:0 "The Horses Are Blown"
 bc_spent_horse_desc:0 "The knights went in hard and went in early. There is nothing left in the animals."
 bc_pursuit:0 "Hard on Their Heels"
 bc_pursuit_desc:0 "The enemy is giving ground, and there is no order left in the giving."
 bc_ground_held:0 "The Ground Is Ours"
 bc_ground_held_desc:0 "They chose the ground and they have not stepped off it. Moving them is a day's work; moving them forward is not happening."

 bc_valiant_in_battle_opinion:0 "Stood Fast in Battle"
 bc_craven_in_battle_opinion:0 "Shamed Himself in Battle"
 bc_shieldbrother_opinion:0 "Shieldbrother"

# --- game rules -------------------------------------------------------------

 rule_bc_frequency:0 "Battle Chronicles: Frequency"
 rule_bc_frequency_desc:0 "How often a battle produces a notable moment. Battles roll for events every five days."
 setting_bc_frequency_low:0 "Rare"
 setting_bc_frequency_low_desc:0 "Half as often. Chronicles stay reserved for long, hard battles."
 setting_bc_frequency_default:0 "Default"
 setting_bc_frequency_default_desc:0 "A notable moment roughly once a month of fighting."
 setting_bc_frequency_high:0 "Frequent"
 setting_bc_frequency_high_desc:0 "Twice as often. Battles become a running account."

 rule_bc_swing:0 "Battle Chronicles: Swing"
 rule_bc_swing_desc:0 "How far a single moment can tip a battle. Affects the advantage granted or lost by every chronicle."
 setting_bc_swing_subtle:0 "Subtle"
 setting_bc_swing_subtle_desc:0 "Moments colour a battle without deciding it."
 setting_bc_swing_default:0 "Default"
 setting_bc_swing_default_desc:0 "A decisive moment is worth about as much as a capable commander."
 setting_bc_swing_dramatic:0 "Dramatic"
 setting_bc_swing_dramatic_desc:0 "A battle can turn on one moment. Cuts both ways."

 rule_bc_aftermath:0 "Battle Chronicles: Aftermath"
 rule_bc_aftermath_desc:0 "Whether a battle worth remembering leaves a mark on the men who fought it. Knights carry a memory of the field; a commander who wins several may be named for them."
 setting_bc_aftermath_off:0 "Off"
 setting_bc_aftermath_off_desc:0 "Battles leave nothing behind. The mod behaves as it did before this was added, and AGOT's own nickname system is left entirely alone."
 setting_bc_aftermath_default:0 "Default"
 setting_bc_aftermath_default_desc:0 "A battle must stand out in at least two ways — its size, its cost, the odds against, or how completely it was decided. Most fields do not."
 setting_bc_aftermath_generous:0 "Generous"
 setting_bc_aftermath_generous_desc:0 "One reason is enough. Notable fields and the names won on them become common."

# --- commander chronicles ---------------------------------------------------

 bc_banner_falls_toast:0 "The Banner Falls"
 bc_banner_falls_toast_desc:0 "The standard goes down in the press, and the men nearest it look for it and do not find it.[bc_chronicle_subject.Custom('bc_banner_falls_ground')]"

# SPIKE. One fragment set, on one moment, to prove the shape renders before
# ninety-nine more are written. Each BEGINS WITH A SPACE because it is appended
# to a finished sentence - the anchor above deliberately has no space before the
# tag, so that the empty fallback leaves no trailing space. Each is one clause:
# the fragment adds a place to a thing that already happened, it does not
# restate the thing.
 bc_frag_banner_falls_desert:0 " The dust takes it before the sand does."
 bc_frag_banner_falls_open:0 " There is nothing else on that field to look at, and so they all see it go."
 bc_frag_banner_falls_rough:0 " It goes down the slope with the man who carried it."
 bc_frag_banner_falls_forest:0 " The branches have it before the ground does, and it hangs there where no one can reach it."
 bc_frag_banner_falls_jungle:0 " The green closes over it in a moment, as though it had never been raised."
 bc_frag_banner_falls_winter:0 " It lies in the snow, and the snow begins at once to cover it."
 bc_frag_banner_falls_any:0 ""

 bc_rally_the_line_toast:0 "The Line Is Rallied"
 bc_rally_the_line_toast_desc:0 "A shouted order carries where it should not have, and the ranks close again."

 bc_horse_killed_toast:0 "Unhorsed"
 bc_horse_killed_toast_desc:0 "The horse goes down screaming. He comes up out of the mud on foot, and is seen to come up."

 bc_flank_collapses_toast:0 "The Flank Collapses"
 bc_flank_collapses_toast_desc:0 "The outnumbered wing bends, and then it does not stop bending."

 bc_van_breaks_through_toast:0 "The Van Breaks Through"
 bc_van_breaks_through_toast_desc:0 "The leading ranks find the seam, and open it."

 bc_ground_favours_us_toast:0 "The Ground Favours Us"
 bc_ground_favours_us_toast_desc:0 "The slope, the trees, the narrow way in. They have to come to us across all of it."

 bc_lines_bogged_down_toast:0 "The Lines Bog Down"
 bc_lines_bogged_down_toast_desc:0 "Neither host can move. The battle becomes a matter of who tires of the mud last."

# --- knight chronicles ------------------------------------------------------

 bc_knight_holds_the_breach_toast:0 "He Holds the Breach"
 bc_knight_holds_the_breach_toast_desc:0 "One man in the gap where the line failed, and the line has time to be made again behind him."

 bc_knight_shames_himself_toast:0 "He Breaks and Runs"
 bc_knight_shames_himself_toast_desc:0 "He throws down the shield and goes back through his own ranks. Every man he passes remembers it."

 bc_shieldbrother_forged_toast:0 "Shieldbrothers"
 bc_shieldbrother_forged_toast_desc:0 "They came through the same press back to back. Neither will speak of it well, and neither will forget it."

# --- shared fragments: the bond ---------------------------------------------

 bc_frag_bond_nemesis:0 " The man commanding here knew whose colours those were across the field before either host moved."
 bc_frag_bond_kin:0 " The man commanding here shares blood with whoever is giving the orders across the field."
 bc_frag_bond_countryman:0 " The men on both sides curse in the same words."
 bc_frag_bond_heathen:0 " Whatever the other side was praying to at dawn, the man commanding here was not."
 bc_frag_bond_stranger:0 " Nobody across the field is anybody to the man commanding here."
 bc_frag_bond_any:0 ""

# --- aftermath --------------------------------------------------------------

# The desc NAMES the nickname. It used to end "calling him something", which left
# the player to go and open the character sheet to find out what he had just been
# called - the one fact the toast exists to deliver. The saved scope is safe to
# read here: bc_aftermath_nickname_effect runs give_nickname BEFORE the toast, and
# the scope is saved by the caller (bc_chronicles.0091) so it survives the step up
# to the liege in the AI branch.
#
# GetNicknameNoTooltip, not GetNickname: the nickname is already inside a toast
# body, and GetNickname would nest a tooltip in a tooltip. Vanilla uses exactly
# this form for a saved scope in fp2_struggle.2051.desc.

 bc_aftermath_nickname_toast:0 "A Name Won on the Field"
 bc_aftermath_nickname_toast_desc:0 "He has won another great field, and enough of them now that men who were not there have started calling him '[bc_named_commander.GetNicknameNoTooltip]'. It has stuck."

# --- memories ---------------------------------------------------------------
#
# Three perspectives, per the vanilla standard in _character_memories.info: no
# perspective / first / second / third, all past tense, all lower-case, because
# the UI prints them inside a sentence it builds around them. `shieldbrother` is
# the participant tag declared in bc_memories.txt; `owner` is always available.

 bc_shieldbrother_memory:0 "stood shieldbrother in a battle"
 bc_shieldbrother_memory_desc:0 "I came through the press back to back with [shieldbrother.GetFullName], and neither of us went down"
 bc_shieldbrother_memory_desc_second_perspective:0 "you came through the press back to back with [shieldbrother.GetFullName], and neither of you went down"
 bc_shieldbrother_memory_desc_third_perspective:0 "[owner.GetName] came through the press back to back with [shieldbrother.GetFullName], and neither of them went down"

# The title reads back the province with GetNameNoTooltip and the description
# with GetName. Vanilla's own battle-memory titles do the same: a title is
# already inside a memory-list entry, and GetName there nests a tooltip in a
# tooltip. `battle_location` is set on the memory by bc_battle_memory_effect.

 bc_battle_memory_won:0 "won a battle at [ROOT.Var('battle_location').GetProvince.GetNameNoTooltip]"
 bc_battle_memory_won_desc:0 "I stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and we were the ones still standing on it"
 bc_battle_memory_won_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and you were the ones still standing on it"
 bc_battle_memory_won_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and was among those still standing on it"

 bc_battle_memory_lost:0 "lost a battle at [ROOT.Var('battle_location').GetProvince.GetNameNoTooltip]"
 bc_battle_memory_lost_desc:0 "I stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_second_perspective:0 "you stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"
 bc_battle_memory_lost_desc_third_perspective:0 "[owner.GetName] stood in the line at [ROOT.Var('battle_location').GetProvince.GetName], and the line did not hold"

# --- pop-up events ----------------------------------------------------------

 bc_chronicles.0001.t:0 "The Banner Falls"
 bc_chronicles.0001.desc:0 "The standard goes down.\n\nIt is not a sound so much as an absence. The men who were dressing on it turn, and find nothing to dress on, and the turn spreads outward faster than any order could.\n\nThe standard-bearer is somewhere under the feet of the melee. The staff is still visible, canted, being trodden lower."
 bc_chronicles.0001.a:0 "Then I will carry it myself."
 bc_chronicles.0001.b:0 "Sound the withdrawal. Reform behind the line."
 bc_chronicles.0001.c:0 "No man steps back from where it fell."

 bc_chronicles.0002.t:0 "Rally the Line"
 bc_chronicles.0002.desc:0 "The line has not broken. It is doing something worse, and slower: it is thinking about breaking.\n\nMen at the back are looking over their shoulders and measuring the distance. Nothing has been decided yet. It will be decided in the next few moments, by whoever speaks into them."
 bc_chronicles.0002.a:0 "Ride the length of the line where they can see me."
 bc_chronicles.0002.b:0 "Promise them the spoils, and pay it out now."
 bc_chronicles.0002.c:0 "Say nothing. Let them steady themselves."

 bc_chronicles.0003.t:0 "The Van Breaks Through"
 bc_chronicles.0003.desc:0 "The leading ranks have found the seam and put a wedge in it, and the wedge is going deeper than anyone intended.\n\nIt can be driven all the way. It can also be driven so far that it comes out the far side alone, with the enemy closed up behind it."
 bc_chronicles.0003.a:0 "Press it. Everything behind the wedge."
 bc_chronicles.0003.b:0 "Hold them. Keep the line whole."

# --- nickname tooltips ------------------------------------------------------
#
# The ONE place this mod writes a key it did not invent. CK3 builds the nickname
# tooltip in the character sheet from `<nickname>_desc`, so there is no bc_-
# prefixed alternative: either the engine's key exists or the tooltip has nothing
# to say. AGOT defines all 27 names but only ONE of these descriptions
# (nick_agot_the_painter_desc), so 26 of the names this mod hands out hovered
# blank. That is what these fill.
#
# ADDITIONS, NOT OVERRIDES. Verified against the whole AGOT localization tree
# before writing: none of the 26 keys below is defined anywhere in it. A key that
# is defined twice is a `Duplicate localization key` line in error.log and the
# loser is silently discarded, so if AGOT ever ships its own, DELETE ours - do not
# rely on load order to pick a winner.
#
# These render for ANY bearer, including canon characters who start the game with
# the name. So each one is written as a byname a fighting man earns, never as
# something that only makes sense for a commander this mod just promoted, and each
# uses the vanilla gendered tokens rather than assuming a man.

 nick_agot_the_warrior_desc:0 "Men who have stood in the line beside [CHARACTER.GetShortUINameNoTooltipNoFormat] say the Warrior himself was wearing [CharYourHerHis(CHARACTER)] face that day."
 nick_agot_greysteel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has gone grey in the saddle, and the steel in [CharYourHerHis(CHARACTER)] hand has lost none of its edge."
 nick_agot_fireball_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] falls on a battle the way fire falls on dry grass, and leaves about as much of it standing."
 nick_agot_hardstone_desc:0 "The field threw everything it had at [CHARACTER.GetShortUINameNoTooltipNoFormat] and broke on [CharYouHerHim(CHARACTER)] like water on stone."
 nick_agot_breakspear_desc:0 "Spears splinter on [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] shield, and [CharYouSheHe(CHARACTER)] keeps coming."
 nick_agot_oakenfist_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] fist closes on a battle like oak, and what it takes hold of does not get loose."
 nick_agot_greatheart_desc:0 "There is no braver heart on any field [CHARACTER.GetShortUINameNoTooltipNoFormat] has ridden onto, and every man who followed [CharYouHerHim(CHARACTER)] there knows it."
 nick_agot_ironheart_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] watched the line break and did not flinch. Men have called [CharYouHerHim(CHARACTER)] iron-hearted ever since, and not all of them meant it kindly."
 nick_agot_the_neveryield_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been outnumbered, surrounded and ridden down, and has never once yielded."
 nick_agot_greycloak_desc:0 "The cloak went onto the field clean and came off it grey with ash and dust, and [CHARACTER.GetShortUINameNoTooltipNoFormat] has worn it that way ever since."
 nick_agot_longspear_desc:0 "Few men get close enough to [CHARACTER.GetShortUINameNoTooltipNoFormat] to find out what [CharYouSheHe(CHARACTER)] can do with a sword."
 nick_agot_shieldbreaker_desc:0 "Shields come away from [CHARACTER.GetShortUINameNoTooltipNoFormat] in pieces, and the arms behind them rarely fare better."
 nick_agot_shieldsmasher_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] does not go around a shield wall. [CharYouSheHe(CHARACTER)] goes through it."
 nick_agot_thunderbolt_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] arrives on a battle the way thunder arrives on a summer afternoon: all at once, and far too late to do anything about."
 nick_agot_the_steelskin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been cut, thrown and trampled, and keeps standing back up. The smallfolk have decided [CharYouSheHe(CHARACTER)] must be skinned in steel."
 nick_agot_the_woe_desc:0 "Whole houses count the day they met [CHARACTER.GetShortUINameNoTooltipNoFormat] in the field as the worst in their history."
 nick_agot_the_morningstar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rides at the head of the charge, bright and early and impossible to mistake for anyone else."
 nick_agot_oakenshield_desc:0 "Men form up behind [CHARACTER.GetShortUINameNoTooltipNoFormat] because whatever is in front of [CharYouHerHim(CHARACTER)] tends to stay in front of [CharYouHerHim(CHARACTER)]."
 nick_agot_blacksword_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade comes off the field black to the hilt, and [CharYouSheHe(CHARACTER)] has never been in any hurry to clean it."
 nick_agot_widowmaker_desc:0 "Count the widows made by the last three fields and you have counted [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] work."
 nick_agot_bloodborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] seems to have been born for a battlefield, and is never so alive as on one."
 nick_agot_starfire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] came down on them like something falling burning out of the night sky."
 nick_agot_the_windrider_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is always on the flank nobody was watching, and always sooner than anyone thought possible."
 nick_agot_swiftspur_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is first onto the field and last off it, and [CharYourHerHis(CHARACTER)] horses pay for both."
 nick_agot_battleborn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has fought so many fields that men have stopped asking where [CharYouSheHe(CHARACTER)] came from and started saying [CharYouSheHe(CHARACTER)] was born out of one."
 nick_agot_swordbiter_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] blade has taken so many notches out of other men's steel that the armourers know [CharYouHerHim(CHARACTER)] by the work."
 bc_style_award_toast:0 "A Way of Fighting"
 bc_style_award_aggressive_attacker_desc:0 "[bc_award_subject.GetName] has won three battles by making the enemy pay for standing still. Men have started to say he does not fight so much as insist."
 bc_style_award_unyielding_defender_desc:0 "Three times now [bc_award_subject.GetName] has set his line and three times it has held. Whatever else is said of him, he does not move."
 bc_style_award_flexible_leader_desc:0 "[bc_award_subject.GetName] has won three battles on ground that did not suit him, and won them by not minding."
 bc_style_award_cautious_leader_desc:0 "[bc_award_subject.GetName] has taken three fields without spending men on any of them. The reckless captain he was is not the man who came back."
 bc_style_award_reckless_desc:0 "[bc_award_subject.GetName] has thrown himself into three battles without waiting to see the shape of them. It has worked three times."
 bc_style_award_organizer_desc:0 "Three battles, and not once has [bc_award_subject.GetName]'s line lost its shape. The men know where to be before he tells them."
 bc_terrain_award_toast:0 "He Knows This Ground"
 bc_terrain_award_desert_warrior_desc:0 "[bc_award_subject.GetName] has fought twice in the dry country and learned what it costs."
 bc_terrain_award_open_terrain_expert_desc:0 "Twice on open ground, and [bc_award_subject.GetName] has learned what open ground is for."
 bc_terrain_award_rough_terrain_expert_desc:0 "[bc_award_subject.GetName] has fought twice in broken country and stopped cursing it."
 bc_terrain_award_forest_fighter_desc:0 "Twice under the trees. [bc_award_subject.GetName] has stopped trying to make a forest into a field."
 bc_terrain_award_jungle_stalker_desc:0 "[bc_award_subject.GetName] has come out of the green twice. Not everyone does."
 bc_terrain_award_winter_soldier_desc:0 "Twice [bc_award_subject.GetName] has drawn up a line on ground that would not hold a stake, and twice he has come off it walking. The cold takes more men than the enemy does, and he has stopped letting it."
 rule_bc_rivalry:0 "Battle Chronicles: Rivalry"
 rule_bc_rivalry_desc:0 "Whether losing a notable battle to the same commander twice makes an enemy of him. The mod tracks the man regardless; this decides how far the grudge is allowed to go."
 setting_bc_rivalry_off:0 "Off"
 setting_bc_rivalry_off_desc:0 "No relations are set. Battles still remember who beat you, and the field still reads differently when you meet him again, but CK3's relation graph is left alone — and so are the schemes A Game of Thrones hangs off it."
 setting_bc_rivalry_rival:0 "Rival"
 setting_bc_rivalry_rival_desc:0 "A first loss is a grudge; a second makes him a rival. It stops there however many times he beats you."
 setting_bc_rivalry_nemesis:0 "Nemesis"
 setting_bc_rivalry_nemesis_desc:0 "The full ladder. Three losses to one man makes him a nemesis — which in A Game of Thrones is a man you may find yourself planning to kill."

 rule_bc_wounds:0 "Battle Chronicles: Wounds"
 rule_bc_wounds_desc:0 "Whether a commander can be hurt in the fighting. He is never killed, and never worse than wounded — but a wounded man cannot lead an army until he mends."
 setting_bc_wounds_off:0 "Off"
 setting_bc_wounds_off_desc:0 "Commanders come off every field whole. Battles still turn on their decisions; nothing is ever taken out of them."
 setting_bc_wounds_default:0 "Default"
 setting_bc_wounds_default_desc:0 "A commander on the wrong side of a decisive moment, in a large battle that has already been going a while, may be carried off it. At most once per battle, and never more than once at a time."

# --- rivalry ----------------------------------------------------------------

 bc_reason_battle_grudge:0 "beat him on the field"
 bc_reason_battle_rival:0 "has beaten him twice on the field"
 bc_reason_battle_nemesis:0 "has broken him three times on the field"
 bc_rivalry_toast:0 "The Man Across the Field"
 bc_rivalry_grudge_desc:0 "[bc_rivalry_foe.GetName] took the field from [bc_rivalry_subject.GetName] today. That is all it is so far — a name, and a face to put to it."
 bc_rivalry_rival_desc:0 "Twice now. [bc_rivalry_subject.GetName] has lost to [bc_rivalry_foe.GetName] twice, and the second time it stopped being bad luck."
 bc_rivalry_nemesis_desc:0 "Three fields, three defeats, one man. [bc_rivalry_subject.GetName] has stopped thinking about the war and started thinking about [bc_rivalry_foe.GetName]."

# --- the dead ---------------------------------------------------------------

 bc_dead_knights_toast:0 "They Did Not All Come Back"
 bc_dead_knights_toast_desc:0 "Some of the men who rode out under [bc_bereaved_commander.GetName]'s banner are still on that field. The heralds will have their names by morning."

# --- the opening ------------------------------------------------------------

 bc_chronicles.0011.t:0 "The Lines Close"
 bc_chronicles.0011.desc_intro:0 "The hosts are in reach of one another and nothing has been settled yet. Whatever is chosen now will have to be lived with all day."
 bc_chronicles.0011.desc_nemesis:0 "And across the field, under the other banner, is [bc_eve_foe.GetName]. [ROOT.Char.GetFirstName] has been here before, against this man, and it did not go well."
 bc_chronicles.0011.desc_stranger:0 "Across the field the other host comes on behind a banner nobody here can name. Nobody over there is anybody [ROOT.Char.GetFirstName] knows."
 bc_chronicles.0011.a:0 "Press them before they are set."
 bc_chronicles.0011.b:0 "Hold the ground and let them come."
 bc_chronicles.0011.c:0 "Wait. See how the first ranks fare."
 bc_chronicles.0011.desc_kin:0 "The banners across the field are ones he grew up under. Somebody over there taught him to ride."
 bc_chronicles.0011.desc_heathen:0 "They will pray before this, as he will, and not to the same thing."
 bc_chronicles.0011.desc_countryman:0 "The men across the field speak as his do. Whatever is decided here, both sides will tell it in the same tongue."
 bc_chronicles.0011.desc_ground_rough:0 "The ground is broken between here and them. Whoever crosses it will arrive out of order."
 bc_chronicles.0011.desc_ground_forest:0 "The trees begin a hundred paces off and do not end. A line that goes in there stops being a line."
 bc_chronicles.0011.desc_ground_jungle:0 "The green starts where the field ends and it does not thin. Men who go in there are gone from this battle."
 bc_chronicles.0011.desc_ground_winter:0 "The cold has been in the men since before dawn. It will be in them all day."
 bc_chronicles.0011.desc_ground_desert:0 "There is no water between here and the horizon, and both armies know it."
 bc_chronicles.0011.desc_ground_open:0 "The field is what it is. Nothing on it will decide anything for you."
 bc_chronicles.0011.d:0 "Let the ground fight for us."
 bc_chronicles.0011.e:0 "This time he does not ride away."

# --- the flesh --------------------------------------------------------------

 bc_wounded_toast:0 "Carried From the Field"
 bc_wounded_toast_desc:0 "[bc_wounded_commander.GetName] was brought down in the thick of it and carried out. He will live. He will not sit a horse at the head of an army until he mends."
