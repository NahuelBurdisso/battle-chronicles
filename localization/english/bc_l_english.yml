# to use".
 bc_the_one_part_of_the_field_he_cannot_reach_is_all_of_it_toast:0 "The One Part Of The Field He Cannot Reach Is All Of It"
 bc_the_one_part_of_the_field_he_cannot_reach_is_all_of_it_toast_desc:0 "They carried him up here at dawn and set the chair down where the ground is highest, and that is where he will be at dusk, because there is no other arrangement available. Everything he knows about war he still knows. What has been taken from him is the twenty minutes in which a man goes and looks. His left is being cut apart. He can see that it is happening and he can see roughly where, and what he cannot do is the thing every other man in this position does without thinking about it - get down there, put his own face in front of theirs, find out in person whether it is fear or ground or simply too many of them. So he sits above it, entirely upright, being told things by men who are out of breath and are already a little out of date, and works with what reaches him. It is not enough today. He has known for some hours that it would not be, and he has stayed exactly as he is, because the one thing he can still do from a chair is refuse to be moved off it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_already_been_dead_once_this_life_toast:0 "He Has Already Been Dead Once This Life"
 bc_knight_he_has_already_been_dead_once_this_life_toast_desc:0 "When he was eleven they walked him into the surf and put him under and held him there past struggling, past stillness, until whatever it is that argues about staying had finished arguing. Then they hauled him out and knelt on him and worked at him until the water came back up. He remembers the cold and he remembers the quiet and he does not remember being frightened, which is the part nobody believes. He is bleeding from the forearm and from somewhere above the ear and he has not looked at either. The men in front of him have begun to give way, not all at once but in the way a bank does, and he is going into every gap they leave with the unhurried, thorough persistence of somebody who has already settled the largest question available and is doing the small remaining work of the afternoon. What is behind him is a faith. What is in front of him is only weather.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

