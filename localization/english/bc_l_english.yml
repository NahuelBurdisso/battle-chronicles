 bc_the_thing_he_never_said_out_loud_toast:0 "The Room He Learned To Read"
 bc_the_thing_he_never_said_out_loud_toast_desc:0 "He learned young how to sit in a hall full of men with his face doing one thing and the rest of him doing another, and in forty years he has never once slipped. There was somebody, a long while ago. There has been nobody since. Not one man out here knows either half of that, and none of it is any use to him this afternoon. What is of use is the habit underneath it, which is four decades of working out what a room will bear before he opens his mouth, and which turns out to work exactly as well on a hillside as it ever did indoors. The left has gone soft and the far side has seen that it has. He does not argue with the fact. He stops asking his line for the thing it cannot give him and starts asking it for the thing it still can, and he does the whole of it without explaining himself to anybody, because explaining himself is not something he has ever done. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_none_of_it_ever_reached_him_toast:0 "None Of It Ever Reached Him"
 bc_knight_none_of_it_ever_reached_him_toast_desc:0 "Most men spend a fair part of their lives turned around by somebody. He has watched it happen to every friend he has, from close up, and understood not one minute of it. Nothing of that kind has ever reached him. He does not know what he is missing and he has never once minded not knowing. What it has left him with is a very quiet head. The far side has begun to come apart at the join between two of its companies, the gap there is widening at about the pace of a walking horse, and there is nothing whatever inside him competing for the room that fact needs. He goes in straight, at the speed he judged and not a stride faster, and the men to either side of him find they can hold the shape because he has not asked them for anything clever. The join is a hole by the time the second rank gets to it. He has still not said a word. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

