# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 280.
 bc_the_man_opposite_thinks_the_way_he_does_toast:0 "The Same Short List"
 bc_the_man_opposite_thinks_the_way_he_does_toast_desc:0 "Three of the words that describe him describe the man on the other side as well, and he has known it since the heralds finished. It is not a comfort. Everything he can think to try this afternoon is a thing that would occur to the man opposite in the same order, for the same reasons, at roughly the same moment, and the proof of that is arriving in front of him rank by rank. He feints, and the feint is read. He commits late, because he has always committed late and it has always been the right instinct, and the far side is already standing where late arrives. There is no trick left that belongs to him alone. Two men assembled from the same short list can only beat one another with numbers or with ground, and the numbers and the ground both went the other way before any of this started. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_nothing_about_that_man_is_his_toast:0 "Nothing Of That Man"
 bc_knight_nothing_about_that_man_is_his_toast_desc:0 "He has never met the man commanding over there and does not need to. Everything the far side has done today has been done in a manner he finds personally insulting: the caution, the hoarding of good men, the willingness to spend an hour on a thing that wanted a minute. Word for word the two of them were drawn from opposite ends of whatever list the gods keep, and that is not a figure of speech, it is the plain arithmetic of the thing. So when the gap opens he goes into it in exactly the way that man never would, which is to say without asking anybody first, and the men to either side of him come along because it is obvious, and a position that was going to cost the whole afternoon costs rather less. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

