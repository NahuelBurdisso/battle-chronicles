# to".
 bc_this_column_is_all_horse_and_no_bow_toast:0 "Bought for the Charge"
 bc_this_column_is_all_horse_and_no_bow_toast_desc:0 "He bought the destriers because destriers win, and on the day he was signing for them nobody in the hall said the word distance. Now there is a line three hundred paces off doing nothing whatever, and he has no way of touching it that does not involve sending the most expensive thing he owns across open ground into whatever is waiting there. He sends it. It costs. He sends it again, further along, and it costs again, and each time the ones who come back are fewer and slower and less willing to hear the next order. What he wants, with a want that has gone almost physical, is a hundred men who could simply stand where they are and make that line uncomfortable. He does not have them. He never bought them. There was always something better to spend it on, and the something better is dying in front of him now in armour worth a village apiece.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_this_column_is_all_bow_and_no_horse_toast:0 "The Unglamorous Half"
 bc_knight_this_column_is_all_bow_and_no_horse_toast_desc:0 "There is not a horse on this side of the field and he has stopped wishing for one. What he has is men who can hit a moving thing at two hundred paces and a piece of ground to stand on while they do it, and his whole work for the last hour has been keeping that ground worth standing on. He walks the line instead of riding it. He puts his shield where the gap opens, calls the count for the next volley, hauls a man up by the collar and shoves him into the space he left, and none of it looks like anything at all. Then the far side comes on a fourth time and comes slower, and he can read it in their front rank before they have admitted it themselves: they have decided they cannot get here. The shafts keep going out over his head in that unhurried rhythm somebody spent years beating into them, the men opposite stop coming, and he stands in the middle of it doing the least glamorous work on the field extremely well.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

