 bc_his_sideways_kin_are_a_crowd_toast:0 "Past Ten"
 bc_his_sideways_kin_are_a_crowd_toast_desc:0 "He could not tell you offhand how many of them there are. Uncles who married well and uncles who did not, a great tangle of nephews at four different ages, cousins whose faces he has to reconstruct out of their mothers - the count sits somewhere past ten and has done for years, and keeping it in some sort of order is most of what his winters consist of. Out here not one of them is any use to him whatsoever, and yet they keep turning up in his head anyway, unhelpfully, one at a time, each attached to a small unfinished argument. He is thinking about a marriage he promised to look into when a spear comes over the rim of his shield and opens his cheek from the jaw to the ear. The world becomes very simple after that. He is aware of warmth running into his collar, and of his own teeth being visible to other people, which is undignified, and of a great quantity of noise arriving from the left where things were already bad. It is the first honest hour he has had in a decade, and he would hand over the whole tangle of them to have it be over.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_only_one_man_stands_sideways_of_him_toast:0 "One Left"
 bc_knight_only_one_man_stands_sideways_of_him_toast_desc:0 "One. That is the whole of it sideways - one man, a cousin he has met perhaps six times, presently somewhere south of here doing something with sheep. Everybody else who ever stood beside him in that particular way is under the ground, most of them out of the same bad autumn, and what that subtraction left him with is a habit he does not examine: when the shouting starts he goes into it like a man throwing away a thing he has already decided is worthless. Today it is going well, which makes no difference to him at all. He is over the ditch before the men beside him have finished agreeing to it, and he takes the horse through ground no sensible rider would take a horse through, and he keeps taking it until the animal is blown and shuddering and steam is coming off it into the cold. It works. Things give way in front of him because he does not appear to care what happens next, and there is a kind of freedom in that which he would find hard to describe and would not try.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

