# on it quickly".
 bc_the_man_opposite_has_been_doing_this_since_before_he_started_toast:0 "He Is Having The Worst Day Of His Life Against A Man For Whom It Is Tuesday"
 bc_the_man_opposite_has_been_doing_this_since_before_he_started_toast_desc:0 "Whoever is handling the far side has not spent a peaceful day in ten years and it is legible in every single thing that side does. Nothing over there is being improvised. The reserve went in at the moment it should have gone in and not one moment earlier, which is a thing that sounds easy and is not, because holding a reserve while your own front bends takes a stomach that only gets built one way. Nobody over there is hurrying. Their wounded are being pulled out along a route that somebody clearly walked before the fighting started. Their second line is resting - actually sitting, in the middle of this - because whoever put them there knows to the hour what a body of men has left in it. He himself has been at war for the better part of one season and had thought, until about noon, that it had aged him. What is being done to him now is not cleverness and it is not strength. It is repetition. Everything that is going wrong for him this afternoon is a thing the man opposite has already seen go wrong for somebody else, several times, in several countries, and has had years of quiet evenings afterwards in which to decide precisely what he would do about it if it were ever his turn to be standing on the winning side of it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_has_not_been_home_in_two_years_toast:0 "Two Years Of This Have Worn Everything Off His Work Except The Parts That Were Doing Something"
 bc_knight_he_has_not_been_home_in_two_years_toast_desc:0 "It has been two years since he slept anywhere he could call his own and the fighting has become the ordinary condition of his life rather than an interruption of it. Everything decorative has gone. He does not shout, he does not set himself, he has stopped raising his shield higher than it needs to go, and the swing he started the second summer with has shortened by about a hand's breadth because that hand's breadth was never arriving anywhere. He eats when there is food in front of him without deciding to. He has learned, the way you learn to walk, which of the sounds behind him require turning round. The men beside him think he is gifted and he is not especially; he is simply the only one of them who has not had a winter off, and what looks like skill from a yard away is mostly the absence of everything that used to be wasted. The day is going well and he has noticed that it is going well the same way he would notice weather. Somewhere under all of it is a fact he keeps at arm's length, which is that he can no longer clearly picture the room he grew up in, and that he stopped trying to some months ago.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 155 - the gap between his hands and the far commander's ----------
#
