# loss badly and has already taken one".
 bc_the_least_of_him_is_what_today_wants_toast:0 "The Least of Him"
 bc_the_least_of_him_is_what_today_wants_toast_desc:0 "There are five things a man is asked to be and he has always been worst at this one. Nobody at home would call it a failing. He keeps accounts nobody has ever caught out, he can sit in a room full of people who hate each other and have them leave in one piece, and he has read more than the man who taught him to read. None of that is what is wanted out here. What is wanted is the knack he has never had, which is looking at ground and men and daylight and knowing which of the three runs out first, and today the answer is arriving as a fact rather than as a choice. Off on the right a company that should have shifted a quarter of an hour ago is being taken apart where it stands, and he did not see it coming until it was already happening. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_no_second_thought_in_him_toast:0 "No Second Thought"
 bc_knight_there_is_no_second_thought_in_him_toast_desc:0 "Whatever else is wrong with him, none of it is concealed. He has never had a plan sitting behind a plan, never said one thing while meaning a second, never once been the one in a room who knew something the rest did not. Most years that is a way of getting used badly by cleverer people. Out here it means there is no part of him standing off to one side with an eye on afterwards. He is where he was put. When the far side comes on and the fellow on his left steps up, he steps with him without being told, and when the ground on his right opens a little he shuts it instead of filling it with himself. It is not brilliance. It is the whole of a man arriving in one place at one time, which is worth a good deal more out here than it ever was indoors. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

