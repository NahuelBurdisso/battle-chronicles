# SPENT PHRASES: ../../../docs/battle-chronicles/phrase-ledger.md, block 483.
# in his boot again".
 bc_this_field_is_a_crossroads_toast:0 "Five Roads"
 bc_this_field_is_a_crossroads_toast_desc:0 "Five ways in, and he has men enough to hold perhaps two of them properly. The trouble with ground everybody wants is that everybody can reach it, and the sum has been getting worse all morning in a direction he can do nothing about: shut one approach and the next stands bare, spread across them all and not one of them will take a push. So he gives up owning the whole of it. The line draws in, shortens, thickens, abandons the hedge and the good slope beyond it, and takes instead a smaller shape that can be answered on every face at once. He is not proud of it. A better-placed man would have wanted this ground for exactly the reasons it is now costing him, and would have sat down on it early with everything he had. He came late. He holds a knot, and every track that made this worth having is a track somebody else is walking down.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_there_is_one_way_out_of_here_toast:0 "The Only Door"
 bc_knight_there_is_one_way_out_of_here_toast_desc:0 "There is one way out and it lies behind them. He worked that out yesterday, pacing the ground with nothing better to do, and said nothing about it because at the time it did not seem worth saying: high broken stone along two sides, wet bottom on the third, and a single gap where the track runs through. Now the far line has started coming apart the way lines do, not breaking so much as leaning, everyone drifting one way without any of them choosing to. They are drifting at the gap. So he takes a dozen horse, gets there ahead of the drift, sets himself across the track and does nothing clever whatever. Men come up in ones and twos, see what is filling the gap, and stop. The ones behind them come up and find them stopped. Most of what he is doing is not fighting at all. It is occupying a doorway while the room fills.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

