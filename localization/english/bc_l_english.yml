 bc_nobody_on_this_side_is_going_to_tell_him_how_bad_it_is_toast:0 "He Will Have To Work Out How Bad It Is By Looking, Because Asking Gets One Answer"
 bc_nobody_on_this_side_is_going_to_tell_him_how_bad_it_is_toast_desc:0 "The runner comes back and says it is holding. The next one comes back and says it is holding. He was raised in the same schoolroom as both of them and he knows precisely what that word is doing, which is covering everything from comfortable to unspeakable, because among his own people the disgrace is not in being cut to pieces, it is in mentioning that you are being cut to pieces. So he has stopped asking and started counting instead. He counts standards, which is unreliable. He counts how far the noise has crept along the line since he last checked, which is better. He counts wounded coming back and, more usefully, how many of them are walking with somebody helping. What the counting tells him is considerably worse than what the words told him, and the gap between the two has been widening since midday, and every man who reported that it was holding believed he was doing the decent thing.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_he_was_raised_to_believe_this_is_what_the_year_is_for_toast:0 "He Was Raised To Believe This Is The Part Of The Year The Rest Of It Waits For"
 bc_knight_he_was_raised_to_believe_this_is_what_the_year_is_for_toast_desc:0 "Everything he understands about how a mass of men behaves he learned before he was twelve, from watching, at close range, in a place where this was the ordinary business of a summer rather than a catastrophe. So he can see it. He can see that the group in front of him is three men wide at the point and hollow behind, that the ones on the far left have already privately decided and are waiting for an excuse, and that the whole thing is about to turn on the man with the bad shoulder who does not yet know he is the hinge. None of that is cleverness. It is the same recognition a farmer has for weather, built the same way, by seeing the thing four hundred times. He shifts two paces to his right without being told to, and the men either side of him shift because he did, and ninety seconds later the hollow part comes apart exactly where he was standing waiting for it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- batch 162 - what his face has been doing for him since he was a boy ----
