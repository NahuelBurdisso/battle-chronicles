 bc_his_sons_will_carry_her_name_toast:0 "The Name It Goes Under"
 bc_his_sons_will_carry_her_name_toast_desc:0 "He signed what he signed and he has never once complained about it out loud. The lands he has run for two decades will pass to a boy who is not called what he is called. Every account he has balanced, every hedge he has had cut back, every hard winter he got the whole household through - all of it goes into a book kept under somebody else's name, and this afternoon is going into that book too, badly begun, on ground he would never have picked. So he does the one part still left to him. The steadiest men go where the weight is coming down, he stops trying to win anything at all, and he starts on the smaller and colder business of not losing it worse than it has to be lost. Whatever gets written, it will not say the thing came apart while he stood there watching it. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_line_runs_through_her_toast:0 "Hers Before Anybody's"
 bc_knight_the_line_runs_through_her_toast_desc:0 "Her husband came to her house and not the other way about, and the children asleep two hundred miles from here are hers before they are anybody's. She has never once had to think about that and she is not thinking about it now. What she is thinking about is that the far side has bent in the middle three times and this time it has not come back, and that the animal under her has one good run left in it and probably not two. She takes the one. She is into the bend before it can close, and she takes the whole wing with her because not one of them intends to sit and watch her go alone, and the space behind her fills up with men who were holding a minute ago and are not holding now. The horses will pay for this tonight. Every rider there knows it and every rider there goes. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

