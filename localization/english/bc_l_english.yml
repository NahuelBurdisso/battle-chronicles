 bc_his_father_is_alive_to_hear_of_this_toast:0 "Still Somebody's Son"
 bc_his_father_is_alive_to_hear_of_this_toast_desc:0 "He is forty-one and there is still a man alive who taught him to hold a rein. Nobody who has not had that arrangement understands it. The seat is his, the men out here are his, the choices of the last twenty years were every one of them his, and underneath all of it sits the plain fact that somebody who made those same choices first is breathing this afternoon and has opinions about how they turned out. It is not that he wants the approval. He gave up wanting it a long while back and mostly believes himself when he says so. It is that the standard exists, it was set before he was old enough to argue with it, and it does not go away because the ground here is soft and the wing is folding and he has run out of ideas at exactly the hour that needed one. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_his_mother_is_the_last_one_left_toast:0 "The Last One Left"
 bc_knight_his_mother_is_the_last_one_left_toast_desc:0 "His father went into the ground when he was nineteen and he has mostly stopped turning it over. His mother is another matter. She is old now, she is sharp, she notices things across a room that nobody else in it has seen, and she is the only person breathing who knows what he was like before he was any of this. So when the shape of the fight changes twice inside a minute he changes with it - shield lower, feet further apart, weight off the front foot that was about to be taken out from under him. It is the kind of adjustment a man makes without thinking when he settled in advance that he is going back, because there is somebody waiting who would take the loss badly and has already taken one. [bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

