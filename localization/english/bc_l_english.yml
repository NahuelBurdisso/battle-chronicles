l_english:

# Battle Chronicles.
#
# MUST stay UTF-8 WITH BOM. Without it CK3 drops the entire file and every key
# renders as its raw name. Entry syntax is exact: one leading space, KEY:0 "text".
#
# The momentum modifier names below are NOT internal labels. The combat advantage
# breakdown prints them verbatim, in a list next to "Commander Martial Skill" and
# "Leading Own Soldiers". Verified in game. Write them as causes a maester would
# record, never as mechanics.

 bc_momentum_minor:0 "The Line Steadies"
 bc_momentum_minor_desc:0 "The shouting has changed. They are listening again."
 bc_momentum_major:0 "The Line Surges Forward"
 bc_momentum_major_desc:0 "The line is moving forward and it is moving together."
 bc_momentum_decisive:0 "The Field Is Ours"
 bc_momentum_decisive_desc:0 "It is over. They have not all worked that out yet."
 bc_faltering_minor:0 "The Line Wavers"
 bc_faltering_minor_desc:0 "Men are looking over their shoulders. Not many. Enough."
 bc_faltering_major:0 "The Banner Wavers"
 bc_faltering_major_desc:0 "The banner is where the line should be, and the line is not there."
 bc_faltering_decisive:0 "The Line Is Breaking"
 bc_faltering_decisive_desc:0 "It is not a battle any more. It is a crowd running in one direction."

# Family 2, the character of the fight. These are `army_*` / `knight_*` tags, so
# they do NOT appear in the combat advantage breakdown the comment above is about
# — they show in the army stat breakdown and the character's modifier list, both
# of which render the name and the _desc. Nothing in the toolchain warns when one
# of these is missing: `--strict`'s loc cross-check covers traits, decisions and
# character interactions only, so an unlocalized modifier renders its raw key at
# the player and validates clean forever.
 bc_bloodied:0 "Blood for Ground"
 bc_bloodied_desc:0 "They have paid for every step they have taken, and they mean to be paid back."
 bc_shieldwall:0 "The Shields Are Locked"
 bc_shieldwall_desc:0 "They have set their feet. Nothing is getting through, and nothing is getting done."
 bc_spent_horse:0 "The Horses Are Blown"
 bc_spent_horse_desc:0 "The knights went in hard and went in early. There is nothing left in the animals."
 bc_pursuit:0 "Hard on Their Heels"
 bc_pursuit_desc:0 "The enemy is giving ground, and there is no order left in the giving."
 bc_ground_held:0 "The Ground Is Ours"
 bc_ground_held_desc:0 "They chose the ground and they have not stepped off it. Moving them is a day's work; moving them forward is not happening."

 bc_valiant_in_battle_opinion:0 "Stood Fast in Battle"
 bc_craven_in_battle_opinion:0 "Shamed Himself in Battle"
 bc_shieldbrother_opinion:0 "Shieldbrother"

# --- game rules -------------------------------------------------------------

 rule_bc_frequency:0 "Battle Chronicles: Frequency"
 rule_bc_frequency_desc:0 "How often a battle produces a notable moment. Battles roll for events every five days."
 setting_bc_frequency_low:0 "Rare"
 setting_bc_frequency_low_desc:0 "Half as often. Chronicles stay reserved for long, hard battles."
 setting_bc_frequency_default:0 "Default"
 setting_bc_frequency_default_desc:0 "A notable moment roughly once a month of fighting."
 setting_bc_frequency_high:0 "Frequent"
 setting_bc_frequency_high_desc:0 "Twice as often. Battles become a running account."

 rule_bc_swing:0 "Battle Chronicles: Swing"
 rule_bc_swing_desc:0 "How far a single moment can tip a battle. Affects the advantage granted or lost by every chronicle."
 setting_bc_swing_subtle:0 "Subtle"
 setting_bc_swing_subtle_desc:0 "Moments colour a battle without deciding it."
 setting_bc_swing_default:0 "Default"
 setting_bc_swing_default_desc:0 "A decisive moment is worth about as much as a capable commander."
 setting_bc_swing_dramatic:0 "Dramatic"
 setting_bc_swing_dramatic_desc:0 "A battle can turn on one moment. Cuts both ways."

 rule_bc_aftermath:0 "Battle Chronicles: Aftermath"
 rule_bc_aftermath_desc:0 "Whether a battle worth remembering leaves a mark on the men who fought it. Knights carry a memory of the field; a commander who wins several may be named for them."
 setting_bc_aftermath_off:0 "Off"
 setting_bc_aftermath_off_desc:0 "Battles leave nothing behind. The mod behaves as it did before this was added, and AGOT's own nickname system is left entirely alone."
 setting_bc_aftermath_default:0 "Default"
 setting_bc_aftermath_default_desc:0 "A battle must stand out in at least two ways — its size, its cost, the odds against, or how completely it was decided. Most fields do not."
 setting_bc_aftermath_generous:0 "Generous"
 setting_bc_aftermath_generous_desc:0 "One reason is enough. Notable fields and the names won on them become common."

# --- commander chronicles ---------------------------------------------------

 bc_banner_falls_toast:0 "The Banner Falls"
 bc_banner_falls_toast_desc:0 "The standard goes down in the press, and the men nearest it look for it and do not find it.[bc_chronicle_subject.Custom('bc_banner_falls_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# SPIKE. One fragment set, on one moment, to prove the shape renders before the
# rest of the fragment keys were written. That run has not happened; the bond and
# scale fragments below were written anyway, under the AMENDMENT in
# ../../docs/plans/2026-08-15-battle-chronicles-depth-plan-b-prose.md - a path
# from THIS repo's root, the plans living in the tooling repo two levels above
# this one - because a fragment APPENDED to a desc that keeps its literal
# sentence fails to "no improvement" rather than to an empty toast. It stopped
# being the ONLY per-moment set on 2026-08-17, when the other nine moments got
# sets on the same argument; all ten descs carry a ground call now. Each
# fragment BEGINS WITH A SPACE because
# it is appended to a finished sentence - bc_banner_falls_toast_desc deliberately
# has no space before the tag, so the empty fallback leaves no trailing space.
# One clause each: the fragment adds a place to a thing that already happened,
# it does not restate the thing.
 bc_frag_banner_falls_desert:0 " The dust takes it before the sand does."
 bc_frag_banner_falls_open:0 " There is nothing else on that field to look at, and so they all see it go."
 bc_frag_banner_falls_rough:0 " It goes down the slope with the man who carried it."
 bc_frag_banner_falls_forest:0 " The branches have it before the ground does, and it hangs there where no one can reach it."
 bc_frag_banner_falls_jungle:0 " The green closes over it in a moment, as though it had never been raised."
 bc_frag_banner_falls_winter:0 " It lies in the snow, and the snow begins at once to cover it."
 bc_frag_banner_falls_any:0 ""

 bc_rally_the_line_toast:0 "The Line Is Rallied"
 bc_rally_the_line_toast_desc:0 "A shouted order carries where it should not have, and the ranks close again.[bc_chronicle_subject.Custom('bc_rally_the_line_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE FOURTH PER-MOMENT GROUND SET, paired with the flank-collapse set below on
# the same six bands: a line coming apart and a line being put back together.
# Nothing here reuses a word from the other three sets - the rough arm takes the
# high ground because the slope belongs to the banner, the standing-stone to the
# van and the rocks to the collapse.
 bc_frag_rally_desert:0 " They close up around the one man still shouting, half of them blind with grit."
 bc_frag_rally_open:0 " There is nothing out here to rally on except an order, and today an order is enough."
 bc_frag_rally_rough:0 " The high ground behind them is where they are sent, and they get there in some order."
 bc_frag_rally_forest:0 " They form on a line of trunks, which is not a line at all, and it serves."
 bc_frag_rally_jungle:0 " Voices do the work eyes cannot, and the ranks find one another by them."
 bc_frag_rally_winter:0 " Men who had begun to drift back stamp themselves warm again in their old places."
 bc_frag_rally_any:0 ""

 bc_horse_killed_toast:0 "Unhorsed"
 bc_horse_killed_toast_desc:0 "The horse goes down screaming. He comes up out of the mud on foot, and is seen to come up.[bc_chronicle_subject.Custom('bc_horse_killed_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE FIFTH PER-MOMENT GROUND SET. The literal spends "mud", so no arm here may;
# it also already says he got up, so these say what he got up out of instead of
# saying it twice.
 bc_frag_horse_killed_desert:0 " The horse takes the whole weight of him into the dry stones, and he rises off them anyway."
 bc_frag_horse_killed_open:0 " Everybody within a bowshot watches the horse go down and watches him stand."
 bc_frag_horse_killed_forest:0 " There was a root in it somewhere, and the horse found it before the enemy did."
 bc_frag_horse_killed_rough:0 " He lands where the country is all knuckles and edges, with nothing soft anywhere in it."
 bc_frag_horse_killed_jungle:0 " He hauls himself up out of the wet growth with half of it still hanging off him."
 bc_frag_horse_killed_winter:0 " The horse's blood steams where it spreads, and he steps out of the steam."
 bc_frag_horse_killed_any:0 ""

 bc_flank_collapses_toast:0 "The Flank Collapses"
 bc_flank_collapses_toast_desc:0 "The outnumbered wing bends, and then it does not stop bending.[bc_chronicle_subject.Custom('bc_flank_collapses_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE THIRD PER-MOMENT GROUND SET, and the bad half of the pair the rally set
# above completes. Each arm says what the ground does to men who have started
# going backwards, which is a different question from what it does to men going
# forwards - the van set answers that one on the same six bands.
 bc_frag_flank_collapses_desert:0 " The sand keeps no shape, and neither does the wing once it has started to go."
 bc_frag_flank_collapses_open:0 " Flat country gives a running man a long way to run and no reason to stop early."
 bc_frag_flank_collapses_rough:0 " They come apart among the rocks, each little party climbing away from the next."
 bc_frag_flank_collapses_forest:0 " The wood swallows the first men who turn, and the rest of them learn from it."
 bc_frag_flank_collapses_jungle:0 " Whatever the heat had left of that wing, one push takes."
 bc_frag_flank_collapses_winter:0 " They give way over ground already trodden to grey slush, and they are slow in it."
 bc_frag_flank_collapses_any:0 ""

 bc_van_breaks_through_toast:0 "The Van Breaks Through"
 bc_van_breaks_through_toast_desc:0 "The leading ranks find the seam, and open it.[bc_chronicle_subject.Custom('bc_van_breaks_through_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE SECOND PER-MOMENT GROUND SET, AND THE MIRROR OF THE SPIKE. Each string
# describes the same six bands the banner-falling set does, from the winning
# side. A player who reads both in one battle should recognise the ground twice
# and the sentence never, so nothing here reuses a banner-falls word: not
# "dust", not "the slope", not "the branches", not "the snow begins", and not
# "the green closes" - that last one also cost the jungle template its title,
# recorded where that title is set.
#
# LEADING SPACE ON EVERY ARM, empty fallback, and no space before the tag in the
# desc above, exactly as the spike does it.
 bc_frag_van_breaks_desert:0 " They go through in a wall of sand and are on the far side before it settles."
 bc_frag_van_breaks_open:0 " There is room out here to run it down, and they take all of it."
 bc_frag_van_breaks_rough:0 " The gap is where the stone lets men stand, and it is theirs now."
 bc_frag_van_breaks_forest:0 " The trees make it a hundred small fights, and the leading ranks win each one in turn."
 bc_frag_van_breaks_jungle:0 " They are through and lost to sight in the same breath."
 bc_frag_van_breaks_winter:0 " The churned ice takes them forward faster than it took anyone else."
 bc_frag_van_breaks_any:0 ""

 bc_ground_favours_us_toast:0 "The Ground Favours Us"
 bc_ground_favours_us_toast_desc:0 "The slope, the trees, the narrow way in. They have to come to us across all of it.[bc_chronicle_subject.Custom('bc_ground_favours_us_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE SEVENTH PER-MOMENT GROUND SET, and the one whose literal already talks
# about ground. The literal names a shape - slope, trees, a narrow way - because
# the trigger behind the moment is a list of terrain keys rather than a band;
# these arms name the band that was recorded. The two are allowed to describe
# different things about the same place, which is why no arm below repeats the
# literal's three nouns.
 bc_frag_favours_desert:0 " Their whole approach is over bare pan under a white sun."
 bc_frag_favours_open:0 " Even out here the land has one fold in it, and it is ours."
 bc_frag_favours_rough:0 " They must come up at us, and the gully lets them come up a few at a time."
 bc_frag_favours_forest:0 " Every man of theirs who gets through arrives alone and arrives late."
 bc_frag_favours_jungle:0 " They have to cut their way to us, and the cutting is loud enough to count them by."
 bc_frag_favours_winter:0 " The drifts choose the road for them, and the road ends where we are."
 bc_frag_favours_any:0 ""

 bc_lines_bogged_down_toast:0 "The Lines Bog Down"
 bc_lines_bogged_down_toast_desc:0 "Neither host can move. The battle becomes a matter of who tires of the mud last.[bc_chronicle_subject.Custom('bc_lines_bogged_down_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE SIXTH PER-MOMENT GROUND SET. Like the unhorsing above it, the literal has
# already spent "mud"; unlike it, the literal is about both hosts, so these arms
# are the only ground fragments in the file that describe a stalemate rather
# than something one side is doing to the other.
 bc_frag_bogged_desert:0 " Nobody can charge in this and nobody can leave it either, and the sun does not move."
 bc_frag_bogged_open:0 " Two hosts stand a bowshot apart on country made for horses, and neither will spend one."
 bc_frag_bogged_rough:0 " Every yard forward is uphill for somebody, so nobody buys one."
 bc_frag_bogged_forest:0 " There is no room in here for a push, only for men to lean on one another."
 bc_frag_bogged_jungle:0 " Both hosts are drowning slowly in the same wet air."
 bc_frag_bogged_winter:0 " Boots freeze into the ruts they made this morning, and the ruts are the day's whole progress."
 bc_frag_bogged_any:0 ""

# --- commander chronicles, the second ten (2026-08-17) -----------------------
#
# Design: docs/specs/2026-08-17-battle-chronicles-cases-design.md
#
# EVERY ONE OF THESE RENDERS AS THREE SENTENCES, NOT ONE: this literal, then
# bc_bond_clause, then bc_scale_clause. So each was written against the curated
# shortlist further down this file, and specifically against the two clauses that
# always follow. The words that cost the most here are `field` (both
# bc_frag_bond_nemesis and bc_frag_bond_kin spend it), singular `man` (all five
# bond arms carry `the man commanding here`), and `the men` / `a fight` /
# `the fighting` (all three scale arms). TWO EVENTS WERE RENAMED rather than
# have their prose bend around the collision - bc_the_killing_is_general and
# bc_kin_across_the_line were bc_the_field_is_a_slaughter and
# bc_kin_across_the_field in the first draft.
#
# NO PER-MOMENT GROUND FRAGMENTS HERE. Those are Plan B tasks 5-14 and remain
# gated on a run. Appending the shared clauses is the SAFE half of that gate:
# each literal below stands as a finished sentence, so if Custom() turns out not
# to compose, these toasts read exactly as they would have anyway.
#
# THREE CLAUSES SINCE 2026-08-17, NOT TWO. bc_ground_clause was added and now
# renders FIRST of the three on twenty-six toasts, in the same position the
# per-moment sets hold on the ten: ground, then foe, then field. The seven
# toasts in this file that are GATED on a band do not call it - their literal is
# already about the ground - and neither do the ten moments, which have their own
# per-moment sets above. So the collision list below gains one more entry: no
# literal that calls the shared clause may spend `the ground` on its own.

 bc_winter_bites_toast:0 "Winter Bites"
 bc_winter_bites_toast_desc:0 "The cold does what the enemy could not. Fingers stop closing on spear-shafts, and the ranks shuffle in place to keep the blood moving.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_dust_and_thirst_toast:0 "Dust and Thirst"
 bc_dust_and_thirst_toast_desc:0 "The dust stands as high as a horse's chest and will not settle. Waterskins went dry before noon.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_woods_hide_us_toast:0 "The Woods Hide Us"
 bc_the_woods_hide_us_toast_desc:0 "Numbers count for less among trees. Arrows come from cover, and the cover is empty by the time anyone reaches it.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_long_war_toast:0 "The Long War"
 bc_the_long_war_toast_desc:0 "Two years of this now. The veterans have stopped flinching, and stopped hurrying along with it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_too_wide_to_see_toast:0 "Too Wide to See"
 bc_too_wide_to_see_toast_desc:0 "The line runs past what one pair of eyes can hold. An order sent to the far wing will arrive at a battle that has already changed.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_killing_is_general_toast:0 "The Killing Is General"
 bc_the_killing_is_general_toast_desc:0 "The dying has stopped being something that happens here and there. One host is coming apart, and it is not this one.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_kin_across_the_line_toast:0 "Kin Across the Line"
 bc_kin_across_the_line_toast_desc:0 "He knows the device on the other side better than he knows his own. Somebody will have to explain this at a funeral.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_old_wolf_toast:0 "The Old Wolf"
 bc_the_old_wolf_toast_desc:0 "He has stood in this exact noise before, more times than the boys around him have years. He does not shout. He points.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_green_boy_toast:0 "The Green Boy"
 bc_the_green_boy_toast_desc:0 "He has read about this. The reading covered none of the noise, and none of how long it goes on.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_his_lords_war_toast:0 "His Lord's War"
 bc_his_lords_war_toast_desc:0 "It is not his quarrel and never was. He serves it well regardless, which is what the oath was for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles ------------------------------------------------------

 bc_knight_holds_the_breach_toast:0 "He Holds the Breach"
 bc_knight_holds_the_breach_toast_desc:0 "One man in the gap where the line failed, and the line has time to be made again behind him.[bc_chronicle_subject.Custom('bc_knight_holds_the_breach_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE EIGHTH PER-MOMENT GROUND SET, and the first on a knight moment. The
# subject of the literal is the KNIGHT while the toast is raised on the
# commander, so these arms describe the place and not the man - a "he" here
# would be read as the wrong person the moment the bond clause follows it.
 bc_frag_breach_desert:0 " The gap is a dry watercourse, and everything that comes at it has to come down into it first."
 bc_frag_breach_open:0 " Nothing at all shelters the spot. It is held because somebody chose to hold it."
 bc_frag_breach_rough:0 " Two boulders pinch the path there, which is the only reason one man is enough."
 bc_frag_breach_forest:0 " The trees narrow it to the width of a cart, and that width is the whole battle for a while."
 bc_frag_breach_jungle:0 " The gap is a hacked-out tunnel of green with no way round it at all."
 bc_frag_breach_winter:0 " The snow there is trodden black and it stays trodden, because nothing gets past to churn it."
 bc_frag_breach_any:0 ""

 bc_knight_shames_himself_toast:0 "He Breaks and Runs"
 bc_knight_shames_himself_toast_desc:0 "He throws down the shield and goes back through his own ranks. Every man he passes remembers it.[bc_chronicle_subject.Custom('bc_knight_shames_himself_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE NINTH. Same subject warning as the breach set above. The literal has
# already spent the shield and the ranks he pushes through, so each arm below
# says only where the running goes.
 bc_frag_shames_desert:0 " There is a horizon in every direction and he picks one."
 bc_frag_shames_open:0 " He is visible for as long as anyone cares to watch, which is a long time."
 bc_frag_shames_rough:0 " The easy way is downhill and away, and that is the way taken."
 bc_frag_shames_forest:0 " Three trees in, the running man is nobody's business but his own."
 bc_frag_shames_jungle:0 " The green takes him in one stride and the sound of him lasts longer than the sight."
 bc_frag_shames_winter:0 " The tracks going back are deep and singular, and they are still there at dusk."
 bc_frag_shames_any:0 ""

 bc_shieldbrother_forged_toast:0 "Shieldbrothers"
 bc_shieldbrother_forged_toast_desc:0 "They came through the same press back to back. Neither will speak of it well, and neither will forget it.[bc_chronicle_subject.Custom('bc_shieldbrother_forged_ground')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE TENTH AND LAST. Every moment the mod shipped with now names its ground.
# This one has TWO subjects rather than one, so its arms are the only ground
# fragments written in the plural, and they say what the place did to the pair
# of them rather than what either of them did.
 bc_frag_shieldbrother_desert:0 " They shared the last of one waterskin afterwards and neither mentioned whose it had been."
 bc_frag_shieldbrother_open:0 " There was nowhere to put a back except against another back."
 bc_frag_shieldbrother_rough:0 " They found the same hollow to stand in and were still standing in it at the end."
 bc_frag_shieldbrother_forest:0 " Neither could see more than the other one and so each watched the half the other could not."
 bc_frag_shieldbrother_jungle:0 " In heat like that a man fights until somebody holds him up, and somebody did."
 bc_frag_shieldbrother_winter:0 " They spent the night after it under one cloak and have never agreed whose cloak."
 bc_frag_shieldbrother_any:0 ""

# --- knight chronicles, the second three (2026-08-17) ------------------------
#
# Design: docs/specs/2026-08-17-battle-chronicles-cases-design.md
#
# Same three-sentence render as every other desc, so the same collision rules
# apply, PLUS three the knight block spends on its own: `the line` (holds the
# breach spends it twice), `one man` / `every man` (both shipped knight descs),
# and `the press` (shieldbrothers). None of the three below reuses any of them.
#
# THE SUBJECT IS THE KNIGHT BUT THE SCOPE IS THE COMMANDER. These descs render
# inside a toast raised on `scope:combat_side.side_commander`, so
# bc_chronicle_subject is the COMMANDER, not the man in the sentence - exactly
# as it is for the shipped three. The literal therefore says `he` about the
# knight and the appended clauses say `the man commanding here` about someone
# else, and that reads correctly only because the clauses name their subject
# every time. Do not write a clause that says a bare `he`.
 bc_knight_unhorses_a_lord_toast:0 "A Lord Goes Down"
 bc_knight_unhorses_a_lord_toast_desc:0 "The spear takes the horse first and the rider after it. Whoever that was in the good armour is on his back in the churn now, and shouting for help.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_takes_a_captive_toast:0 "Yielded"
 bc_knight_takes_a_captive_toast_desc:0 "Sword reversed, gauntlet off, a name given quickly and clearly. Both of them know what the name is worth by the hour.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_is_ridden_down_toast:0 "Ridden Down"
 bc_knight_is_ridden_down_toast_desc:0 "Flat country, and nothing on it to put your back against. He is still turning when the horses reach him.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles, the third three (2026-08-17) -------------------------
#
# Ground, age and kin - the three things a knight case has never read. Same
# subject warning as the block above: the toast is raised on the COMMANDER, so
# `he` in these literals is the knight and the appended bond clause is about
# somebody else entirely. That only reads if every clause names its own subject,
# which all fifteen of them do.
#
# bc_knight_meets_his_cousin IS THE ONE PLACE THE LITERAL AND THE CLAUSE CAN
# COLLIDE ON MEANING RATHER THAN ON WORDS. If the commander is ALSO kin to the
# man opposite the bond clause will say so, and the toast then reports two
# separate kinships in two sentences. That is true, not a bug, and the literal
# is written so it still parses when it happens - it says `his own name`, which
# belongs to the knight and to nobody else in the sentence.
 bc_knight_stands_in_the_snow_toast:0 "He Stands in the Snow"
 bc_knight_stands_in_the_snow_toast_desc:0 "Everything is white and grey and slow, and he has not given up a step of it. Ice has frozen the mail to his surcoat where the blood ran down.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_old_sword_toast:0 "The Old Sword"
 bc_knight_the_old_sword_toast_desc:0 "He is too old for this and has been for a decade, and he is still upright when younger backs have bent. Nothing he does today is quick and nothing he does today is wasted.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_meets_his_cousin_toast:0 "His Own Name, Opposite"
 bc_knight_meets_his_cousin_toast_desc:0 "The device coming at him is his own name, worn by somebody who used to eat at the same table. Neither of them says anything anybody else can hear.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles, the fourth three (2026-08-17) ------------------------
#
# These three read the BATTLE from inside the ranks - how bloody it is, how long
# the war has run, how many men are on the field - so they are the first knight
# literals that can be about something other than the knight's own arms. Same
# subject warning as the two blocks above: `he` is the knight, the bond clause
# is about the commander.
#
# THE SPENT PHRASES ACROSS ALL TWELVE KNIGHT DESCS, which none of these three
# may reuse: "the line", "one man", "every man", "the press" as a noun (the
# title below uses it and the desc therefore does not), "flat country", "a step
# of it", "the same table". The three below reach instead for footing, for the
# count of days, and for the size of the field.
#
# bc_knight_among_thousands SAYS NOTHING ABOUT WHAT HE DID, deliberately - it is
# the only knight literal with no deed in it, because the case grants no rung
# and a deed would promise a consequence the effect does not deliver.

 bc_knight_in_the_press_toast:0 "In the Press"
 bc_knight_in_the_press_toast_desc:0 "Two in five of them are down and there is nowhere left to put a foot that is not somebody. He has stopped stepping over them and is simply going forward.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_long_war_toast:0 "Two Years of This"
 bc_knight_the_long_war_toast_desc:0 "Seven hundred days since the first muster and he was never any good at it on the first one. What is left of him goes where it is pushed and no further.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_among_thousands_toast:0 "Among Thousands"
 bc_knight_among_thousands_toast_desc:0 "There are fifteen thousand men on this field and not one of them will remember which was him. He can see two banners from where he is standing and neither is close enough to shout at.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles, the trait batch (2026-08-17) -------------------------
#
# The first three knight literals whose GATE is temperament rather than prowess,
# ground, age or the battle. Same subject warning as the four blocks above: `he`
# is the knight and the appended bond clause is about the commander.
#
# EACH DESC SHOWS THE TRAIT WORKING AND NEVER NAMES IT. The gate already knows he
# is arrogant, patient or greedy; a literal that said so would be reading the
# character sheet aloud, and the character batch on the commander side settled
# this question the same way six descs ago.
#
# THE SPENT PHRASES ACROSS ALL FIFTEEN KNIGHT DESCS, which none of these three
# may reuse: "the line", "one man", "every man", "flat country", "a step of it",
# "the same table", "nowhere to put a foot", "what is left of him", "not one of
# them will remember". These three reach instead for being watched, for the pace
# of a walk, and for what a man's hands are doing.

 bc_knight_the_glory_hound_toast:0 "Somebody Is Watching"
 bc_knight_the_glory_hound_toast_desc:0 "He is out past the standards where the whole field can see him, and he has been careful about which way he is facing while he does it. The horses that went with him will not be good for anything else today.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_walks_them_back_toast:0 "He Walks Them Back"
 bc_knight_walks_them_back_toast_desc:0 "It is going badly and he will not let it go badly at a run. He puts the shaken ones in front of him where he can see them and sets the pace himself, and what walks away from this is still an army.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_strips_the_dead_toast:0 "His Hands Are Full"
 bc_knight_strips_the_dead_toast_desc:0 "They are winning without him and he has noticed. He is on his knees over somebody's dead brother with a knife working at a strap, and there is a gap where he was standing.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles, the ground batch (2026-08-17) ------------------------
#
# Rough, forest and jungle from inside the ranks. THESE THREE DO NOT CALL
# bc_ground_clause and must not be given it: they are gated on a band, so the
# shared clause would say in general terms what the literal has just said in
# particular ones. Same exclusion the seven commander band toasts carry.
#
# THE SPENT BAND PHRASES, which are now numerous and which these three may not
# reuse: "the spine of rock" and "their backs to a slope" (the commander's rough
# toast), "the standing stone", "the high ground", "the gully", "two boulders",
# "a hollow", "knuckles and edges" (the per-moment rough fragments), "the heat
# and the green" and "ten paces away" (the commander's jungle toast), "the trees
# begin a hundred paces off" (the eve), "the wood swallows sound" (the shared
# clause, which these three do not call but whose words are still spent).
 bc_knight_on_the_broken_ground_toast:0 "No Horse Is Any Use Here"
 bc_knight_on_the_broken_ground_toast_desc:0 "He came off his horse an hour ago because there was nothing here it could do, and he has been working on foot since, one bad step at a time. Nobody has moved him and he has moved nobody.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_wood_takes_them_toast:0 "The Chase Goes In and Stops"
 bc_knight_the_wood_takes_them_toast_desc:0 "They were running and he was on them, and then there was bark and shadow and nobody to his left or right. What went in as a pursuit is now forty men shouting for each other.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_in_the_green_toast:0 "Boiled in His Own Harness"
 bc_knight_in_the_green_toast_desc:0 "He has been standing in mail in this since first light and the air has not moved once. Whatever is wrong with him now, nobody on the other side did it.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- knight chronicles, the body batch (2026-08-17) --------------------------
#
# Three templates gated on what the man is carrying rather than on what he can
# do with it. THESE THREE DO CALL bc_ground_clause, unlike the ground batch
# above: none of them is gated on a band, so nothing in the literal has already
# named the field.
#
# THE PROSE MUST NOT NAME THE TRAIT. The gate is `wounded_*`, `maimed` /
# `one_legged` and `one_eyed` / `disfigured`, and each of those is an OR over a
# population - a desc that says "his missing leg" is a lie about half the men
# who read it, and one that says "his eye" is a lie about the disfigured. Each
# line describes what the other men can see happening, which is true of the
# whole gate.
#
# THE THIRD SAYS NOTHING ABOUT WHAT HE LOOKS LIKE, on purpose. The moment is
# the decision the rank in front of him takes, not his face, and the toast is
# raised on a man the player may have grown fond of.
 bc_knight_the_old_wound_toast:0 "It Opens Again"
 bc_knight_the_old_wound_toast_desc:0 "He came into this carrying something that had not finished healing, and it has stopped holding. He is still on his feet and he is doing it wrong now, favouring one side of himself, and the men beside him have started covering the gap he leaves.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_will_not_be_carried_toast:0 "He Will Not Be Carried Off"
 bc_knight_will_not_be_carried_toast_desc:0 "He has already paid for one of these days and here he is standing in another. Twice somebody has come to take him out of the line and twice he has sent them back, and the piece of the line he is in has not gone anywhere since.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_the_face_they_run_from_toast:0 "They Will Not Come At Him"
 bc_knight_the_face_they_run_from_toast_desc:0 "The rank in front of him has decided something about him and it decided it early. Where he walks they are somewhere else by the time he arrives, and the hole that opens ahead of him keeps opening.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- commander chronicles, the character batch (2026-08-17) ------------------
#
# Six templates gated on WHO THE MAN IS rather than on how the battle is going.
# The prose therefore has to do something the other twenty descs do not: say
# something about a person while the two appended clauses are also saying
# something about a person. All five bond variants of a value name their subject
# as `the man commanding here`, so these six say `he` and never `the man` - two
# sentences apart, `the man` twice would read as two different people.
#
# Same collision list as the second ten: `field`, `the men`, `a fight`,
# `the fighting`, `dawn`, plus the knight block's `the line`, `one man` /
# `every man` and `the press`. None of the six below spends any of them, which
# is why bc_he_looks_for_the_road says `everyone near enough to see him` where
# the obvious phrasing was `every man who sees him`.
 bc_the_wrath_takes_him_toast:0 "The Wrath Takes Him"
 bc_the_wrath_takes_him_toast_desc:0 "Something in him goes, and what is left is not taking counsel from anybody. He is forward of his own standard before his guards have understood what happened.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_patient_hand_toast:0 "The Patient Hand"
 bc_the_patient_hand_toast_desc:0 "They have the numbers and they are in a hurry to spend them. He is in no hurry whatsoever, and it costs them more with every hour he waits.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_wine_at_noon_toast:0 "The Wine at Noon"
 bc_the_wine_at_noon_toast_desc:0 "What was in the skin was not water, and it was not the first skin of the day either. His orders keep arriving a little later than the trouble they were meant for.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_zealot_will_not_stop_toast:0 "No Quarter Asked"
 bc_the_zealot_will_not_stop_toast_desc:0 "Two in five of them are down already and he calls that a judgement rather than a tally. Nothing he has said since morning suggests he intends to stop at five.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_he_looks_for_the_road_toast:0 "He Looks for the Road"
 bc_he_looks_for_the_road_toast_desc:0 "His eyes keep going back to the way they came in this morning. Everyone near enough to see him do it draws the obvious conclusion.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_practised_eye_toast:0 "The Practised Eye"
 bc_the_practised_eye_toast_desc:0 "A host this size does not fit in one head unless somebody taught you how to hold it there. Somebody did, and he is putting the far wing where it needs to be while it is still forming up.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- the last two ground bands, 2026-08-17 ----------------------------------
#
# These two finish the set the other three band toasts started - winter, desert
# and woods are above at lines 141-148. WRITE THE GROUND, NOT THE WEATHER: those
# three each name a thing underfoot or overhead that the ground itself produced,
# and these do the same, so the six read as one family when a player meets two
# of them in the same war.
#
# THE SPENT PHRASES IN THIS BLOCK, which the earlier band descs already used and
# which must not appear again here: "the cold", "the dust", "the trees", "among
# trees", "arrows come from cover". The rough desc reaches for stone and slope;
# the jungle desc reaches for heat and green.

 bc_the_broken_ground_holds_toast:0 "The Broken Ground Holds"
 bc_the_broken_ground_holds_toast_desc:0 "The line gives way and then stops giving, because there is a spine of rock behind it that no one has to be told to stand on. What was a rout a moment ago is a hundred men with their backs to a slope.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# THE TITLE IS NOT "The Green Closes In" although the template key is, because
# bc_frag_banner_falls_jungle already says "The green closes over it". Two
# jungle strings in one campaign reading as near-copies is the exact fault the
# pooling work is undoing, and the title is the cheaper of the two to move.
 bc_the_green_closes_in_toast:0 "The Heat and the Green"
 bc_the_green_closes_in_toast_desc:0 "Nothing here is more than ten paces away and half of it is still moving. Men are going down to the heat who were never touched by anything with an edge.[bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- who is across the field, 2026-08-17 ------------------------------------
#
# Three toasts whose GATE is the man opposite rather than the ground, the odds
# or the commander's own traits. Each one is read immediately before a bond
# clause that names the same relation in plain words, so NONE OF THESE THREE
# DESCS MAY STATE THE RELATION. bc_frag_bond_nemesis already says there is old
# business; bc_frag_bond_heathen already says the prayers differ;
# bc_frag_bond_countryman already says the tongue is shared. A desc that said it
# too would print the same fact twice in two sentences.
#
# So each desc shows what the man DOES about it instead: the grudge changes
# where he puts himself, the faith changes who he sends down the line, the
# shared tongue changes what he can and cannot stop hearing.
#
# THE SPENT PHRASES IN THIS BLOCK: "his own tongue shouted back" (bond
# countryman_b and eve countryman_c both have it), "old business" (bond
# nemesis_b), "two sets of prayers" (bond heathen_c and eve heathen_b), "the
# device on the other side" (bc_kin_across_the_line_toast_desc).

 bc_the_old_grudge_toast:0 "He Puts Himself Opposite"
 bc_the_old_grudge_toast_desc:0 "He moves his standard down the line until it is square on to the one he came here for, and the men around him understand that they are now standing where the day will be decided.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_gods_on_both_sides_toast:0 "Gods on Both Sides"
 bc_gods_on_both_sides_toast_desc:0 "The holy men are sent out along the front rank instead of being kept safe behind it, and they are still working when the lines touch. Men who could barely stand an hour ago are shouting themselves hoarse.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_the_same_tongue_toast:0 "He Can Understand the Screaming"
 bc_the_same_tongue_toast_desc:0 "Everything carried across from the other side arrives in words he has known since he was a boy — orders, oaths, and the noise men make when they are hit. He can do nothing with any of it except hear it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- commander chronicles, what he has to lose (2026-08-17) ------------------
#
# Station, which twenty-eight templates had never asked about: a kingdom,
# nothing at all, or somebody.
#
# NONE OF THE THREE NAMES A TITLE, A PLACE OR A HOUSE. The gates are
# `highest_held_title_tier >= tier_kingdom`, `is_landed = no` and a close-family
# test, and AGOT is a setting where the reader knows the map far better than
# this mod does. A desc that said "his kingdom" would be fine; one that said
# "the Reach" would be a guess. The first line therefore says `crowned`, which
# every tier at or above kingdom answers to.
#
# THE THIRD MUST NOT SAY WHICH RELATION IT IS. `is_close_family_of` covers
# parents, children, siblings, grandparents and grandchildren, so "his son" is
# a lie about most of the men it fires for. It says `his own blood` and leaves
# the reader to know which.
#
# SPENT PHRASES THIS BLOCK MAY NOT REUSE: "somebody will have to explain this
# at a funeral" (bc_kin_across_the_line_toast_desc, the other kin toast, which
# a player can see in the same battle as the third of these).
 bc_the_crown_on_the_field_toast:0 "The Tallest Thing Still Standing"
 bc_the_crown_on_the_field_toast_desc:0 "It is going badly and he is the most valuable man on a field that is losing. Every eye on the other side has worked out where he is, and his own men keep coming off the line to stand between him and the people who want to reach him.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_nothing_but_the_horse_toast:0 "Nothing Behind Him"
 bc_nothing_but_the_horse_toast_desc:0 "He holds no land, so there is no hall waiting for him to lose this carefully and go home to it. He rides at the thing instead of around it, and the horses will be finished by evening.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_his_blood_in_the_ranks_toast:0 "He Knows Where That One Is"
 bc_his_blood_in_the_ranks_toast_desc:0 "His own blood is out there in the knights and he has not lost sight of him once, which is one more thing than a man commanding can afford to be doing. He works forward to where he can be seen doing it.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

# --- shared fragments: the bond ---------------------------------------------

# THREE VARIANTS PER VALUE SINCE 2026-08-17, picked by `random_valid = yes` in
# bc_flavour.txt. The 2026-08-15 sweep read one of these five sentences after
# every one of 233 moments, and two values - stranger 134, countryman 126 -
# carried most of them.
#
# THE THREE VARIANTS OF A VALUE SAY THE SAME THING THREE WAYS. They are not
# three degrees of it. The ladder in bc_write_bond_effect already decided the
# fact; these only decide the wording, and a variant that says something
# slightly different makes the clause report a fact the ladder never wrote.
#
# ALL FIFTEEN NAME THEIR SUBJECT, all but two as `the man commanding here`. That
# repetition is deliberate: the toast carries the COMMANDER's portrait, but
# three of the thirteen moment literals are about a KNIGHT, so a clause saying
# a bare `he` would attach to the wrong man on those three.
#
# `dawn` and `field` ARE SPENT AND ARE NOT SPENT AGAIN. Both are on the curated
# shortlist further down; the shipped nemesis, kin and heathen strings already
# carry them, and no variant added below reuses either. Nor does any variant
# reuse `Nobody over there is anybody ... knows`, which is the eve's
# desc_stranger paragraph - the eve and a toast of the same battle would
# otherwise print the same sentence twice.
 bc_frag_bond_nemesis:0 " The man commanding here does not have to ask whose colours are across the field."
 bc_frag_bond_nemesis_b:0 " There is old business between the man commanding here and the man commanding against him."
 bc_frag_bond_nemesis_c:0 " The man commanding here knew exactly who was opposite from the moment the scouts came back."
 bc_frag_bond_kin:0 " The man commanding here shares blood with whoever is giving the orders across the field."
 bc_frag_bond_kin_b:0 " The man commanding here is fighting his own house today, whatever the heralds have made of it."
 bc_frag_bond_kin_c:0 " There is one family on this ground and it is drawn up on both sides of it."
 bc_frag_bond_countryman:0 " The man commanding here and the one commanding against him are of the same people."
 bc_frag_bond_countryman_b:0 " The man commanding here will hear his own tongue shouted back at him before this is finished."
 bc_frag_bond_countryman_c:0 " Both hosts were raised in one country, and so were both the men who brought them."
 bc_frag_bond_heathen:0 " Whatever the other side was praying to at dawn, the man commanding here was not."
 bc_frag_bond_heathen_b:0 " Nothing the other host holds sacred means anything at all to the man commanding here."
 bc_frag_bond_heathen_c:0 " Two sets of prayers went up this morning and they did not go to the same place."
 bc_frag_bond_stranger:0 " The man commanding here has never had cause to learn a name on the other side."
 bc_frag_bond_stranger_b:0 " The man commanding here could not pick the man opposite out of a crowd, and will not have to."
 bc_frag_bond_stranger_c:0 " Whatever quarrel the man commanding here has with that host, the war supplied it and nothing else did."
 bc_frag_bond_any:0 ""

# --- shared fragments: the scale --------------------------------------------
#
# ONE AXIS, GRADED: how much of the fight is not yet in the fighting. Huge, most
# of the men; large, a good part of them; small, few. ALL THREE CARRY THE PHRASE
# `not yet in the fighting` VERBATIM, so the grading is legible in one reading
# and a reader comparing two arms is comparing quantifiers. The opening clause
# and the word order still differ between them - the small arm fronts its subject
# to avoid `scarcely any ... are not`, which needs two inversions to parse - so
# this is a shared phrase, not a shared frame. Keep it monotone.
#
# KEEP THE SMALLEST ARM SHORT OF A UNIVERSAL. An arm saying every man is in the
# fighting is falsified outright on bc_knight_shames_himself, whose literal is a
# man leaving the fighting. The shipped arm survives that pairing by being SILENT
# about him rather than by accommodating him: "not yet in the fighting" denotes
# men who have not gone in, and he went in and came back out, so he is in neither
# the few nor the many. That event is `type = knight` and its is_valid carries no
# size gate (bc_knight_phase_events.txt:124-132), so a small battle is a routine
# host for the pairing.
#
# TWO STRAINS ARE NOT FIXED AND ARE RECORDED RATHER THAN HIDDEN. Both are between
# the SMALL arm and a literal that implies men still out of the fighting; the huge
# and large arms reinforce those same literals.
#   bc_ground_favours_us - a COMMANDER moment, bc_commander_phase_events.txt:328 -
#   reads `They have to come to us across all of it.`, which puts the enemy host
#   short of contact. bc_battle_size counts BOTH sides, so read strictly, near
#   half the combat is not yet in the fighting and `are few` is wrong for the
#   same reason the universal was, only less so.
#   bc_knight_holds_the_breach - bc_knight_phase_events.txt:50, no size gate in
#   its is_valid at :56-61 - reads `the line has time to be made again behind
#   him`, which needs men behind the line who are not yet in it. Milder, because
#   a line being remade is a smaller body of men than a host still crossing.
# Softening the quantifier bought a degree, not a fix. Both toasts now carry the
# clause, so a run will show them; if either reads badly, the answer is a
# per-moment clause on that one toast, not a fourth regrade of a clause all ten
# share.
#
# See the header on bc_scale_clause in bc_flavour.txt, which records the two axes
# that are closed, why, and the four-row test a replacement has to pass.
#
# THE SUBJECT IS THE WHOLE FIGHT, NOT THE COMMANDER'S OWN MEN, AND THAT IS NOT A
# STYLE CHOICE. bc_battle_size is set by comparing num_total_troops on the
# COMBAT scope (the size ladder in bc_battle_open_effect,
# bc_ledger_effects.txt), which counts both sides, so a clause read as a claim
# about his men would report something the variable never
# measured. It would also collide with the moments' own gates: a toast carries
# the commander's portrait, and bc_flank_collapses fires only when he is
# outnumbered (bc_commander_phase_events.txt:221) while bc_van_breaks_through
# fires only when he is outnumbering (:290). TWO drafts shipped and were pulled
# for this, and they are different drafts - quoted rather than paraphrased,
# because paraphrasing them is how they got merged into one in an earlier note:
#   b3e7c32  " Whole companies will be kept out of the fighting and never put in
#            at all."  - reads as the commander's own men, which on
#            bc_flank_collapses contradicts a literal about a wing giving way for
#            want of men.
#   4163d3b  " Whole parts of a battle this size are standing idle, not yet
#            called on."  - subject fixed, verb not: "called on" still implies
#            someone who could have called and did not, and the toast carries his
#            portrait.
# The verb has to be agentless as well as the subject shared.
#
# THE THREE SAY NOTHING ABOUT THE MOMENT ITSELF, and that is deliberate twice
# over. The clause is SHARED by all ten moments, so anything it says has to read
# the same after a banner falling and after a stalemate - the same test
# bc_bond_clause's own header states, under `SHARED AND NOT PER-MOMENT`. And a
# fragment that points back at the moment ("such a thing", "it") is pointing
# past the bond fragment that renders in between on all ten - and past the ground
# fragment as well on bc_banner_falls_toast_desc, the only desc that has one -
# so its nearest antecedent at render time is the bond sentence, not the toast's
# own. These three name their subject outright and carry no anaphor.
#
# WORDS ALREADY SPOKEN FOR IN THE RUN OF TEXT THIS CLAUSE JOINS. This is a
# CURATED SHORTLIST, not a grep dump - grepping "field" alone returns thirty-two
# key lines across the file, most of them in text that never renders beside a
# moment toast. What is listed is what a desc can put in one line with this
# clause: a toast literal, one bond fragment, and on bc_banner_falls_toast_desc
# alone a ground fragment as well - that one can resolve to its empty arm, so
# treat its words as possible rather than guaranteed.
# KEYS ARE NAMED WITHOUT LINE NUMBERS ON PURPOSE, and the reason has narrowed
# since this was written. `validate` now checks the POSITION of a citation: it
# will say when one runs off the end of the file it names, or lands on a blank
# line. No example is spelled out here, because a spelled-out example IS a
# citation and the checker resolves it - the first draft of this paragraph
# invented a line number to illustrate the error and duly earned the error.
# What it still cannot say is that a citation landed on a real line which is the
# WRONG line - and that is exactly what a citation into this file does on any
# edit to this file, the file most likely to be edited by whoever is reading
# this. A key name survives that. Grep the key.
#   "the man"   ALL FIVE CONTENT ARMS of bc_bond_clause carry the substring
#               "man commanding here" - four open on "The man commanding here",
#               bc_frag_bond_heathen carries it mid-sentence ("...at dawn, the
#               man commanding here was not."). The sixth key that matches
#               bc_frag_bond_* is the empty fallback bc_frag_bond_any, which
#               cannot render from these ten toasts. The bond fragment renders in
#               the sentence immediately before this one on all ten toasts.
#               THE ONLY GUARANTEED COLLISION IN THIS LIST. Plural "the men"
#               beside it is ordinary English; SINGULAR "a man" is not, and an
#               earlier small arm read " In a fight this small, there is not a
#               man who is not in the fighting." (The ALL-CAPS collision verdict
#               in this entry is not requoted here, because requoting a grep
#               target inside its own file makes the grep return two hits. That
#               verdict sits on one unbroken line because a name is cited on one
#               line or it is not cited at all. The 84-column rule is what forced
#               the wrap that used to split it, so the fix was to re-flow the
#               entry rather than widen the budget.)
#   "man"       singular, and NOT only in the bond arms:
#               bc_knight_holds_the_breach_toast_desc ("One man in the gap") and
#               bc_frag_banner_falls_rough ("the man who carried it"). On the
#               breach toast an arm using singular "man" would make three
#               consecutive sentences that each name one.
#   "the men"   bc_banner_falls_toast_desc ("the men nearest it"), which is the
#               one literal that already spends the plural every arm here uses.
#   "all"       bc_ground_favours_us_toast_desc ("across all of it"),
#               bc_frag_banner_falls_open ("they all see it go"). The huge arm
#               ended " ...not yet in the fighting at all." until this was
#               noticed.
#   "field"     bc_frag_banner_falls_open, bc_frag_bond_nemesis, bc_frag_bond_kin
#   "again"     bc_rally_the_line_toast_desc, bc_knight_holds_the_breach_toast_desc
#   "behind"    bc_knight_holds_the_breach_toast_desc
#   "every man" bc_knight_shames_himself_toast_desc
#   "no one"    bc_frag_banner_falls_forest
#   "came"      bc_shieldbrother_forged_toast_desc
#   "dawn"      bc_frag_bond_heathen
#   "out of"    bc_horse_killed_toast_desc ("comes up out of the mud")
#
# THE EVE DESCS ARE A SEPARATE COLLISION SCOPE, because they render in their own
# pop-up rather than in this run of text. CHECK ALL THREE ARMS AGAINST THEM, not
# just the huge one. The tempting shortcut is that bc_eve_offer_effect gates the
# eve on `var:bc_battle_size >= 3` (bc_eve_effects.txt:75) while the huge arm
# fires on `= 3`, so an eve implies the huge arm - but that holds only at the
# MOMENT THE EVE WAS OFFERED. The gate also carries
# `NOT = { exists = var:bc_battle_moments }`, which is evaluated on every phase
# event but CAN ONLY PASS at the first; the size ladder sits in
# bc_battle_open_effect, which runs upstream of every read in all ten events
# (in bc_ledger_effects.txt: the UNCONDITIONAL, NOT WRITE-IF-UNSET paragraph for
# the overwrite semantics, the size ladder itself, and THE ANCHOR comment on
# `save_scope_as = bc_chronicle_subject` for why "upstream of every read" is the
# right phrase and "at the top of every event" is not - the three knight events
# call it nested rather than at the top). So the band is re-derived from a live
# num_total_troops comparison at every later moment. Whether that number can FALL
# during a combat is NOT established anywhere in this repo. If it can, a battle
# that opens above 10,000 shows its eve and then renders the large arm later in
# the same fight.
#
# NOR IS THE CONVERSE ANYWHERE NEAR TRUE, which is the more useful fact: the eve
# needs a human commander and clears a 90-day cooldown, so the 2026-08-15
# tiered-marker run recorded 131 size-3 moments and TWO eves over 44 combat ends
# (README.md, that run's section). The huge arm is overwhelmingly seen by players
# who never saw an eve. Words that are the eve's: "all day" (desc_intro,
# desc_ground_winter), "across the field" (desc_nemesis, desc_stranger, desc_kin,
# desc_countryman), "field" alone (desc_ground_open, desc_ground_jungle), "the
# men" (desc_countryman, desc_ground_winter), "yet" (desc_intro, "nothing has
# been settled yet"), and "go in there ... gone from this battle"
# (desc_ground_jungle, with "goes in there" in desc_ground_forest), which is why
# no arm here says "gone in". Treat neither list as complete.

# THREE VARIANTS PER BAND SINCE 2026-08-17, pooled by `random_valid = yes` in
# bc_flavour.txt. This is the most-read prose in the mod - it closes every moment
# toast, and the 2026-08-15 run recorded 131 size-3 moments in 44 battles, so the
# huge string alone was read 131 times in one campaign.
#
# EVERY ARM STILL OPENS WITH A LEADING SPACE. It is appended directly to the end
# of a sentence with no separator, and the three originals carry it; an arm
# without one runs into the full stop before it.
#
# THE THREE ORIGINALS ALL SAY "not yet in the fighting" AND THE SIX NEW ONES
# MUST NOT. That phrase is the reason a player recognises this clause on sight,
# which is precisely the problem being fixed. The `_b` arms say the same thing
# about companies and standards rather than about men; the `_c` arms say
# something about the size of the fight instead of about the reserve, which is
# the same fact from the other end.
 bc_frag_scale_huge:0 " In a fight this big, most of the men are not yet in the fighting."
 bc_frag_scale_huge_b:0 " Whole companies have not struck a blow and may not strike one before dark."
 bc_frag_scale_huge_c:0 " There are more banners standing here than any one man could put a name to."
 bc_frag_scale_large:0 " In a fight this size, a good part of the men are not yet in the fighting."
 bc_frag_scale_large_b:0 " A good many standards are still waiting their turn at it."
 bc_frag_scale_large_c:0 " Enough are engaged to settle it and enough are not to drag it out."
 bc_frag_scale_small:0 " In a fight this small, the men not yet in the fighting are few."
 bc_frag_scale_small_b:0 " Everybody who came is in it, or will be inside the hour."
 bc_frag_scale_small_c:0 " It is a small enough thing that one company could tip it either way."
 bc_frag_scale_any:0 ""

# --- shared fragments: the ground (2026-08-17) ------------------------------
#
# The clause the twenty-six toasts written AFTER Plan B now carry, so that a
# trait case or a foe case says what is underfoot the way the ten moments have
# since Plan B task 6. Two per band, `random_valid`; the argument for two rather
# than three, and for one shared set rather than twenty-six per-moment ones, is
# in bc_flavour.txt at the definition.
#
# EVERY ONE OF THESE HAS TO BE TRUE OF EVERY TERRAIN ITS BAND COLLECTS. `rough`
# is hills, mountains, wetlands and bog together, so a rough line may not say
# slope; `forest` and `jungle` are separate bands and neither may borrow the
# other's word.
#
# NONE OF THEM NAMES A CONSEQUENCE, unlike the per-moment sets. Those know what
# the moment was and can say the slope broke the charge; this one is appended to
# twenty-six different literals and knows nothing about any of them.
#
# THE SPENT GROUND PHRASES ACROSS THE MOD, which these twelve may not reuse:
# "the trees" and "arrows come from cover" (bc_the_woods_hide_us and the forest
# per-moment fragments), "the green closes over it" (banner falls, jungle), "the
# cold has been in the men" (the eve), "there is no water between here and the
# horizon" (the eve, desert), "the high ground", "the slope", "the gully", "a
# hollow", "two boulders", "the standing stone" (the nine per-moment rough
# fragments). These reach instead for what the ground does to a man's footing,
# his sight and his patience.
 bc_frag_where_desert:0 " The heat here comes up off the ground as hard as it comes down out of the sky."
 bc_frag_where_desert_b:0 " There is dust in the water, in the mail and in every mouth on this field."
 bc_frag_where_open:0 " The field is flat enough that a man can see the whole of it from where he stands."
 bc_frag_where_open_b:0 " There is nothing on this ground that either host can make use of."
 bc_frag_where_rough:0 " Nothing about this ground is easy to stand on and none of it is level."
 bc_frag_where_rough_b:0 " The footing here has been arguing with both hosts since first light."
 bc_frag_where_forest:0 " Half of what is happening on this ground is happening out of sight."
 bc_frag_where_forest_b:0 " The wood swallows sound, so orders arrive late here or not at all."
 bc_frag_where_jungle:0 " The green is thick enough here that a man can lose the sky in it."
 bc_frag_where_jungle_b:0 " Nothing dries out in this country and nothing in it is more than a few paces off."
 bc_frag_where_winter:0 " Snow lies over the whole of this ground and more of it is still coming."
 bc_frag_where_winter_b:0 " The cold on this field is doing its own work and taking its time about it."
 bc_frag_where_any:0 ""

