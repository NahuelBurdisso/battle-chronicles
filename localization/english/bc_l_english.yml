# actually came for".
 bc_a_great_deal_arrives_every_month_toast:0 "Twenty A Month"
 bc_a_great_deal_arrives_every_month_toast_desc:0 "Twenty a month walks into his chest without being asked. Mills he has never visited, tolls on a road he has crossed twice, a fishing right nobody now remembers granting - it arrives, it stacks up, and for most of his life it has meant that any problem set in front of him could be looked at once, priced, and then handed to somebody with the coin to make it stop being his. He has genuinely forgotten what it is like to want a thing he cannot purchase. He finds out this morning. The left is buckling and there is no man alive out here who will straighten it for silver, and the discovery is less frightening than it is disorienting, like reaching for a step that turns out not to be there. So he does the only thing left to him, which is to change what he is asking for. He stops trying to keep the shape he came with and starts trying to keep a smaller and uglier one, and he does it slowly, badly, and about a quarter of an hour later than a poorer man would have. The coin will still come next month. It will simply come somewhere he is not.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

 bc_knight_almost_nothing_arrives_for_him_toast:0 "Not A Third"
 bc_knight_almost_nothing_arrives_for_him_toast_desc:0 "Not quite a third of a coin finds its way to him in a month, which is another way of saying that what he owns is what he is wearing and what he can carry. He is used to it. It has taught him one useful thing, which is that a man who owns nothing loses nothing by staying exactly where he was put, and he has been put on a bit of rutted ground beside a thorn hedge with instructions that amounted to remain there. So he remains there. Men come at him and he does not go out to meet them, because going out to meet them would mean leaving, and leaving is the one expense he cannot cover. He sets his heel against a root, gets his shoulder into the boards, and becomes for the space of a long ugly hour an obstacle rather than a person. The hedge keeps because he keeps. Afterwards somebody will work out that the whole right of it pivoted on a man with nothing to his name at all, and will find that funny, and he will not, because to him it was only ever the cheapest thing he could have done.[bc_chronicle_subject.Custom('bc_ground_clause')][bc_chronicle_subject.Custom('bc_bond_clause')][bc_chronicle_subject.Custom('bc_scale_clause')]"

